<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="980" viewBox="0 0 1280 980"><rect width="1280" height="980" fill="#f4f7fb"/><style>text{font-family:Arial,sans-serif;fill:#172638}.h{font-size:28px;font-weight:bold}.t{font-size:20px;font-weight:bold}.s{font-size:17px}.sub{font-size:18px;fill:#425874}.box{fill:white;stroke:#9bb3c9;stroke-width:2}.hold{fill:#fff5e7;stroke:#b86e12;stroke-width:2;stroke-dasharray:8 5}.wire{fill:none;stroke:#246789;stroke-width:3}</style>
<text x="40" y="48" class="h">ACT-12 | Define the fault response at the actuator connector</text>
<text x="40" y="80" class="sub">Verified ACT-04 signal paths | No circuit change | Receiver interpretation and stop behavior unresolved</text>
<rect x="40" y="110" width="1200" height="65" rx="9" class="hold"/>
<text x="58" y="138" class="t">An inactive driver does not establish a low signal, rejected pulse or stopped actuator.</text>
<text x="58" y="162" class="s">400 ns remains a conditional inhibit allocation. Actual connector and receiver limits still need evidence.</text>
<rect x="40" y="215" width="215" height="90" rx="9" class="box"/>
<rect x="315" y="215" width="200" height="90" rx="9" class="box"/>
<rect x="575" y="215" width="150" height="90" rx="9" class="box"/>
<rect x="785" y="215" width="240" height="90" rx="9" class="box"/>
