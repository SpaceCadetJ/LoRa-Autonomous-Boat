<text x="58" y="281" class="s">PWM input</text>
<text x="333" y="247" class="t">U4 TXU0102</text>
<text x="333" y="281" class="s">Pins 5 -&gt; 8</text>
<text x="593" y="247" class="t">R10 100 ohm</text>
<text x="593" y="281" class="s">Series resistor</text>
<text x="803" y="247" class="t">J2.1 ESC signal</text>
<text x="803" y="281" class="s">R11 10k + D10 to GND</text>
<path class="wire" d="M255 260H315 M515 260H575 M725 260H785 M1025 260H1070"/>
<rect x="1070" y="215" width="170" height="90" rx="9" class="hold"/>
<text x="1086" y="246" class="t">Receiver</text>
<text x="1086" y="279" class="s">Unidentified</text>
<text x="785" y="334" class="s">J2.2 BEC_IN; J2.3 GND</text>
<rect x="40" y="365" width="215" height="90" rx="9" class="box"/>
<rect x="315" y="365" width="200" height="90" rx="9" class="box"/>
<rect x="575" y="365" width="150" height="90" rx="9" class="box"/>
<rect x="785" y="365" width="240" height="90" rx="9" class="box"/>
<text x="58" y="397" class="t">PA8 / U1.41</text>
<text x="58" y="431" class="s">PWM input</text>
<text x="333" y="397" class="t">U4 TXU0102</text>
<text x="333" y="431" class="s">Pins 4 -&gt; 1</text>
<text x="593" y="397" class="t">R12 100 ohm</text>
<text x="593" y="431" class="s">Series resistor</text>
