<rect x="1070" y="365" width="170" height="90" rx="9" class="hold"/>
<text x="1086" y="396" class="t">Receiver</text>
<text x="1086" y="429" class="s">Unidentified</text>
<text x="785" y="484" class="s">J3.2 VSERVO; J3.3 GND</text>
<rect x="40" y="530" width="1200" height="65" rx="9" class="box"/>
<text x="58" y="559" class="t">Preserve U4 VCCB = +5V_BUCK before D4; BEC_ONLY / ONBOARD remain exclusive.</text>
<text x="58" y="583" class="s">Pin numbers are schematic evidence. Physical harness orientation and receiver-ground behavior require verification.</text>
<rect x="40" y="635" width="380" height="180" rx="9" class="box"/>
<text x="58" y="668" class="t">1. Fast inhibit</text>
<text x="58" y="701" class="s">100 ns + 55 ns + 245 ns = 400 ns</text>
<text x="58" y="730" class="s">After the allocated overdrive point.</text>
<text x="58" y="759" class="s">Whole downstream path shares 245 ns.</text>
<text x="58" y="788" class="s">Actual waveform remains unqualified.</text>
<rect x="450" y="635" width="380" height="180" rx="9" class="box"/>
<text x="468" y="668" class="t">2. Continuous disabled hold</text>
<text x="468" y="701" class="s">No gap after island hold-up expires.</text>
<text x="468" y="730" class="s">Bound every allowed feed and dwell.</text>
<text x="468" y="759" class="s">High-Z alone does not mean low.</text>
<text x="468" y="788" class="s">Receiver loss policy remains unknown.</text>
<rect x="860" y="635" width="380" height="180" rx="9" class="box"/>
<text x="878" y="668" class="t">3. Fresh rearm</text>
<text x="878" y="701" class="s">Fault must clear retained READY.</text>
<text x="878" y="730" class="s">New health interval after any bounce.</text>
<text x="878" y="759" class="s">Fresh ACK with ARM low; then ARM.</text>
<text x="878" y="788" class="s">Normal disarm is a separate case.</text>
<rect x="40" y="855" width="1200" height="99" rx="9" class="hold"/>
<text x="58" y="885" class="t">Next evidence: exact ESC/BEC/servo, voltage/pulse/loss limits, readiness and harness.</text>
<text x="58" y="916" class="s">No hardware test or application release. Independent next packet: C11 identity and VSERVO reservoir/transients.</text>
<text x="58" y="942" class="s">Preserve 6S, both converters and all default-disabled qualifications.</text>
</svg>
