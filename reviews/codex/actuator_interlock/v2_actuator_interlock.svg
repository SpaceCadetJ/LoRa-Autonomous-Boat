<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 810" role="img" aria-labelledby="title desc"><title id="title">ACT-03 proposed actuator arm interlock</title><desc id="desc">Proposed input qualification and fault latch before the existing ACT-02 translator. No circuit or board changes.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#235d80"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#203746}.h{font-size:28px;font-weight:bold}.s{font-size:17px}.b{font-size:20px;font-weight:bold}.muted{fill:#526977}.card{fill:#fff;stroke:#a9bdca;stroke-width:2}.proposal{fill:#f0f6fa;stroke:#235d80;stroke-width:2;stroke-dasharray:7 5}.wire{stroke:#235d80;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.hold{fill:#9a342e}</style><rect width="1200" height="810" fill="#edf2f5"/><text x="36" y="51" class="h">ACT-03 / Fault-latched actuator permission</text><text x="36" y="84" class="s muted">Behavioral prototype and proposed wiring boundary • ACT-02 schematic remains unchanged</text><rect x="36" y="117" width="340" height="104" rx="10" class="proposal"/><text x="54" y="147" class="b">Local operating windows</text><text x="54" y="175" class="s">3.3 V + 5 V + interlock supply valid</text><text x="54" y="202" class="s muted">Thresholds / hysteresis not selected</text><rect x="36" y="239" width="340" height="112" rx="10" class="proposal"/><text x="54" y="269" class="b">Receiver readiness</text><text x="54" y="297" class="s">ESC_READY + SERVO_READY</text><text x="54" y="325" class="s hold">No ready signals in current harness</text><rect x="36" y="369" width="340" height="110" rx="10" class="proposal"/><text x="54" y="399" class="b">Command service watchdog</text><text x="54" y="427" class="s">Edges from reviewed command handling</text><text x="54" y="455" class="s muted">Timer / diagnostic heartbeat insufficient</text><rect x="36" y="497" width="340" height="90" rx="10" class="proposal"/><text x="54" y="528" class="b">Stop loop / power-on reset</text><text x="54" y="557" class="s">Default-disable and failed-wire behavior</text><path d="M376 169H414V542H376M376 295H414M376 424H414" stroke="#235d80" stroke-width="2.5" fill="none"/><path d="M414 341H454" class="wire"/><rect x="454" y="221" width="337" height="246" rx="10" class="proposal"/><text x="478" y="258" class="b">Qualification + arm latch</text><text x="478" y="292" class="s">1. Stable qualified conditions</text><text x="478" y="323" class="s">2. PC4 low + fresh ACK edge</text><text x="478" y="354" class="s">3. Later PC4 rising edge</text><text x="478" y="395" class="s hold">Any fault clears permission first.</text><text x="478" y="427" class="s hold">Recovery never auto-rearms.</text><path d="M791 341H834" class="wire"/><rect x="834" y="241" width="330" height="198" rx="10" class="card"/><text x="857" y="278" class="b">ACT-02 TXU0102</text><text x="857" y="312" class="s">U4.6 OE + R40 pulldown</text><text x="857" y="345" class="s">OE low → high-impedance outputs</text><text x="857" y="379" class="s muted">Retain both PWM signal paths.</text><text x="857" y="410" class="s hold">HiZ is not proof of motor stop.</text><rect x="454" y="497" width="710" height="90" rx="10" class="card"/><text x="478" y="527" class="b">Future circuit delta to declare before native capture</text><text x="478" y="556" class="s">Split PC4 request from OE; insert the interlock; retain R40 on OE.</text><text x="36" y="634" class="b">Evidence boundary</text><text x="36" y="668" class="s">Solid output block exists in ACT-02. Dashed blocks are proposed and have no selected parts.</text><text x="36" y="700" class="s">BEC_IN / local VSERVO can show voltage at a measured point; neither proves remote receiver readiness.</text><text x="36" y="732" class="s">100 ms demonstration timing is illustrative. No rail limits, vehicle timeout, PCB or fabrication release.</text><text x="36" y="775" class="s muted">Preserve 6S, both converter sheets, exclusive ACT-01 populations, V1 and existing firmware.</text></svg>