<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1150" viewBox="0 0 1400 1150"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#537088" stroke-width="1.5"/></marker></defs><rect width="1400" height="1150" fill="#f1f5fa"/>
<text x="44" y="43" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#175ec2" font-weight="700">V2 / 2S–6S / PROPOSED POWER ARCHITECTURE</text>
<text x="44" y="91" font-family="Segoe UI,Arial,sans-serif" font-size="35" fill="#19364d" font-weight="700">Choose the protection boundary before routing</text>
<text x="44" y="126" font-family="Segoe UI,Arial,sans-serif" font-size="19" fill="#465f73" font-weight="400">Recommendation: advance A to an isolated schematic study. Neither circuit is selected or hardware-qualified.</text>
<rect x="40" y="158" width="1320" height="335" rx="12" fill="#ffffff" stroke="#d2dfeb"/>
<text x="66" y="200" font-family="Segoe UI,Arial,sans-serif" font-size="26" fill="#19364d" font-weight="700">A  ·  Wider-voltage conversion</text>
<text x="66" y="233" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#465f73" font-weight="400">Higher-voltage bucks and sensing; reverse controller still needs a bounded positive/negative surge design.</text>
<rect x="66" y="259" width="170" height="100" rx="12" fill="#f5f8fc" stroke="#d2dfeb"/>
<text x="82" y="288" font-family="Segoe UI,Arial,sans-serif" font-size="19" fill="#19364d" font-weight="600">7–25.2 V pack</text>
<text x="82" y="314" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#465f73" font-weight="400">Fuse + TVS</text>
<text x="82" y="336" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#465f73" font-weight="400">Exact parts open</text>
<rect x="278" y="259" width="238" height="100" rx="12" fill="#f5f8fc" stroke="#d2dfeb"/>
<text x="294" y="288" font-family="Segoe UI,Arial,sans-serif" font-size="19" fill="#19364d" font-weight="600">Reverse protection</text>
<text x="294" y="314" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#465f73" font-weight="400">Controller + N-FET</text>
<text x="294" y="336" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#465f73" font-weight="400">LM74700 under review</text>
<rect x="558" y="259" width="200" height="100" rx="12" fill="#f5f8fc" stroke="#d2dfeb"/>
<text x="574" y="288" font-family="Segoe UI,Arial,sans-serif" font-size="19" fill="#19364d" font-weight="600">Sense boundary</text>
<text x="574" y="314" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#465f73" font-weight="400">VIN_RAW → shunt</text>
<text x="574" y="336" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#465f73" font-weight="400">VIN_BUCK → loads</text>
<rect x="806" y="259" width="238" height="100" rx="12" fill="#f5f8fc" stroke="#d2dfeb"/>
<text x="822" y="288" font-family="Segoe UI,Arial,sans-serif" font-size="19" fill="#19364d" font-weight="600">Parallel converters</text>
<text x="822" y="314" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#465f73" font-weight="400">2 × LMR36520</text>
<text x="822" y="336" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#465f73" font-weight="400">3.3 V and 5 V</text>
<rect x="1090" y="259" width="244" height="100" rx="12" fill="#f5f8fc" stroke="#d2dfeb"/>
<text x="1106" y="288" font-family="Segoe UI,Arial,sans-serif" font-size="19" fill="#19364d" font-weight="600">Logic + actuator</text>
<text x="1106" y="314" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#465f73" font-weight="400">Buffers: regulated 5 V</text>
<text x="1106" y="336" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#465f73" font-weight="400">Servo: variant choice</text>
<path d="M236 309L278 309" fill="none" stroke="#537088" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M516 309L558 309" fill="none" stroke="#537088" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M758 309L806 309" fill="none" stroke="#537088" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M1044 309L1090 309" fill="none" stroke="#537088" stroke-width="2" marker-end="url(#arrow)"/>
<text x="68" y="393" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#19364d" font-weight="400">Sensing: INA281A1 on protected taps; battery divider and ADC protection must be recalculated.</text>
<text x="68" y="424" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#885200" font-weight="600">Open exclusion: charged output 25.2 V minus input −53.3 V = 78.5 V differential.</text>
<text x="68" y="454" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#885200" font-weight="400">LM74700 limit: 70 V recommended / 75 V absolute. Resolve the envelope or use a different controller.</text>
<rect x="40" y="513" width="1320" height="310" rx="12" fill="#ffffff" stroke="#d2dfeb"/>
<text x="66" y="555" font-family="Segoe UI,Arial,sans-serif" font-size="26" fill="#19364d" font-weight="700">B  ·  Active cutoff, existing converter types</text>
<text x="66" y="588" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#465f73" font-weight="400">Retain for comparison. A lower cutoff is possible if restart at a full 25.2 V pack is not required.</text>
<rect x="66" y="614" width="170" height="100" rx="12" fill="#f5f8fc" stroke="#d2dfeb"/>
<text x="82" y="643" font-family="Segoe UI,Arial,sans-serif" font-size="19" fill="#19364d" font-weight="600">7–25.2 V pack</text>
<text x="82" y="669" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#465f73" font-weight="400">Fuse + TVS</text>
<text x="82" y="691" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#465f73" font-weight="400">Exact parts open</text>
<rect x="278" y="614" width="238" height="100" rx="12" fill="#f5f8fc" stroke="#d2dfeb"/>
<text x="294" y="643" font-family="Segoe UI,Arial,sans-serif" font-size="19" fill="#19364d" font-weight="600">Cutoff + reverse block</text>
<text x="294" y="669" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#465f73" font-weight="400">LTC4365 TS8</text>
<text x="294" y="691" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#465f73" font-weight="400">2 common-source FETs</text>
<rect x="558" y="614" width="200" height="100" rx="12" fill="#f5f8fc" stroke="#d2dfeb"/>
<text x="574" y="643" font-family="Segoe UI,Arial,sans-serif" font-size="19" fill="#19364d" font-weight="600">Protected island</text>
<text x="574" y="669" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#465f73" font-weight="400">Shunt + ADC divider</text>
<text x="574" y="691" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#465f73" font-weight="400">Upgraded sensing</text>
<rect x="806" y="614" width="238" height="100" rx="12" fill="#f5f8fc" stroke="#d2dfeb"/>
<text x="822" y="643" font-family="Segoe UI,Arial,sans-serif" font-size="19" fill="#19364d" font-weight="600">Existing buck types</text>
<text x="822" y="669" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#465f73" font-weight="400">R1240 + TPS54202</text>
<text x="822" y="691" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#465f73" font-weight="400">Support fixes required</text>
<rect x="1090" y="614" width="244" height="100" rx="12" fill="#f5f8fc" stroke="#d2dfeb"/>
<text x="1106" y="643" font-family="Segoe UI,Arial,sans-serif" font-size="19" fill="#19364d" font-weight="600">Logic + actuator</text>
<text x="1106" y="669" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#465f73" font-weight="400">Same corrected rails</text>
<text x="1106" y="691" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#465f73" font-weight="400">Same load constraints</text>
<path d="M236 664L278 664" fill="none" stroke="#537088" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M516 664L558 664" fill="none" stroke="#537088" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M758 664L806 664" fill="none" stroke="#537088" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M1044 664L1090 664" fill="none" stroke="#537088" stroke-width="2" marker-end="url(#arrow)"/>
<text x="68" y="754" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#19364d" font-weight="400">OV study: 539 kΩ / 10 kΩ, ±0.1% → 26.980–27.922 V trip; minimum recovery 25.226 V.</text>
<text x="68" y="785" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#885200" font-weight="400">Only 78 mV below the 28 V buck operating ceiling. Delay at specified overdrive is not a surge guarantee.</text>
<rect x="40" y="843" width="644" height="219" rx="12" fill="#fff6e7" stroke="#e7c78b"/>
<rect x="706" y="843" width="654" height="219" rx="12" fill="#ffffff" stroke="#d2dfeb"/>
<text x="66" y="884" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#19364d" font-weight="600">Load budget: one feed cannot promise every rail goal</text>
<text x="66" y="919" font-family="Segoe UI,Arial,sans-serif" font-size="19" fill="#19364d" font-weight="400">7 V input, 1.2 A logic + 2 A servo:</text>
<text x="66" y="951" font-family="Segoe UI,Arial,sans-serif" font-size="20" fill="#885200" font-weight="600">1.994 A ideal  /  2.363 A at the example assumptions</text>
<text x="66" y="984" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#19364d" font-weight="400">Example: 85% converter efficiency + 20 mA auxiliary 5 V.</text>
<text x="66" y="1013" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#19364d" font-weight="400">External BEC removes servo demand from this board feed.</text>
<text x="66" y="1040" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#19364d" font-weight="400">1 A is a planning goal, not a demonstrated hardware limit.</text>
<text x="732" y="884" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#19364d" font-weight="600">Next: one captured input-stage schematic</text>
<text x="732" y="919" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#19364d" font-weight="400">1. Bound source, surge, reverse and stored-energy cases.</text>
<text x="732" y="951" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#19364d" font-weight="400">2. Select exact protection parts and record every pin delta.</text>
<text x="732" y="983" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#19364d" font-weight="400">3. Run native checks; qualify package and thermal space.</text>
<text x="732" y="1015" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#19364d" font-weight="400">4. Then complete converter cells and coordinate IMU2 routing.</text>
<text x="732" y="1040" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#465f73" font-weight="400">No live CAD, copper, BOM or firmware changes in this packet.</text>
<text x="44" y="1100" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#526577" font-weight="400">Functional power-path map • Not a native schematic • 2026-10-12 • Sources and tolerances: README.md</text>
<text x="44" y="1128" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#526577" font-weight="400">Separate external BEC and motor feeds are omitted. Voice/text/location handheld hardware is a separate future design.</text>
</svg>