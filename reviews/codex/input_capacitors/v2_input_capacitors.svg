<title id="title">V2 input capacitor network — proposed connection contract</title><desc id="desc">Separate nonpolar reservoir on VIN_RAW and local ceramic bank plus high frequency bypass on VIN_BUCK after R33. Proposed only, no live schematic or board change.</desc>
