<text x="55" y="616" class="label">Keep the two loops distinct</text><text x="55" y="645" class="body">Remote VIN_RAW capacitors are not credited as local CIN. CHF and CIN return directly to converter PGND.</text>
<rect x="34" y="686" width="642" height="190" rx="9" class="card"/><rect x="698" y="686" width="668" height="190" rx="9" class="card"/>
<text x="55" y="722" class="label">Exact part and footprint proposal</text><text x="55" y="752" class="body">TDK C5750X7S2A106K230KB · 10 µF / 100 V</text><text x="55" y="782" class="body">Lands: gap 4.4 mm · pads 1.3 × 4.6 mm</text><text x="55" y="812" class="body">Four proposed sites: 177 mm² before routing / CHF</text><text x="55" y="842" class="small hint">Native dimensions checked; board fit / assembly unqualified.</text>
<text x="719" y="722" class="label">Required before integration</text><text x="719" y="752" class="body">Bound effective C at 25.2 / 44 V, temperature and age.</text><text x="719" y="782" class="body">Close negative-rail leakage and source-lead damping.</text><text x="719" y="812" class="body">Screen 0.6 A RMS for first input bank; verify ripple.</text><text x="719" y="842" class="small hint">5 V converter needs its own local bank; not shown here.</text>
<text x="42" y="914" class="small">Functional aliases are not allocated CAD references. Drawing is a proposed connection contract, not a native netlist.</text>
<text x="42" y="943" class="small hint">Sources, exact native land inspection and limitations: reviews/codex/input_capacitors/README.md</text>
