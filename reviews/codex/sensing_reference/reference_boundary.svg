<path d="M348 446H540 M700 446H810" class="wire"/><text x="400" y="430">+3V3</text>
<rect x="540" y="420" width="160" height="53" rx="8" class="box"/><text x="566" y="453">FB1 bead</text>
<rect x="810" y="404" width="300" height="83" rx="8" class="box"/><text x="833" y="435">VDDA / internal VREF+</text><text x="833" y="466" class="sub">C21 / C22 to analog return</text>
<rect x="35" y="540" width="1130" height="109" rx="12" fill="#fff0e7" stroke="#ce7444"/>
<text x="58" y="575" class="label">25.2 V raw example: 3.219942 − 3.241200 = −21.257801 mV</text>
<text x="58" y="605" class="sub">Reference + initial-resistor screen only; VFB limits specified at converter VIN=24 V.</text>
<text x="58" y="630" class="sub">Actual VDDA, transients, ripple, drift, feed drop and required reserve remain unqualified.</text>
<text x="38" y="685" class="label">Reset / inactive FT pad ≠ enabled ADC ≠ startup / shutdown</text>
<text x="38" y="717" class="sub">Check peripheral state, pull configuration, C36 stored charge and reference collapse.</text>
<text x="38" y="745" class="sub">FT VDD+4 V stress ceiling is not conversion permission or a diode-clamp allowance.</text>
<text x="38" y="777" class="sub">Next: state-based isolation / discharge / reference-valid contract before a new circuit amendment.</text>
