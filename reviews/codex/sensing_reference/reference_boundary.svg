<circle cx="590" cy="185" r="5" fill="#147d91"/><text x="505" y="154" class="sub">VBAT_SENSE</text>
<text x="517" y="240">R32 · 6.8 kΩ</text><text x="517" y="269">C36 · 100 nF</text><text x="517" y="299" class="sub">both to GND</text>
<path d="M590 190V217" class="wire"/>
<rect x="810" y="151" width="300" height="92" rx="8" class="box"/><text x="833" y="184" class="label">U1 PA2 · ADC123_IN2</text><text x="833" y="217" class="sub">Active range: 0…VREF+</text>
<text x="58" y="295" class="sub">The divider measures VIN_RAW, not battery-terminal voltage.</text>
