<text x="38" y="46" class="h">SENSE-03 · Follow the signal and its reference</text>
<text x="38" y="76" class="sub">Captured SENSE-02 topology + conditional arithmetic. No native change or hardware acceptance.</text>
<rect x="35" y="104" width="1130" height="230" rx="12" class="box"/>
<text x="58" y="138" class="label">Signal path</text><text x="58" y="184">VIN_RAW</text><text x="58" y="211" class="sub">post-D12</text>
