<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="900" viewBox="0 0 1280 900" role="img" aria-labelledby="title desc">
<title id="title">ACT-06 local rail observation and incomplete permission boundary</title><desc id="desc">A functional proposal, not a schematic. Local windows feed retained-fault and conditioning stages. No connection is implemented to the preserved default-disabled ACT-04 qualification input.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#557384" stroke-width="1.5"/></marker><style>text{font-family:Arial,sans-serif;fill:#183142}.eyebrow{font-size:14px;letter-spacing:2px;font-weight:bold}.heading{font-size:32px;font-weight:bold}.sub{font-size:18px;fill:#516976}.label{font-size:21px;font-weight:bold}.body{font-size:17px}.small{font-size:15px;fill:#516976}.hold{fill:#923e24}.box{fill:white;stroke:#b8cbd5;stroke-width:2}.line{fill:none;stroke:#557384;stroke-width:2.5;marker-end:url(#arrow)}</style></defs>
<rect width="1280" height="900" fill="#f3f6f8"/><text class="eyebrow" x="45" y="43">ACT-06 · FUNCTIONAL PROPOSAL · ELECTRICAL DELTA ZERO</text><text class="heading" x="45" y="90">Local rail validity is one input to actuator permission</text><text class="sub" x="45" y="125">No supervisor is selected. ACT-04 remains the latest native circuit; QUAL_OK and ACK stay pulled low.</text>
<rect class="box" x="45" y="173" width="365" height="233" rx="12"/><text class="label" x="65" y="209">1  Observe local rails</text><text class="body" x="65" y="246">3V3 and pre-diode +5V_BUCK</text><text class="body" x="65" y="279">TPS3700: two dividers per rail</text><text class="body" x="65" y="309">or TPS3703: one monitor per rail</text><text class="small hold" x="65" y="351">Threshold, drift and timing limits open</text><text class="small hold" x="65" y="378">Monitor supply / power loss unresolved</text>
<path class="line" d="M410 281H472"/><text class="small" x="420" y="263">fault</text>
<rect class="box" x="482" y="173" width="328" height="233" rx="12"/><text class="label" x="502" y="209">2  Retain detected faults</text><text class="body" x="502" y="249">Bound clear-pulse duration</text><text class="body" x="502" y="280">Control recovery and restart</text><text class="small" x="502" y="319">TPS3808 or integrated reset:</text><text class="small hold" x="502" y="348">a release delay cannot recover</text><text class="small hold" x="502" y="377">a fault the detector missed</text>
<path class="line" d="M810 281H867"/>
<rect class="box" x="877" y="173" width="358" height="233" rx="12"/><text class="label" x="897" y="209">3  Condition the signal</text><text class="body" x="897" y="249">Schmitt interface candidate:</text><text class="body" x="897" y="280">SN74LVC1G17DBVR</text><text class="small hold" x="897" y="320">Loading, supply ramp and edge</text><text class="small hold" x="897" y="349">qualification still required</text><text class="small" x="897" y="379">Proposed port: LOCAL_RAIL_OK</text>
<path d="M1055 406V468" fill="none" stroke="#ad6a41" stroke-width="2.5" stroke-dasharray="7 5"/><path d="M1039 468H1071" stroke="#ad6a41" stroke-width="5"/><text class="small hold" x="820" y="502">NO IMPLEMENTED CONNECTION TO QUAL_OK</text>
<rect x="45" y="468" width="670" height="218" rx="12" fill="#fff3e3" stroke="#d4af80" stroke-width="2"/><text class="label" x="65" y="505">Complete permission still requires</text><text class="body" x="65" y="542">Independent receiver readiness · fresh-command watchdog</text><text class="body" x="65" y="574">Stop continuity · supply qualification · deliberate ACK</text><text class="small hold" x="65" y="617">Local VSERVO alone cannot establish remote ESC readiness.</text><text class="small hold" x="65" y="650">Missing permissions remain disabled; no new harness assignment.</text>
<rect class="box" x="800" y="540" width="435" height="146" rx="12"/><text class="label" x="820" y="577">Preserved ACT-04 latch</text><text class="body" x="820" y="611">QUAL_OK → R42 10k to GND</text><text class="body" x="820" y="646">ACK → R43 10k to GND</text>
<rect x="45" y="730" width="1190" height="124" rx="12" fill="#e4edf2"/><text class="label" x="65" y="770">Direct pull-up is not a valid permission interface</text><text class="body" x="65" y="805">3.3 V → 10k pull-up → R42 10k to ground gives ~1.65 V, below the selected 2.0 V high threshold.</text><text class="small" x="65" y="833">Preserve R42 and the disabled default; review the eventual driver, power sequencing and full permission logic.</text>
</svg>