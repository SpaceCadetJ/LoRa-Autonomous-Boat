tor stock for V1, but expect to move to TCAN1044A-Q1. Non-automotive TCAN1042HDR is the same silicon without AEC-Q100 if that is acceptable.\n5. **R5 ROHM MCR10EZPF3002** could not be found at Mouser, and Digi-Key carries a ROHM notice that MCR/MNR-series new orders are no longer accepted. Substitute Yageo RC0805FR-0730KL (or Panasonic ERJ-6ENF3002V) - same 0805 footprint, 30 k 1% 1/8 W.\n6. **R6 Samsung RC1005F103CS** is Digi-Key-only among the two named distributors; qty-1 $0.10 is from a Digi-Key search snippet. Yageo RC0402FR-0710KL is a drop-in if you consolidate on one resistor vendor.\n7. **Sullins PPTC headers and JST B4B-XH-A(LF)(SN)**: Mouser does not stock Sullins and did not render pricing for the JST header; the Digi-Key qty-1 numbers come from search snippets (multiple values were seen, the lowest is quoted in the table). Verify the qty-10 break on Digi-Key before ordering.\n8. **Test points.** The 1.4 mm / 3.4 mm amv_test_point pad does not match any Keystone through-hole test point hole size (0.040 in miniature/loop, 0.063-0.078 in large). Recommend leaving these as bare PTH pads (no BOM line) for V1; if a loop is wanted, swap the footprint to a Keystone 5020/5021 two-hole 0.040 in pattern.\n9. **CL10A 4.7 uF voltage.** The design encodes only series + size. 10 V (KP8) is the safer choice for a 3.3 V/5 V rail and is cheaper than the 6.3 V (KQ8) part today; a 16 V CL10A475KO8NNNC also exists if CEXT sits on a higher rail.\n10. **Kyocera AVX global part numbers.** Mouser cross-lists 06035A471JAT2A to new global PN KGM15ACG1H471JT; both are orderable, same part.\n11. **Murata 10 uF caps.** GRM21BR61C106KE15L and GRM31CR71E106KA12L both priced, but Mouser showed no in-stock quantity on the page read - check stock at order time. 50 V 1206 X5R (GRM31CR61H106KA12L) is obsolete at Mouser, hence the 25 V X7R choice for COUT (buck output, Vout \u003c= 15 V).\n12. **U6 output current.** Distributor listings show R1240N001B at ~1.2 A. If V1 intends to feed servo/ESC logic from this rail, confirm the load budget.\n13. **Mouser tariff banner.** Several Mouser passive pages showed \"a tariff of X% may be applied if shipping to the United States\" (8% to 30%). Not included in the figures.\n\n## V1 BOM cost estimate (qty-1 breaks, one board)\n\nSum uses the qty-1 unit price times the per-board quantity. Where 10 pieces are used (C1-C9, C22) the qty-10 break would actually apply and cut that line from $1.10 to $0.41.\n\n| Line | Qty/board | Unit (qty-1) | Ext. | Basis |\n|---|---|---|---|---|\n| KGM21NR71H104KT (C1-C9, C22) | 10 | $0.11 | $1.10 | Mouser |\n| CL10A475KP8NNNC (C10) | 1 | $0.11 | $0.11 | Mouser |\n| CL10A475KP8NNNC (CEXT) | 1 | $0.11 | $0.11 | Mouser |\n| CL10B104KB8NNNC (C12) | 1 | $0.16 | $0.16 | Mouser |\n| 06035A471JAT2A (C14) | 1 | $0.12 | $0.12 | Mouser |\n| GRM21BR61C106KE15L (C20, C21) | 2 | $0.12 | $0.24 | Mouser |\n| GJM1555C1H470JB01D (C23, as drawn) | 1 | $0.12 | $0.12 | Mouser |\n| KTS500B106M55N0T00 (CIN) | 1 | $4.37 | $4.37 | Mouser |\n| GRM31CR71E106KA12L (COUT) | 1 | $0.33 | $0.33 | Mouser |\n| CMS06(TE12L,Q,M) (D21) | 1 | $0.88 | $0.88 | Mouser |\n| VLS6045EX-4R7M-H (L1 substitute) | 1 | $0.21 | $0.21 | LCSC (not DK/Mouser) |\n| BLM15AG601SN1D (L3, L4) | 2 | $0.10 | $0.20 | Mouser |\n| ERJ-2RKF1502X (R1) | 1 | $0.11 | $0.11 | Mouser |\n| RC0603FR-074K7L (R2) | 1 | $0.10 | $0.10 | Mouser |\n| RC0402FR-0751RL (R3) | 1 | $0.11 | $0.11 | Mouser |\n| ERJ-2RKF5101X (R4) | 1 | $0.10 | $0.10 | Mouser |\n| RC0805FR-0730KL (R5 substitute) | 1 | $0.10 | $0.10 | Estimate (typical RC0805 qty-1) |\n| RC1005F103CS (R6) | 1 | $0.10 | $0.10 | Digi-Key snippet |\n| STM32F446RET6 (U3) | 1 | $10.57 | $10.57 | Mouser (TR variant $9.76) |\n| TCAN1042HDRQ1 (U5) | 1 | $2.19 | $2.19 | Mouser |\n| R1240N001B-TR-FE (U6) | 1 | $1.77 | $1.77 | Mouser (Digi-Key $1.72) |\n| FTSH-105-01-L-DV-K (JTAG) | 1 | $1.24 | $1.24 | Mouser |\n| B4B-XH-A(LF)(SN) (CANHEADER) | 1 | $0.21 | $0.21 | Digi-Key snippet |\n| PPTC051LFBN-RC (GPSMODULE, LORAMODULE) | 2 | $0.38 | $0.76 | Digi-Key snippet |\n| PPTC031LFBN-RC (SPEEDCONTROLLER, STEERINGSERVO) | 2 | $0.30 | $0.60 | Digi-Key snippet |\n| TP1, TP3, TP4, TP5 | 4 | $0 | $0 | bare pad (Keystone 5020 option adds $1.04) |\n| VIN, GND | 2 | $0 | $0 | bare pad |\n| **Total, one board** | | | **$25.91** | |\n\nBreakdown of the total by pricing basis: $23.93 read directly from Mouser product pages; $1.67 from Digi-Key search snippets (R6, CANHEADER, four Sullins sockets); $0.31 estimated/LCSC (L1 and R5 substitutes). Using STM32F446RET6TR instead of the tray part gives $25.10. Ten-piece breaks on the 0805 0.1 uF line would bring it to about $25.22. CIN alone is 17% of the board cost; a cheaper 2220 50 V 10 uF (Note 1) is the obvious cost lever.\n\nCould not price at Digi-Key or Mouser today: SLF7045T-4R7M2R0-PF (obsolete, no price), VLS6045EX-4R7M-H (LCSC only), ROHM MCR10EZPF3002 (not found), RC0805FR-0730KL (LCSC only), qty-10 breaks for RC1005F103CS, B4B-XH-A(LF)(SN), PPTC051LFBN-RC and PPTC031LFBN-RC.\n"},{"path":"docs/research/DATASHEET_NOTES.md","title":"Datasheet research notes — STM32 boat-controller PCB review","text":"# Datasheet research notes — STM32 boat-controller PCB review\n\nCompiled 2026-09-16 from the current manufacturer documents (or the newest copy that could actually be retrieved; where a newer revision exists but could not be downloaded, that is stated). Page numbers are PDF page numbers of the cited document. \"NOT FOUND\" means the fact is not in the cited document(s), not that it is false.\n\nRetrieval notes that affect trust:\n- st.com, toshiba.semicon-storage.com (Akamai) and product.tdk.com refuse non-browser downloads; where a mirror was used it is named, and the manufacturer's current revision/date is recorded from the manufacturer's product page.\n- All PDFs were text-extracted with pypdf and drawings were rendered and read visually (PyMuPDF), so pin numbers/land patterns below come from the drawings, not from distributor summaries.\n\n---\n\n## 1. Nisshinbo (ex-Ricoh) R1240N001B-TR-FE — 1.2 A / 30 V asynchronous step-down DC/DC, SOT-23-6W\n\n- Manufacturer: Nisshinbo Micro Devices Inc. (the former Ricoh Electronic Devices \"R\" product line; DigiKey lists the part under Nisshinbo).\n- Exact MPN: R1240N001B-TR-FE.\n- Datasheet: \"R1240x Series 1.2 A, 30 V Step-Down DC/DC Converter\", document NO.EA-190-240903 (2024-09-03; PDF created 2024-09-11), 22 pp. URL: https://www.nisshinbo-microdevices.co.jp/en/pdf/datasheet/r1240-ea.pdf (linked from https://www.nisshinbo-microdevices.co.jp/en/products/dc-dc-switching-regulator/spec/?product=r1240).\n\nFacts:\n- Topology: ASYNCHRONOUS. Only an internal N-ch high-side switch (RON 0.35 Ω typ); the converter is built \"with the following external components: an inductor, resistors, a diode, and capacitors\" (p.1 OUTLINE). The basic-circuit figure shows an external freewheel diode (p.6) and the recommended-parts table lists D = CMS06 or CMS11 (Toshiba) (p.7, p.11). There is no synchronous low-side FET. A catch Schottky from Lx to GND is mandatory.\n- Note on the series description: switching frequency is 1.25 MHz typ (1.0–1.5 MHz min/max), not 1.5 MHz (p.1, p.5 \"fosc\"). Fold-back (B version) frequency 310 kHz when VFB \u003c 0.56 V (p.5).\n- Input voltage: 4.5–30 V operating (p.1 FEATURES; p.4 Recommended Operating Conditions); VIN abs max −0.3 to 32 V (p.4).\n- Max output current: 1.2 A (p.1). Peak current limit 2.0 A typ; ILX abs max 2 A (p.4, p.5). Min on-time 100 ns typ (p.5, p.10).\n- Feedback reference: VFB = 0.800 V ±1.5 % (0.788–0.812 V), ±150 ppm/°C (p.5). Output formula: VOUT = VFB × (R1 + R2) / R2; recommended R2 ≈ 1.2–16 kΩ (p.9). Recommended-values table: R1 = (VOUT/0.8 − 1) × 1.2 kΩ with R2 = 1.20 kΩ; for 3.3 V the typical circuit uses R1 = 3.75 kΩ, R2 = 1.2 kΩ, CSPD = 470 pF (+ optional 5.1 kΩ) (p.7, p.11).\n- Recommended externals (p.7 typical circuit, p.11 table): CBST = 0.1 µF/50 V (Murata GRM21BB11H104KA01L) in series with RBST = 51 Ω between BST and Lx; L = 4.7 µH for 1.8 V ≤ VOUT \u003c 5 V (TDK SLF7045T-4R7M2R0-PF; 2.2 µH below 1.8 V, 4.7–10 µH ≥ 5 V, p.9); CIN ≥ 10 µF ceramic (10 µF/50 V: Taiyo Yuden UMK325BJ106MM-P, TDK CGA6P3X7S1H106K, or Nippon Chemi-Con KTS500B106M55N0T00); COUT ≥ 10 µF for VOUT ≥ 1.8 V (10 µF/25 V Murata GRM31CR71E106K), ≥ 20 µF below 1.8 V (p.9, p.11); D = CMS06 (30 V/2 A, 0.32 V) or CMS11 (40 V/2 A) (p.11). Diode guidance: Schottky with total capacitance ≤ 100 pF at VR = 10 V; if VF > 0.7 V at 4–5 A the Lx pin can exceed its negative rating on an output short (p.9).\n- SOT-23-6W pinout (p.3, \"R1240N001x Pin Description\"): 1 = CE (chip enable, active \"H\"), 2 = VIN, 3 = Lx, 4 = BST, 5 = GND, 6 = VFB. Pin 1 is at the dot; pins 1-2-3 down the left side, 6-5-4 down the right side (top view).\n- CE thresholds: VCEH ≥ 1.6 V, VCEL ≤ 0.3 V; ICEH/ICEL = ±1 µA (p.5) — i.e. NO internal pull-up/down; CE must be driven or tied. An ESD diode exists from CE to VIN; if CE can exceed VIN add ~5 kΩ in series (p.11 \"RCE\").\n- UVLO: detect (falling) 3.8 V typ (3.6–4.0), release (rising) VUVLO1 + 0.2 V typ, 4.2 V max (p.5). Thermal shutdown 160 °C typ, 30 °C hysteresis (p.5). Standby current 0 typ / 5 µA max (p.5).\n- Package thermal: SOT-23-6W PD = 430 mW on the standard land pattern, θja ≈ 233 °C/W (p.4, p.16). Tj −40..125 °C, Ta −40..85 °C (p.4).\n- Part-number decoding (Selection Guide p.2 and marking p.18): R1240 = series; N = SOT-23-6W package (K = DFN(PL)2527-10); 001 = product/version code for the SOT-23-6W version (003 for the DFN); trailing letter = short-protection option, A = latch (2 ms delay), B = fold-back → \"001B\" = fold-back version, and it is NOT a fixed-output code — every R1240 is adjustable 0.8–15 V via R1/R2 (p.1). Marking on SOT-23-6W: R1240N001B = product code \"8B\" (p.18). \"-TR\" = tape & reel, 3000 pcs (p.2). \"-FE\" is not decoded in the datasheet (NOT FOUND; the selection guide only lists the full string \"R1240N001x-TR-FE\" as Pb-free/halogen-free \"Yes\").\n\n## 2. Texas Instruments TCAN1042H-Q1 (orderable TCAN1042HDRQ1, SOIC-8 \"D\")\n\n- Manufacturer: Texas Instruments. Exact MPN: TCAN1042HDRQ1 (Active, SOIC D, 2500/reel, -55 to 125 °C, per orderable addendum at the end of the datasheet).\n- Datasheet: \"TCAN1042-Q1 Automotive Fault Protected CAN Transceiver with CAN FD\", SLLSES9D, February 2016 – revised October 2021 (Rev. D; TI product page shows \"Rev. D, Oct 28 2021\"). Covers TCAN1042-Q1/V/H/HV/G/GV/HG/HGV-Q1. URL: https://www.ti.com/lit/ds/symlink/tcan1042h-q1.pdf. (Note: the family datasheet number is SLLSES9, not SLLSER7.)\n\nFacts:\n- SOIC-8 pin table (Table 6-1, p.5; Figure 6-1 top view): 1 TXD (digital in, LOW = dominant), 2 GND, 3 VCC (5 V transceiver supply), 4 RXD (digital out, LOW = dominant), 5 NC on Base/H/G/HG devices — VIO only on \"V\"-suffix devices, 6 CANL, 7 CANH, 8 STB (standby control input, active high). Block-diagram note A (p.1): \"Terminal 5 function is device dependent; NC on devices without the 'V' suffix\".\n- VCC range: 4.5–5.5 V (Recommended Operating Conditions §7.4, p.8). 3.3 V on VCC is NOT allowed; UVCC falling threshold 3.8–4.25 V puts the part in protected mode (p.9, Table 9-1 p.20). VIO 3–5.5 V exists only on V variants; the H variant has no VIO (pin 5 = NC).\n- RXD output level on the H (non-V) part: referenced to VCC — VOH 4.0 V min / 4.6 V typ at IO = −2 mA, VOL 0.2/0.4 V (§7.7 RXD terminal, p.10); block-diagram note B: \"RXD logic output is driven to VCC on devices without the 'V' suffix\". So RXD is a 5 V output; the MCU RXD pin must be 5 V tolerant (STM32 PA11 is FT, see §5).\n- TXD input thresholds (non-V devices): VIH ≥ 2 V, VIL ≤ 0.8 V (§7.7 TXD terminal, p.9). 3.3 V CMOS drive is therefore acceptable on TXD (and STB, same thresholds). TXD has an internal pull-up to VCC (§9.3.5 p.20; footnote 2 to the mode table p.22; §11 p.29). IIL at TXD = 0 V is −100 to −7 µA (p.9).\n- STB polarity: HIGH = Standby (driver and receiver off, bus biased to GND); LOW = Normal (Table 9-3 p.22; §9.4.2/9.4.3 p.23). STB is INTERNALLY PULLED UP to VCC \"to force the device into low power Standby mode if the terminal floats\" (§9.3.5 p.20) — STB must be actively driven low (or tied to GND) to communicate. IIL(STB) at 0 V = −20 to −2 µA (p.9).\n- Temperature: AEC-Q100 grade 1 (p.1); electrical characteristics over TA = −55 to 125 °C (p.9); TJ −55 to 150 °C (p.6, p.1); orderable TCAN1042HDRQ1 marked −55 to 125 (addendum).\n- Bus fault protection ±70 V for H variants (p.1, p.6). Feature bullet \"I/O Voltage range supports 3.3 V and 5 V MCUs\" (p.1) refers to the family (V variants supply the level shift); for the H part the practical 3.3 V compatibility is TXD/STB thresholds (TTL) plus a 5 V-tolerant RXD input on the MCU.\n\n## 3. Toshiba CMS06(TE12L,Q,M) — 30 V / 2 A Schottky barrier rectifier, M-FLAT\n\n- Manufacturer: Toshiba Electronic Devices & Storage Corp. Orderable: CMS06(TE12L,Q,M) (Toshiba page lists \"CMS06(TE12L,Q\" MOQ 3000; TE12L = 12 mm embossed tape, 3000/reel per the M-FLAT package page; the \",Q\" and \",M\" suffix letters are not decoded on the pages retrieved — NOT FOUND).\n- Current datasheet: \"CMS06 Data sheet/English\", Nov 2013, 155 KB, URL https://toshiba.semicon-storage.com/info/CMS06_datasheet_en_20131101.pdf?did=3138&prodName=CMS06 (product page https://toshiba.semicon-storage.com/us/semiconductor/product/diodes/detail.CMS06.html). Toshiba's server forces a file download and blocks scripted access, so the outline/marking/pad drawings below were read from the 2003-02-17 edition mirrored at https://media.digikey.com/pdf/Data%20Sheets/Toshiba%20PDFs/CMS06.pdf and the ratings were cross-checked against Toshiba's current product page (identical values). Package data also from Toshiba's M-FLAT package page https://toshiba.semicon-storage.com/us/semiconductor/design-development/package/detail.M-FLAT.html.\n\nFacts:\n- VRRM = 30 V; IF(AV) = 2.0 A (note: Tℓ = 82.8 °C, rectangular wave 180°, VR = 15 V); IFSM = 40 A (50 Hz, one cycle); Tj −40..125 °C; Tstg −40..150 °C (DS p.1 Maximum Ratings; product page).\n- VF: VFM = 0.37 V max / 0.32 V typ at IFM = 2.0 A; 0.28 V typ at 1.0 A; 0.26 V typ at 0.5 A (DS p.1 Electrical Characteristics; product page \"VFM (max) 0.37 V\").\n- IR: IRRM = 3.0 mA max / 1.4 mA typ at VRRM = 30 V; 0.09 mA typ at 5 V (DS p.1; product page \"IRRM(MAX) 3 mA @ 30 V\"). Junction capacitance Cj = 130 pF typ at VR = 10 V, 1 MHz (DS p.1) — larger than the ≤ 100 pF at 10 V that the R1240 datasheet asks for, even though Nisshinbo lists CMS06 as a recommended diode.\n- Rth(j-a) 60 °C/W on ceramic with 2 × 2 mm lands, 135 °C/W on glass-epoxy with 6 × 6 mm lands; Rth(j-l) 16 °C/W (DS p.1).\n- Package: Toshiba name \"M-FLAT\" (Toshiba code 3-4E1A in the datasheet, 3-4E1S on the package page; no JEDEC/JEITA equivalent listed). Overall 2.4 (+0.2/−0.1) wide × 4.7 ± 0.2 long × 0.98 ± 0.1 high; body 3.8 ± 0.1 long; each terminal 1.75 ± 0.1 wide, 0.65 ± 0.2 long, 0.16 thick (DS p.1 outline; package page \"2.4×4.7×0.98 mm, 2 pins, surface mount\"). Weight 0.023 g.\n- Land pattern: datasheet \"Standard Soldering Pad\" (p.2): two pads 1.4 mm (along the part) × 2.1 mm (across), 3.0 mm gap → 4.4 mm centre-to-centre, 5.8 mm outer extent. Toshiba package page reference land pattern (JEITA ET-7501 level 3): pads 2.1 × 1.4 mm, 4.4 mm centre-to-centre (same geometry).\n- Polarity/pin numbering: DS p.1 outline labels ① ANODE and ② CATHODE, i.e. pin 1 = anode, pin 2 = cathode. The cathode is the end carrying the printed CATHODE BAND (\"Cathode mark\", DS p.2 marking drawing; the band is at the pin-2 end). Marking type code \"S6\".\n- Application: switching-mode power supplies, portable battery equipment (DS p.1).\n\n## 4. onsemi (ex-SANYO) SB007-03Q-TL-E — 30 V / 70 mA Schottky barrier diode, SOT-323 (SC-70), NOT an ESD/TVS device\n\n- Manufacturer: onsemi (Semiconductor Components Industries, LLC; legacy SANYO part, ordering number EN2939B). Exact MPN: SB007-03Q-TL-E.\n- Datasheet: \"SB007-03Q Schottky Barrier Diode 30V, 70mA, Low IR, Single MCP\", September 2013, 5 pp., URL https://www.onsemi.com/download/data-sheet/pdf/sb007-03q-d.pdf (product page https://www.onsemi.com/products/discrete-power-modules/schottky-diodes-schottky-rectifiers/sb007-03q). The datasheet is in English on onsemi.com — not a Japanese-only page.\n\nFacts:\n- What it is: a single small-signal Schottky rectifier (\"Schottky Barrier Diode ... Single MCP\"), applications \"High frequency rectification (switching regulators, converters, choppers)\" (p.1). It is not a TVS/ESD diode array, so \"working voltage / clamping voltage / peak pulse power\" are NOT FOUND (not applicable). If the schematic uses it as ESD protection, that is a mis-application: it only has VRRM 30 V, 2 A single-cycle surge, no specified ESD clamp.\n- Ratings (p.1 Absolute Maximum, p.2 Electrical, Ta = 25 °C): VRRM 30 V; VRSM 35 V; IO 70 mA; IFSM 2 A (50 Hz, 1 cycle); Tj/Tstg −55..125 °C. VR ≥ 30 V at IR = 20 µA; VF ≤ 0.55 V at IF = 70 mA; IR ≤ 5 µA at VR = 15 V; C = 3.0 pF typ at VR = 10 V, 1 MHz; trr ≤ 10 ns.\n- Package: \"MCP\" = JEITA SC-70 / JEDEC SOT-323 (p.1). Body 2.0 ± 0.2 × 1.25 ± 0.1 mm, 0.9 ± 0.1 high, lead pitch 0.65 mm, overall lead span 2.1 ± 0.1 (p.1, p.4 outline 7023A-005).\n- SOT-323 pinout (p.1 \"Electrical Connection\" and outline): pin 1 = Anode, pin 2 = No Contact (NC), pin 3 = Cathode. Pins 1 and 2 are on one side (0.65 mm apart), pin 3 alone on the opposite side. Marking \"G\".\n- Land pattern example (p.4): three pads 0.7 × 1.0 mm; pins 1/2 pads on 0.65 mm pitch; pin-3 pad centred 2.1 mm from the pin-1/2 pad row (centre-to-centre).\n\n## 5. STMicroelectronics STM32F446RE (DS10693), LQFP64\n\n- Manufacturer: STMicroelectronics. Exact MPN family: STM32F446RET6 (LQFP64, 512 KB).\n- Datasheet: DS10693 \"STM32F446xC/E — Arm Cortex-M4 32-bit MCU+FPU, 225 DMIPS, up to 512 KB Flash/128+4 KB RAM ...\". Current revision per ST's product page (https://www.st.com/en/microcontrollers-microprocessors/stm32f446re.html): Rev 11.0, 29 May 2026, URL https://www.st.com/resource/en/datasheet/stm32f446re.pdf. ST's server timed out on every download attempt, so the facts below were verified in DS10693 Rev 10 (January 2021, 198 pp., mirror: https://storage.googleapis.com/media.amperka.com/products/chip-stm32f446ret6/media/stm32f446re-datasheet.pdf). Rev 10's only change from Rev 9 was an HSI footnote (Table 118, p.197); pinout/AF tables are stable across revisions, but re-check Rev 11 if a value below is design-critical.\n\nFacts (Table 10 \"STM32F446xx pin and ball descriptions\", pp.44–56; Table 11 \"Alternate function\", pp.57–63):\n- LQFP64 pins: 28 = PB2-BOOT1 (p.48); 29 = PB10 (p.49); 30 = VCAP_1 (p.49); 31 = VSS (p.49); 32 = VDD (p.49). Confirmed: pin 30 is VCAP_1 and pin 31 is VSS. Also 47 = VSS, 48 = VDD (p.52), 63 = VSS, 64 = VDD (p.56).\n- IMPORTANT: LQFP64 has ONLY ONE VCAP pin. The VCAP_2 row (LQFP100 pin 73 / UFBGA C2 / LQFP144 106) shows \"-\" in the LQFP64 column (p.55). §6.3.2 (p.76): \"For packages supporting only 1 VCAP pin, the two CEXT capacitors are replaced by a single capacitor.\" Table 18 (p.77): CEXT = 2.2 µF with ESR \u003c 2 Ω per pin for two-VCAP packages; with a single VCAP pin CEXT = 4.7 µF, ESR \u003c 1 Ω. So the LQFP64 board needs 4.7 µF (low-ESR ceramic) on pin 30, not 2.2 µF. Footnote 1: only if the regulator is bypassed can it be 100 nF.\n- CAN alternate functions, AF9 column of Table 11: CAN1_RX on PA11 (p.57), PB8 (p.58), PD0 (p.60); CAN1_TX on PA12 (p.57), PB9 (p.58), PD1 (p.60); CAN2_RX on PB5 (p.58), PB12 (p.59); CAN2_TX on PB6 (p.58), PB13 (p.59). (PH13/PH14/PI9 do not exist on STM32F446.)\n- PA10: its Table 11 row (p.57) is AF1 TIM1_CH3, AF7 USART1_RX, AF10 OTG_FS_ID, AF13 DCMI_D1, AF15 EVENTOUT — PA10 has NO CAN alternate function on any AF. CAN1_RX must be PA11/PB8/PD0.\n- 5 V tolerance (Table 10 \"I/O structure\"): PA8 FT (p.52), PA10 FT (p.52), PA11 FT (p.52), PA12 FT (p.52), PB0 FT (p.48), PC6 FTf (5 V tolerant, I2C FM+ option) (p.51). All six are 5 V tolerant. (Table 10 legend p.44: FT = 5 V tolerant I/O, TTa = 3.3 V tolerant, connected to ADC.) Note Table 58 footnote (p.117): PA10 and PB12 have a weaker pull-up (OTG ID pins) than the 30–50 kΩ of other pins.\n- HSI (Table 41, p.105): fHSI = 16 MHz; accuracy ±1 % at TA = 25 °C (factory calibrated); −8 % / +4.5 % over −40..105 °C; ±4 % over −10..85 °C; ±1 % user-trimmed. Startup 2.2 µs typ / 4 µs max.\n- Max SYSCLK: 180 MHz (p.1; Table 43 p.106 fPLL_OUT 12.5–180 MHz, VCO 100–432 MHz, PLL input 0.95–2.10 MHz). The datasheet does not restrict the PLL source; HSI (16 MHz ÷ M) can drive the PLL to 180 MHz (the source selection is in RM0390 §6.2.3, not the DS). Over-drive (scale 1) is required above 168 MHz (Table 17 p.76 area, p.81 notes) — no HSE required for 180 MHz.\n- USB OTG FS clock: §3.33 (p.36): \"The USB OTG full-speed controller requires a dedicated 48 MHz clock that is generated by a PLL connected to the HSE oscillator.\" §3.30 (p.35): PLLSAI can also generate the 48 MHz USB/SDIO clock. The DS therefore ties the USB 48 MHz clock to HSE; HSI's −8/+4.5 % tolerance cannot meet USB's ±0.25 % anyway. Practical reading: a crystal is needed for USB FS on this part.\n- VBAT when unused: §3.20 (p.30): VBAT may be powered \"from VDD when no external battery and an external supercapacitor are present\"; §3.16.2 (p.24) and §3.20 (p.30): when PDR_ON is not tied to VDD (internal reset off) \"the VBAT pin has to be connected to VDD\". Table 10 (p.44): VBAT = LQFP64 pin 1. Tie to VDD (a 100 nF decoupling recommendation is in AN4488, not in the DS).\n- BOOT0: LQFP64 pin 60, type I, I/O structure \"B — dedicated BOOT0 pin\" (Table 10 p.55; legend p.44); §3.14 (p.22) boot modes (user Flash / system memory / SRAM). An explicit \"must not float / pull-down\" statement is NOT FOUND in DS10693 (it is in RM0390/AN4488); the DS treats BOOT0 as a dedicated input sampled at reset, so it must be driven (normally 10 kΩ to GND).\n- NRST: Table 59 (p.121): RPU weak pull-up 30 kΩ min / 40 kΩ typ / 50 kΩ max; filtered pulse \u003c 100 ns; unfiltered pulse ≥ 300 ns (VDD > 2.7 V); internal reset pulse ≥ 20 µs. Figure 33 (p.122) recommends an external RC/capacitor on NRST placed close to the device.\n\n## 6. REYAX RYLR998 and RYLR896 (868/915 MHz LoRa UART modules)\n\n### 6a. RYLR998\n- Manufacturer: REYAX Technology Co., Ltd. MPN: RYLR998 (variants: RYLR998_M4 = I-PEX MHF4 connector instead of antenna; _NP = no antenna; datasheet p.17).\n- Datasheet: \"RYLR998 UART Interface 868/915 MHz LoRa Antenna Transceiver Module Datasheet\", 9-FEB-2026, doc 56312E30, 17 pp., https://reyax.com/upload/products_download/download_file/RYLR998_EN.pdf.\n- AT guide: \"LoRa AT COMMAND GUIDE, apply for RYLR998 / RYLR498\", 7-AUG-2025, doc 56312E33, 9 pp., https://reyax.com/upload/products_download/download_file/LoRa_AT_Command_RYLR998_RYLR498_EN.pdf.\n\nFacts:\n- Max TX power: 22 dBm (RF output power range 0–22 dBm, DS p.5; \"must be set below AT+CRFOP=14 to comply with CE\"). Settable with AT+CRFOP=\u003c0..22>, default 22 (AT guide p.7, factory defaults p.8).\n- TX current: 140 mA typ at RFOP = +22 dBm (DS p.5); measured table p.6: 144.7 mA at CRFOP=22, 138.1 mA at 20, 94.4 mA at 10, 56.6 mA at 0 dBm.\n- RX current: 17.5 mA typ at 3.3 V (DS p.5). Sleep: 10 µA typ (AT+MODE=1); smart-receive average 0.06–2.65 mA depending on duty (DS p.5, p.9).\n- Supply: VDD 2.3 V min / 3.3 V typ / 3.6 V max (DS p.5).\n- Sensitivity: −129 dBm (DS p.5, no SF/BW condition stated). Per-SF values (SF12/BW125, SF7/BW125): NOT FOUND.\n- Frequency 820–960 MHz (default 915 MHz), ±10 ppm (DS p.5).\n- 5-pin header (DS p.3 pin description; 2.54 mm pitch per dimension drawing p.13): 1 = VDD, 2 = NRST (active low, 100 kΩ internal pull-up, hold low ≥ 100 ms), 3 = RXD (UART data input), 4 = TXD (UART data output), 5 = GND.\n- Logic level (DS p.5): VIH ≥ 0.8·VDD, VIL ≤ 0.1 V, VOH ≥ 0.8·VDD, VOL ≤ 0.1 V → 3.3 V CMOS levels. Absolute-maximum / 5 V tolerance on RXD: NOT FOUND (do not drive from 5 V logic). Timing diagram p.4: keep RXD and NRST low before power-on/off.\n- Antenna: \"Built-in antenna\" (DS p.2); order table p.17 = \"90 Degree Angle Antenna\"; the dimension drawing p.13 shows a helical (spring/coil) antenna ≈ 16.2 mm long, 5.5 mm wide, mounted at 90° to the board. Gain: NOT FOUND.\n- Chipset: DS p.2 \"NUVOTON MCU & Semtech LoRa Engine\" — the Semtech part number is not named in the datasheet, the AT guide, or Semtech's 12-May-2022 press release. Third-party sources state SX1262 (the 22 dBm / SF5 capability is consistent with SX126x, not SX1276), but that is unverified by REYAX documents.\n- AT+PARAMETER=\u003cSF>,\u003cBW>,\u003cCR>,\u003cPreamble> (AT guide p.5): SF 5–11, default 9; allowed combinations \"SF7 to SF9 at 125 kHz, SF7 to SF10 at 250 kHz, SF7 to SF11 at 500 kHz\". BW index 7 = 125 kHz (default), 8 = 250 kHz, 9 = 500 kHz — only 7..9 accepted. CR 1 = 4/5, 2 = 4/6, 3 = 4/7, 4 = 4/8 (default 1). Preamble default 12; only when NETWORKID = 18 may it be 4–24, otherwise it must be 12 (+ERR=18 otherwise, p.9). Recommended \"9,7,1,12\"; \"8,7,1,12\" for payloads > 100 bytes (p.2). NETWORKID 3–15 or 18 (default 18) (p.6).\n- AT+SEND max payload: 240 bytes (AT guide p.7; +ERR=13 \"TX data exceeds 240 bytes\", p.9). The module adds 8 bytes of overhead on air (p.2).\n- AT+MODE: 0 transceiver, 1 sleep, 2 smart receiving with \u003cRX time>,\u003cLow speed time> 30–60000 ms (p.3). Default UART 115200 8N1 (p.4).\n\n### 6b. RYLR896\n- MPN: RYLR896. Datasheet: \"RYLR896 UART Interface 868/915 MHz Lora Antenna Transceiver Module Datasheet\", 01-Nov-2021, doc 56312E37, 7 pp. (copy retrieved from https://lemosint.com/wp-content/uploads/2021/11/RYLR896_EN.pdf; REYAX product page https://reyax.com/products/rylr896/). AT guide: \"Lora AT COMMAND GUIDE, apply for RYLR405/406/895/896/89H1\", 28-Jun-2022, doc 56322E32, 9 pp., https://reyax.com/upload/products_download/download_file/LoRa-AT-Command-RYLR40x_RYLR89x_EN-8.pdf.\n\nFacts:\n- Chipset: Semtech SX1276 engine (DS p.2).\n- Max TX power: +15 dBm (RF output power range −4 to 15 dBm, DS p.4); AT+CRFOP=\u003c0..15>, default 15 (AT guide p.6, p.8).\n- TX current 43 mA typ at +15 dBm; RX 16.5 mA (AT+MODE=0); sleep 0.5 µA (AT+MODE=1) (DS p.4).\n- Supply: VDD 2–3.6 V, 3.3 V typ (DS p.4). Sensitivity −148 dBm (no SF/BW condition; per-SF NOT FOUND). Frequency 862–1020 MHz, ±2 ppm.\n- Header is SIX pins, not five (DS p.3; 2.54 mm pitch p.5): 1 = VDD, 2 = NRST (active low, 100 kΩ internal pull-up, ≥ 100 ms), 3 = RXD (in), 4 = TXD (out), 5 = NC, 6 = GND. A footprint made for the 5-pin RYLR998 will not match (GND moves from pin 5 to pin 6).\n- Logic level (DS p.4): VIH ≥ 0.7·VDD, VIL ≤ 0.3·VDD, VOH ≥ 0.9·VDD (printed \"0.9 … VDD\"), VOL ≤ 0.1 V → 3.3 V CMOS; 5 V tolerance NOT FOUND.\n- Antenna: \"Designed with integrated antenna\" (DS p.2); drawings p.5–6 show a helical (spring/coil) antenna ≈ 17.5 mm long, 5.5 mm wide, in line with the board. Gain: NOT FOUND. Module 42.5 × 18.4 × 5.5 mm, 7 g (p.4–5).\n- AT+PARAMETER (AT guide p.4): SF 7–12, default 12. BW index 0–9: 0 = 7.8 kHz (not recommended), 1 = 10.4, 2 = 15.6, 3 = 20.8, 4 = 31.25, 5 = 41.7, 6 = 62.5, 7 = 125 kHz (default), 8 = 250, 9 = 500. CR 1–4 (default 1). Preamble 4–7 (default 4). Recommended \"10,7,1,7\" within 3 km, \"12,4,1,7\" beyond (p.2). NETWORKID 0–16, default 0 (p.5). So BW index 7 = 125 kHz on BOTH modules, but the index table, SF range, preamble rules and CRFOP range differ, so parameter strings are not interchangeable.\n- AT+SEND max payload: 240 bytes (AT guide p.7; +ERR=13). AT+MODE only 0/1 (no smart-receive mode) (p.3). UART default 115200.\n\n## 7. TDK SLF7045T-4R7M2R0-PF — 4.7 µH shielded power inductor, 7.0 × 7.0 × 4.5 mm\n\n- Manufacturer: TDK. Exact MPN: SLF7045T-4R7M2R0-PF (4R7 = 4.7 µH, M = ±20 %, 2R0 = 2.0 A rated current, -PF = TDK internal/Pb-free code; product-identification legend on datasheet p.1).\n- STATUS: \"EOL Announced\" — discontinue issue date May 14 2024, last purchase order Mar 31 2026, last shipment Dec 31 2026; recommended alternate VLS5045EX-4R7M (interchangeability not guaranteed) — TDK product page https://product.tdk.com/en/search/inductor/inductor/smd/info?part_no=SLF7045T-4R7M2R0-PF (accessed 2026-09-16).\n- Datasheet: \"SLF Series SLF7045 Type\" — current TDK edition inductor_commercial_power_slf7045_en.pdf (dated 2024-05-27 per TDK search index; https://product.tdk.com/system/files/dam/doc/product/inductor/inductor/smd/catalog/inductor_commercial_power_slf7045_en.pdf) could not be downloaded (server refuses non-browser clients); values below are from the TDK product page (current) and the SLF7045 datasheet edition 531_SLF7045 / 990803 (Aug 1999) mirrored at https://media.digikey.com/pdf/Data%20Sheets/TDK%20PDFs/SLF7045.pdf for the land-pattern drawing.\n\nFacts:\n- Inductance 4.7 µH ±20 % at 100 kHz (product page; 1999 DS p.2 tests at 1 kHz).\n- Rated current, saturation basis (Isat): 2.0 A max at 10 % inductance drop (\"Rated Current (L Change) [Max.] 2A (10 % Down)\", product page; DS p.2 \"based on inductance change 2\").\n- Rated current, temperature-rise basis (Irms): 2.1 A typ at 20 °C rise (product page; DS p.2 \"based on temperature rise 2.1\"). DS footnote: rated current is the smaller of the 20 °C-rise and 10 %-drop values.\n- DCR: 30 mΩ typ, 36 mΩ max (product page; 1999 DS 0.03 Ω ±20 %).\n- Self-resonant frequency: NOT FOUND (product-page fields \"Self Resonant Frequency Min/Typ\" are blank; not in the datasheet).\n- Operating temperature −40..105 °C including self-heating (product page; the 1999 edition said −20..85).\n- Recommended land pattern: product page gives A = 1.50 mm, B = 4.80 mm, C = 2.20 mm nominal; the datasheet drawing (DS p.2 \"Shapes and dimensions / recommended PC board pattern\") shows two rectangular pads each 2.2 mm wide (C) × 1.5 mm long (A), separated by an inner gap B (4.9 mm in the 1999 drawing, 4.80 mm current) → pad centres ≈ 6.3 mm apart, overall pattern 7.8 × 2.2 mm. Body 7.0 ± 0.2 square, 4.5 ± 0.3 high; terminals 2.0 ± 0.1 wide.\n\n## 8. Samtec FTSH-105-01-L-DV-K — 2 × 5, 1.27 mm SMT micro header (ARM 10-pin Cortex Debug connector)\n\n- Manufacturer: Samtec. Exact MPN: FTSH-105-01-L-DV-K (product page https://www.samtec.com/products/ftsh-105-01-l-dv-k).\n- Documents: (a) Footprint: \"Recommended PCB layout for FTSH-1XX-XX-XXX-DV-XXX\", drawing FTSH-1XX-XX-XXX-DV-XXX-FOOTPRINT, Revision H, 8/27/2019 (ECN-364793), https://suddendocs.samtec.com/prints/ftsh-1xx-xx-xxx-dv-xxx-footprint.pdf. (b) Product print: FTSH-1XX-XX-XXX-DV-XXX-XXX-X-XX-MKT, Revision FX, sheet dated Jan 2026, https://suddendocs.samtec.com/prints/ftsh-1xx-xx-xxx-dv-xxx-xxx-x-xx-mkt.pdf.\n\nFacts:\n- Footprint (drawing sheet 1, Fig 1): pad 0.029\" × 0.110\" (0.74 × 2.79 mm); pitch along the row 0.050\" (1.27 mm); the two pad rows span 0.270\" (6.86 mm) outer-edge to outer-edge → pad centre-to-centre across rows 0.160\" (4.07 mm) with a 0.050\" (1.27 mm) inner gap; connector body width 0.135\" (3.43 mm); pattern length = (no. of positions per row) × 0.050\" = 0.250\" (6.35 mm) for -105; \"all dimensions symmetric about the centerline\". Table 1: option -K has no alignment-pin hole (N/A). Stencil sheet 2: 0.006\" (0.152 mm) stencil.\n- Pin numbering (drawing Fig 1 and print Fig 1): position 01 and 03 are on one row, 02 on the other — i.e. odd pins on one row, even pins on the other, numbered across the rows (1-2, 3-4, ... 9-10), pin 1 at one end.\n- Ordering-code decode (print sheet 1): -105 = 5 positions per row (10 contacts); -01 = lead style .120\" (3.05 mm) post; -L = 10 µ\" selective gold on contact, matte tin on tail; -DV = double row vertical SMT; -K = keying option (keying notch for mating with FFSD; lead style -01 only). Samtec product page: \"Keying Notch\". Keil's ULINK2 guide specifies the keyed version FTSH-105-01-L-DV-007-K (-007 = position 7 pin omitted) (https://support.arm.com/documentation/101455 \"Target Connectors\"); Keil J-Link connector page: \"Position 7 has no pin and serves only as a key\" (https://www.keil.com/support/man/docs/jlink/jlink_connectors.asp).\n- ARM Cortex Debug 10-pin pinout (Arm/Keil \"Cortex-M Debug Connectors\" overview, https://documentation-service.arm.com/static/5fce6c49e167456a35b36af1, Feb 2011, p.2 diagram, \"based on the Samtec 0.05\" micro header\", ref. FTSH-105): 1 VCC/VTref, 2 SWDIO/TMS, 3 GND, 4 SWDCLK/TCK, 5 GND, 6 SWO/TDO, 7 KEY (no pin), 8 NC/TDI, 9 GNDDetect, 10 nRESET. This matches the list in the question. Keil ULINKpro guide (https://support.arm.com/documentation/101416/0100 \"Cortex Debug (10-pin)\") gives the same signals with the note that SWDIO/TMS should have a 100 kΩ pull-up, SWCLK a 100 kΩ pull-down, nRESET open-drain with 100 kΩ pull-up.\n\n## 9. \"KEMET\" KTS500B106M55N0T00 — actually Nippon Chemi-Con, 10 µF 50 V X7R 2220\n\n- Manufacturer: Nippon Chemi-Con Corporation (United Chemi-Con in the Americas) — NOT KEMET. The KTS500B… part number is Chemi-Con's \"NTS series\" MLCC (Chemi-Con product page https://www.chemi-con.co.jp/en/products/print-condenser.php?part_number=KTS500B106M55N0T00; LCSC lists it as \"NCC (Nippon Chemi-Con)\"). It is also the exact CIN/COUT capacitor that the R1240 datasheet recommends (R1240 DS p.7, p.11).\n- Datasheet: no standalone PDF; specification data and characteristic graphs are on the Chemi-Con page above (graphs served as SVG, e.g. .../capacitor/graph/KTS500B106M55N0T00_1.SVG).\n\nFacts:\n- Case size: 2220 EIA = 5750 metric, 5.7 mm L × 5.0 mm W, thickness 2.8 mm; weight 0.46 g (Chemi-Con page).\n- Dielectric X7R; 10 µF; ±20 % (M) at 25 °C/1 kHz; 50 Vdc; −55..125 °C; tanδ ≤ 0.05; status \"In Production\" (Chemi-Con page).\n- DC-bias derating: from the Chemi-Con \"DC Bias Characteristics\" graph (0 % at 0–3 V, ≈ −5 % at 8 V, ≈ −9 % at 12 V, ≈ −20 % at 18 V, ≈ −35 % at 25 V, ≈ −65 % at 50 V) → at 12 V the effective capacitance is ≈ 9.1 µF (≈ −8 to −10 %, read from the graph). Impedance/ESR graph: ESR ≈ 7–10 mΩ from 200 kHz to 1 MHz, SRF ≈ 1 MHz.\n\n## 10. Murata GJM1555C1H220JB01(D) — 22 pF, 0402, C0G — schematic label \"47 pF\" is wrong\n\n- Manufacturer: Murata Manufacturing Co., Ltd. Exact MPN: GJM1555C1H220JB01# where # = packaging code (D = φ180 mm reel, paper tape, 10 000 pcs; J/V/W other reels). Series: GJM \"High Q chip multilayer ceramic capacitors (≤ 100 Vdc) for consumer & industrial equipment\". Status: In Production.\n- Datasheet/spec: Murata product page https://www.murata.com/en-us/products/productdetail?partno=GJM1555C1H220JB01%23 (redirects to https://pim.murata.com/en-us/pim/details/?partNum=GJM1555C1H220JB01%23), accessed 2026-09-16.\n\nFacts:\n- Capacitance encoded by the MPN and confirmed by Murata: 22 pF (code \"220\" = 22 × 10^0 pF), tolerance J = ±5 %, C1H = 50 Vdc, temperature characteristic C0G (EIA), operating −55..125 °C (Murata page \"Specifications\").\n- Case: chip size code \"15\" = 1005M / 0402 inch; L 1.0 ± 0.05 × W 0.5 ± 0.05 × T 0.5 ± 0.05 mm; external terminal 0.15–0.35 mm; mass 1.6 mg (Murata page \"Appearance & Shape\").\n- Consequence: the schematic value \"47 pF\" does not match this MPN; a 47 pF part in the same series would carry code \"470\" (e.g. GJM1555C1H470JB01D — not verified here). Note the RYLR998 application schematic (RYLR998 DS p.12) uses C4 = 47 pF on the antenna/supply filter, which is likely where the 47 pF intent came from.\n\n---\n\n## Summary of facts that matter for the review\n\n- R1240N sync vs async: ASYNCHRONOUS — internal high-side N-FET only; an external Schottky catch diode (CMS06/CMS11) from Lx to GND is mandatory; fosc is 1.25 MHz (not 1.5), VFB 0.8 V, CBST 0.1 µF + 51 Ω, L 4.7 µH; SOT-23-6W pins 1 CE / 2 VIN / 3 Lx / 4 BST / 5 GND / 6 VFB; CE has no internal pull (VIH 1.6 V) (Nisshinbo R1240x DS NO.EA-190-240903 pp.1,3,5,7,11).\n- TCAN1042H VCC range: 4.5–5.5 V only (no 3.3 V option; pin 5 is NC on the H part, VIO exists only on V variants); RXD swings to VCC (VOH 4.0–4.6 V), TXD/STB VIH 2 V so 3.3 V drive is fine; STB is internally pulled up and HIGH = standby, so it must be driven/tied LOW (TI SLLSES9D pp.5,8,9,10,20).\n- CAN1 AF pins: CAN1_RX = PA11 / PB8 / PD0 and CAN1_TX = PA12 / PB9 / PD1 on AF9; CAN2_RX = PB5 / PB12, CAN2_TX = PB6 / PB13; PA10 has NO CAN function at all (DS10693 Table 11 pp.57–60).\n- STM32 pin 30/31 names: LQFP64 pin 30 = VCAP_1, pin 31 = VSS (pin 29 PB10, 32 VDD); LQFP64 has only one VCAP pin, so CEXT must be 4.7 µF with ESR \u003c 1 Ω, not 2.2 µF (DS10693 Table 10 p.49, §6.3.2 p.76, Table 18 p.77); PA8/PA10/PA11/PA12/PB0 are FT and PC6 is FTf (5 V tolerant); HSI ±1 % at 25 °C, −8/+4.5 % over temp; USB OTG FS 48 MHz is specified from a PLL on HSE; NRST pull-up 30–50 kΩ; current DS is Rev 11 (29 May 2026), facts verified in Rev 10.\n- RYLR998 max TX dBm and TX current: 22 dBm (AT+CRFOP 0–22, default 22), 140 mA typ / 144.7 mA measured at +22 dBm, RX 17.5 mA, sleep 10 µA, VDD 2.3–3.6 V, 3.3 V CMOS UART, 5-pin header VDD/NRST/RXD/TXD/GND, helical antenna at 90°, BW index 7 = 125 kHz, SF 5–11, 240-byte max payload; RYLR896 differs: SX1276, 15 dBm max, 43 mA TX, SIX-pin header (pin 5 NC, pin 6 GND), SF 7–12, BW index 0–9 (7 = 125 kHz), preamble 4–7.\n- CMS06 ratings: 30 V VRRM, 2.0 A IF(AV), VFM 0.37 V max (0.32 typ) at 2 A, IRRM 3 mA max at 30 V, Cj 130 pF at 10 V (above the ≤ 100 pF the R1240 DS asks for), M-FLAT 2.4 × 4.7 × 0.98 mm, pin 1 anode / pin 2 cathode with the cathode band at the pin-2 end, pads 2.1 × 1.4 mm at 4.4 mm centres (Toshiba CMS06 DS pp.1–2; Toshiba M-FLAT page). Also: SB007-03Q-TL-E is a 30 V/70 mA Schottky diode (pin 1 anode, 2 NC, 3 cathode), not an ESD/TVS part; KTS500B106M55N0T00 is a Nippon Chemi-Con 2220 X7R 10 µF/50 V (≈ −9 % at 12 V), not KEMET; GJM1555C1H220JB01 is 22 pF, not 47 pF; TDK SLF7045T-4R7M2R0-PF is EOL (last shipment 31 Dec 2026).\n"},{"path":"docs/research/FIRMWARE_REVIEW_NOTES.md","title":"Firmware Review Notes — Boat node (STM32F446RET, `BoatTHISTIMEITSDIFFERENT`)","text":"# Firmware Review Notes — Boat node (STM32F446RET, `BoatTHISTIMEITSDIFFERENT`)\n\nRead-only review, 2026-09-16. No files were modified.\n\nFiles reviewed in full:\n\n| Short name | Path |\n|---|---|\n| `main.c` | `firmware/Core/Src/main.c` (750 lines) |\n| `it.c` | `firmware/Core/Src/stm32f4xx_it.c` |\n| `hal_msp.c` | `firmware/Core/Src/stm32f4xx_hal_msp.c` |\n| `.ioc` | `firmware/BoatTHISTIMEITSDIFFERENT.ioc` |\n\nCross-references consulted for corroboration only (cited where used):\n`firmware/Drivers/STM32F4xx_HAL_Driver/Src/stm32f4xx_hal_uart.c` (`hal_uart.c`, STM32Cube FW_F4 V1.28.3 per `.ioc:91`),\n`firmware/Core/Inc/stm32f4xx_hal_conf.h` (`hal_conf.h`), `firmware/STM32F446RETX_FLASH.ld` (`.ld`),\n`docs/NETLIST.md`, `docs/BOM.csv`.\n\nVerdict key: **CONFIRMED** = the behaviour asked about is present exactly as described; **REFUTED** = it is not; **PARTIAL** = mixed, see evidence.\n\n---\n\n## 1. Link-loss failsafe\n\n**Verdict: CONFIRMED — there is no link-loss failsafe of any kind. The last commanded thrust and rudder persist indefinitely if the handset goes silent.**\n\n### Evidence\n\nThe only use of `HAL_GetTick()` in the whole firmware is the telemetry send timer. The main loop in full (`main.c:454-486`):\n\n```c\n  while (1)\n  {\n    /* Handle GPS parsing */\n    gps_task();                                   // main.c:457\n\n    /* Process any complete LoRa line */\n    if (lora_ready)                               // main.c:460\n    {\n      lora_ready = 0;\n      char buf_local[LORA_BUF_LEN];\n      strncpy(buf_local, lora_buf, sizeof(buf_local));\n      buf_local[LORA_BUF_LEN - 1] = '\\0';\n      dbg(\"LORA RX: \"); dbg(buf_local); dbg(\"\\r\\n\");\n      parse_lora_line(buf_local);                 // main.c:471\n    }\n\n    uint32_t now = HAL_GetTick();                 // main.c:474\n\n    /* Send *our* GPS over LoRa every 5 seconds if valid */\n    if (gps_valid && (now - last_lora_tx >= 5000U))   // main.c:477\n    {\n      ... lora_send_payload(payload);             // main.c:481\n      last_lora_tx = now;                         // main.c:482\n    }\n\n    HAL_Delay(10);                                // main.c:485\n  }\n```\n\n- `now` (`main.c:474`) is compared only against `last_lora_tx` (`main.c:112`, `main.c:477`), which is a *transmit* timestamp. There is no `last_lora_rx`, no \"last command\" timestamp, and no comparison that could detect silence from the handset. `grep HAL_GetTick main.c` yields exactly one hit (`main.c:474`).\n- Thrust and rudder are applied immediately and only when a command arrives: `set_thrust()` at `main.c:335`, `set_rudder()` at `main.c:350`, both called from `parse_lora_line()`. Nothing else ever writes the compare registers after boot (`main.c:378`, `main.c:394`).\n- There is no heartbeat/keep-alive message type; the parser recognises only `THRUST`, `RUDDER` and `GPS` (`main.c:327`, `main.c:342`, `main.c:357`).\n\n### What persists if the handset goes silent\n\n| State | Where held | Behaviour on link loss |\n|---|---|---|\n| `thrust_value` (0..100) | `main.c:115`, written `main.c:334/379` | Unchanged forever |\n| `rudder_value` (0..100) | `main.c:116`, written `main.c:349/395` | Unchanged forever |\n| TIM3 CCR1 (motor pulse, µs) | `main.c:378` | Timer hardware free-runs; the ESC keeps receiving the last pulse width at 50 Hz |\n| TIM1 CCR1 (rudder pulse, µs) | `main.c:394` | Same; servo holds last position |\n\nBecause the PWM is generated by timer hardware, the outputs also persist if the CPU stops (hard fault, `Error_Handler`, see §8) — a hung MCU is indistinguishable from a healthy one at the ESC connector. Combined with §5 (no watchdog) and §7 (an overrun error permanently kills LoRa reception), a boat at full thrust can keep going with no path back to idle other than a power cycle.\n\n---\n\n## 2. PWM pin mapping, timer math, pulse mapping\n\n**Verdict: PARTIAL — the firmware mapping (PA8/TIM1 = rudder, PC6/TIM3 = motor), the 50 Hz / 1 µs-per-count math and the 16 MHz timer-clock assumption are all CONFIRMED from the code and .ioc; but `docs/NETLIST.md` routes PA8 to the ESC and PC6 to the servo, the opposite of the firmware, and this contradiction is unresolved.**\n\n### Pin/timer assignment (firmware)\n\n| Function | Timer | Pin | `.ioc` | `hal_msp.c` | `main.c` helper |\n|---|---|---|---|---|---|\n| Rudder servo | TIM1_CH1 | PA8 | `.ioc:65-66` (`PA8.Signal=S_TIM1_CH1`), `.ioc:135` | `hal_msp.c:124-132` (AF1) | `set_rudder()` `main.c:387-396`, header `main.c:8` |\n| Motor ESC | TIM3_CH1 | PC6 | `.ioc:78-79` (`PC6.Signal=S_TIM3_CH1`), `.ioc:137` | `hal_msp.c:145-153` (AF2) | `set_thrust()` `main.c:371-380`, header `main.c:9` |\n\nThe `main.c` header explicitly claims this is \"actual, based on testing\" (`main.c:7`).\n\n**Contradiction with the PCB documentation:** `docs/NETLIST.md:159-162` puts net `PWM_MOTOR` on **U3-41 (PA8)** → `SPEEDCONTROLLER-2`, and `NETLIST.md:164-167` puts `PWM_RUDDER` on **U3-37 (PC6)** → `STEERINGSERVO-2`; the netlist author already flagged the swap at `NETLIST.md:169`. If the netlist is what is on the board, then at boot the ESC receives the *rudder* waveform (1500 µs centre = mid-throttle on a forward-only ESC) and the servo receives the *thrust* waveform (1000 µs = hard against one end-stop). This must be settled by measurement on the physical board before any V2 pin table is frozen.\n\n### Timer clock and prescaler/period math\n\n- Clock tree (`main.c:493-526`): HSI on (`main.c:503-505`), `PLL.PLLState = RCC_PLL_NONE` (`main.c:506`), `SYSCLKSource = RCC_SYSCLKSOURCE_HSI` (`main.c:517`), AHB/APB1/APB2 dividers all `DIV1` (`main.c:518-520`). The `.ioc` agrees: `RCC.CortexFreq_Value=16000000` (`.ioc:114`) and there are no `RCC.SYSCLKSource`/APB-divider overrides, so CubeMX defaults (HSI, /1) apply. The `PLLCLKFreq_Value=96000000` etc. at `.ioc:117-134` are CubeMX's computed defaults for an *unused* PLL and are not on any clock path.\n- On the F4, `TIMxCLK = PCLKx` when the APB prescaler is 1 (it is 2×PCLK only when the prescaler > 1). With both APB dividers at /1: **TIM1CLK (APB2) = TIM3CLK (APB1) = 16 MHz.** The 16 MHz assumption is correct.\n- Both timers: `Prescaler = 15`, `Period = 19999` (`main.c:540,542` for TIM1; `main.c:592,594` for TIM3; `.ioc:142-143`, `.ioc:148-149`).\n  - Counter clock = 16 MHz / (15+1) = **1 MHz → 1 count = 1 µs**.\n  - PWM period = (19999+1) counts = 20 000 µs = **50 Hz**.\n  - Consequently the CCR value *is* the pulse width in microseconds, which is why `__HAL_TIM_SET_COMPARE()` is passed raw µs values (`main.c:378`, `main.c:394`).\n- Auto-reload preload is enabled (`main.c:545`, `main.c:596`) and `HAL_TIM_PWM_ConfigChannel` enables CCR preload, so a new pulse width takes effect at the next update event (≤ 20 ms), glitch-free.\n\n### Pulse mapping\n\nMotor (`main.c:70-72`, `main.c:375-376`): `pulse = 1000 + (1000 * value) / 100` → exactly 10 µs per percent.\n\n| thrust | pulse (µs) |\n|---|---|\n| 0 | 1000 (idle / `PWM_MOTOR_IDLE_US`, `main.c:72`) |\n| 50 | 1500 |\n| 100 | 2000 |\n\nRudder (`main.c:75-77`, `main.c:391-392`): `pulse = 1100 + (800 * value) / 100` → exactly 8 µs per percent.\n\n| rudder | pulse (µs) |\n|---|---|\n| 0 (left) | 1100 (`PWM_RUDDER_LEFT_US`, `main.c:76`) |\n| 50 (centre) | 1500 (`PWM_RUDDER_CENTER_US`, `main.c:75`) |\n| 100 (right) | 1900 (`PWM_RUDDER_RIGHT_US`, `main.c:77`) |\n\nInputs are clamped to 0..100 twice (in the parser `main.c:332-333`/`347-348` and in the setters `main.c:373`/`389`). The thrust mapping assumes a forward-only ESC (1000 µs = stop); there is no reverse/neutral-at-1500 mode.\n\n### .ioc vs main.c drift (regeneration hazard)\n\n- `.ioc:150` sets the TIM3 initial pulse to **1500**, but `main.c:608` uses `PWM_MOTOR_IDLE_US` (**1000**). `MX_TIM3_Init()` is generated code outside any `USER CODE` block, so a CubeMX regeneration would restore 1500 µs (= 50 % throttle) as the power-on compare value.\n- `main()` itself (`main.c:405-487`) contains **no** `USER CODE BEGIN 2 / WHILE / 3` markers. With `ProjectManager.KeepUserCode=true` (`.ioc:95`) only marked blocks survive regeneration, so regenerating from this `.ioc` deletes the NVIC setup, PWM start, LoRa init and the entire main loop.\n\n---\n\n## 3. LoRa configuration\n\n**Verdict: CONFIRMED — the AT sequence, `AT+PARAMETER=12,7,1,4` (SF12 / BW index 7 = 125 kHz / CR 4-5 / preamble 4), `AT+SEND=2,\u003clen>,\u003cpayload>` to address 2, and a 5 s telemetry period are all as read from the code. The `// SF12,BW7.8` comment is wrong (index 7 is 125 kHz). Module replies are never read, there is no application-level checksum, and the sender address is not checked.**\n\n### AT command sequence (`main.c:445-449`)\n\n```c\n  lora_send_line(\"ATE0\");                        // Echo off              main.c:445\n  lora_send_line(\"AT+ADDRESS=1\");                // This node (boat)      main.c:446\n  lora_send_line(\"AT+NETWORKID=18\");             // Network ID            main.c:447\n  lora_send_line(\"AT+BAND=915000000\");           // 915 MHz               main.c:448\n  lora_send_line(\"AT+PARAMETER=\" LORA_PARAM_STR);// SF12,BW7.8,CR4/5,PL=4 main.c:449\n```\n\n- `lora_send_line()` (`main.c:173-181`) transmits the string and then `\\r\\n`, each with a 100 ms blocking timeout. Commands are sent back-to-back with no wait for `+OK`/`+ERR`, and the module's replies are received by the ISR but discarded by the parser because they do not start with `+RCV=` (`main.c:298-301`). A rejected command is therefore invisible.\n- The RYLR is never reset by the MCU: `NETLIST.md:87-90` routes `LORA_RST` to PA3, but PA3 is not in the `.ioc` pin list (`.ioc:20-32`) and never appears in `main.c`. The firmware cannot recover a wedged module and does not wait for the module's `+READY` banner; it relies solely on the fixed `HAL_Delay(1500)` at `main.c:438`.\n- The literals `1`, `18`, `915000000` at `main.c:446-448` are hard-coded even though `LORA_ADDR_BOAT`, `LORA_NET_ID`, `LORA_FREQ` exist at `main.c:63-66`; only `LORA_PARAM_STR` (`main.c:67`) is actually used.\n\n### `LORA_PARAM_STR \"12,7,1,4\"` (`main.c:67`)\n\nRYLR `AT+PARAMETER=\u003cSF>,\u003cBW>,\u003cCR>,\u003cPreamble>`:\n\n| Field | Value | Meaning |\n|---|---|---|\n| SF | 12 | Spreading factor 12 (slowest, longest range) |\n| BW | 7 | **125 kHz** in both the RYLR896 table (0 = 7.8 kHz … 7 = 125, 8 = 250, 9 = 500) and the RYLR998 table (7 = 125, 8 = 250, 9 = 500) |\n| CR | 1 | Coding rate 4/5 |\n| Preamble | 4 | 4 symbols. On the RYLR998 a preamble other than 12 is only accepted when `NETWORKID=18`, which is consistent with `main.c:447` |\n\n**Comment discrepancy:** `main.c:449` says `BW7.8`; 7.8 kHz would be BW index **0** on the RYLR896 and does not exist at all on the RYLR998. The value actually programmed is 125 kHz. Header comment `main.c:26` repeats the numeric string correctly.\n\n**Module-variant risk:** `docs/BOM.csv:29` lists only the 5-pin header (`LORAMODULE`), not the module part. If the fitted module is an RYLR998, its command manual caps SF at 11 (and pairs allowed SF with BW); `AT+PARAMETER=12,7,1,4` would be answered with `+ERR` and, because replies are ignored, the module would silently keep its stored parameters. The RYLR896 generation accepts SF 7–12. Confirm the part number before relying on SF12.\n\n**Airtime consequence (estimate, SF12 / 125 kHz / CR4-5 / preamble 4 / explicit header / CRC / LDRO on; T_sym = 32.8 ms):** a `THRUST,50` frame (≈9 B + module addressing) is ≈1.0 s on air; a `GPS,42.123456,-83.123456` frame (24 B) is ≈1.5 s. The command channel is therefore limited to roughly one packet per second per direction, and the boat's own 1.5 s telemetry burst every 5 s (`main.c:477`) blocks reception (half-duplex) for ~30 % of the time.\n\n### AT+SEND payload format and destination\n\n`lora_send_payload()` (`main.c:188-198`):\n\n```c\n  snprintf(cmd, sizeof(cmd), \"AT+SEND=%d,%u,%s\",\n           LORA_ADDR_RC,              /* 2 */                       main.c:194\n           (unsigned)strlen(payload), payload);                    main.c:195-196\n```\n\n- Destination = `LORA_ADDR_RC` = **2** (`main.c:63`). `cmd` is 128 bytes (`main.c:191`).\n- Payload built at `main.c:479-480`: `\"GPS,%.6f,%.6f\"` into a 64-byte buffer, e.g. `AT+SEND=2,24,GPS,42.123456,-83.123456`.\n- **Telemetry period: 5000 ms** (`main.c:477`), gated on `gps_valid` (see §4 for why this gate is sticky).\n- `%f`/`%.6f` formatting (`main.c:364`, `main.c:480`) and `sscanf(\"%f\")` (`main.c:360`) require newlib float support (`-u _printf_float` / `-u _scanf_float`) with newlib-nano. No `.cproject`/Makefile is committed under `firmware/` (only the `.ioc` and two `.ld` files), so this cannot be verified from the repo; if float support is off, the GPS payload is emitted without numbers and the RC-GPS echo never parses.\n\n### `+RCV=` parsing (`main.c:282-368`)\n\n- ISR side (`main.c:709-727`): one byte at a time into `lora_buf[LORA_BUF_LEN=128]` (`main.c:60`, `main.c:102`). A `\\n` terminates the line and sets `lora_ready` (`main.c:713-718`). Bytes beyond 127 are **silently dropped** (`main.c:721-724`); the truncated line is still delivered and parsed. No length field, no CRC, no framing error check.\n- Main side copies the buffer (`main.c:463-465`), echoes it on the debug/GPS UART (`main.c:467-469`), then `parse_lora_line()`:\n  1. skips leading CR/LF/space/tab (`main.c:287-290`), returns on empty (`main.c:292`);\n  2. requires prefix `+RCV=` or `RCV=` (`main.c:298-301`), otherwise returns silently — this is how `+OK`, `+ERR=n`, `+READY` are discarded;\n  3. skips to the second comma (`main.c:304-311`) — i.e. past `\u003csrc addr>,\u003clen>,` — and returns if fewer than two commas (`main.c:311`). The `\u003clen>` field is not used to delimit the payload and the `\u003csrc addr>` is **never checked**, so any node on network 18 at the same RF parameters can drive the boat;\n  4. strips trailing CR/LF (`main.c:315-319`);\n  5. matches `THRUST,` / `RUDDER,` / `GPS,` with `strncmp` (`main.c:327/342/357`) and extracts values with `sscanf` (`main.c:330`, `345`, `360`); trailing `,\u003cRSSI>,\u003cSNR>` is ignored because `sscanf` stops after the first `%d`.\n- **Malformed input:** every failure path is a silent `return` or a failed `sscanf` with no action and no counter. A partially corrupted byte inside the digits (e.g. from a UART framing error, §7/§9) that still yields a parseable integer *is* applied to the motor — there is no checksum, sequence number or plausibility filter on the value.\n- **No checksum at the application layer.** The LoRa PHY CRC (handled inside the RYLR) protects the air link only; the 115200-baud UART between module and MCU is unprotected.\n- **Single-buffer race:** `lora_ready` is set by the ISR while the main loop may be inside a blocking `dbg()` call (`main.c:467-469`, each up to 100 ms at 9600 baud) or `HAL_Delay(10)` (`main.c:485`). A second line arriving in that window overwrites `lora_buf` from index 0 (`main.c:717`, `main.c:723`) before `strncpy` at `main.c:464` runs. With ~1 s LoRa airtime this is unlikely for `+RCV` lines but does happen with the five `+OK` replies during init (harmless there because they are ignored).\n\n---\n\n## 4. GPS parsing\n\n**Verdict: PARTIAL — RMC-only parsing with an A/V validity check and a real XOR checksum is CONFIRMED; but `gps_valid` is never cleared after a fix is lost (stale position keeps being transmitted), and the single RX buffer is overwritten by the next NMEA sentence before the main loop copies it, so RMC lines are likely to be dropped most of the time.**\n\n### What is parsed\n\n- Sentences: only `$GPRMC` / `$GNRMC` (`main.c:275`, re-checked at `main.c:243-247`). GGA/GSA/GSV/VTG/GLL are discarded — so no altitude, HDOP, satellite count or speed/course is available.\n- Validity: field 2 must be `'A'` (`main.c:250`); on `'V'` the code sets `gps_valid = 0` and returns (`main.c:252-253`).\n- Checksum: **present** — `gps_validate_checksum()` (`main.c:214-227`) XORs every byte between `$` and the last `*` (`main.c:217`, `main.c:221-224`), parses the two hex digits with `strtol` (`main.c:225`) and rejects on mismatch. The trailing `\\r` left in the buffer (only `\\n` is stripped, `main.c:694`) is harmless because `strtol` stops at it.\n- Lat/lon conversion `gps_ddmm_to_deg()` (`main.c:201-211`): `atof` of `ddmm.mmmm`, `deg = (int)(v/100)`, `minutes = v - deg*100`, `deg + minutes/60`, negated for `S`/`W` (`main.c:204-208`). Arithmetically correct. Result is truncated to `float` (`main.c:209`, stored at `main.c:107-108`) — ~4–8 × 10⁻⁶ ° resolution (≈0.5 m), so the `%.6f` printed later (`main.c:480`) carries one digit of false precision.\n- What is done with the fix: **telemetry only**. `gps_lat`/`gps_lon`/`gps_valid` are read in exactly one place, the 5 s `AT+SEND` at `main.c:477-483`. There is no navigation, waypoint, heading or return-to-home logic anywhere in the firmware despite the project name.\n- Buffers: `GPS_BUF_LEN = 128` (`main.c:59`); ISR buffer `gps_buf` (`main.c:96`) with overflow guard at `main.c:702-705` (excess bytes dropped, line still delivered); `gps_task()` copies to a 128-byte stack buffer (`main.c:271-273`); `gps_parse_rmc()` tokenises in place into at most 16 pointers (`main.c:234-240`). An RMC sentence is ≈70–80 bytes, so 128 is adequate.\n\n### Defect A — `gps_valid` is sticky after fix loss (`main.c:237-241`, `main.c:250-254`)\n\nTokenising uses `strtok` (`main.c:237`), which **collapses consecutive commas**. A void RMC as emitted by most receivers has empty fields, e.g. `$GNRMC,120000.00,V,,,,,,,160926,,,N*7D`, which yields only 5 tokens. `gps_parse_rmc()` then returns at `main.c:241` (`if (n \u003c 7) return;`) *before* reaching the `'V'` test at `main.c:250` and never clears `gps_valid`. Result: once a fix has been obtained, losing it leaves `gps_valid = 1` with the last coordinates, and the boat keeps transmitting that stale position every 5 s indefinitely (`main.c:477-483`). Only sentences that still carry populated lat/lon with status `V` reach the clearing path.\n\nThe same `strtok` behaviour means any empty field *before* the lat/lon fields (e.g. missing time on a cold receiver) shifts the field indices; `toks[2]` is then not the status field.\n\n### Defect B — ISR/main race on `gps_buf` (`main.c:694-706`, `main.c:271-273`, `main.c:485`)\n\nWhen `\\n` arrives the ISR terminates the string, sets `gps_ready`, and resets `gps_len = 0` (`main.c:696-698`). The very next byte — the `$` of the following sentence — is written to `gps_buf[0]` (`main.c:704`). The main loop copies `gps_buf` only when `gps_task()` runs (`main.c:457`, `main.c:272`), which is at best one loop iteration later: `HAL_Delay(10)` (`main.c:485`) plus any blocking `dbg()` output (`main.c:467-469`, `338-339`, `353-354`). At 9600 baud one byte takes ≈1.04 ms, so with typical 10–50 ms latency the first 10–50 bytes of the RMC line have already been replaced by the next sentence (`$GPVTG…` on u-blox and MediaTek default orderings, which emit VTG immediately after RMC). The copied buffer then fails `strncmp(buf, \"$GPRMC\")` at `main.c:275` (or fails the checksum) and the fix is dropped. Parsing only succeeds when the receiver leaves an inter-sentence gap longer than the loop latency, or when RMC happens to be the last sentence of the epoch. This needs a bench check (count of parsed RMC per minute); the fix is a second \"ready\" buffer filled in the ISR, or a ring buffer.\n\n---\n\n## 5. Peripherals NOT initialised\n\n**Verdict: CONFIRMED — ADC, CAN, IWDG, WWDG, RTC and USB are absent from the .ioc IP list, from `main.c`, from `hal_msp.c`/`it.c`, and are disabled in `hal_conf.h`. The PA2 battery divider has no reader. Additionally the LoRa reset line (PA3) is undriven and the on-board CAN transceiver is unused.**\n\n### Evidence\n\n- `.ioc:10-17` — the complete IP list is `NVIC, RCC, SYS, TIM1, TIM3, UART4, USART3` (`Mcu.IPNb=7`). No `ADC*`, `CAN*`, `IWDG`, `WWDG`, `RTC`, `USB_OTG_FS`.\n- `.ioc:20-32` — the complete pin list is PA0, PA1, PB0, PC6, PA8, PA13, PA14, PA15, PC10, PC11, PB3, SysTick. **PA2 is not configured** at all (left as reset-state analog/floating input).\n- `main.c:121-126` — only `SystemClock_Config`, `MX_GPIO_Init`, `MX_UART4_Init`, `MX_USART3_UART_Init`, `MX_TIM1_Init`, `MX_TIM3_Init` exist; `main.c:416-420` calls exactly those. No `ADC_HandleTypeDef`, `CAN_HandleTypeDef`, `IWDG_HandleTypeDef`, `RTC_HandleTypeDef` or `PCD_HandleTypeDef` anywhere in `main.c`, `hal_msp.c` or `it.c` (grep `ADC|IWDG|WWDG|CAN|RTC|USB|PCD` over `firmware/Core/Src` returns nothing).\n- `hal_conf.h:41` (`HAL_ADC_MODULE_ENABLED`), `:42` (`CAN`), `:58` (`IWDG`), `:61` (`RTC`), `:72` (`WWDG`), `:73` (`PCD`/USB) are all commented out, so the HAL drivers are not even compiled.\n- `hal_msp.c` contains MSP init only for TIM1/TIM3 (`hal_msp.c:88-113`) and UART4/USART3 (`hal_msp.c:200-255`). `it.c` has only the Cortex handlers plus `UART4_IRQHandler` (`it.c:196-205`) and `USART3_IRQHandler` (`it.c:217-220`).\n\n### Hardware that consequently goes unused (from `docs/NETLIST.md`)\n\n| Net | MCU pin | Netlist | Firmware |\n|---|---|---|---|\n| `ADC_VBAT` (R5/R6 divider, TP2) | PA2 (U3-16) | `NETLIST.md:63-66` | Not configured; battery voltage is never read, no low-battery action possible |\n| `LORA_RST` | PA3 (U3-17) | `NETLIST.md:87-90` | Not configured; MCU cannot reset the RYLR |\n| TCAN1042H `CAN_TX`/`CAN_RX`/`CAN_STB` | PA11 / PA10 / PA12 | `NETLIST.md:125-138` | No CAN driver. Note also that the F446's CAN1 pins are PA11 = RX and PA12 = TX; PA10 has no CAN function, so the netlist's PA11-TX / PA10-RX / PA12-STB assignment could not be used by CAN1 without a hardware change (verify against the schematic) |\n| `VBAT` | U3-1 | `NETLIST.md:205-208` | No RTC, and no LSE crystal pins in `.ioc:20-32`, so the backup domain is unused |\n\n**No watchdog** is the safety-relevant omission here: with IWDG disabled (`hal_conf.h:58`, absent from `.ioc:10-17`), the infinite loops in `Error_Handler` (`main.c:736-742`) and the fault handlers (`it.c:82-137`) are permanent, with PWM frozen at the last value (§1, §8).\n\n---\n\n## 6. PB0\n\n**Verdict: CONFIRMED — PB0 is configured as a push-pull output, written low once at init, and never changes state; on the PCB it is the `GPS_RX` net to GPS header pin 3, so the firmware is holding that GPS pin at 0 V permanently.**\n\n### Evidence\n\n- Header comment: `PB0 -> Debug LED / probe` (`main.c:10`).\n- `.ioc:67-68`: `PB0.Signal=GPIO_Output`.\n- `MX_GPIO_Init()` (`main.c:665-683`): `HAL_GPIO_WritePin(GPIOB, GPIO_PIN_0, GPIO_PIN_RESET)` at `main.c:675`, then configured `GPIO_MODE_OUTPUT_PP`, no pull, low speed at `main.c:678-682`.\n- Those are the **only** references to `GPIO_PIN_0` on port B in the reviewed sources (`hal_msp.c:216` uses `GPIO_PIN_0|GPIO_PIN_1` but on GPIOA for UART4). There is no `HAL_GPIO_TogglePin`, no second `WritePin`, and no use in any ISR. The pin is a constant logic 0 from a few ms after reset.\n- `docs/NETLIST.md:106-109`: net `GPS_RX` — \"MCU PB0 → GPS module (data to GPS)\", pins `U3-26 (PB0), GPSMODULE-3`. The netlist author's own note says the firmware uses USART3 on PC10/PC11 instead (`NETLIST.md:107`), which matches `main.c:13` and `hal_msp.c:239-248`.\n\n### Consequence\n\nThe GPS header therefore has two MCU-driven lines: pin 3 (PB0, constant low) and pin 5 (PC10 / USART3_TX, `NETLIST.md:116-119`, carrying the `dbg()` text at 9600 baud). What that does depends on which GPS-module signal lands on header pin 3:\n\n- If pin 3 is the module's serial **RX** input (as the net name implies), it sees a permanent break condition — harmless for NMEA output, but any configuration commands must go via PC10 (which is currently spammed with debug text, `main.c:467-469`).\n- If the module actually presents an **output** on pin 3 (TX or 1PPS on some breakout pinouts), a push-pull low on PB0 is a driver-to-driver contention.\n\nSafest V2 stance until the header pinout is verified: configure PB0 as input (or analog) at init, or drive it high (idle UART level) if it really is the GPS RX line.\n\n---\n\n## 7. UART robustness\n\n**Verdict: PARTIAL — interrupt-driven 1-byte reception on both UARTs is CONFIRMED; there is no `HAL_UART_ErrorCallback`, so an overrun error permanently disables reception on that UART (CONFIRMED from the HAL source); the widely-cited \"blocking transmit timeout kills RX interrupts\" behaviour is REFUTED for the HAL version in this repo.**\n\n### Reception path\n\n- Both UARTs are armed with single-byte `HAL_UART_Receive_IT` (`main.c:162-170`), first from `main.c:441-442`, then re-armed from inside `HAL_UART_RxCpltCallback` (`main.c:707`, `main.c:726`). Return values are ignored in all four call sites (`main.c:164`, `169`, `707`, `726`); a `HAL_BUSY`/`HAL_ERROR` would silently end the receive chain.\n- Re-arming from the callback is legal with this HAL: `UART_Receive_IT` sets `RxState = READY` (`hal_uart.c:3673`) *before* invoking the callback, and `HAL_UART_Receive_IT` takes no lock (`hal_uart.c:1347-1366`).\n- IRQ plumbing: `UART4_IRQHandler` → `HAL_UART_IRQHandler(&huart4)` (`it.c:196-205`), `USART3_IRQHandler` → `HAL_UART_IRQHandler(&huart3)` (`it.c:217-220`, in a user block because `.ioc:38-49` lists only `UART4_IRQn`). NVIC priority for UART4 is set to 0 in `hal_msp.c:224-225`, then overridden to 5 in `main.c:423-424`; USART3 is enabled only in `main.c:426-427` at priority 5. Equal priorities mean neither UART ISR can pre-empt the other. SysTick is priority 0 (`hal_conf.h:151`, `.ioc:47`).\n\n### Overrun (ORE) handling — the real hole\n\n`HAL_UART_IRQHandler` in the repo's HAL:\n\n- With no error flags, RXNE simply calls `UART_Receive_IT` (`hal_uart.c:2364-2372`).\n- With any error flag it still delivers the byte if RXNE is set (`hal_uart.c:2408-2411`) — so a byte with a **framing/noise error is passed to the application as data** (`hal_uart.c:2464-2476`, \"Non Blocking error\"). There is no per-byte error flag visible to `HAL_UART_RxCpltCallback`, so corrupted bytes enter `lora_buf`/`gps_buf` and, for LoRa, can be parsed into a thrust value (§3).\n- On **ORE** the error is \"blocking\": `UART_EndRxTransfer()` is called (`hal_uart.c:2416-2421`), which clears `RXNEIE`/`PEIE`/`EIE` and sets `RxState = READY` (`hal_uart.c:3370-3385`), then the weak `HAL_UART_ErrorCallback` is invoked (`hal_uart.c:2445-2461`).\n- **`main.c` does not define `HAL_UART_ErrorCallback`** (grep over `firmware/Core/Src` finds only `HAL_UART_RxCpltCallback` at `main.c:688`). The weak default does nothing, nobody re-arms `HAL_UART_Receive_IT`, and that UART is deaf until reset. On UART4 this means the boat stops accepting commands while the motor keeps the last thrust (§1). ORE requires the RX ISR to be delayed by more than one byte time (≈87 µs at 115200, ≈1 ms at 9600) — rare in this simple system, but it is a single, unrecoverable event (e.g. a debugger halt, a long critical section added later, or noise bursts at the module's boot).\n\n### Blocking transmit timeouts\n\n- `dbg()` → `HAL_UART_Transmit(&huart3, …, 100)` (`main.c:158`); `lora_send_line()` → two transmits with 100 ms each (`main.c:178`, `180`).\n- At 9600 baud, 100 ms covers ≈96 characters. `dbg(buf_local)` at `main.c:468` can be handed up to 127 characters, so long LoRa lines are truncated mid-string with `HAL_TIMEOUT` returned and ignored. At 115200 the 100 ms budget is ample.\n- **Refuted gotcha:** in older F4 HAL releases `UART_WaitOnFlagUntilTimeout` disabled `RXNEIE` on timeout, which would have killed IT reception on the same UART. In the HAL shipped here it simply returns `HAL_TIMEOUT` (`hal_uart.c:3212-3225`) and `HAL_UART_Transmit` restores `gState = READY` (`hal_uart.c:1174`, `1193`), so a debug-print timeout does *not* break GPS reception and TX recovers on the next call.\n- `dbg()` shares the GPS UART: everything written for \"debug\" (`main.c:339`, `354`, `365`, `451`, `467-469`) is transmitted into the GPS module's RX line (`NETLIST.md:116-119`). There is no separate console; the strings are only observable by probing PC10.\n\n### Other observations\n\n- Blocking `HAL_UART_Transmit` calls run with interrupts enabled, so the RX ISRs continue during them; no `__disable_irq()` exists outside `Error_Handler` (`main.c:738`).\n- The `lora_ready`/`gps_ready` flags and buffers are shared between ISR and main with no double-buffering (see §3 and §4 Defect B).\n- No IDLE-line detection, no DMA, no ring buffer — every byte costs a full `HAL_UART_IRQHandler` pass (~100+ cycles at 16 MHz).\n\n---\n\n## 8. `Error_Handler` behaviour and startup ordering\n\n**Verdict: CONFIRMED — `Error_Handler` disables interrupts and spins forever; all Cortex fault handlers spin forever with no watchdog to recover; PWM is started and set to idle/centre ~1.5 s before the LoRa module is configured, so the ESC sees a steady 1000 µs from a few ms after reset.**\n\n### `Error_Handler` (`main.c:736-742`)\n\n```c\nvoid Error_Handler(void)\n{\n  __disable_irq();     // main.c:738\n  while (1) { }        // main.c:739-741\n}\n```\n\n- Interrupts disabled, no indication, no reset. It is reachable only from init paths: `main.c:430`, `431` (PWM start), `509`, `524` (RCC), `548`, `554`, `565`, `576` (TIM1), `599`, `605`, `613` (TIM3), `635` (UART4), `656` (USART3). If it fires at `main.c:430/431` the timer never starts and PC6/PA8 are static — the ESC will refuse to arm, which is the benign case. If it fires earlier, SysTick is dead too.\n- Cortex fault handlers (`it.c:67-77` NMI, `82-92` HardFault, `97-107` MemManage, `112-122` BusFault, `127-137` UsageFault) are all bare `while(1)` loops, interrupts still enabled, PWM timers still running at the last CCR. A runtime fault (e.g. stack overflow — stack is 0x800 bytes, `.ld:42`, `.ioc:106`, while `main()`+`gps_task()`+`parse_lora_line()`+`lora_send_payload()` place 128+64+128+80+128 bytes of buffers on it and newlib's `%f` formatting adds ≈1 KB) therefore leaves the boat running at the last thrust with no recovery. No IWDG (§5).\n- `assert_failed` (`main.c:745-749`) is a no-op and `USE_FULL_ASSERT` is off (`.ioc:93`).\n\n### Startup ordering (`main.c:405-451`)\n\n| Step | Line | ESC / servo see |\n|---|---|---|\n| `HAL_Init`, `SystemClock_Config` | `main.c:410-413` | Pins in reset state (high-Z inputs) |\n| `MX_GPIO_Init` (PB0 low) | `main.c:416` | — |\n| `MX_UART4_Init`, `MX_USART3_UART_Init` | `main.c:417-418` | — |\n| `MX_TIM1_Init`, `MX_TIM3_Init` (pins switched to AF in `HAL_TIM_MspPostInit`, `hal_msp.c:115-160`; initial CCR 1500 µs / 1000 µs at `main.c:557`, `608`) | `main.c:419-420` | Static level, no pulses (timers not yet running) |\n| NVIC priorities/enables | `main.c:423-427` | — |\n| `HAL_TIM_PWM_Start` TIM1, then TIM3 | `main.c:430-431` | **Pulses begin:** 1500 µs on PA8, 1000 µs on PC6 (per firmware mapping) |\n| `set_thrust(0)`, `set_rudder(50)` | `main.c:434-435` | Same values re-written (1000 µs / 1500 µs) — no glitch |\n| `HAL_Delay(1500)` | `main.c:438` | Steady idle/centre for 1.5 s → a typical forward-only ESC arms here |\n| `StartGPSRxIT`, `StartLoRaRxIT` | `main.c:441-442` | — |\n| LoRa AT configuration | `main.c:445-449` | — |\n| `dbg(\"Boat: LoRa init done\")` | `main.c:451` | — |\n\nSo PWM starts **before** LoRa init, and the ESC sees a continuous 1000 µs from roughly 10 ms after reset. That is the correct order for safety (never start the radio before the outputs are in a known state), but note two things: (a) the ESC is armed automatically with no user gate, so the first `THRUST,n` received drives the motor immediately; (b) if the netlist swap in §2 is real, the ESC instead sees **1500 µs** at boot, which most ESCs treat as \"not at minimum, refuse to arm\" — or, on an auto-calibrating ESC, as mid throttle.\n\n---\n\n## 9. Clock / oscillator and UART baud accuracy\n\n**Verdict: CONFIRMED — HSI only (no HSE, no LSE, no PLL); the divider error is ≤ 0.08 % at both baud rates, so the HSI tolerance dominates: ±1 % at 25 °C sits comfortably inside the ~3.3 % receiver budget, but the datasheet's over-temperature band (up to ±4 % or worse) does not.**\n\n### Evidence\n\n- `main.c:503-506`: `OscillatorType = HSI`, `HSIState = ON`, `HSICalibrationValue = DEFAULT`, `PLL.PLLState = RCC_PLL_NONE`. `main.c:517`: `SYSCLKSource = RCC_SYSCLKSOURCE_HSI`. AHB/APB1/APB2 = /1 (`main.c:518-520`), flash latency 0 (`main.c:522`), regulator scale 3 (`main.c:500`) — all consistent with 16 MHz.\n- `.ioc:114` `RCC.CortexFreq_Value=16000000`. No `PH0/PH1` (HSE) or `PC14/PC15` (LSE) pins in `.ioc:20-32`. The PLL/VCO values at `.ioc:117-134` are unused defaults.\n- All UART and timer clocks are therefore derived from the untrimmed HSI (`RCC_HSICALIBRATION_DEFAULT`, `main.c:505`); there is no run-time trimming against an external reference.\n\n### Baud-rate divider error (16 MHz, oversampling 16, `main.c:632`, `653`)\n\n| UART | Baud (`main.c`) | Ideal USARTDIV | Programmed BRR | Actual baud | Divider error |\n|---|---|---|---|---|---|\n| UART4 (LoRa) | 115200 (`main.c:626`) | 8.6806 | 8 + 11/16 = 8.6875 | 115 108 | −0.080 % |\n| USART3 (GPS) | 9600 (`main.c:647`) | 104.1667 | 104 + 3/16 = 104.1875 | 9 598 | −0.020 % |\n\n### Error budget\n\nThe STM32 receiver tolerates ≈3.33 % total clock deviation for 8-bit frames with 16× oversampling and a non-zero BRR fraction (RM0390 \"USART receiver tolerance to clock deviation\" table; 3.75 % with a zero fraction). Typical peer receivers (RYLR MCU, GPS MCU) are quoted at 2–3 %.\n\n| Condition | HSI error (STM32F4 datasheet, verify DS10693 table) | + divider | Share of 3.33 % budget | Share of a 2.5 % peer budget |\n|---|---|---|---|---|\n| 25 °C, factory trim | ±1 % | 1.08 % | 32 % | 43 % |\n| −10 … 85 °C | −4 / +4 % | up to 4.1 % | **>100 %** | **>100 %** |\n| −40 … 105 °C | −8 / +4.5 % | up to 8.1 % | >100 % | >100 % |\n\nPeer-side crystal error (typically ±50–100 ppm) is negligible by comparison. A sealed electronics box on the water in summer can exceed 60 °C, where the HSI is typically 2–3 % off: enough to produce intermittent framing errors that, per §7, are delivered as data with no checksum (§3). Consequences beyond UART: SysTick and therefore the 5 s telemetry period and all `HAL_Delay`s are ±1–4 %; the 1 µs PWM tick is likewise ±1–4 % (±15–60 µs at 1500 µs) — insignificant for the servo, but it shifts the ESC's throttle end-points slightly.\n\nRemedies for V2: fit the HSE crystal (footprint decision on the PCB), or at minimum use the RYLR/GPS traffic to detect framing errors and add an application checksum.\n\n---\n\n## 10. Prioritised defect list for the V2 plan\n\n**Verdict: CONFIRMED — 6 Safety, 7 Functional, 9 Reliability and 6 Nice-to-have items, each traceable to a line above.**\n\n### Safety\n\n| # | Defect | Citation |\n|---|---|---|\n| S1 | No link-loss failsafe: thrust/rudder persist forever when commands stop; `HAL_GetTick()` is only used for telemetry TX. | `main.c:454-486`, `474-483`, `115-116` |\n| S2 | Overrun error permanently disables LoRa RX — no `HAL_UART_ErrorCallback`, no re-arm; combined with S1 the boat keeps its last thrust and can no longer be commanded. | `main.c:688-728` (no error callback), `hal_uart.c:2416-2421`, `3370-3385` |\n| S3 | No watchdog; `Error_Handler` and all fault handlers spin forever with PWM frozen at last value. | `main.c:736-742`, `it.c:82-137`, `.ioc:10-17`, `hal_conf.h:58` |\n| S4 | Commands carry no application checksum, no sender-address check and no sequence number; UART bytes with framing errors are delivered as data and can become a thrust value. | `main.c:298-312`, `327-341`, `hal_uart.c:2408-2411`, `2464-2476` |\n| S5 | Motor/rudder pin assignment contradicts the PCB netlist (PA8→ESC, PC6→servo). Unresolved; wrong assumption = 1500 µs to the ESC at boot. | `main.c:8-9`, `370-396` vs `NETLIST.md:159-169` |\n| S6 | ESC arms automatically at boot with no arming/disarm command or user gate; first `THRUST` drives the motor. | `main.c:430-438` |\n\n### Functional\n\n| # | Defect | Citation |\n|---|---|---|\n| F1 | GPS single-buffer race: next NMEA sentence overwrites `gps_buf` before `gps_task()` copies it; RMC lines are likely dropped most of the time. | `main.c:694-706`, `271-273`, `485` |\n| F2 | `gps_valid` never clears after fix loss because `strtok` collapses empty fields and the parser returns before the `'V'` check; stale position is transmitted every 5 s. | `main.c:237-241`, `250-254`, `477-483` |\n| F3 | SF12/125 kHz: ≈1 s airtime per command, ≈1.5 s per telemetry frame; boat is deaf ~30 % of the time during its own TX. If the module is an RYLR998, SF12 is rejected and silently ignored. | `main.c:67`, `449`, `477` |\n| F4 | AT replies (`+OK`/`+ERR`/`+READY`) are never read; commands are sent back-to-back with a fixed 1.5 s boot delay; the LoRa reset line (PA3) is never driven. | `main.c:438`, `445-449`, `298-301`; `NETLIST.md:87-90` |\n| F5 | `%f` in `snprintf`/`sscanf` depends on newlib float support that cannot be verified (no build files in repo); if off, GPS telemetry has no numbers. | `main.c:360`, `364`, `480` |\n| F6 | \"Debug\" output is transmitted into the GPS module's RX line (USART3 shared); no real console. | `main.c:13`, `154-159`, `467-469`; `NETLIST.md:116-119` |\n| F7 | No autonomy: GPS is only echoed; no navigation, heading, waypoint or RTH logic exists. | `main.c:476-483` |\n\n### Reliability\n\n| # | Defect | Citation |\n|---|---|---|\n| R1 | `main()` has no `USER CODE` markers; CubeMX regeneration deletes NVIC setup, PWM start, LoRa init and the main loop. | `main.c:405-487`, `.ioc:95` |\n| R2 | `.ioc` and `main.c` disagree on TIM3 initial pulse (1500 vs 1000 µs) and on USART3 NVIC enable; UART4 priority is set twice (0 then 5). | `.ioc:150` vs `main.c:608`; `.ioc:38-49` vs `main.c:426-427`; `hal_msp.c:224` vs `main.c:423` |\n| R3 | LoRa line buffer race / `lora_ready` overwrite during blocking `dbg()` and `HAL_Delay(10)`. | `main.c:709-727`, `460-472`, `485` |\n| R4 | Silent truncation at 127 bytes on both UARTs; truncated line is still parsed. | `main.c:702-705`, `721-724` |\n| R5 | Return values of `HAL_UART_Receive_IT` ignored at all four call sites. | `main.c:164`, `169`, `707`, `726` |\n| R6 | 2 KB stack with ~530 bytes of line buffers plus newlib `%f` formatting; overflow → HardFault → permanent hang (S3). | `.ld:42`, `.ioc:106`, `main.c:191`, `271`, `463`, `479` |\n| R7 | HSI-only clock: baud error budget exceeded over temperature; no HSE/LSE. | `main.c:503-506`, `517`; `.ioc:114` |\n| R8 | `dbg()` 100 ms timeout truncates lines longer than ≈96 chars at 9600 baud; `HAL_TIMEOUT` ignored. | `main.c:158`, `468` |\n| R9 | Framing/noise errors are invisible to the application (no error callback, no counters). | `main.c:688-728`; `hal_uart.c:2464-2476` |\n\n### Nice-to-have\n\n| # | Item | Citation |\n|---|---|---|\n| N1 | PB0 is a constant-low push-pull output on the GPS header's pin 3 (`GPS_RX` net); make it input/analog or drive it idle-high until the header pinout is confirmed. | `main.c:675-682`; `NETLIST.md:106-109` |\n| N2 | Battery ADC divider on PA2 unread; add ADC1_IN2 sampling and a low-voltage policy. | `.ioc:20-32`; `NETLIST.md:63-66` |\n| N3 | JTAG 4-pin mode reserves PA15 and PB3; SWD-only frees two pins. | `.ioc:56-64`, `69-71` |\n| N4 | Hard-coded `\"1\"`, `\"18\"`, `\"915000000\"` in AT strings duplicate the unused macros. | `main.c:63-66` vs `446-448` |\n| N5 | Wrong comment `BW7.8` (index 7 = 125 kHz); `+RCV` example shows source address 1 (the boat itself). | `main.c:449`, `295-296` |\n| N6 | Lat/lon stored as `float` then printed with `%.6f`; use `double` or `int32_t` in 1e-7 °. | `main.c:107-108`, `209`, `480` |\n\n---\n\n## Appendix — hardware cross-references noticed in passing (out of firmware scope)\n\nRecorded here only because they bear on the V2 firmware/hardware split; they come from `docs/NETLIST.md`, not from the firmware.\n\n- `NETLIST.md:17` places `SPEEDCONTROLLER-1` and `STEERINGSERVO-1` on the **+3V3** net. If the ESC has a BEC it would back-feed 5 V into the 3.3 V rail; a servo run from 3.3 V will be weak. Worth confirming on the schematic.\n- `NETLIST.md:71` notes the VCAP net is drawn to PB11 (pin 30) rather than VCAP_1 (pin 31).\n- `NETLIST.md:128` questions the TCAN1042H pin 8 assignment; together with the PA10/PA11/PA12 CAN pin choice (§5) the CAN path needs a hardware review before any CAN firmware is planned.\n"},{"path":"docs/V1_DESIGN_REVIEW.md","title":"V1 design review — LoRa Autonomous Boat Controller (senior design v5.brd, as fabricated)","text":"# V1 design review — LoRa Autonomous Boat Controller (senior design v5.brd, as fabricated)\n\nWritten 2026-09-16 from the reconstructed board (`hardware/kicad/`), the v5 fabrication films, `pstxnet.dat`, the firmware, and the current datasheets. Every finding states its evidence. Severity: **Safety** (can hurt people or destroy the boat/board), **Functional** (a feature cannot work as designed), **Reliability** (works, but marginally or by luck), **Nice** (improvement). Finding IDs are referenced by `V2_REQUIREMENTS.md` and `REPORT.md`.\n\nEvidence shorthand: `pstxnet` = `Allegro/hardware/allegro-original/Allegro v5/Allegro/pstxnet.dat`; `DS-*` = `docs/research/DATASHEET_NOTES.md` section; `FW §n` = `docs/research/FIRMWARE_REVIEW_NOTES.md` section; `main.c:n` = `firmware/Core/Src/main.c`; DRC/XOR numbers = `hardware/kicad/_build/*.json` regenerated by `build_v1.py`.\n\n## 0. The three open questions, answered from copper\n\n| Question | Answer | Evidence |\n|---|---|---|\n| Which header does PA8 reach? | **PA8/TIM1_CH1 → TP1 → SPEEDCONTROLLER pin 2; PC6/TIM3_CH1 → TP3 → STEERINGSERVO pin 2.** The netlist was right and the firmware naming is the mirror image (it drives PA8 as \"rudder\" and PC6 as \"motor\"). The board can only have worked with the ESC plugged into the STEERINGSERVO header and the servo into SPEEDCONTROLLER, or with a firmware build other than the one in the repo. | `docs/img/v1_evidence_pwm.png` (film copper traced by net); `pstxnet` N04355 = {U3-41, SPEEDCONTROLLER-2, TP1-1}, N04395
