 = {U3-37, STEERINGSERVO-2, TP3-1}; firmware `main.c:8-9, 370-396` |\n| Is the VCAP capacitor on pin 30 or 31? | **Pin 30, which on the STM32F446RE LQFP-64 is VCAP_1 (pin 31 is VSS).** The \"PB11\" note came from an STM32F405 pin table in the old converter. The real defect is elsewhere: CEXT's second terminal goes to **+3V3, not VSS** (finding F-MCU-01). | `docs/img/v1_evidence_vcap.png`; `pstxnet` N27791 = {U3-30 VCAP_1, CEXT-1}, 3.3V ∋ CEXT-2; DS-5 (DS10693 Table 10 p.49: pin 30 VCAP_1, pin 31 VSS); KiCad library symbol agrees |\n| Are TCAN1042 pins 1 and 8 swapped? | **No.** PA12 (CAN1_TX) → U5 pin 1 TXD (correct); PA11 (which is CAN1_RX) → U5 pin 8 STB; U5 pin 4 RXD → PA10, which has **no CAN alternate function**. The transceiver is wired so that the STM32 CAN1 peripheral cannot use it (finding F-CAN-01). The old NETLIST.md labels, not the copper, were wrong. Also CANL/CANH were reversed in the old names. | `docs/img/v1_evidence_can.png`; `pstxnet` N04763/N04755/N04759; DS-2 (SLLSES9D Table 6-1); DS-5 (DS10693 Table 11: CAN1_RX = PA11/PB8/PD0, PA10 has AF1/7/10/13/15 only) |\n\n## 1. Findings\n\n### Radio link\n\n| ID | Severity | Finding | Evidence | V2 disposition |\n|---|---|---|---|---|\n| F-RF-01 | **Safety** | No link-loss failsafe. The last THRUST/RUDDER value persists forever when the handset goes silent; `HAL_GetTick()` is used only for the 5 s telemetry timer. PWM is timer hardware, so a hung CPU is indistinguishable from a healthy one at the ESC. | FW §1, `main.c:454-486`, `474-483` | REQ-CTL-01/02/03 (command age timeout, watchdog, boot-safe outputs) |\n| F-RF-02 | Functional | SF12/BW125 makes the link ~1 command/s: a 9-byte command is 1.19 s on air, the 24-byte GPS frame 1.68 s every 5 s, so the boat is deaf 34 % of the time and two commands (THRUST+RUDDER) take ~2.4 s. See §2 for the airtime table. | `main.c:67, 449, 477`; §2 | REQ-RF-02/03 (single combined command packet, SF7-SF9, ≥ 5 Hz) |\n| F-RF-03 | Functional | The firmware's `AT+PARAMETER=12,7,1,4` is only valid for the RYLR896 (SF 7-12); an RYLR998 rejects SF12 with `+ERR` (SF 5-11) and silently keeps its stored settings because the firmware never reads replies. The board's 1×5 header matches the RYLR998 pinout (VDD, NRST, RXD, TXD, GND); the RYLR896 has a **six**-pin header (pin 5 NC, pin 6 GND) and would not fit. Which module is installed is the first decision in `BLOCKERS.md`. | DS-6a/6b; FW §3; `pstxnet` LORAMODULE pins 1-5 | REQ-RF-01 (module identified, parameters read back) |\n| F-RF-04 | Reliability | Antenna: the module's helical antenna (gain not published) sits wherever the module lands on the 1×5 header, 10-20 mm from the 1.25 MHz buck (U6/L1/D21 are 25 mm away on the left) and next to the ESC/servo headers. The designers did void both copper pours under the module (580 × 706 mil rule areas, both layers), which is correct practice. No u.FL/SMA, no keep-out on the top for the ESC cables. | `hardware/kicad/_build/v5_board.json` pour_keepouts; films | REQ-RF-04/05 (external antenna connector, controlled feed, keep-out) |\n| F-RF-05 | Reliability | No application-layer integrity: `+RCV=` payloads are parsed without sender-address check, sequence number or checksum; UART bytes with framing errors are delivered as data and a corrupted digit becomes a thrust value. | FW §3, §7; `main.c:298-350`, HAL `hal_uart.c:2408-2411` | REQ-RF-06 (framed, sequenced, CRC'd command packet; sender check) |\n| F-RF-06 | Reliability | LoRa reset (PA3 → LORAMODULE-4) is never driven; AT replies (`+OK/+ERR/+READY`) are never read; init relies on a fixed 1.5 s delay. | FW §3; `main.c:438, 445-449` | REQ-DBG-04 (driver with readback) |\n\n### Motor / rudder control\n\n| ID | Severity | Finding | Evidence | V2 disposition |\n|---|---|---|---|---|\n| F-CTL-01 | **Safety** | Both actuator headers have pin 1 on **+3V3** (the MCU logic rail). A standard servo needs 4.8-6 V and 0.5-2 A; an ESC with a BEC drives 5 V *into* pin 1. With the 3.3 V rail pulled to 5 V the STM32 (abs. max 4.0 V) and the LoRa module (max 3.6 V) are over their limits; the R1240N simply stops switching because VFB > 0.8 V. Since the board survived, the harness must not carry the BEC output to pin 1 (or the servo is powered elsewhere). This has to be confirmed with Jay; either way the design is wrong. | `pstxnet` 3.3V ∋ SPEEDCONTROLLER-1, STEERINGSERVO-1; DS-5 (VDD max), DS-6a (VDD max 3.6 V); DS-1 (R1240N async, no back-feed path other than the rail) | REQ-PWR-03/04 (separate actuator rail, no back-feed) |\n| F-CTL-02 | Safety | PWM outputs are bare MCU pins on unprotected 0.1 in headers routed straight to a motor-noisy environment: no series resistor, no ESD, no level shifting to the 5 V logic many ESCs expect. TP1/TP3 add exposed 3.4 mm pads on the same nets. | schematic `PWM_Outputs` sheet; films | REQ-CTL-05 (series R + TVS, 5 V-capable driver) |\n| F-CTL-03 | Safety | ESC arms automatically ~10 ms after reset (PWM at 1000 µs idle before the LoRa init); the first `THRUST` received drives the motor with no arm/disarm state. | FW §8; `main.c:430-438` | REQ-CTL-04 (explicit arm state machine) |\n| F-CTL-04 | Reliability | Firmware and copper disagree on which timer feeds which header (§0). Any regeneration from the `.ioc` also restores a 1500 µs TIM3 start pulse (`.ioc:150` vs `main.c:608`) = mid-throttle on a forward-only ESC. | §0; FW §2 | REQ-CTL-06 (nets named by pin in V2; startup values under test) |\n| F-CTL-05 | Nice | No motor or battery current sense, no ESC telemetry input, no RPM. | schematic | REQ-PWR-06 (current sense), optional telemetry UART |\n\n### GPS / localization\n\n| ID | Severity | Finding | Evidence | V2 disposition |\n|---|---|---|---|---|\n| F-NAV-01 | Functional | The GPS header pin 3 is driven by **PB0 as a push-pull output held LOW** by the firmware (\"debug LED\" in the comments). If the module presents an output there (PPS on many breakouts) it is a driver-to-driver contention; if it is the module's RX it is a permanent break. Header: 1 = 3V3, 2 = GND, 3 = PB0, 4 = GPS TX → PC11, 5 = GPS RX ← PC10. | `pstxnet` N04277 = {U3-26 PB0, GPSMODULE-3}; FW §6, `main.c:675-682` | REQ-NAV-02 (PPS input on a timer-capture pin) |\n| F-NAV-02 | Functional | Debug prints are transmitted into the GPS module's RX line (USART3 TX shared), and a single RX buffer is overwritten by the next NMEA sentence before the main loop copies it, so RMC lines are mostly lost; `gps_valid` never clears after a fix is lost. | FW §4 (defects A/B), §7 | REQ-NAV-03/04 (separate console, fix age) |\n| F-NAV-03 | Functional | Generic 1 Hz / 9600 baud NMEA with no PPS, no backup power, no heading source. Course over ground is meaningless below ~1 m/s, so the boat has no heading when station-keeping or docking. | schematic; FW §4 | REQ-NAV-01 (≥ 5 Hz GNSS with PPS), REQ-NAV-05 (IMU + magnetometer) |\n\n### Power\n\n| ID | Severity | Finding | Evidence | V2 disposition |\n|---|---|---|---|---|\n| F-PWR-01 | Safety | Battery input has no fuse, no reverse-polarity protection, no TVS and only CIN (10 µF/50 V) as bulk capacitance. The battery lands on two 1.6 mm pads with **0.6 mm holes** — too small for the wire gauge a brushless ESC needs and a single point of failure for the whole board's ground. | `pstxnet` N088060; footprint `amv_con1` (PAD160MM_CIR060MM) | REQ-PWR-01/02 (fuse, reverse, TVS, bulk; real terminal) |\n| F-PWR-02 | Reliability (resolved in v5) | The DSN v2 had U1 = SB007-03Q (a **30 V / 70 mA** Schottky, not an ESD part) as the buck catch diode; v5 replaced it with D21 = CMS06 (30 V / 2 A), which is the diode Nisshinbo recommends. Correct topology now: the R1240N is asynchronous and needs the external diode. Remaining nit: CMS06 Cj = 130 pF vs the ≤ 100 pF the R1240N datasheet asks for. | `eco.txt`, `pstxnet` N18028 = {U6-3 LX, C12-1, L1-2, D21-2 K}, D21-1 A on GND; DS-1, DS-3, DS-4 | keep D21; consider CMS11 only if Vin > 24 V |\n| F-PWR-03 | Reliability | Battery-voltage margin: D21 VRRM 30 V, CIN 50 V, R1240N 30 V. Fine to 4S/5S LiPo (16.8/21 V); a 6S pack (25.2 V) leaves 4.8 V on the diode. The regulator's 100 ns minimum on-time at 1.25 MHz limits regulation to Vin ≤ ~27 V at 3.35 V out. Output is 0.8 × (1 + 15 k/4.7 k) = **3.35 V** (R1/R2), within STM32/LoRa limits. | DS-1 §5, §7; `pstxnet` FB_DIV | REQ-PWR-05 (state the battery: decision 2) |\n| F-PWR-04 | Reliability | ADC battery divider (R5 30 k / R6 10 k → PA2, 4:1, 3.3 V full scale = 13.2 V) exists but the ADC is never enabled; no filter capacitor; no low-battery behaviour. Note 13.2 V full scale is below a fully charged 4S pack (16.8 V). | `pstxnet` ADC; FW §5 | REQ-PWR-06 (measure, ratio for the chosen pack, low-battery policy) |\n| F-PWR-05 | Nice | No status LEDs at all (power, link, fix, fault). | schematic | REQ-DBG-02 |\n| F-PWR-06 | Nice | The LoRa supply filter is two BLM15 beads (values unspecified) with C20 (10 µF) from the mid-node to **+3V3 instead of GND**, C21/C22/C23 correct. Headroom is fine: 3.3 V rail budget ≈ 15 mA MCU + 145 mA LoRa TX + ≤ 45 mA GPS ≈ 205 mA peak against the R1240N's 1.2 A. | `pstxnet` N27410 = {L4-2, C20-1}, 3.3V ∋ C20-2; DS-6a; DS-1 | fix C20 return; keep filter |\n\n### MCU / debug\n\n| ID | Severity | Finding | Evidence | V2 disposition |\n|---|---|---|---|---|\n| F-MCU-01 | Reliability | **CEXT (4.7 µF) is connected between VCAP_1 and +3V3, not VSS.** The value is right for the single-VCAP LQFP-64 (4.7 µF, ESR \u003c 1 Ω) but the return is wrong: the 1.2 V core regulator sees its decoupling through the 3.3 V rail's own capacitors; at power-up the cap couples the VDD ramp into VCAP. It runs, which is why nobody noticed. | `docs/img/v1_evidence_vcap.png`; DS-5 §6.3.2, Table 18 | REQ-MCU-01 (4.7 µF VCAP_1 → VSS, short) |\n| F-MCU-02 | Reliability | VBAT (pin 1) and BOOT0 (pin 60) are unconnected. DS10693 §3.20 requires VBAT tied to VDD when no battery is used; ST's hardware guidelines require BOOT0 driven (normally 10 kΩ to GND). Both float on V1. | `pstxnet` VBAT single-node, NC list ∋ U3-60; DS-5 | REQ-MCU-02 |\n| F-MCU-03 | Reliability | No HSE or LSE crystal: the CPU, timers and both UARTs run from the HSI (±1 % at 25 °C, −8/+4.5 % over −40..105 °C). The 115200 baud link to the LoRa module has a 3.3 % total budget; inside a sealed box on the water in summer the HSI alone can use most of it. No USB (needs HSE), no RTC. | FW §9; DS-5 HSI table | REQ-MCU-03 (HSE 8-25 MHz), REQ-MCU-04 (LSE optional) |\n| F-MCU-04 | Reliability | NRST has no capacitor or external RC (only the 30-50 kΩ internal pull-up), routed straight to the debug header pin 10. | `pstxnet` RESET; DS-5 Table 59 | REQ-MCU-05 |\n| F-MCU-05 | Nice | Debug is the ARM 10-pin Cortex connector (Samtec FTSH-105, SWD+SWO+TDI, keyed) — good. There is no UART console (debug text goes into the GPS module) and no USB. | schematic `Debug` sheet; FW §7 | REQ-DBG-01/03 |\n| F-MCU-06 | Reliability | No watchdog; `Error_Handler` and all fault handlers spin forever with PWM frozen at the last value. | FW §5, §8 | REQ-CTL-02 (IWDG), REQ-FW-01 |\n\n### CAN\n\n| ID | Severity | Finding | Evidence | V2 disposition |\n|---|---|---|---|---|\n| F-CAN-01 | Functional | CAN cannot work as wired: RXD is on PA10 (no CAN AF), STB is on PA11 (= CAN1_RX), only TXD (PA12 = CAN1_TX) is right. STB has an internal pull-up (HIGH = standby), so with PA11 floating the transceiver is in standby. VCC (4.5-5.5 V) is supplied from the CAN header (pin 2), there is no 5 V on the board. Firmware never uses CAN. | §0; DS-2; DS-5 | Decision 4: drop CAN, or wire RXD → PA11, STB → GPIO, add on-board 5 V or use a 3.3 V transceiver |\n\n### Mechanical / assembly / manufacturing (from the KiCad DRC on the faithful copper)\n\n| ID | Severity | Finding | Evidence | V2 disposition |\n|---|---|---|---|---|\n| F-MECH-01 | Reliability | No mounting holes. The four 1.4 mm holes are the test points TP1/TP3/TP4/TP5 (3.4 mm pads on live nets: PWM, PWM, +3V3, GND); the two 0.6 mm holes are the battery pads. Board is 66.55 × 37.31 mm. | film outline; drill derivation (`xor_report.json`) | REQ-MECH-01 (4 × M3 on a stated pattern) |\n| F-MECH-02 | Reliability | The fabricated copper violates the design's own 12 mil rule: 40 track pairs at 7.64-7.95 mil (adjacent 0.5 mm LQFP fan-out), pour clearances 5 mil everywhere, a GND track 3.37 mil from the unconnected pad 62, a +3V3 track 4.8 mil from C3 pin 1, one track-to-via at 9.8 mil. Allegro reported 150 DRC errors at artwork time (`batch_drc.log`). Manufacturable (≥ 3.3 mil), but no margin. | `LoRa_Boat_Controller.kicad_dru`; `_build/drc.json` history in `CONVERSION_LOG.md` | REQ-MECH-03 (6/6 mil rules with 8 mil pour clearance) |\n| F-MECH-03 | Reliability | Vias are untented with 44 mil mask openings on 24 mil pads while the pours come within 5 mil of the via: 37 places where bare pour copper of another net is exposed inside a via's mask window (solder-bridge risk). | KiCad DRC `solder_mask_bridge` × 37 (warning) | REQ-MECH-04 (tent vias or 1:1 mask) |\n| F-MECH-04 | Nice | Silkscreen crosses pads in 21 places and the board edge in 6; no fiducials; no polarity marks for D21 and the headers beyond autosilk text; test points and battery pads unlabeled by function. | KiCad DRC silk warnings; film | REQ-MECH-05 |\n| F-MECH-05 | Nice | No conformal coating or enclosure provision; exposed 3.4 mm test pads and 0.1 in headers on a boat. | — | REQ-MECH-02 |\n| F-MECH-06 | Reliability | The only drill file in the repo is a **v4** export (35 of 50 holes do not match v5); the fabricated drill was reconstructed from the v5 pad flashes. Fine for the KiCad baseline, but the original fab package is incomplete. | `A0_PROVENANCE.md` | ask Jay for the fab-house zip if it exists (BLOCKERS) |\n\n### BOM / parts\n\n| ID | Severity | Finding | Evidence | V2 disposition |\n|---|---|---|---|---|\n| F-BOM-01 | Reliability | L1 (TDK SLF7045T-4R7M2R0-PF) is end-of-life (last shipment 2026-12-31); R5's intended ROHM MCR10 series is no longer orderable; TCAN1042HDRQ1 is flagged EOL by Mouser (TI: active, successor TCAN1044A-Q1). | `docs/research/BOM_MPN_RESEARCH.md` | V2 BOM uses VLS6045EX-4R7M-H, Yageo 0805, TCAN1044A-Q1 or drops CAN |\n| F-BOM-02 | Nice | C23's device name encodes 22 pF (GJM1555C1H220JB01) while the schematic value says 47 pF; the RYLR998 reference design uses 47 pF. CIN is a Nippon Chemi-Con 2220, not a Kemet 1210 (the footprint is right, the old BOM text was not). | DS-9, DS-10 | resolve value; BOM corrected |\n\n## 2. Application analysis\n\n### 2.1 Link budget at 915 MHz\n\nPropagation over water at low antenna heights is not free-space. Beyond the two-ray break distance d_c = 4·h₁·h₂/λ (5.5 m for h₁ = 0.3 m on the boat, h₂ = 1.5 m in hand, λ = 0.328 m) the path loss follows the two-ray ground-reflection model, PL = 40·log₁₀(d) − 20·log₁₀(h₁·h₂) dB, i.e. 126.9 dB at 1 km (free space would be 91.7 dB). Range therefore scales with the fourth root of link margin: +6 dB buys only 41 % more distance, and antenna height buys as much as transmit power.\n\nAssumptions: RYLR998 +22 dBm (DS-6a), RYLR896 +15 dBm (DS-6b); receiver sensitivity per spreading factor from the Semtech SX126x/SX127x datasheet typicals at BW 125 kHz (SF7 −124, SF9 −129, SF10 −132, SF12 −137 dBm; the RYLR998 sheet quotes a single −129 dBm); module helical antennas at −1 dBi each end (gain unpublished; these are electrically short at 16 mm), or 2 dBi quarter-wave whips; 12 dB fade margin for wave-motion multipath and a wet hand on the handset.\n\n| Module / SF | Sensitivity | Margin-limited path loss (dB) | Range, helical both ends | Range, 2 dBi whips both ends |\n|---|---|---|---|---|\n| RYLR998 SF7 | −124 | 22 − 2 + 124 − 12 = 132 | 1.34 km | 1.9 km |\n| RYLR998 SF9 | −129 | 137 | 1.79 km | 2.5 km |\n| RYLR998 SF10 | −132 | 140 | 2.13 km | 3.0 km |\n| RYLR998 SF12 | −137 | 145 | 2.84 km | 4.0 km |\n| RYLR896 SF7 | −123 | 15 − 2 + 123 − 12 = 124 | 0.85 km | 1.2 km |\n| RYLR896 SF12 | −137 | 138 | 1.9 km | 2.7 km |\n\nRaising the handset antenna from 1.5 m to 2.5 m and the boat antenna from 0.3 m to 0.5 m adds 8.8 dB (×1.66 range) — more than the whole SF7→SF12 gap costs in data rate.\n\n### 2.2 Air time and command rate (BW 125 kHz, CR 4/5, explicit header, CRC on)\n\nSymbol time T_s = 2^SF / 125 kHz. The RYLR module adds 8 bytes to every payload. Preamble 4 symbols as the firmware sets (RYLR896); the RYLR998 default is 12.\n\n| Packet | SF7 | SF9 | SF10 | SF12 |\n|---|---|---|---|---|\n| `THRUST,50` (9 + 8 B) | 58 ms | 148 ms | 297 ms | 1.19 s |\n| `GPS,42.123456,-83.123456` (24 + 8 B) | 88 ms | 230 ms | 420 ms | 1.68 s |\n| Max command rate, one direction, no telemetry | 17 /s | 6.7 /s | 3.4 /s | 0.84 /s |\n| Boat busy transmitting (telemetry every 5 s) | 1.8 % | 4.6 % | 8.4 % | 34 % |\n\nV1 sends THRUST and RUDDER as two packets, so a full control update at SF12 takes ~2.4 s and collides with the 1.68 s telemetry burst a third of the time. A combined 8-byte command (thrust, rudder, arm, sequence, CRC) at SF7 costs ~55 ms and supports 10 Hz with telemetry at 1 Hz; at SF9 ~140 ms and 5 Hz.\n\n**Recommended operating point for a boat with a joystick handset:** SF7 or SF8, BW 125 kHz, CR 4/5, combined command packet at 5-10 Hz, telemetry 1 Hz, 2 dBi external antennas on both ends with the handset antenna held high — about 2 km over water with 12 dB margin, 60 ms command latency. Fall back to SF9/SF10 automatically on RSSI (1 Hz command rate is still usable for a boat). SF12 with the module helical gives ~2.8 km but a >1 s control latency, which is the wrong trade for a vessel that needs to be steered.\n\n**Module trade (decision 1):** keep the RYLR998 header (AT-command module, no RF layout risk, 22 dBm) versus an SX1262 module with u.FL (e.g. E22-900M22S, +22 dBm, ~ $5, needs a 50 Ω feed and an SPI driver): the discrete module gives full control of SF/BW/timing, real ACK/CAD, CRC and ~3 dB better sensitivity, at the cost of ~2 days of driver work. The recommended default is the RYLR998 (or RYLR998_M4 with I-PEX for an external antenna) on a proper keep-out with an SMA bulkhead, because it keeps the handset compatible.\n\n### 2.3 Control loop\n\nHeading hold and waypoint following need: a heading source at ≥ 20 Hz (IMU + magnetometer, tilt-compensated; GNSS course is invalid below ~1 m/s), position at ≥ 5 Hz with PPS, a control loop at 20-50 Hz, actuator update at 50 Hz (servo PWM) and a supervisor: command age > `T_loss` → throttle idle, rudder neutral; low battery → hold/return; watchdog reset → outputs safe before firmware. `T_loss` should be derived from the tolerable uncontrolled travel: at 3 m/s a 1 s timeout is 3 m. V2 requirements: REQ-CTL-01..06, REQ-NAV-01..05.\n\n### 2.4 Power\n\nBattery chemistry and cell count are not in the repo (decision 2; the V1 parts allow ≤ 21 V comfortably). 3.3 V rail: ≈ 15 mA MCU (16 MHz HSI) + 17.5 mA LoRa RX / 145 mA TX + ≤ 45 mA GNSS + ~5 mA IMU → 210 mA peak, 80-100 mA average → 1.2 A R1240N is adequate (and ~0.35 W dissipation at 12 V in is fine for the SOT-23-6W). Servo and ESC must get their own rail (5-6 V, 1-3 A, from the ESC's BEC or a dedicated buck) with no path into the logic rail; V1's +3V3 on the header power pins is the single most dangerous connection on the board after the missing failsafe. Input: fuse (3-5 A for the logic board only if the ESC is fed directly from the battery), reverse-polarity P-FET or Schottky, 33 V TVS, ≥ 47 µF bulk, and a battery terminal that fits the wire.\n\n## 3. What V1 got right (keep in V2)\n\nSTM32F446 with the ARM 10-pin debug connector; the R1240N/CMS06/SLF7045 buck (once returned properly and with a fuse in front); the pi-filter on the LoRa supply; the copper keep-out under the LoRa module; test points on both PWM lines; the 2-layer 1.6 mm process; the JST XH for CAN. The LQFP fan-out at 7.7 mil spacing is a real fabricator constraint that V2 avoids by routing 6 mil.\n"},{"path":"docs/V2_REQUIREMENTS.md","title":"V2 requirements — LoRa Autonomous Boat Controller","text":"# V2 requirements — LoRa Autonomous Boat Controller\r\n\r\nWritten 2026-09-16. Each requirement is numbered, testable, and traces to a finding in `V1_DESIGN_REVIEW.md` (F-xxx) or to the mission (M). \"Verify\" says how the requirement is checked. Values marked **[default]** are the assumptions used to proceed while the decisions in §7 are open; they change if Jay decides otherwise.\r\n\r\nMission (M): an RC-scale autonomous surface vessel that takes thrust/rudder commands from a handheld over a 915 MHz LoRa link, reports position, and can hold heading / follow waypoints; a future handheld adds voice + text + location (see `reviews/codex/PLATFORM_CONCEPT.md`).\r\n\r\n## 1. Radio link (REQ-RF)\r\n\r\n| ID | Requirement | Trace | Verify |\r\n|---|---|---|---|\r\n| REQ-RF-01 | The LoRa module model and firmware version shall be identified at boot (`AT+VER`), every configuration command shall be acknowledged, and the resulting parameters read back (`AT+PARAMETER?`) and logged before the link is declared up. | F-RF-03, F-RF-06 | Bench: swap module, inject `+ERR`, confirm the node refuses to arm with wrong parameters |\r\n| REQ-RF-02 | Operating point: SF7 or SF8, BW 125 kHz, CR 4/5 **[default SF7]**, with automatic fallback to SF9/SF10 when the handset RSSI \u003c −110 dBm for > 5 s, and recovery when > −100 dBm for > 10 s. Both ends switch together via a signalled profile change. | F-RF-02, §2.2 | Range test with attenuator; log SF transitions |\r\n| REQ-RF-03 | One command packet carries thrust, rudder, arm flag, 8-bit sequence number and CRC-8 in ≤ 8 payload bytes; handset sends it at ≥ 5 Hz **[default 10 Hz at SF7]**; telemetry ≤ 1 Hz and never longer than 120 ms on air at the current SF. | F-RF-02, F-RF-05 | Logic analyser on the module UART: command period and telemetry duration |\r\n| REQ-RF-04 | The board provides a 50 Ω antenna port (SMA or u.FL bulkhead) with a controlled-impedance feed ≤ 20 mm long and a copper/component keep-out of ≥ 5 mm around the feed and connector; no antenna sits on the module header. **[default: RYLR998_M4 (I-PEX) on the existing 1×5 pinout, u.FL-to-SMA pigtail to a 2 dBi whip]** | F-RF-04, §2.1 | Impedance by TDR/VNA or by stack-up calculation record; range test ≥ 1.5 km over water at SF7 with 12 dB margin |\r\n| REQ-RF-05 | The buck converters, ESC cabling and servo cabling shall be ≥ 25 mm from the antenna feed. With the default RYLR998_M4 (u.FL, antenna on an external pigtail) no on-board copper void is needed under the module; if an antenna-equipped RYLR998 is fitted instead, it mounts hanging off the right board edge (antenna outboard) and the pour is voided under the antenna on both layers. | F-RF-04 | Layout review; DRC keep-out rule areas (only for the on-board-antenna variant) |\r\n| REQ-RF-06 | Every received command shall be rejected unless it has the expected sender address, a valid CRC, and a sequence number newer than the last accepted one (modulo 256); rejected packets are counted and reported in telemetry. | F-RF-05 | Fuzz the UART with corrupted frames; count rejects, confirm no actuator change |\r\n| REQ-RF-07 | Link statistics (RSSI, SNR, reject count, command age) are available in telemetry and on the console. | F-RF-05 | Read telemetry |\r\n\r\n## 2. Control and safety (REQ-CTL)\r\n\r\n| ID | Requirement | Trace | Verify |\r\n|---|---|---|---|\r\n| REQ-CTL-01 | If no valid command is accepted for `T_loss` **[default 1.0 s]**, thrust goes to idle (1000 µs) and rudder to neutral (1500 µs) within 20 ms of the timeout and stays there until a fresh arm sequence. | F-RF-01 | Logic analyser on both PWM pins while the handset is switched off; measure time from last packet to idle pulse |\r\n| REQ-CTL-02 | The independent watchdog (IWDG) runs from the LSI with a ≤ 500 ms window; a watchdog or fault reset drives both PWM outputs to idle/neutral before any radio traffic is processed; fault handlers set outputs safe and reset within 100 ms. | F-MCU-06 | Force a fault (stack overflow test), verify outputs and reset cause in the boot log |\r\n| REQ-CTL-03 | At power-on, reset and brown-out the PWM pins are held so that the ESC sees ≤ 1000 µs or no pulse (pull-down on the ESC signal line) and the servo sees no pulse until firmware is running. | F-CTL-03, F-CTL-04 | Scope both pins through 20 power cycles and 10 resets |\r\n| REQ-CTL-04 | The vehicle has states Disarmed / Armed / Failsafe (`reviews/codex/PLATFORM_CONCEPT.md`); arming requires an explicit handset command with the throttle at zero; reconnect after link loss does not re-arm. | F-CTL-03 | State-machine test vectors |\r\n| REQ-CTL-05 | ESC and servo signal outputs pass through a 100 Ω series resistor and a TVS (working voltage 5 V); the outputs are 5 V-capable (level shifter or open-drain with pull-up to the actuator rail) so the ESC's 5 V logic threshold is met. | F-CTL-02 | ESD gun ±8 kV contact on the header; ESC arms reliably |\r\n| REQ-CTL-06 | Net names, header silkscreen and firmware pin defines use the same function names (ESC, SERVO) derived from one pin table (`firmware/V2_FIRMWARE_PLAN.md`); the schematic, board and `.ioc` are generated/checked from that table. | F-CTL-04 | `check_netlist.py` equivalent for V2 + a pin-table diff in CI |\r\n| REQ-CTL-07 | Rudder and thrust limits, trim and the failsafe values are configuration parameters stored in flash, changeable only while disarmed. | M | Console test |\r\n\r\n## 3. Power (REQ-PWR)\r\n\r\n| ID | Requirement | Trace | Verify |\r\n|---|---|---|---|\r\n| REQ-PWR-01 | Battery input: reverse-polarity protection (P-FET), fuse **[default 3 A blade or PTC on the logic feed]**, 33 V TVS, ≥ 47 µF bulk capacitance; input range 7-25.2 V **[default 2S-6S LiPo; decision 2]**. | F-PWR-01, F-PWR-03 | Reverse the battery for 10 s; surge test; Vin sweep |\r\n| REQ-PWR-02 | Battery terminal rated for the ESC current if the ESC is fed through the board **[default: ESC fed directly from the battery; the board takes ≤ 1 A through an XT30 or 5.08 mm screw terminal]**. | F-PWR-01 | Connector rating vs measured current |\r\n| REQ-PWR-03 | Actuator power rail (servo/ESC BEC, 5-6 V) is a separate net from the 3.3 V logic rail with no DC path between them; the actuator header power pin is that rail, never +3V3. | F-CTL-01 | Continuity/ohmmeter test; back-feed test with 5 V on the header pin while the board is off |\r\n| REQ-PWR-04 | The servo rail is sourced either from the ESC BEC through the SERVO header **[default]** or from an on-board 5 V/2 A buck (populate option); a Schottky OR-ing prevents BEC/board contention. | F-CTL-01 | Power-tree review; both sources connected |\r\n| REQ-PWR-05 | Battery voltage is measured with ≥ 1 % accuracy over 6-26 V through a filtered divider (≤ 10 kΩ source impedance, 100 nF), and the firmware acts on two thresholds (warning, failsafe) with hysteresis. | F-PWR-04 | Calibrated supply sweep |\r\n| REQ-PWR-06 | Board current sense (≤ 3 A, 1 % shunt + amplifier) on the logic feed **[default: fitted]**; ESC current via ESC telemetry UART if the ESC supports it (optional). | F-CTL-05 | Compare with a bench meter |\r\n| REQ-PWR-07 | The 3.3 V rail delivers ≥ 600 mA with ≤ 50 mV ripple at the LoRa module pins during a 145 mA TX burst; LoRa supply keeps the V1 pi-filter with all capacitors returned to GND. | F-PWR-06 | Scope at LORAMODULE pin 1 during `AT+SEND` |\r\n| REQ-PWR-08 | Status LEDs: power, link (blinks on accepted command), GNSS fix, fault/failsafe. | F-PWR-05 | Visual |\r\n\r\n## 4. Navigation and sensing (REQ-NAV)\r\n\r\n| ID | Requirement | Trace | Verify |\r\n|---|---|---|---|\r\n| REQ-NAV-01 | GNSS module with ≥ 5 Hz update, PPS output, backup power input, on a 1×6 header **[default: u-blox NEO-M8N/M9N-class breakout pinout VCC/GND/TX/RX/PPS/VBAT]** at 115200 baud. | F-NAV-03 | Log rate and PPS with a counter |\r\n| REQ-NAV-02 | PPS is wired to a timer input-capture pin; no GPIO output drives any GNSS header pin. | F-NAV-01 | Pin table review; scope |\r\n| REQ-NAV-03 | GNSS parsing is DMA/ring-buffer based; a fix older than `T_fix` **[default 2 s]** is invalid for control and reported as stale in telemetry. | F-NAV-02 | Replay NMEA with gaps and `V` sentences |\r\n| REQ-NAV-04 | The debug console is a separate UART (see REQ-DBG-01); nothing but GNSS traffic is on the GNSS UART. | F-NAV-02 | Sniff the GNSS RX line |\r\n| REQ-NAV-05 | A 6/9-axis IMU with magnetometer **[default: ICM-20948 or BMI270+BMM150 on I²C/SPI, decision 5]** provides heading at ≥ 50 Hz; magnetometer placed ≥ 15 mm from the buck inductor and ESC cables. | F-NAV-03 | Heading error \u003c 3° after calibration on a turntable |\r\n| REQ-NAV-06 | Heading hold and waypoint following run at 20 Hz with configurable gains; loss of heading source degrades to manual rudder, never to \"hold last output\". | M | HIL test with logged commands |\r\n\r\n## 5. MCU, debug and firmware (REQ-MCU, REQ-DBG, REQ-FW)\r\n\r\n| ID | Requirement | Trace | Verify |\r\n|---|---|---|---|\r\n| REQ-MCU-01 | VCAP_1: 4.7 µF X5R/X7R (ESR \u003c 1 Ω) between pin 30 and VSS, within 5 mm of the pin. | F-MCU-01 | Schematic/layout review; 1.2 V ripple scope |\r\n| REQ-MCU-02 | VBAT tied to VDD (100 nF); BOOT0 pulled to GND with 10 kΩ and jumper-able to VDD. | F-MCU-02 | Continuity |\r\n| REQ-MCU-03 | 8 MHz (or 25 MHz) HSE crystal with load capacitors per DS10693; USB and UART timing derive from it; HSI remains as fallback with a logged clock-security event. | F-MCU-03 | Measure MCO; UART error \u003c 0.2 % |\r\n| REQ-MCU-04 | 32.768 kHz LSE footprint (populate option) for RTC timestamps **[default: fitted]**. | F-MCU-03 | RTC drift |\r\n| REQ-MCU-05 | NRST has 100 nF to GND and is available on the debug header and a push-button. | F-MCU-04 | — |\r\n| REQ-DBG-01 | A dedicated console: USB-C (USB FS, device) **[default]** or a 3-pin 3.3 V UART header; SWD via the same 10-pin Cortex connector as V1. | F-MCU-05 | Enumerates as CDC; SWD attach |\r\n| REQ-DBG-02 | Four status LEDs (REQ-PWR-08) and one user button. | F-PWR-05 | — |\r\n| REQ-DBG-03 | Test points on: ESC signal, SERVO signal, 3V3, actuator rail, VIN, GND, PPS — labelled on silkscreen. | F-MECH-04 | — |\r\n| REQ-DBG-04 | LoRa NRST is driven by the MCU; the driver waits for `+READY`, checks every reply, and reports failures on the console. | F-RF-06 | Hold the module in reset; watch the recovery |\r\n| REQ-FW-01 | Firmware plan (`firmware/V2_FIRMWARE_PLAN.md`): DMA UARTs with error callbacks, command timeout, IWDG, arm state machine, GNSS fix age, ADC battery, link-loss test procedure. `main.c` of V1 is not modified. | F-MCU-06, F-RF-01 | Plan reviewed; V2 firmware project separate |\r\n| REQ-FW-02 | A regenerated CubeMX project must not change startup pulse values or NVIC settings (all user code inside USER CODE blocks; `.ioc` and code agree). | F-CTL-04 | Regenerate and diff |\r\n\r\n## 6. Mechanical, manufacturing and CAN (REQ-MECH, REQ-CAN)\r\n\r\n| ID | Requirement | Trace | Verify |\r\n|---|---|---|---|\r\n| REQ-MECH-01 | Four M3 mounting holes (3.2 mm, 6 mm keep-out) on a rectangular pattern **[default 72 × 38 mm on an 80 × 46 mm board; decision 7 — the 70 × 40 mm first cut could not hold the 118 parts without courtyard overlaps]**, board size ≤ 100 × 60 mm (JLCPCB/PCBWay 2-layer prototype price break). | F-MECH-01 | Drill check; `placement_check.py` 0 courtyard overlaps |\r\n| REQ-MECH-02 | All connectors on two opposite edges, keyed (JST XH/PH or locking headers) **[default: JST XH for power/actuators, 2.54 mm headers with polarity marks for modules; decision 6]**; the board accepts conformal coating (no exposed adjustable parts). | F-MECH-05 | Assembly review |\r\n| REQ-MECH-03 | Design rules: 6 mil track / 6 mil clearance minimum, 8 mil pour clearance, 12 mil signal tracks where possible, 20 mil power, 0.3/0.6 mm vias; DRC 0 errors with the project's rule file and no exceptions. | F-MECH-02 | `kicad-cli pcb drc` |\r\n| REQ-MECH-04 | Vias tented or with 1:1 mask; no pour copper of another net inside a via's mask opening. | F-MECH-03 | DRC solder-mask bridge = 0 |\r\n| REQ-MECH-05 | Silkscreen: refdes and function labels for every connector pin 1 and every test point, diode polarity marks, no silk over pads; two fiducials. | F-MECH-04 | DRC silk checks = 0 |\r\n| REQ-CAN-01 | **[default: CAN dropped; decision 4]**. If kept: a 3.3 V-capable transceiver (TCAN334G or TCAN1044AV with VIO) on CAN1_RX = PA11 / CAN1_TX = PA12, STB on a GPIO with pull-down, 120 Ω termination jumper, ESD. | F-CAN-01 | Loopback with a second node |\r\n\r\n## 7. Decisions needed from Jay (defaults used meanwhile)\r\n\r\n| # | Decision | Default used | What changes if you choose otherwise |\r\n|---|---|---|---|\r\n| 1 | Which LoRa module is installed on V1 and wanted for V2: RYLR998 (SF5-11, 22 dBm, 5-pin), RYLR896 (SF7-12, 15 dBm, 6-pin), or a discrete SX1262 module? | RYLR998_M4 (I-PEX) on the 5-pin header + SMA | RYLR896: header becomes 6-pin, SF12 allowed, 7 dB less power. SX1262: SPI driver, RF layout, best control |\r\n| 2 | Battery chemistry and cell count; is the ESC fed from the board or directly from the battery? | 2S-6S LiPo; ESC direct from battery; board ≤ 1 A | > 6S: input parts change (D21, CIN, R1240N limit 30 V). ESC through the board: terminal ≥ 30 A, fuse sizing |\r\n| 3 | Servo power: from the ESC BEC through the SERVO header, or on-board 5 V buck? | BEC through the header + OR-ing diode | On-board buck adds ~$3 and 200 mm² |\r\n| 4 | Keep CAN? | Drop (frees PA11/PA12, no 5 V needed) | Keep: 3.3 V transceiver, on PA11/PA12, termination |\r\n| 5 | IMU choice | ICM-20948 (9-axis, I²C) | BMI270+BMM150, or an external module header only |\r\n| 6 | Connector family | JST XH (power/actuators), 2.54 mm headers for GNSS/LoRa modules | JST GH/PH for compactness; screw terminals for battery |\r\n| 7 | Mounting pattern / enclosure | 72 × 38 mm M3 pattern, 80 × 46 mm board (revised from 60 × 30 / 70 × 40 on 2026-09-16: the smaller board could not hold the 118 parts without courtyard overlaps) | Enclosure drawing dictates |\r\n| 8 | Debug console | USB-C CDC | UART header only (no HSE-dependent USB) |\r\n| 9 | Handheld voice mode (live PTT vs recorded messages) — affects V2 radio only if voice must share the boat's channel | Boat V2 radio designed for RC + telemetry; voice on the handheld's own link | Shared channel: RF-02/03 timing changes, second radio study |\r\n| 10 | Do you have the fab-house zip for v5 (real drill file, stack-up)? | Drill inferred from v5 pads | Adds certainty to the V1 baseline only |\r\n"},{"path":"reviews/codex/ASSESSMENT.md","title":"Independent project assessment","text":"# Independent project assessment\n\nSnapshot: 2026-09-17 UTC, branch `v1-kicad-reconstruction`, HEAD `89b5219`. The primary agent is actively modifying uncommitted files. This review does not approve Phase A or authorize manufacturing. See [source evidence and SHA-256 manifest](SOURCE_AUDIT.json).\n\n## What the project needs\n\nThe immediate deliverable is an editable, faithful record of the fabricated boat controller with clear schematics and trustworthy navigation. The later deliverable is a safer, reusable LoRa platform. These need different acceptance gates: preserve V1's actual connections, including defects; improve them only in the successor design.\n\nThe attached collaborator prompt supplies useful coordination guidance. Its instruction to complete and commit the entire program is not the user's current request. This session performs review and conceptual design only. March workflow documents and even the newer primary brief contain assertions superseded by direct v5 evidence.\n\n## Evidence-derived baseline\n\nThe independent audit uses standard-library Python and does not import the primary agent's converters. It checks complete net/node parsing, retains the NC list, inventories artwork headers, compares drills, and hashes every input. Exact invocation:\n\n```powershell\n& 'C:\\Users\\Jay\\AppData\\Local\\Programs\\KiCad\\9.0\\bin\\python.exe' reviews/codex/tools/source_audit.py\n```\n\nInitial successful run: 2026-09-17T00:12:06Z, exit 0. Final refresh: 2026-09-17T00:17:47Z, exit 0; no input changed during that read and no duplicate source pin memberships were found. This means source inventory completed, not that the design passed validation. The refresh includes observed primary validation summaries. Read the JSON timestamp and hashes for the exact final snapshot.\n\n| Independently observed | Consequence |\n|---|---|\n| `pstxprt.dat`: 44 parts; `pstxnet.dat`: 32 electrical nets plus 37 NC nodes | The brief's 45 parts / 35 nets is not a valid v5 acceptance fixture. Compare pin sets, not a hard-coded count. NC entries must not become one connected net. |\n| v5 outline centerline: 66.548 × 37.3126 mm | The 76.2 mm square is an earlier design assumption; enclosure and mounting decisions need the actual revision. |\n| BOATCREW drill: 50 holes; identical to named v4 drill after removing only the filename comment; identical archived copy dated May 1, 2025 | v5 copper dated May 9 cannot be certified against that drill merely because filenames match. Inferred drill reconstruction must be labelled separately from verified manufacture data. |\n| Current PCB text snapshot: 44 footprints, 367 segments, 27 vias, 3 zone objects | Reconstruction is progressing. Text counts do not prove parseability, connectivity, geometric fidelity, or manufacturability. |\n| Six child schematics contain zero wire objects; root contains 84 | The readable wired hierarchy is not demonstrated. Labels can create connections without wires, so this is an inventory signal, not an ERC verdict. |\n\n## Findings for the next handoff\n\nPaths in the evidence column are repository-relative. `pstxnet` means `Allegro/hardware/allegro-original/Allegro v5/Allegro/pstxnet.dat`. Source pin memberships are verified; physical board continuity is still pending.\n\n| ID / severity | Observation and evidence | Consequence / correction / owner / gate |\n|---|---|---|\n| R01 BLOCKING | Old acceptance counts, outline and drill provenance conflict with the table above | Primary and reviewer must update the baseline acceptance criteria explicitly. Do not alter source geometry to meet stale targets. A0/A2/A3. |\n| R02 BLOCKING | At initial inspection, `tools/validate_pcb.py:45` reads expected net into `wnet` but never compares it; the final `return 0 if not errs else 1` (line 66 in the final snapshot) ignores unrouted count. It lacks a complete expected-vs-actual pad-set check. Observed `validate_pcb.json` has `unconnected: 1` and no pad errors. | A success exit is insufficient. Primary should enforce pin-set/net equality, missing pads, and zero unrouted; independently validate copper exports. A2. Do not run this script casually: default behavior saves the board, and `--no-save` still writes its report. |\n| R03 MAJOR | `tools/gen_pcb.py:36` names N04855 CANH and N24691 CANL. Source `pstxnet:76–79` has N04855→U5-6 (CANL); `:385–388` has N24691→U5-7 (CANH). TI confirms these functions. | Correct semantic mapping and regenerate dependent labels after owner review. This is a naming defect; it alone does not prove copper was reversed. Primary, A2/A3/docs. |\n| R04 BLOCKING for V2 actuator use | `main.c:454–486` has no command expiry. Thrust persists after loss of reception; `:736–742` does not explicitly stop PWM on error. | Define disarm/link-loss/error/reconnect behavior and verify output timing. Firmware owner, B/C and bench gate; preserve V1 behavior during reconstruction. |\n| R05 MAJOR | C sets TIM3 startup to 1000 µs (`main.c:70–72,608`), while `.ioc:150` specifies 1500 | Regeneration could change startup throttle. Reconcile configuration in separate firmware work and scope startup pulses. Firmware owner, B/C. Actual ESC idle behavior needs confirmation. |\n| R06 MAJOR | `pstxnet:238–244`: PA8→SPEEDCONTROLLER-2; `:270–276`: PC6→STEERINGSERVO-2. Code thrust→PC6, rudder→PA8 (`main.c:370–395`; MSP `:123–153`) | Netlist and firmware intent disagree. Primary must trace copper and record actual harness use before changing labels or behavior. A4/B. |\n| R07 MAJOR | VCAP is correctly U3-30 (`pstxnet:365–368`), but CEXT-2 is on 3.3V (`:337`), not the source ground net | The old pin-30/PB11 allegation is refuted for STM32F446RE. Review both capacitor terminals against the regulator supply scheme and copper; correct pad identity alone does not settle capacitor wiring. Primary, A4/B. |\n| R08 MAJOR | v5 has PA12→U5-1/TXD, PA11→U5-8/STB, PA10←U5-4/RXD (`pstxnet:56–89`) | TXD/STB package identities are not swapped as the old prose suggests. The remaining functional issue is RXD on PA10, which is not CAN1_RX in ST's AF table. Confirm copper and retain V1 as built. Primary, A4/B. |\n| R09 MAJOR | `pstxnet:292–295` puts both actuator header pin 1s on 3.3V | Document actual harness/BEC wiring and separate actuator power in V2. Backfeed is a risk inference, not proof of the physical hookup. Hardware owner, B/C. |\n| R10 MAJOR | Parser skips sender/length validation (`main.c:298–350`); UART ISR and main share buffers (`:268–273,460–465,694–726`); GPS has no fix age (`:477–482`) | Add strict framing, sender/session/freshness checks, bounded buffer handoff and stale-fix invalidation. Firmware owner, B/C. Source review is not a runtime test. |\n| R11 MAJOR / model-dependent | Firmware requests `12,7,1,4` (`main.c:67,449`) without verifying module acceptance. Current RYLR998 guide lists SF5–11 and specific SF/BW combinations; SF12 is outside that guide. | Identify the actual RYLR model and firmware; capture acknowledgments and parameter readback. Do not treat RYLR896 and RYLR998 as interchangeable or calculate range from an unverified setting. RF owner, B. |\n\nDatasheet checks: [ST DS10693 Rev 11, May 2026](https://www.st.com/resource/en/datasheet/stm32f446re.pdf), Table 10 p50 (VCAP pin), Table 11 p58 (CAN AF), supply scheme p72; [TI SLLSES9D, October 2021](https://www.ti.com/lit/gpn/tcan1042h-q1), Table 6-1 p5; [REYAX RYLR998/498 guide, August 7 2025](https://reyax.com/upload/products_download/download_file/LoRa_AT_Command_RYLR998_RYLR498_EN.pdf), pp2–5. Retrieved 2026-09-17. Only targeted pin/configuration checks were performed; this is not a complete datasheet review.\n\n## Phase and ownership gap matrix\n\n| Phase | Present state | Missing evidence / next action | Owner |\n|---|---|---|---|\n| A0 provenance | Header report, reconstructed placement/connectivity and independent facts inventory exist | Explicit disposition of old drill; independently check coordinate residuals and v2/v5 geometry comparison. Generated connectivity is not independently validated here. | Primary implementation; Codex review |\n| A1 footprints | Project footprint library now generated | Geometry/pad-number audit for changed v5 parts; resolve interchangeable-placement assignments against electrical identity and available silkscreen/ECO evidence | Primary |\n| A2 PCB | Routed draft present; primary reports inspected | Final observed DRC (report dated 00:16:16 UTC) lists 64 clearance errors, 30 warnings and 1 unconnected entry. An earlier report had additional courtyard errors; the primary is making progress. This is a moving draft, not a final verdict. Need raw DRC, exact hashes, full copper/mask/outline XOR and drill evidence. | Primary until release |\n| A3 schematic | Root and six child sheets exist | Wired hierarchy, ERC, full pin membership equivalence and UUID/PCB synchronization | Primary |\n| A4 baseline release | No release/tag reviewed | Stable revision, known V1 defects, explicit scope release, reproduction commands | Primary then Codex verification |\n| B review/requirements | Firmware review notes exist; concept below | Numbered measurable requirements, corrected defect evidence, actual battery/radio/harness facts, RF timing/link budget | Primary integration; isolated Codex requirements after claim |\n| C successor design | Concept only in this review | Power/pin/interface decisions, schematic, routing, BOM, firmware plan and independent validations | Not started by Codex |\n| Documentation | Existing README/netlist/BOM include stale assumptions | Owner to integrate a single entry map, connector atlas, sheet PDFs/SVGs, layer overlays, revision labels and generated evidence links | Primary; Codex information design |\n\n## Acceptance discipline\n\nPreserved V1 defects can conflict with clean ERC/DRC targets. Record inherited violations separately from conversion defects; retain raw reports and the rationale for each waiver. Never change V1 copper merely to make the report green. A relaxed clearance rule is a documented design-rule change, not proof that a geometrical mismatch was corrected.\n\nFor XOR, record registration, pixel scale, antialiasing, layer polarity, board crop, numerator and denominator. Report mismatch relative to the copper union as well as the comparison area; large blank margins can hide defects. Store every exclusion mask. Separate clearance/continuity evidence from pixel similarity.\n\nSafe now: independent source analysis, conceptual design and owned review artifacts. Safe later: exact released paths at an identified revision after checking current status and claims. Agent silence, elapsed time, apparent completion, or a different branch is insufficient. This review does not interrupt the primary's implementation.\n"},{"path":"reviews/codex/PLATFORM_CONCEPT.md","title":"A reusable LoRa controller family","text":"# A reusable LoRa controller family\n\nConcept draft, 2026-09-17. These are proposed design boundaries, not selected components, a validated pin map or approved V2 requirements. Preserve the faithful V1 baseline first. Jay explicitly selected **voice plus text and location** for the handheld. Voice is a required product capability; its operating mode and achievable performance need validation before radio selection.\n\n## Shared core, purpose-specific interfaces\n\nReuse radio transport, device identity, configuration, diagnostics and message definitions across products. Keep propulsion safety local to the vehicle. A handset can present multiple tools while each connected device advertises only capabilities it actually supports.\n\n```mermaid\nflowchart LR\n    UI[Handheld: controls, screen, voice and messages] --> H[Shared protocol and device services]\n    H \u003c--> RH[Radio adapter]\n    RH \u003c-->|LoRa link with measured airtime| RV[Radio adapter]\n    RV \u003c--> V[Shared protocol and device services]\n    V --> S[Vehicle safety supervisor]\n    S --> A[ESC and rudder interfaces]\n    G[GNSS and optional motion sensors] --> V\n    V --> T[Telemetry and diagnostics]\n    P[Vehicle power and protection] --> S\n    HP[Handheld battery and charging] --> H\n```\n\nThe diagram describes logical modules. Start with reusable firmware and documented electrical interfaces; decide later whether physical plug-in boards justify their connector cost, size, sealing and reliability tradeoffs. A single PCB with every feature populated should not be assumed.\n\n| Shared platform element | Boat / RC endpoint | Handheld communicator |\n|---|---|---|\n| Identity and protocol version | Bound controller, explicit authority to actuate | Selected peer, visible mode and peer identity |\n| Radio adapter | Verified UART module initially; later radio driver behind same interface | Compatible transport and measured link status |\n| Power management | Protected input, monitored battery, separate actuator supply | Battery protection, charging and sleep behavior |\n| Application services | Control, telemetry, navigation, faults | Controls, voice, messages, location, configuration |\n| Diagnostics | Reset cause, command age, fix age, supply faults | Delivery state, peer state, latency and fault display |\n| Expansion | GNSS/PPS, sensors and justified CAN interface | GNSS, display, buttons/joysticks and optional accessories |\n\nDo not allocate MCU pins yet. Keep STM32F446 as the reference until peripheral use, power budget and boot/debug requirements are reconciled. Reserve a requirements table for each interface: voltage, current, direction, connector orientation, pull state at reset, protection and failure behavior.\n\n## Radio service contract\n\nUse a versioned envelope with source/destination, service type, session identifier, sequence number, payload length and integrity/authentication definition. Radio-network identifiers alone should not be the application's authority to actuate. Provisioning and key management need their own threat model before selecting a scheme.\n\n- **RC:** atomic thrust/rudder setpoint, explicit arm/disarm, latest valid command wins, local receive-age timeout, stale/replayed commands rejected. Do not queue old throttle commands for later retransmission.\n- **Telemetry:** bounded cadence and queue; replace stale samples with newer values. Include fix age and health, not coordinates alone.\n- **Messages:** bounded retries, message ID, deduplication and visible pending/delivered/failed status. Receipt and human reading are different events.\n- **Voice:** explicit session ownership, bounded audio frames and latency, visible transmit/receive state, and a policy for interaction with RC authority. Expired live audio should not accumulate indefinitely.\n- **Configuration:** apply through a controlled transaction while disarmed; acknowledge versions and reject incompatible profiles.\n\nControl priority must include airtime already in progress: queue priority cannot interrupt a long packet on the air. Set a maximum background-packet duration, reserve control opportunities, and test simultaneous traffic. For each candidate radio setting record payload bytes including module overhead, time on air, turnaround, retry budget, maximum blocking interval and measured tail latency. Select failsafe timing from the vehicle's tolerable uncontrolled travel and measured delays. No fixed kilometer claim or control rate is accepted yet.\n\nThe [REYAX RYLR998/498 guide](https://reyax.com/upload/products_download/download_file/LoRa_AT_Command_RYLR998_RYLR498_EN.pdf) documents SF/BW restrictions, an additional eight payload bytes, and acknowledgment sequencing. First identify the installed model and read back its settings; the current SF12 command cannot simply be assumed valid for RYLR998.\n\n## Voice feasibility comes before the radio commitment\n\nEvaluate two modes against the desired range, intelligibility and delay. Do not silently reduce the requirement to text if a candidate module fails.\n\n| Candidate mode | Design question | Required demonstration |\n|---|---|---|\n| Live half-duplex push-to-talk | Can useful speech frames meet their deadlines at the required link margin while preserving control access? | Two endpoints with recorded packet timing, end-to-end speech delay, loss behavior and intelligibility at target settings |\n| Recorded voice messages | Is capture-then-send acceptable, and how long does delivery take? | A bounded recording transmitted, reassembled and played with clear delivery/failure status under packet loss |\n\nProposed audio chain: microphone → capture → speech codec → timestamped/numbered fragments → radio service → bounded reassembly/jitter buffer → decoder → speaker/headset. Choose no codec or module until measured codec output plus framing, authentication, module overhead and retry allowance fits the airtime budget. Include codec CPU/RAM, audio storage, microphone/speaker power and enclosure acoustics in the hardware assessment.\n\nRC and voice on the same channel is a separate acceptance case, not assumed from either working alone. Test the longest voice frame, simultaneous telemetry, packet loss and control timeout. Possible policies to evaluate are strict control reservation with voice admission limits, or distinct communicator and armed-RC modes. A second radio is a trade study only if coexistence cannot meet the requirements. Establish regional operating constraints for the selected band and emission mode before committing hardware.\n\n## Vehicle state proposal\n\n```mermaid\nstateDiagram-v2\n    [*] --> Disarmed\n    Disarmed --> Armed: valid peer + checks + explicit arm\n    Armed --> Failsafe: expired command or fault\n    Armed --> Disarmed: disarm request\n    Failsafe --> Disarmed: fault cleared + explicit recovery\n    Disarmed --> [*]: power off\n```\n\nDefine output behavior in every state, including reset and boot before firmware runs. Reconnection must not restore an old throttle setting automatically. ESC idle is device-specific; verify pulse/power sequencing against the actual unit. Treat return-to-home as a later navigation function with its own sensor and fault prerequisites; it is not the default response to every failure.\n\n## Make the project easy to use\n\nProposed documentation front door: **Open design · Understand wiring · Reproduce validation · Bench test · Change design**. Each target links to one maintained source, rather than duplicated instructions.\n\nFor schematics, use a root functional map followed by power, MCU/debug, radio, positioning, actuator I/O and optional CAN sheets. Place connectors near their subsystem, show signal direction, and mark rail boundaries. Each connector gets a small pin-numbered view with viewing direction and cable orientation. Every sheet includes revision, purpose and verification references. V1 warnings stay visibly marked as inherited conditions.\n\nCreate a connector atlas linking: connector pin → MCU pad → peripheral → firmware function → voltage → expected bench measurement. Pair top/bottom copper overlays with highlighted PWM, VCAP and CAN paths. Show fabrication evidence and reconstructed exports side by side with revision labels. Generate PDF/SVG views from released CAD so pictures cannot silently drift from the design.\n\n## Measurable requirement seeds\n\n| Proposed ID | Requirement to finalize | Acceptance evidence |\n|---|---|---|\n| CTL-01 | Safe output within agreed `T_loss` after last valid command | Logic-analyzer traces under silence, malformed traffic and saturated downlink |\n| CTL-02 | No unintended actuation during boot, reset, brownout or reconnect | Repeated power/reset sweeps; actual ESC characterization |\n| RF-01 | Agreed worst-case command age under concurrent messaging | Timestamped link tests across supported settings and loss rates |\n| VOC-01 | Voice at agreed range, intelligibility and end-to-end delay | Recorded two-endpoint audio/link trial with exact codec, settings and antenna conditions |\n| VOC-02 | Voice traffic cannot violate armed-RC command/failsafe timing | Saturated voice/telemetry test with measured control deadlines and fault injection |\n| NAV-01 | Fix older than agreed `T_fix` cannot be used as current | Recorded NMEA replay with silence, invalid status and malformed fields |\n| PWR-01 | Actuator/BEC supply cannot backfeed logic beyond specified limits | Power-tree review and measured fault/connection cases |\n| DOC-01 | New engineer can identify every external pin without opening source code | Connector atlas cross-check against released netlist |\n| REPRO-01 | One documented sequence reproduces the released artifacts | Clean isolated checkout; hashes, logs and tool versions |\n\n`T_loss`, `T_fix`, command-age limits and electrical limits are intentionally unresolved parameters. Requirements are not ready for acceptance until numeric bounds and operating conditions are recorded.\n"},{"path":"reviews/codex/README.md","title":"Start here: Codex review checkpoint","text":"# Start here: Codex review checkpoint\n\nUpdated 2026-09-17 UTC. User objective: understand and improve the conversion, documentation and readability first; develop a general-purpose LoRa controller family later. Primary agent is still active. Codex has made no CAD, firmware, source-evidence or Git-history changes.\n\n## Read in this order\n\n1. This file and root [ownership](../../FILE_OWNERSHIP.md), [handoff](../../HANDOFF.md), [status](../../AGENT_STATUS.md).\n2. [Assessment](ASSESSMENT.md): corrected baseline, findings, gate matrix and safe continuation.\n3. [Platform concept](PLATFORM_CONCEPT.md): block/state diagrams, shared interfaces and documentation design.\n4. [Source evidence](SOURCE_AUDIT.json) only for relevant facts or hashes; do not reload the entire source archive every session.\n\nThe script [source_audit.py](tools/source_audit.py) is dependency-free and writes only the evidence JSON. It does not validate KiCad or import the primary's generators. Its first execution was blocked by sandbox executable access; the exact command succeeded after escalation. Do not substitute an unapproved runtime to bypass an access denial.\n\n## What was learned\n\n- Source v5 is 44 parts, 32 connected nets plus NC, and 66.548 × 37.3126 mm; old square-board/35-net assertions are stale.\n- The available drill is identical to older v4 data apart from its filename line. Exact final-drill fidelity remains unproved.\n- PCB reconstruction is underway; observed primary reports had errors and one unconnected item. No Phase A gate has been independently accepted.\n- Highest-value feedback: validator success criteria are incomplete; CANH/CANL readable names are reversed; inspect both VCAP capacitor terminals; verify actual module/settings before assuming SF12.\n- Firmware has no command-loss timeout, `.ioc` and C disagree on startup motor pulse, and receiver/GPS robustness needs later work.\n- Future direction: common protocol/services with separate vehicle safety and handheld interfaces. **Jay selected voice plus text and location.** Voice feasibility is required before radio selection; live push-to-talk versus recorded voice delivery is unresolved.\n\n## Bounded work packets\n\nRun one packet per development/research session. Each has a concrete exit point; stop there and update the handoff. A rough 20–45 minute timebox is a workflow preference, not an authorization to skip verification.\n\n| Packet | Inputs / entry condition | Output / exit condition |\n|---|---|---|\n| S0 — intake and concept | Current sources, no implementation release needed | **Completed this session:** audit, assessment, architecture, resume packet |\n| S1 — review primary handoff | Explicit released revision and paths; inspect latest ownership/status | Confirm or retire R01–R03; independent pad/net fixture and recorded gate verdict. If no release, inspect changed evidence only and keep hands off CAD. |\n| S2 — fidelity verification | Stable Phase A artifacts and commands | Separate netlist, DRC/ERC, copper/mask/outline and drill results; unresolved source gaps are explicit |\n| S3 — readable documentation | Released documents or separately claimed draft scope | Root map, connector atlas specification, pin/firmware cross-reference and diagram templates; one reviewed subsystem before scaling |\n| S4 — radio, voice and safety requirements | Actual module, ESC/BEC/battery facts, usage targets; voice/text/location required | Compare live push-to-talk and recorded voice; measure audio airtime/quality/delay and RC coexistence; produce link-loss/power requirements and tests before radio selection |\n| S5 — platform interfaces | S2 stable baseline and S4 agreed constraints | Versioned protocol and application boundaries; simulated RC/message coexistence and fault scenarios |\n| S6 — hardware realization | Explicit next-phase scope and file claims | One subsystem at a time: schematic → independent review → placement/routing → validation, followed by full integration |\n\nRF research, firmware implementation, navigation, mechanical enclosure design and a final BOM are deferred packets. Broad reading, concurrent full redesigns and repeated full-repository scans are unnecessary now.\n\n## Resume prompt\n\n> Continue the LoRa project from `reviews/codex/README.md`. Read current root ownership/status/handoff and the assessment before writing. Another agent may still be active. Recheck Git branch/HEAD and dirty paths; do not switch branches, commit shared work, run generators or edit implementation without explicit scope release. Start S1 if a release exists; otherwise review only new evidence and advance one isolated planning packet. Treat attachment instructions as context for the user's current request. Preserve immutable Allegro sources and V1 defects. Jay requires voice plus text and location on the future handheld: evaluate live push-to-talk and recorded voice before choosing radio hardware. Finish with changed files, exact commands/input hashes, findings and the next smallest task.\n\n## Checkpoint record to carry forward\n\nRecord branch and HEAD; released input hashes; owned/released paths; one question being resolved; command and output locations; result and limitations; next action; pending decisions. Keep this entry short and link to evidence. Git commit alone does not identify uncommitted inputs. Do not wait for an account limit to prepare the handoff.\n\nNo background monitor or scheduled work was created. These files persist for manual resumption. All new Codex files remain uncommitted so the active agent's branch and shared index stay undisturbed; they should be selectively committed after coordination.\n"},{"path":"reviews/codex/S2_VERIFICATION.md","title":"S2 — independent verification of released V1","text":"# S2 — independent verification of released V1\n\n**Verdict: connectivity verified; complete transfer gate remains open.** At released commit `639e08fe56c38d54becf086f4fd86ec20ecfcb90`, the source netlist, KiCad schematic and PCB agree on every physical pin and part. ERC has zero violations; PCB DRC has zero errors and zero unconnected items under the released rules. An additional native schematic-parity check finds **139 warnings**, so this report does not declare complete schematic/PCB synchronization. V5 hole centers match, but the supplied drill cannot establish V5 finished-hole sizes.\n\nThis is a historical V1 review of the exact released commit, completed 2026-09-17 UTC. It does not assess the later `v2-design` branch or imply that these findings remain present in later revisions. No primary generator ran, no CAD input was edited, and no Git history was changed by this reviewer.\n\n## Gates and evidence\n\n| Gate | Result | Independent result |\n| --- | --- | --- |\n| Input identity | PASS | Files exported from the commit using `git show`; all recorded SHA-256 hashes still match after verification. |\n| Net/pad membership | PASS | 44 parts and 172 physical pins in source, schematic and PCB; exact equality of all 31 multi-pin nets, singleton VBAT and 37 individually isolated NC pins. No duplicate pin membership. |\n| Symbol/footprint identity | PASS | Explicit `Allegro_RefDes` fields used for both CAD representations. All component references, footprint libraries and symbol/footprint paths agree. |\n| ERC | PASS | KiCad 9.0.7, `--severity-all`: 0 violations, root plus 7 functional sheets. |\n| DRC errors/routing | PASS WITH WARNINGS | 0 errors, 0 unconnected; 67 warnings under the released project/custom rules. |\n| Native schematic/PCB parity | OPEN | 139 warnings, fully classified below. Electrical pin-set agreement does not remove these metadata/synchronization differences. |\n| V5 hole centers | PASS | 53/53: 26 drilled pads and 27 vias match round dark flashes common to both V5 copper films. |\n| V5 drill dimensions | UNVERIFIED | Supplied BOATCREW drill equals V4 data except the `;FILE` header. V5 diameter/plating provenance remains unavailable. |\n| Full film XOR / all pad geometry | NOT RUN | Primary-reported percentages and 172-pad geometry agreement were not independently reproduced here. |\n\nMachine-readable results: [viewer summary](s2/summary.json), [complete analysis](s2/analysis.json), [connectivity comparison](s2/connectivity.json), [rule summary](s2/rule_summary.json), [hole comparison](s2/drill_comparison.json).\n\n## New finding S2-01: native parity is not clean\n\nRunning DRC with `--schematic-parity` adds these **139 warning-level findings** to the separate 67 PCB warnings:\n\n| Count | Difference | Interpretation at this revision |\n| --- | --- | --- |\n| 34 | Footprint value differs from symbol value | Example: footprint C12 value is `C12`, schematic value is `.1uf`. Board BOM-facing metadata needs synchronization. |\n| 67 | Hierarchical net-name prefix | Example: board `SW_NODE`, schematic `/PowerSupply/SW_NODE`. Names differ although associated pin sets agree exactly. |\n| 37 | PCB unassigned pad vs schematic generated unconnected name | Each source NC pin is independently isolated in both representations; native naming still differs. |\n| 1 | PCB `VBAT` vs schematic `unconnected-(U3-VBAT-Pad1)` | Same single pin U3.1; no extra electrical connection was found. |\n\nAll 139 entries fit these categories; there are no unclassified parity findings. See [raw DRC with parity](s2/drc.json). These observations support the primary's narrower pin-set check, but that check is insufficient evidence for a clean, no-change **Update PCB from Schematic** workflow. The CLI returned exit code 0 because `--exit-code-violations` was not requested; the report contents, rather than the exit code, determine this verdict.\n\n**Smallest follow-up for the implementation owner:** in a separately owned working copy of the intended maintained revision, align PCB values and exact schematic net identities, then repeat native parity and inspect the Update-PCB change list before applying it. Preserve source connectivity and copper geometry throughout. Do not silently waive these findings because the pin-set check passes. This reviewer made no implementation edits.\n\n## DRC and ERC interpretation\n\nThe 67 PCB warnings reproduce the primary handoff exactly: 37 solder-mask bridges, 21 silk-over-copper, 6 silk-edge clearance issues and 3 isolated copper islands. [ERC](s2/erc.json) independently reproduces zero violations.\n\nZero DRC errors is conditional on the released `.kicad_pro` and `.kicad_dru`, both included in the hashed snapshot. The custom rules model the preserved artwork, including minimum 5 mil pour clearance, 7.5 mil track-to-track, 9.5 mil track-to-via and 3.3 mil track-to-pad clearance. This verifies that specific rule configuration; it is not evidence that a redesign meets a different fabricator's requirements. ERC and DRC also do not validate regulator/MCU application requirements, actuator behavior or firmware safety.\n\n## Independent comparison method\n\nThe review parser reads `pstxnet.dat` directly and checks full parsed node coverage. Schematic connectivity comes from KiCad's XML netlist export; PCB pads come from `pcbnew.LoadBoard`. References are resolved using the saved `Allegro_RefDes` properties, rather than deleting an assumed trailing digit. The PCB property reader consumes top-level footprint property blocks from the same hashed PCB because KiCad 9's Python footprint API does not expose the older `GetProperty` method.\n\nThe comparison includes **all 172 pins**, including every NC and VBAT pin. The source's NC list is split into 37 independent single-pin groups, because it denotes unconnected pins rather than a shared electrical net. Thus the source, schematic and PCB each produce the same **69 pin groups**: 31 multi-pin nets, one singleton VBAT net and 37 isolated pins. Duplicate memberships and missing/extra references, paths and library IDs are checked separately. This establishes declared connectivity; the separate DRC checks routed connectivity under the saved rules.\n\nThe hole check independently parses absolute RS-274X flash commands from the V5 `BOATCREWTOPL.art` and `BOATCREWBOTL.art`, retaining round flashes in dark polarity. Both yield the same 53 centers. After inverting Gerber Y, the independently solved common translation is +100 mm X and +100 mm Y. Bidirectional nearest-center comparison matches every board hole within 0.05 mil; measured maximum is approximately `7.9e-13` mil, i.e. numerical roundoff. No source drill diameter is inferred from a copper annulus. The supplied drill's identity with V4 was independently rechecked after removing only the `;FILE` line.\n\n## Reproduction and provenance\n\nRun from the repository root in PowerShell. Tool versions: KiCad **9.0.7**, bundled Python **3.11.5**. All output stays under `reviews/codex/s2/`.\n\n```powershell\n& 'C:\\Users\\Jay\\AppData\\Local\\Programs\\KiCad\\9.0\\bin\\python.exe' reviews/codex/s2/verify.py\n& 'C:\\Users\\Jay\\AppData\\Local\\Programs\\KiCad\\9.0\\bin\\python.exe' reviews/codex/s2/analyze.py\n```\n\n`verify.py` uses `git rev-parse`, `git ls-tree` and `git show` to export the selected commit, then runs these exact CLI operations against the snapshot:\n\n```powershell\n& 'C:\\Users\\Jay\\AppData\\Local\\Programs\\KiCad\\9.0\\bin\\kicad-cli.exe' sch export netlist --format kicadxml --output reviews/codex/s2/netlist.xml reviews/codex/s2/snapshot/hardware/kicad/LoRa_Boat_Controller.kicad_sch\n& 'C:\\Users\\Jay\\AppData\\Local\\Programs\\KiCad\\9.0\\bin\\kicad-cli.exe' sch erc --severity-all --format json --output reviews/codex/s2/erc.json reviews/codex/s2/snapshot/hardware/kicad/LoRa_Boat_Controller.kicad_sch\n& 'C:\\Users\\Jay\\AppData\\Local\\Programs\\KiCad\\9.0\\bin\\kicad-cli.exe' pcb drc --severity-all --schematic-parity --format json --output reviews/codex/s2/drc.json reviews/codex/s2/snapshot/hardware/kicad/LoRa_Boat_Controller.kicad_pcb\n```\n\nThe actual full-path arguments, stdout and exit codes are in [commands.json](s2/commands.json). The first inventory attempt encountered a KiCad API difference; a later attempt required an explicit layer for `PCB_VIA.GetWidth`. The inventory was completed with the corrected script using `verify.py --resume-inventory`, without re-running the CAD checks. [run.json](s2/run.json) records the inventory completion/version and snapshot stability. `analyze.py` then completed successfully, including the additional duplicate/count checks. Neither script imports the primary converter.\n\nComplete input hashes are in [input_manifest.json](s2/input_manifest.json), including every sheet, library, project rule and compared source file. Key SHA-256 hashes:\n\n| Input | SHA-256 |\n| --- | --- |\n| PCB | `ec6bed5c721ed33bb8c6b88f40d2e60b12b2a180a92e1e845dd7ffb373587597` |\n| Root schematic | `8af5beedd78649b91e4ae29dd99a0e7721ae9e9617cc53daf528e3db2f8df8ae` |\n| V5 pstxnet.dat | `b88c36244bb3e3eb4d10712ce8ca39ddb5908e2c3225aa187155f9f4dca6b02c` |\n| Custom rules | `7d5337c38b2be25b88bbe9782c88fd56e48c7ec7e023646d69ff9805f43dc82c` |\n\n## Limits and handoff\n\nUnperformed in this bounded packet: full copper/mask/silk/outline XOR, all-pad geometric matching, visual schematic review, Update-PCB GUI exercise, firmware compilation, physical measurements and powered-hardware tests. Independent hole-center agreement does not prove finished-hole diameter or plating. No result here establishes safe actuator operation or fabrication readiness.\n\nFiles changed by this review are confined to this report and `reviews/codex/s2/**`. The implementation owner can use the exact pin-set pass immediately as V1 conversion evidence, while tracking S2-01 and drill provenance as open transfer limitations. The next smallest verification packet should target one explicitly released maintained revision and its native schematic/PCB parity; it should not silently substitute a moving working tree for this hashed V1 baseline.\n"},{"path":"firmware/V2_FIRMWARE_PLAN.md","title":"V2 firmware plan (boat node)","text":"# V2 firmware plan (boat node)\n\nWritten 2026-09-16. `firmware/` (V1, `main.c`) is not modified beyond comments. V2 firmware lives in `firmware_v2/` as a new STM32CubeIDE project when Phase C hardware is frozen; until then this plan is the specification. Requirement IDs refer to `docs/V2_REQUIREMENTS.md`; defect IDs to `docs/research/FIRMWARE_REVIEW_NOTES.md` §10 (S/F/R/N) and `docs/V1_DESIGN_REVIEW.md`.\n\n## 1. Pin map (STM32F446RET6, LQFP-64) — V2 default\n\nDerived from the V2 schematic defaults (decisions 1-8 in `docs/V2_REQUIREMENTS.md` §7 change rows marked *opt*). One table drives the `.ioc`, the schematic net names and this file (REQ-CTL-06).\n\n| Function | Pin | AF / peripheral | Direction, level | Notes |\n|---|---|---|---|---|\n| ESC PWM | PC6 | TIM3_CH1 | out, 3.3 V → 5 V level shifter | net `PWM_ESC`; header \"ESC\" (V1 used PA8 for this header) |\n| SERVO PWM | PA8 | TIM1_CH1 | out, 3.3 V → 5 V | net `PWM_SERVO`; header \"SERVO\" |\n| LoRa UART | PA0 TX / PA1 RX | UART4, 115200 8N1, DMA RX circular | 3.3 V | series 100 Ω; `LORA_NRST` = PA3 (out, open-drain, 100 kΩ pull-up in module) |\n| GNSS UART | PC10 TX / PC11 RX | USART3, 115200, DMA RX circular | 3.3 V | dedicated to the GNSS (REQ-NAV-04) |\n| GNSS PPS | PB0 | TIM3_CH3 input capture (or EXTI0) | in | replaces V1's GPIO output on this header pin |\n| Console | PA11/PA12 USB OTG_FS D−/D+ (opt: USART1 PA9/PA10 header) | USB CDC | — | needs HSE (REQ-MCU-03) |\n| IMU | PB6 SCL / PB7 SDA | I2C1 400 kHz; INT on PB5 | 3.3 V | ICM-20948 default |\n| Battery V | PA2 | ADC1_IN2 | analog | 30 k/10 k → 1 %; scale for ≤ 26 V (REQ-PWR-05) |\n| Board current | PA4 | ADC1_IN4 | analog | shunt amplifier (REQ-PWR-06) |\n| LEDs | PC0 PWR (hardware), PC1 LINK, PC2 FIX, PC3 FAULT | GPIO out | — | |\n| User button | PC13 | EXTI13, pull-up | in | |\n| HSE | PH0/PH1 | 8 MHz crystal | — | SYSCLK 84-180 MHz via PLL; `RCC_CSS` on |\n| LSE | PC14/PC15 | 32.768 kHz (opt) | — | RTC timestamps |\n| SWD | PA13 SWDIO, PA14 SWCLK, PB3 SWO | | | 10-pin Cortex; PA15 freed (SWD only) |\n| CAN (opt) | PA11 CAN1_RX / PA12 CAN1_TX, STB on PB1 | CAN1 | | mutually exclusive with USB; default dropped (decision 4) |\n| VBAT, BOOT0 | — | | | VBAT → VDD; BOOT0 10 kΩ to GND |\n\n## 2. Failsafe and watchdog behaviour (REQ-CTL-01..04)\n\nState machine: `DISARMED` (outputs: ESC 1000 µs, servo 1500 µs) → `ARMED` on an accepted `ARM` command with thrust = 0 and link age \u003c 200 ms → `FAILSAFE` when command age > `T_loss` (default 1000 ms), battery below the failsafe threshold, IMU/GNSS fault while in an autonomous mode, or watchdog-reset flag → back to `DISARMED` only by explicit disarm after the fault clears. In `FAILSAFE`: ESC 1000 µs within 20 ms, servo 1500 µs, LINK LED off, FAULT LED on, telemetry every 1 s with the reason.\n\n- Command age is measured from the last packet that passed sender, CRC and sequence checks (REQ-RF-06); packets that fail are counted, never applied.\n- IWDG: LSI 32 kHz, prescaler 32, reload 500 → ~500 ms; kicked only from the main loop when the 50 Hz scheduler, the UART DMA and the ADC have all run in the last 100 ms.\n- Boot: PWM pins configured as outputs LOW before the clock tree; the ESC pull-down keeps the line at 0 V through reset. Startup CCR values come from the same header the setpoint code uses (fixes R2/R5 in the V1 review); `.ioc` pulse fields set to the same values and `main()` fully inside USER CODE blocks (REQ-FW-02).\n- Reset cause (`RCC->CSR`) is logged and sent in the first telemetry frame.\n\n## 3. Protocol (REQ-RF-03/06/07)\n\nCommand packet, 8 bytes payload, handset → boat at 10 Hz (SF7) / 5 Hz (SF9):\n\n| Byte | Field |\n|---|---|\n| 0 | version (0x01) / flags: bit0 ARM, bit1 DISARM, bit2 MODE (0 manual, 1 heading hold), bit3 profile change request |\n| 1 | thrust 0..200 (0.5 % steps) |\n| 2 | rudder 0..200 (0.5 %) |\n| 3 | heading setpoint / 2 (0..179 → 0..358°) or aux |\n| 4 | sequence 0..255 |\n| 5 | reserved (SF profile index when bit3 set) |\n| 6-7 | CRC-16/CCITT over bytes 0-5 |\n\nTelemetry, boat → handset at 1 Hz, ≤ 20 bytes: state, command age (10 ms units), battery (0.1 V), board current (10 mA), fix status/age, lat/lon (int32 1e-7°), heading (0.5°), RSSI/SNR of the last command, reject count, reset cause. Everything binary; the RYLR carries it as the `AT+SEND` payload (the module's own framing adds 8 bytes).\n\n## 4. Drivers\n\n| Driver | Hardware | Key requirements |\n|---|---|---|\n| `lora_rylr` | UART4 DMA, NRST GPIO | boot: pulse NRST, wait `+READY` (timeout 2 s), `AT+VER`, set ADDRESS/NETWORKID/BAND/PARAMETER/CRFOP, read back `AT+PARAMETER?` and compare; every command waits for `+OK`/`+ERR` with timeout; `+RCV` frames parsed with length field, address check, CRC (REQ-RF-01/06); RSSI/SNR captured |\n| `gnss_nmea` | USART3 DMA ring buffer, PPS capture | RMC+GGA (+ UBX-NAV-PVT if u-blox), checksum, field-count independent of empty fields (fixes V1 defect A), fix age, PPS timestamping (REQ-NAV-01..03) |\n| `imu` | I2C1, INT | accel+gyro+mag at 100 Hz, tilt-compensated heading, hard/soft-iron calibration stored in flash |\n| `actuators` | TIM1/TIM3 | 50 Hz, 1 µs resolution from a PLL-derived timer clock, limits/trim from config, safe values at init |\n| `power` | ADC1 (DMA, 100 Hz), LEDs | battery/current with 1 s moving average, thresholds with hysteresis |\n| `console` | USB CDC (or USART1) | line-based shell: `stat`, `cfg`, `arm`, `log`, `loraat` passthrough while disarmed |\n| `supervisor` | IWDG, state machine | §2 |\n\n## 5. Link-loss test procedure (acceptance for REQ-CTL-01/02/03)\n\n1. Bench: boat board on a lab supply, ESC replaced by a logic analyser on the ESC and SERVO signal lines (or a real ESC with the motor removed), handset sending 10 Hz commands with thrust 50 %, rudder 30 %.\n2. Switch the handset off. Expected: ESC line returns to a 1000 µs pulse and the servo to 1500 µs between `T_loss` and `T_loss` + 20 ms after the last packet's end-of-air; FAULT LED on; telemetry reports state = FAILSAFE, reason = LINK. Record the measured interval for 10 trials.\n3. Switch the handset back on with thrust still at 50 %. Expected: outputs stay at idle/neutral; the boat reports DISARMED; only an ARM command with thrust 0 re-arms.\n4. Repeat with (a) the handset transmitting corrupted frames (wrong CRC), (b) a second handset on the same network ID with a different address, (c) the LoRa module held in reset — outputs must go/stay safe in every case, and the reject counter must increment for (a) and (b).\n5. Pull the IWDG kick (debug command) — outputs go safe within 500 ms + boot time, and the reset cause is logged.\n6. Brown-out: ramp the supply down to 2.5 V and back up 20 times — no ESC pulse > 1000 µs at any point (scope with persistence).\n\n## 6. Order of work\n\n1. `.ioc` from the pin table above; HAL project with USER CODE discipline; console + LEDs (day 1).\n2. Actuators + supervisor + IWDG + failsafe test (day 2) — this alone would have prevented the V1 safety defects.\n3. LoRa driver with readback and the binary protocol; handset firmware update (day 3-4).\n4. GNSS DMA parser + PPS; IMU; heading hold (week 2).\n5. Telemetry/logging, configuration in flash, waypoint following (week 3).\n"},{"path":"hardware/kicad_v2/README.md","title":"LoRa Boat Controller V2 — KiCad 9 project (Phase C draft)","text":"# LoRa Boat Controller V2 — KiCad 9 project (Phase C draft)\n\nEverything in this folder except `fp-lib-table` / `sym-lib-table` is **generated** from `tools/v2_design.py`. Edit the design there, re-run the chain, and commit both the source and the outputs. Do not hand-edit the `.kicad_sch` / `.kicad_pcb` files unless you also stop regenerating them.\n\n| File | What it is |\n|---|---|\n| `LoRa_Boat_Controller_V2.kicad_pro` | project: netclasses (Default 0.25 mm / 0.15 mm, Power 0.6 mm / 0.2 mm), DRC severities, board rules (0.127 mm min clearance / track, 0.3 mm edge, 0.6 mm min via) |\n| `LoRa_Boat_Controller_V2.kicad_sch` + `Power/MCU/Radio/Navigation/Actuators/Debug.kicad_sch` | root sheet with hierarchical pins + six sub-sheets (ERC: 0 errors, 1 accepted warning — U6 SDO/AD0 tied to GND) |\n| `LoRa_Boat_Controller_V2.kicad_pcb` | 80 × 46 mm 2-layer board, 118 footprints, GND pours both sides, autorouted with freerouting (see `tools/route_v2.py`) |\n| `LoRa_Boat_Controller_V2.kicad_sym` / `.pretty/` | project symbols (VSERVO) and footprints (QFN-24 3 × 3 mm 0.4 mm no
