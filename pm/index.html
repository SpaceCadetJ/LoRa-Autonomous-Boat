ity has not been measured.\n\nEvidence: [Allegro/hardware/allegro-original/Allegro v5/Allegro/pstxnet.dat:127](../../Allegro/hardware/allegro-original/Allegro%20v5/Allegro/pstxnet.dat#L127); [Allegro/hardware/allegro-original/Allegro v5/Allegro/pstxnet.dat:169](../../Allegro/hardware/allegro-original/Allegro%20v5/Allegro/pstxnet.dat#L169); [Allegro/hardware/allegro-original/Allegro v5/Allegro/pstxnet.dat:172](../../Allegro/hardware/allegro-original/Allegro%20v5/Allegro/pstxnet.dat#L172); [Allegro/hardware/allegro-original/Allegro v5/Allegro/pstxnet.dat:175](../../Allegro/hardware/allegro-original/Allegro%20v5/Allegro/pstxnet.dat#L175); [Allegro/hardware/allegro-original/Allegro v5/Allegro/pstxnet.dat:178](../../Allegro/hardware/allegro-original/Allegro%20v5/Allegro/pstxnet.dat#L178); [Allegro/hardware/allegro-original/Allegro v5/Allegro/pstxnet.dat:181](../../Allegro/hardware/allegro-original/Allegro%20v5/Allegro/pstxnet.dat#L181); [hardware/kicad/_build/netmap.json:3](../../hardware/kicad/_build/netmap.json#L3).\n\n### Pin 2 — CAN_VCC\n\n**Domain:** External supply unidentified; TCAN1042H needs 4.5–5.5 V. **Direction:** External connector → CAN supply (source unresolved).\n\nConfirm supply source and polarity. This net is separate from +3V3 and VIN_RAW in v5.\n\nEvidence: [Allegro/hardware/allegro-original/Allegro v5/Allegro/pstxnet.dat:395](../../Allegro/hardware/allegro-original/Allegro%20v5/Allegro/pstxnet.dat#L395); [hardware/kicad/_build/netmap.json:12](../../hardware/kicad/_build/netmap.json#L12); [docs/research/DATASHEET_NOTES.md:37](../../docs/research/DATASHEET_NOTES.md#L37).\n\n### Pin 3 — CANH\n\n**Domain:** Differential CAN bus; not a TTL UART pin. **Direction:** Bidirectional bus via U5.\n\nCheck continuity header pin 3 → U5-7 and external termination; no working bus is claimed.\n\nEvidence: [Allegro/hardware/allegro-original/Allegro v5/Allegro/pstxnet.dat:385](../../Allegro/hardware/allegro-original/Allegro%20v5/Allegro/pstxnet.dat#L385); [hardware/kicad/_build/netmap.json:7](../../hardware/kicad/_build/netmap.json#L7); [docs/research/DATASHEET_NOTES.md:36](../../docs/research/DATASHEET_NOTES.md#L36).\n\n### Pin 4 — CANL\n\n**Domain:** Differential CAN bus; not a TTL UART pin. **Direction:** Bidirectional bus via U5.\n\nCheck continuity header pin 4 → U5-6 and external termination; no working bus is claimed.\n\nEvidence: [Allegro/hardware/allegro-original/Allegro v5/Allegro/pstxnet.dat:76](../../Allegro/hardware/allegro-original/Allegro%20v5/Allegro/pstxnet.dat#L76); [hardware/kicad/_build/netmap.json:8](../../hardware/kicad/_build/netmap.json#L8); [docs/research/DATASHEET_NOTES.md:36](../../docs/research/DATASHEET_NOTES.md#L36).\n\n[Atlas index and snapshot provenance](README.md) · [Schematic PDF](../img/v1_schematic.pdf) · [PCB top](../img/v1_pcb_top.png) · [PCB bottom](../img/v1_pcb_bottom.png)\n"},{"path":"docs/atlas/GND.md","title":"Battery ground","text":"# Battery ground\n\nSingle solder pad on the board common ground net.\n\nAllegro reference **GND** → KiCad reference **GND1**.\n\nBOM: Battery-; MPN `not applicable (bare pad)`; no purchased component; confidence: n/a.\nFootprint: `LoRa_Boat_Controller:amv_con1`. [Full BOM](../BOM.csv).\n\n## Read before wiring\n\n- Electrical pin numbers below come from v5 pstxnet.dat, not a physical left-to-right view. Board side, connector key, cable view, and pin-1 marking require physical verification. All voltages and waveforms are design/code expectations, not bench measurements.\n- Allegro reference GND maps to KiCad GND1; original net name is 0. It is not a separate battery-only ground net in v5.\n\n## Electrical pin map\n\n| Pin | Readable net | Allegro net | MCU | Firmware role |\n|---|---|---|---|---|\n| 1 | GND | 0 | U3-18 VSS; U3-31 VSS_2; U3-47 VSS_3; U3-63 VSS_4; U3-12 VSSA/VREF- | Common reference |\n\n## Verification targets — not measured results\n\n### Pin 1 — GND\n\n**Domain:** 0 V reference (expected). **Direction:** Reference.\n\nUnpowered continuity to GND1/TP5; resistance/continuity has not been measured.\n\nEvidence: [Allegro/hardware/allegro-original/Allegro v5/Allegro/pstxnet.dat:142](../../Allegro/hardware/allegro-original/Allegro%20v5/Allegro/pstxnet.dat#L142); [Allegro/hardware/allegro-original/Allegro v5/Allegro/pstxnet.dat:169](../../Allegro/hardware/allegro-original/Allegro%20v5/Allegro/pstxnet.dat#L169); [Allegro/hardware/allegro-original/Allegro v5/Allegro/pstxnet.dat:172](../../Allegro/hardware/allegro-original/Allegro%20v5/Allegro/pstxnet.dat#L172); [Allegro/hardware/allegro-original/Allegro v5/Allegro/pstxnet.dat:175](../../Allegro/hardware/allegro-original/Allegro%20v5/Allegro/pstxnet.dat#L175); [Allegro/hardware/allegro-original/Allegro v5/Allegro/pstxnet.dat:178](../../Allegro/hardware/allegro-original/Allegro%20v5/Allegro/pstxnet.dat#L178); [Allegro/hardware/allegro-original/Allegro v5/Allegro/pstxnet.dat:181](../../Allegro/hardware/allegro-original/Allegro%20v5/Allegro/pstxnet.dat#L181); [hardware/kicad/_build/netmap.json:3](../../hardware/kicad/_build/netmap.json#L3).\n\n[Atlas index and snapshot provenance](README.md) · [Schematic PDF](../img/v1_schematic.pdf) · [PCB top](../img/v1_pcb_top.png) · [PCB bottom](../img/v1_pcb_bottom.png)\n"},{"path":"docs/atlas/GPSMODULE.md","title":"GPS module","text":"# GPS module\n\nFive-pin GPS socket with USART3 and an extra PB0 signal.\n\nAllegro reference **GPSMODULE** → KiCad reference **GPSMODULE1**.\n\nBOM: PPTC051LFBN-RC; MPN `PPTC051LFBN-RC`; Sullins Connector Solutions; confidence: HIGH.\nFootprint: `LoRa_Boat_Controller:CONN5_1LFBN-RC_SUL`. [Full BOM](../BOM.csv).\n\n## Read before wiring\n\n- Electrical pin numbers below come from v5 pstxnet.dat, not a physical left-to-right view. Board side, connector key, cable view, and pin-1 marking require physical verification. All voltages and waveforms are design/code expectations, not bench measurements.\n- The BOM identifies the socket, not the GPS module. PB0/pin 3 is actively driven LOW by firmware.\n- USART3 TX also carries debug output; assess its effect on the selected GPS module.\n\n## Electrical pin map\n\n| Pin | Readable net | Allegro net | MCU | Firmware role |\n|---|---|---|---|---|\n| 1 | +3V3 | 3.3V | U3-19 VDD; U3-32 VDD_2; U3-48 VDD_3; U3-64 VDD_4; U3-13 VDDA/VREF+ | Board supply / debug voltage reference |\n| 2 | GND | 0 | U3-18 VSS; U3-31 VSS_2; U3-47 VSS_3; U3-63 VSS_4; U3-12 VSSA/VREF- | Common reference |\n| 3 | GPS_PB0 | N04277 | U3-26 PB0 | PB0 is a push-pull output held LOW, described as debug LED/probe |\n| 4 | GPS_RX_PC11 | N04281 | U3-52 PC11 | USART3 RX; $GPRMC/$GNRMC parsing at 9600 baud, 8N1 |\n| 5 | GPS_TX_PC10 | N04285 | U3-51 PC10 | USART3 TX; debug strings share the GPS UART |\n\n## Verification targets — not measured results\n\n### Pin 1 — +3V3\n\n**Domain:** 3.3 V nominal (unmeasured). **Direction:** Board rail; external powering unsupported until reviewed.\n\nMeasure rail relative to TP5 with loads disconnected after V1 power defects are reviewed.\n\nEvidence: [Allegro/hardware/allegro-original/Allegro v5/Allegro/pstxnet.dat:286](../../Allegro/hardware/allegro-original/Allegro%20v5/Allegro/pstxnet.dat#L286); [Allegro/hardware/allegro-original/Allegro v5/Allegro/pstxnet.dat:322](../../Allegro/hardware/allegro-original/Allegro%20v5/Allegro/pstxnet.dat#L322); [Allegro/hardware/allegro-original/Allegro v5/Allegro/pstxnet.dat:325](../../Allegro/hardware/allegro-original/Allegro%20v5/Allegro/pstxnet.dat#L325); [Allegro/hardware/allegro-original/Allegro v5/Allegro/pstxnet.dat:328](../../Allegro/hardware/allegro-original/Allegro%20v5/Allegro/pstxnet.dat#L328); [Allegro/hardware/allegro-original/Allegro v5/Allegro/pstxnet.dat:331](../../Allegro/hardware/allegro-original/Allegro%20v5/Allegro/pstxnet.dat#L331); [Allegro/hardware/allegro-original/Allegro v5/Allegro/pstxnet.dat:334](../../Allegro/hardware/allegro-original/Allegro%20v5/Allegro/pstxnet.dat#L334); [hardware/kicad/_build/netmap.json:2](../../hardware/kicad/_build/netmap.json#L2).\n\n### Pin 2 — GND\n\n**Domain:** 0 V reference (expected). **Direction:** Reference.\n\nUnpowered continuity to GND1/TP5; resistance/continuity has not been measured.\n\nEvidence: [Allegro/hardware/allegro-original/Allegro v5/Allegro/pstxnet.dat:109](../../Allegro/hardware/allegro-original/Allegro%20v5/Allegro/pstxnet.dat#L109); [Allegro/hardware/allegro-original/Allegro v5/Allegro/pstxnet.dat:169](../../Allegro/hardware/allegro-original/Allegro%20v5/Allegro/pstxnet.dat#L169); [Allegro/hardware/allegro-original/Allegro v5/Allegro/pstxnet.dat:172](../../Allegro/hardware/allegro-original/Allegro%20v5/Allegro/pstxnet.dat#L172); [Allegro/hardware/allegro-original/Allegro v5/Allegro/pstxnet.dat:175](../../Allegro/hardware/allegro-original/Allegro%20v5/Allegro/pstxnet.dat#L175); [Allegro/hardware/allegro-original/Allegro v5/Allegro/pstxnet.dat:178](../../Allegro/hardware/allegro-original/Allegro%20v5/Allegro/pstxnet.dat#L178); [Allegro/hardware/allegro-original/Allegro v5/Allegro/pstxnet.dat:181](../../Allegro/hardware/allegro-original/Allegro%20v5/Allegro/pstxnet.dat#L181); [hardware/kicad/_build/netmap.json:3](../../hardware/kicad/_build/netmap.json#L3).\n\n### Pin 3 — GPS_PB0\n\n**Domain:** 0 V expected after GPIO init (unmeasured). **Direction:** MCU → attached GPS pin 3; external function unknown.\n\nIdentify GPS module pin 3 before attachment; possible output contention if that module drives this pin.\n\nEvidence: [Allegro/hardware/allegro-original/Allegro v5/Allegro/pstxnet.dat:46](../../Allegro/hardware/allegro-original/Allegro%20v5/Allegro/pstxnet.dat#L46); [Allegro/hardware/allegro-original/Allegro v5/Allegro/pstxnet.dat:49](../../Allegro/hardware/allegro-original/Allegro%20v5/Allegro/pstxnet.dat#L49); [hardware/kicad/_build/netmap.json:15](../../hardware/kicad/_build/netmap.json#L15); [firmware/Core/Src/main.c:688](../../firmware/Core/Src/main.c#L688).\n\n### Pin 4 — GPS_RX_PC11\n\n**Domain:** GPS TX level unverified. **Direction:** GPS TX → MCU.\n\nCapture NMEA lines and verify actual GPS baud rate/logic levels.\n\nEvidence: [Allegro/hardware/allegro-original/Allegro v5/Allegro/pstxnet.dat:218](../../Allegro/hardware/allegro-original/Allegro%20v5/Allegro/pstxnet.dat#L218); [Allegro/hardware/allegro-original/Allegro v5/Allegro/pstxnet.dat:221](../../Allegro/hardware/allegro-original/Allegro%20v5/Allegro/pstxnet.dat#L221); [hardware/kicad/_build/netmap.json:16](../../hardware/kicad/_build/netmap.json#L16); [firmware/Core/Src/main.c:660](../../firmware/Core/Src/main.c#L660); [firmware/Core/Src/stm32f4xx_hal_msp.c:241](../../firmware/Core/Src/stm32f4xx_hal_msp.c#L241).\n\n### Pin 5 — GPS_TX_PC10\n\n**Domain:** 3.3 V logic domain; module tolerance unverified. **Direction:** MCU → GPS RX.\n\nCapture transmitted debug text; determine whether the connected GPS interprets or rejects it.\n\nEvidence: [Allegro/hardware/allegro-original/Allegro v5/Allegro/pstxnet.dat:228](../../Allegro/hardware/allegro-original/Allegro%20v5/Allegro/pstxnet.dat#L228); [Allegro/hardware/allegro-original/Allegro v5/Allegro/pstxnet.dat:231](../../Allegro/hardware/allegro-original/Allegro%20v5/Allegro/pstxnet.dat#L231); [hardware/kicad/_build/netmap.json:17](../../hardware/kicad/_build/netmap.json#L17); [firmware/Core/Src/main.c:171](../../firmware/Core/Src/main.c#L171); [firmware/Core/Src/stm32f4xx_hal_msp.c:240](../../firmware/Core/Src/stm32f4xx_hal_msp.c#L240).\n\n[Atlas index and snapshot provenance](README.md) · [Schematic PDF](../img/v1_schematic.pdf) · [PCB top](../img/v1_pcb_top.png) · [PCB bottom](../img/v1_pcb_bottom.png)\n"},{"path":"docs/atlas/JTAG.md","title":"Debug / JTAG","text":"# Debug / JTAG\n\nTen numbered electrical pins; do not infer cable orientation from the table.\n\nAllegro reference **JTAG** → KiCad reference **JTAG1**.\n\nBOM: FTSH-105-XX-X-DV; MPN `FTSH-105-01-L-DV-K`; Samtec; confidence: HIGH.\nFootprint: `LoRa_Boat_Controller:SAMTEC_FTSH-105-XX-X-DV`. [Full BOM](../BOM.csv).\n\n## Read before wiring\n\n- Electrical pin numbers below come from v5 pstxnet.dat, not a physical left-to-right view. Board side, connector key, cable view, and pin-1 marking require physical verification. All voltages and waveforms are design/code expectations, not bench measurements.\n- Raw Allegro pin numbers 01–10 are normalized to 1–10 here. Pin 7 is NC, pin 1 is +3V3, and pins 3/5/9 are GND.\n- This follows the v5 debug connectivity. Physical keyed-header orientation remains unverified.\n\n## Electrical pin map\n\n| Pin | Readable net | Allegro net | MCU | Firmware role |\n|---|---|---|---|---|\n| 1 | +3V3 | 3.3V | U3-19 VDD; U3-32 VDD_2; U3-48 VDD_3; U3-64 VDD_4; U3-13 VDDA/VREF+ | Board supply / debug voltage reference |\n| 2 | SWDIO | PA13 TMS | U3-46 PA13 | PA13 debug data |\n| 3 | GND | 0 | U3-18 VSS; U3-31 VSS_2; U3-47 VSS_3; U3-63 VSS_4; U3-12 VSSA/VREF- | Common reference |\n| 4 | SWCLK | PA14 TCLK | U3-49 PA14 | PA14 debug clock |\n| 5 | GND | 0 | U3-18 VSS; U3-31 VSS_2; U3-47 VSS_3; U3-63 VSS_4; U3-12 VSSA/VREF- | Common reference |\n| 6 | SWO_TDO | PB3 TBO | U3-55 PB3 | PB3 trace/JTAG output; usable debug mode must be confirmed |\n| 7 | NC | NC | No direct MCU pin | No connection in v5 source |\n| 8 | TDI | PA15 TDI | U3-50 PA15 | PA15 JTAG input; usable debug mode must be confirmed |\n| 9 | GND | 0 | U3-18 VSS; U3-31 VSS_2; U3-47 VSS_3; U3-63 VSS_4; U3-12 VSSA/VREF- | Common reference |\n| 10 | NRST | RESET | U3-7 NRST | MCU reset |\n\n## Verification targets — not measured results\n\n### Pin 1 — +3V3\n\n**Domain:** 3.3 V nominal (unmeasured). **Direction:** Board rail; external powering unsupported until reviewed.\n\nMeasure rail relative to TP5 with loads disconnected after V1 power defects are reviewed.\n\nEvidence: [Allegro/hardware/allegro-original/Allegro v5/Allegro/pstxnet.dat:358](../../Allegro/hardware/allegro-original/Allegro%20v5/Allegro/pstxnet.dat#L358); [Allegro/hardware/allegro-original/Allegro v5/Allegro/pstxnet.dat:322](../../Allegro/hardware/allegro-original/Allegro%20v5/Allegro/pstxnet.dat#L322); [Allegro/hardware/allegro-original/Allegro v5/Allegro/pstxnet.dat:325](../../Allegro/hardware/allegro-original/Allegro%20v5/Allegro/pstxnet.dat#L325); [Allegro/hardware/allegro-original/Allegro v5/Allegro/pstxnet.dat:328](../../Allegro/hardware/allegro-original/Allegro%20v5/Allegro/pstxnet.dat#L328); [Allegro/hardware/allegro-original/Allegro v5/Allegro/pstxnet.dat:331](../../Allegro/hardware/allegro-original/Allegro%20v5/Allegro/pstxnet.dat#L331); [Allegro/hardware/allegro-original/Allegro v5/Allegro/pstxnet.dat:334](../../Allegro/hardware/allegro-original/Allegro%20v5/Allegro/pstxnet.dat#L334); [hardware/kicad/_build/netmap.json:2](../../hardware/kicad/_build/netmap.json#L2).\n\n### Pin 2 — SWDIO\n\n**Domain:** Target +3V3 logic domain. **Direction:** Bidirectional debugger ↔ MCU.\n\nVerify cable numbering against actual header view before debug attachment.\n\nEvidence: [Allegro/hardware/allegro-original/Allegro v5/Allegro/pstxnet.dat:421](../../Allegro/hardware/allegro-original/Allegro%20v5/Allegro/pstxnet.dat#L421); [Allegro/hardware/allegro-original/Allegro v5/Allegro/pstxnet.dat:418](../../Allegro/hardware/allegro-original/Allegro%20v5/Allegro/pstxnet.dat#L418); [hardware/kicad/_build/netmap.json:27](../../hardware/kicad/_build/netmap.json#L27); [firmware/BoatTHISTIMEITSDIFFERENT.ioc:58](../../firmware/BoatTHISTIMEITSDIFFERENT.ioc#L58).\n\n### Pin 3 — GND\n\n**Domain:** 0 V reference (expected). **Direction:** Reference.\n\nUnpowered continuity to GND1/TP5; resistance/continuity has not been measured.\n\nEvidence: [Allegro/hardware/allegro-original/Allegro v5/Allegro/pstxnet.dat:205](../../Allegro/hardware/allegro-original/Allegro%20v5/Allegro/pstxnet.dat#L205); [Allegro/hardware/allegro-original/Allegro v5/Allegro/pstxnet.dat:169](../../Allegro/hardware/allegro-original/Allegro%20v5/Allegro/pstxnet.dat#L169); [Allegro/hardware/allegro-original/Allegro v5/Allegro/pstxnet.dat:172](../../Allegro/hardware/allegro-original/Allegro%20v5/Allegro/pstxnet.dat#L172); [Allegro/hardware/allegro-original/Allegro v5/Allegro/pstxnet.dat:175](../../Allegro/hardware/allegro-original/Allegro%20v5/Allegro/pstxnet.dat#L175); [Allegro/hardware/allegro-original/Allegro v5/Allegro/pstxnet.dat:178](../../Allegro/hardware/allegro-original/Allegro%20v5/Allegro/pstxnet.dat#L178); [Allegro/hardware/allegro-original/Allegro v5/Allegro/pstxnet.dat:181](../../Allegro/hardware/allegro-original/Allegro%20v5/Allegro/pstxnet.dat#L181); [hardware/kicad/_build/netmap.json:3](../../hardware/kicad/_build/netmap.json#L3).\n\n### Pin 4 — SWCLK\n\n**Domain:** Target +3V3 logic domain. **Direction:** Debugger → MCU.\n\nVerify continuity pin 4 → U3-49; no successful programming session recorded here.\n\nEvidence: [Allegro/hardware/allegro-original/Allegro v5/Allegro/pstxnet.dat:431](../../Allegro/hardware/allegro-original/Allegro%20v5/Allegro/pstxnet.dat#L431); [Allegro/hardware/allegro-original/Allegro v5/Allegro/pstxnet.dat:428](../../Allegro/hardware/allegro-original/Allegro%20v5/Allegro/pstxnet.dat#L428); [hardware/kicad/_build/netmap.json:26](../../hardware/kicad/_build/netmap.json#L26); [firmware/BoatTHISTIMEITSDIFFERENT.ioc:61](../../firmware/BoatTHISTIMEITSDIFFERENT.ioc#L61).\n\n### Pin 5 — GND\n\n**Domain:** 0 V reference (expected). **Direction:** Reference.\n\nUnpowered continuity to GND1/TP5; resistance/continuity has not been measured.\n\nEvidence: [Allegro/hardware/allegro-original/Allegro v5/Allegro/pstxnet.dat:202](../../Allegro/hardware/allegro-original/Allegro%20v5/Allegro/pstxnet.dat#L202); [Allegro/hardware/allegro-original/Allegro v5/Allegro/pstxnet.dat:169](../../Allegro/hardware/allegro-original/Allegro%20v5/Allegro/pstxnet.dat#L169); [Allegro/hardware/allegro-original/Allegro v5/Allegro/pstxnet.dat:172](../../Allegro/hardware/allegro-original/Allegro%20v5/Allegro/pstxnet.dat#L172); [Allegro/hardware/allegro-original/Allegro v5/Allegro/pstxnet.dat:175](../../Allegro/hardware/allegro-original/Allegro%20v5/Allegro/pstxnet.dat#L175); [Allegro/hardware/allegro-original/Allegro v5/Allegro/pstxnet.dat:178](../../Allegro/hardware/allegro-original/Allegro%20v5/Allegro/pstxnet.dat#L178); [Allegro/hardware/allegro-original/Allegro v5/Allegro/pstxnet.dat:181](../../Allegro/hardware/allegro-original/Allegro%20v5/Allegro/pstxnet.dat#L181); [hardware/kicad/_build/netmap.json:3](../../hardware/kicad/_build/netmap.json#L3).\n\n### Pin 6 — SWO_TDO\n\n**Domain:** Target +3V3 logic domain. **Direction:** MCU → debugger.\n\nVerify trace/debug configuration before expecting SWO output.\n\nEvidence: [Allegro/hardware/allegro-original/Allegro v5/Allegro/pstxnet.dat:411](../../Allegro/hardware/allegro-original/Allegro%20v5/Allegro/pstxnet.dat#L411); [Allegro/hardware/allegro-original/Allegro v5/Allegro/pstxnet.dat:408](../../Allegro/hardware/allegro-original/Allegro%20v5/Allegro/pstxnet.dat#L408); [hardware/kicad/_build/netmap.json:28](../../hardware/kicad/_build/netmap.json#L28).\n\n### Pin 7 — NC\n\n**Domain:** No defined voltage. **Direction:** None.\n\nDo not treat NC as a common net; JTAG pin 7 is an individually unconnected pin.\n\nEvidence: [Allegro/hardware/allegro-original/Allegro v5/Allegro/pstxnet.dat:648](../../Allegro/hardware/allegro-original/Allegro%20v5/Allegro/pstxnet.dat#L648).\n\n### Pin 8 — TDI\n\n**Domain:** Target +3V3 logic domain. **Direction:** Debugger → MCU.\n\nConfirm chosen debug mode; SWD normally uses SWDIO/SWCLK instead.\n\nEvidence: [Allegro/hardware/allegro-original/Allegro v5/Allegro/pstxnet.dat:464](../../Allegro/hardware/allegro-original/Allegro%20v5/Allegro/pstxnet.dat#L464); [Allegro/hardware/allegro-original/Allegro v5/Allegro/pstxnet.dat:461](../../Allegro/hardware/allegro-original/Allegro%20v5/Allegro/pstxnet.dat#L461); [hardware/kicad/_build/netmap.json:30](../../hardware/kicad/_build/netmap.json#L30).\n\n### Pin 9 — GND\n\n**Domain:** 0 V reference (expected). **Direction:** Reference.\n\nUnpowered continuity to GND1/TP5; resistance/continuity has not been measured.\n\nEvidence: [Allegro/hardware/allegro-original/Allegro v5/Allegro/pstxnet.dat:199](../../Allegro/hardware/allegro-original/Allegro%20v5/Allegro/pstxnet.dat#L199); [Allegro/hardware/allegro-original/Allegro v5/Allegro/pstxnet.dat:169](../../Allegro/hardware/allegro-original/Allegro%20v5/Allegro/pstxnet.dat#L169); [Allegro/hardware/allegro-original/Allegro v5/Allegro/pstxnet.dat:172](../../Allegro/hardware/allegro-original/Allegro%20v5/Allegro/pstxnet.dat#L172); [Allegro/hardware/allegro-original/Allegro v5/Allegro/pstxnet.dat:175](../../Allegro/hardware/allegro-original/Allegro%20v5/Allegro/pstxnet.dat#L175); [Allegro/hardware/allegro-original/Allegro v5/Allegro/pstxnet.dat:178](../../Allegro/hardware/allegro-original/Allegro%20v5/Allegro/pstxnet.dat#L178); [Allegro/hardware/allegro-original/Allegro v5/Allegro/pstxnet.dat:181](../../Allegro/hardware/allegro-original/Allegro%20v5/Allegro/pstxnet.dat#L181); [hardware/kicad/_build/netmap.json:3](../../hardware/kicad/_build/netmap.json#L3).\n\n### Pin 10 — NRST\n\n**Domain:** Reset domain; pull-up and waveform unmeasured. **Direction:** Debugger → MCU reset.\n\nVerify reset pull network and observe reset release waveform.\n\nEvidence: [Allegro/hardware/allegro-original/Allegro v5/Allegro/pstxnet.dat:474](../../Allegro/hardware/allegro-original/Allegro%20v5/Allegro/pstxnet.dat#L474); [Allegro/hardware/allegro-original/Allegro v5/Allegro/pstxnet.dat:471](../../Allegro/hardware/allegro-original/Allegro%20v5/Allegro/pstxnet.dat#L471); [hardware/kicad/_build/netmap.json:23](../../hardware/kicad/_build/netmap.json#L23).\n\n[Atlas index and snapshot provenance](README.md) · [Schematic PDF](../img/v1_schematic.pdf) · [PCB top](../img/v1_pcb_top.png) · [PCB bottom](../img/v1_pcb_bottom.png)\n"},{"path":"docs/atlas/LORAMODULE.md","title":"LoRa module","text":"# LoRa module\n\nFive-pin serial radio interface; the BOM identifies the socket, not the fitted radio module.\n\nAllegro reference **LORAMODULE** → KiCad reference **LORAMODULE1**.\n\nBOM: PPTC051LFBN-RC; MPN `PPTC051LFBN-RC`; Sullins Connector Solutions; confidence: HIGH.\nFootprint: `LoRa_Boat_Controller:CONN5_1LFBN-RC_SUL`. [Full BOM](../BOM.csv).\n\n## Read before wiring\n\n- Electrical pin numbers below come from v5 pstxnet.dat, not a physical left-to-right view. Board side, connector key, cable view, and pin-1 marking require physical verification. All voltages and waveforms are design/code expectations, not bench measurements.\n- Installed RYLR model remains unconfirmed. Capture identification and accepted AT settings before using performance estimates.\n- No LoRa reset GPIO setup appears in the current source. Legacy command reception has no link-loss timeout.\n\n## Electrical pin map\n\n| Pin | Readable net | Allegro net | MCU | Firmware role |\n|---|---|---|---|---|\n| 1 | LORA_VCC | N04429 | No direct MCU pin | LoRa supply through L3 |\n| 2 | LORA_TX_PA0 | N04477 | U3-14 PA0 | UART4 TX; AT commands at 115200 baud, 8N1 |\n| 3 | LORA_RX_PA1 | N04485 | U3-15 PA1 | UART4 RX; +RCV line parser |\n| 4 | LORA_RST_PA3 | N24517 | U3-17 PA3 | Wired to PA3; no PA3 reset GPIO configuration in this firmware snapshot |\n| 5 | GND | 0 | U3-18 VSS; U3-31 VSS_2; U3-47 VSS_3; U3-63 VSS_4; U3-12 VSSA/VREF- | Common reference |\n\n## Verification targets — not measured results\n\n### Pin 1 — LORA_VCC\n\n**Domain:** Derived from +3V3; actual voltage unmeasured. **Direction:** Board → module supply.\n\nUnpowered continuity through L3 to +3V3; identify module before powering.\n\nEvidence: [Allegro/hardware/allegro-original/Allegro v5/Allegro/pstxnet.dat:27](../../Allegro/hardware/allegro-original/Allegro%20v5/Allegro/pstxnet.dat#L27); [hardware/kicad/_build/netmap.json:22](../../hardware/kicad/_build/netmap.json#L22).\n\n### Pin 2 — LORA_TX_PA0\n\n**Domain:** 3.3 V logic domain; module tolerance unverified. **Direction:** MCU → LoRa RX.\n\nLogic analyzer: expect AT commands at startup. Read module replies to establish accepted settings.\n\nEvidence: [Allegro/hardware/allegro-original/Allegro v5/Allegro/pstxnet.dat:96](../../Allegro/hardware/allegro-original/Allegro%20v5/Allegro/pstxnet.dat#L96); [Allegro/hardware/allegro-original/Allegro v5/Allegro/pstxnet.dat:99](../../Allegro/hardware/allegro-original/Allegro%20v5/Allegro/pstxnet.dat#L99); [hardware/kicad/_build/netmap.json:21](../../hardware/kicad/_build/netmap.json#L21); [firmware/Core/Src/main.c:639](../../firmware/Core/Src/main.c#L639); [firmware/Core/Src/stm32f4xx_hal_msp.c:213](../../firmware/Core/Src/stm32f4xx_hal_msp.c#L213).\n\n### Pin 3 — LORA_RX_PA1\n\n**Domain:** Module TX level must be verified. **Direction:** LoRa TX → MCU.\n\nCapture startup replies and +RCV traffic at 115200 baud, 8N1; no capture exists in this atlas.\n\nEvidence: [Allegro/hardware/allegro-original/Allegro v5/Allegro/pstxnet.dat:17](../../Allegro/hardware/allegro-original/Allegro%20v5/Allegro/pstxnet.dat#L17); [Allegro/hardware/allegro-original/Allegro v5/Allegro/pstxnet.dat:20](../../Allegro/hardware/allegro-original/Allegro%20v5/Allegro/pstxnet.dat#L20); [hardware/kicad/_build/netmap.json:20](../../hardware/kicad/_build/netmap.json#L20); [firmware/Core/Src/main.c:639](../../firmware/Core/Src/main.c#L639); [firmware/Core/Src/main.c:294](../../firmware/Core/Src/main.c#L294); [firmware/Core/Src/stm32f4xx_hal_msp.c:214](../../firmware/Core/Src/stm32f4xx_hal_msp.c#L214).\n\n### Pin 4 — LORA_RST_PA3\n\n**Domain:** Reset polarity/level needs module identification. **Direction:** Intended MCU → module reset; unconfigured.\n\nConfirm module reset pin and pull network; do not assume this firmware can reset the radio.\n\nEvidence: [Allegro/hardware/allegro-original/Allegro v5/Allegro/pstxnet.dat:375](../../Allegro/hardware/allegro-original/Allegro%20v5/Allegro/pstxnet.dat#L375); [Allegro/hardware/allegro-original/Allegro v5/Allegro/pstxnet.dat:378](../../Allegro/hardware/allegro-original/Allegro%20v5/Allegro/pstxnet.dat#L378); [hardware/kicad/_build/netmap.json:19](../../hardware/kicad/_build/netmap.json#L19); [firmware/Core/Src/main.c:678](../../firmware/Core/Src/main.c#L678).\n\n### Pin 5 — GND\n\n**Domain:** 0 V reference (expected). **Direction:** Reference.\n\nUnpowered continuity to GND1/TP5; resistance/continuity has not been measured.\n\nEvidence: [Allegro/hardware/allegro-original/Allegro v5/Allegro/pstxnet.dat:124](../../Allegro/hardware/allegro-original/Allegro%20v5/Allegro/pstxnet.dat#L124); [Allegro/hardware/allegro-original/Allegro v5/Allegro/pstxnet.dat:169](../../Allegro/hardware/allegro-original/Allegro%20v5/Allegro/pstxnet.dat#L169); [Allegro/hardware/allegro-original/Allegro v5/Allegro/pstxnet.dat:172](../../Allegro/hardware/allegro-original/Allegro%20v5/Allegro/pstxnet.dat#L172); [Allegro/hardware/allegro-original/Allegro v5/Allegro/pstxnet.dat:175](../../Allegro/hardware/allegro-original/Allegro%20v5/Allegro/pstxnet.dat#L175); [Allegro/hardware/allegro-original/Allegro v5/Allegro/pstxnet.dat:178](../../Allegro/hardware/allegro-original/Allegro%20v5/Allegro/pstxnet.dat#L178); [Allegro/hardware/allegro-original/Allegro v5/Allegro/pstxnet.dat:181](../../Allegro/hardware/allegro-original/Allegro%20v5/Allegro/pstxnet.dat#L181); [hardware/kicad/_build/netmap.json:3](../../hardware/kicad/_build/netmap.json#L3).\n\n[Atlas index and snapshot provenance](README.md) · [Schematic PDF](../img/v1_schematic.pdf) · [PCB top](../img/v1_pcb_top.png) · [PCB bottom](../img/v1_pcb_bottom.png)\n"},{"path":"docs/atlas/README.md","title":"V1 connector atlas","text":"# V1 connector atlas\n\nThis atlas connects the authoritative v5 electrical netlist to the current KiCad reference names, BOM, and firmware. It is a wiring/review aid for the faithful V1 reconstruction, not a corrected V2 hardware release or a bench sign-off.\n\nElectrical pin numbers below come from v5 pstxnet.dat, not a physical left-to-right view. Board side, connector key, cable view, and pin-1 marking require physical verification. All voltages and waveforms are design/code expectations, not bench measurements.\n\n## Navigate\n\n| Connector / test point | Allegro reference | KiCad reference | Pins |\n|---|---|---|---|\n| [LoRa module](LORAMODULE.md) | LORAMODULE | LORAMODULE1 | 5 |\n| [GPS module](GPSMODULE.md) | GPSMODULE | GPSMODULE1 | 5 |\n| [SPEEDCONTROLLER header / firmware rudder](SPEEDCONTROLLER.md) | SPEEDCONTROLLER | SPEEDCONTROLLER1 | 3 |\n| [STEERINGSERVO header / firmware thrust](STEERINGSERVO.md) | STEERINGSERVO | STEERINGSERVO1 | 3 |\n| [CAN bus](CANHEADER.md) | CANHEADER | CANHEADER1 | 4 |\n| [Debug / JTAG](JTAG.md) | JTAG | JTAG1 | 10 |\n| [Battery positive](VIN.md) | VIN | VIN1 | 1 |\n| [Battery ground](GND.md) | GND | GND1 | 1 |\n| [TP1 — PA8 PWM](TP1.md) | TP1 | TP1 | 1 |\n| [TP3 — PC6 PWM](TP3.md) | TP3 | TP3 | 1 |\n| [TP4 — +3V3](TP4.md) | TP4 | TP4 | 1 |\n| [TP5 — ground](TP5.md) | TP5 | TP5 | 1 |\n\n[Full BOM](../BOM.csv) · [Schematic PDF](../img/v1_schematic.pdf) · [PCB top](../img/v1_pcb_top.png) · [PCB bottom](../img/v1_pcb_bottom.png) · [Viewer JSON](../../pm/data/connectors.json)\n\n## Known V1 issues that affect connection decisions\n\n- **Actuator mapping:** V1 connector names conflict with firmware roles: SPEEDCONTROLLER pin 2 carries the firmware rudder waveform; STEERINGSERVO pin 2 carries the firmware thrust waveform. Treat both as electrical identities until harness labels and physical continuity are verified. Evidence: [firmware/Core/Src/main.c:15](../../firmware/Core/Src/main.c#L15); both PWM connector tables provide pin-level source links.\n- **Link loss:** reviewed C has one HAL_GetTick use, for outgoing telemetry; its main loop has no command-age timeout. Last actuator command is retained. Evidence: [firmware/Core/Src/main.c:487](../../firmware/Core/Src/main.c#L487); [firmware/Core/Src/main.c:384](../../firmware/Core/Src/main.c#L384).\n- **Regeneration hazard:** C initializes TIM3 at 1000 us; CubeMX stores 1500 us. Evidence: [firmware/Core/Src/main.c:621](../../firmware/Core/Src/main.c#L621); [firmware/BoatTHISTIMEITSDIFFERENT.ioc:150](../../firmware/BoatTHISTIMEITSDIFFERENT.ioc#L150).\n- **GPS pin 3:** PB0 is driven LOW; its attached module function is unidentified. Debug text also uses GPS TX. Evidence: [firmware/Core/Src/main.c:688](../../firmware/Core/Src/main.c#L688); [firmware/Core/Src/main.c:171](../../firmware/Core/Src/main.c#L171).\n- **CAN routing:** U5 RXD connects to PA10, which lacks a CAN alternate function; STB connects to PA11. The TCAN1042H requires 4.5–5.5 V on CAN_VCC. Source evidence: [Allegro/hardware/allegro-original/Allegro v5/Allegro/pstxnet.dat:59](../../Allegro/hardware/allegro-original/Allegro%20v5/Allegro/pstxnet.dat#L59); [Allegro/hardware/allegro-original/Allegro v5/Allegro/pstxnet.dat:89](../../Allegro/hardware/allegro-original/Allegro%20v5/Allegro/pstxnet.dat#L89); [ST pin/alternate-function tables](https://www.st.com/resource/en/datasheet/stm32f446re.pdf); [TI pin table and operating conditions](https://www.ti.com/lit/ds/symlink/tcan1042h-q1.pdf). No operational CAN stack is present in this firmware snapshot.\n- **Power and boot:** CEXT connects VCAP1 to the +3V3 net, not ground. BOOT0 is listed NC; VBAT is a singleton. These source facts need an electrical correction decision before treating a reconstructed board as ready to power. Evidence: [Allegro/hardware/allegro-original/Allegro v5/Allegro/pstxnet.dat:337](../../Allegro/hardware/allegro-original/Allegro%20v5/Allegro/pstxnet.dat#L337); [Allegro/hardware/allegro-original/Allegro v5/Allegro/pstxnet.dat:365](../../Allegro/hardware/allegro-original/Allegro%20v5/Allegro/pstxnet.dat#L365); [Allegro/hardware/allegro-original/Allegro v5/Allegro/pstxnet.dat:642](../../Allegro/hardware/allegro-original/Allegro%20v5/Allegro/pstxnet.dat#L642); [Allegro/hardware/allegro-original/Allegro v5/Allegro/pstxnet.dat:478](../../Allegro/hardware/allegro-original/Allegro%20v5/Allegro/pstxnet.dat#L478); [ST MCU supply requirements](https://www.st.com/resource/en/datasheet/stm32f446re.pdf).\n- **External power:** ESC and servo header pin 1 are both on +3V3. Exact loads, BEC wiring, regulator thermal margin, and connector orientation are not verified by this atlas.\n- **Historical tables:** older DSN-derived documentation contained incorrect V5 CAN/debug pin tables and TP2. This atlas extracts v5 directly; docs/NETLIST.md is maintained separately by the primary agent and is not an input. TP2 is absent from both v5 source and the current BOM.\n\n## Reproduce and refresh\n\nRun `python docs/atlas/generate_atlas.py` from the repository (or use the installed KiCad Python executable). Run with `--check` to compare outputs with the same source snapshot without writing. Only Python's standard library is required.\n\nThe generator parses every v5 net/node, preserves Allegro reference and raw pin identifiers, maps readable nets using the current KiCad netmap, obtains KiCad references from the BOM, and compares each connected atlas pin's entire source net membership with the exported KiCad XML. NC is never treated as an electrical net. Reviewed firmware assertions cause generation to stop if key behavior changes. Full source SHA-256 hashes and byte sizes are stored in the JSON; inputs are rehashed before outputs are written to detect concurrent edits.\n\nA successful atlas check proves repeatable extraction and agreement with that exported XML snapshot. It does not independently validate the current CAD copper, a stale XML export, a physical board, firmware build/flash results, or external harnesses. Root S2 validation owns CAD equivalence checks. Manufacturer links were checked on 2026-09-17; local datasheet research remains a separately authored review input.\n\nBefore adaptation: identify fitted radio/GPS and actuator hardware, resolve the power/boot/CAN defects, label the actual harness, scope unloaded PWM, add/test command failsafe, then perform documented bench bring-up. Voice, text, and location handheld requirements are a future platform requirement, not implemented on these connectors.\n\n## Input snapshot\n\n| Input | SHA-256 |\n|---|---|\n| [Allegro/hardware/allegro-original/Allegro v5/Allegro/pstxnet.dat](../../Allegro/hardware/allegro-original/Allegro%20v5/Allegro/pstxnet.dat) | `b88c36244bb3e3eb4d10712ce8ca39ddb5908e2c3225aa187155f9f4dca6b02c` |\n| [hardware/kicad/_build/netmap.json](../../hardware/kicad/_build/netmap.json) | `b9f5502f8c0e06aab989e1558b25aba334c8a6395102dbcc328f358ce43b54e9` |\n| [docs/BOM.csv](../../docs/BOM.csv) | `71f589596007465f98d433cfb7af735b766a5905f74390a73a25d3e1aa0b3efb` |\n| [hardware/kicad/_build/netlist.xml](../../hardware/kicad/_build/netlist.xml) | `d16588c8f579a2a2324b6d6d940b7e0dc2e861f66a75ea191dab4e3c3811a68a` |\n| [firmware/Core/Src/main.c](../../firmware/Core/Src/main.c) | `088bc6e61b8865e1bbf5c8a585cb8524134d418db22926f306627440957d495a` |\n| [firmware/Core/Src/stm32f4xx_hal_msp.c](../../firmware/Core/Src/stm32f4xx_hal_msp.c) | `180c6eefe84d1e58d7f01f635faad358ccc64a3848e0ff2e3f9d700e2d45a1c0` |\n| [firmware/BoatTHISTIMEITSDIFFERENT.ioc](../../firmware/BoatTHISTIMEITSDIFFERENT.ioc) | `eb9df4055fe4f072996c6a92f7b4fc9039c39f28451d9eefeb3bc702370a0579` |\n| [docs/research/DATASHEET_NOTES.md](../../docs/research/DATASHEET_NOTES.md) | `b5171f1d3963c6c293c95935485ca9cab86cb0385e6a2174726a99ca3bb73a3d` |\n| [docs/atlas/generate_atlas.py](../../docs/atlas/generate_atlas.py) | `204e288f63b04842134921c2678ec6a840aa302536f923cc30adfa96d5a36a77` |\n"},{"path":"docs/atlas/SPEEDCONTROLLER.md","title":"SPEEDCONTROLLER header / firmware rudder","text":"# SPEEDCONTROLLER header / firmware rudder\n\nSource-named ESC header carries PA8/TIM1, currently assigned to rudder in firmware.\n\nAllegro reference **SPEEDCONTROLLER** → KiCad reference **SPEEDCONTROLLER1**.\n\nBOM: PPTC031LFBN-RC; MPN `PPTC031LFBN-RC`; Sullins Connector Solutions; confidence: HIGH.\nFootprint: `LoRa_Boat_Controller:CONN_PPTC031_SUL`. [Full BOM](../BOM.csv).\n\n## Read before wiring\n\n- Electrical pin numbers below come from v5 pstxnet.dat, not a physical left-to-right view. Board side, connector key, cable view, and pin-1 marking require physical verification. All voltages and waveforms are design/code expectations, not bench measurements.\n- V1 connector names conflict with firmware roles: SPEEDCONTROLLER pin 2 carries the firmware rudder waveform; STEERINGSERVO pin 2 carries the firmware thrust waveform. Treat both as electrical identities until harness labels and physical continuity are verified.\n- Pin 1 is on the board +3V3 rail. ESC/BEC/servo external power compatibility and current budget are unverified; this is not a certified actuator power port.\n- No link-loss failsafe exists in the reviewed C main loop; last command persists.\n\n## Electrical pin map\n\n| Pin | Readable net | Allegro net | MCU | Firmware role |\n|---|---|---|---|---|\n| 1 | +3V3 | 3.3V | U3-19 VDD; U3-32 VDD_2; U3-48 VDD_3; U3-64 VDD_4; U3-13 VDDA/VREF+ | Board supply / debug voltage reference |\n| 2 | PWM_PA8_ESCHDR | N04355 | U3-41 PA8 | TIM1_CH1 / set_rudder(): 1100–1900 us; startup 1500 us |\n| 3 | GND | 0 | U3-18 VSS; U3-31 VSS_2; U3-47 VSS_3; U3-63 VSS_4; U3-12 VSSA/VREF- | Common reference |\n\n## Verification targets — not measured results\n\n### Pin 1 — +3V3\n\n**Domain:** 3.3 V nominal (unmeasured). **Direction:** Board rail; external powering unsupported until reviewed.\n\nMeasure rail relative to TP5 with loads disconnected after V1 power defects are reviewed.\n\nEvidence: [Allegro/hardware/allegro-original/Allegro v5/Allegro/pstxnet.dat:295](../../Allegro/hardware/allegro-original/Allegro%20v5/Allegro/pstxnet.dat#L295); [Allegro/hardware/allegro-original/Allegro v5/Allegro/pstxnet.dat:322](../../Allegro/hardware/allegro-original/Allegro%20v5/Allegro/pstxnet.dat#L322); [Allegro/hardware/allegro-original/Allegro v5/Allegro/pstxnet.dat:325](../../Allegro/hardware/allegro-original/Allegro%20v5/Allegro/pstxnet.dat#L325); [Allegro/hardware/allegro-original/Allegro v5/Allegro/pstxnet.dat:328](../../Allegro/hardware/allegro-original/Allegro%20v5/Allegro/pstxnet.dat#L328); [Allegro/hardware/allegro-original/Allegro v5/Allegro/pstxnet.dat:331](../../Allegro/hardware/allegro-original/Allegro%20v5/Allegro/pstxnet.dat#L331); [Allegro/hardware/allegro-original/Allegro v5/Allegro/pstxnet.dat:334](../../Allegro/hardware/allegro-original/Allegro%20v5/Allegro/pstxnet.dat#L334); [hardware/kicad/_build/netmap.json:2](../../hardware/kicad/_build/netmap.json#L2).\n\n### Pin 2 — PWM_PA8_ESCHDR\n\n**Domain:** 3.3 V logic; load compatibility unverified. **Direction:** MCU → header / TP1.\n\nExpected 50 Hz, 1500 us after startup; source name says ESC but firmware role is rudder. Scope with actuators disconnected.\n\nEvidence: [Allegro/hardware/allegro-original/Allegro v5/Allegro/pstxnet.dat:238](../../Allegro/hardware/allegro-original/Allegro%20v5/Allegro/pstxnet.dat#L238); [Allegro/hardware/allegro-original/Allegro v5/Allegro/pstxnet.dat:244](../../Allegro/hardware/allegro-original/Allegro%20v5/Allegro/pstxnet.dat#L244); [hardware/kicad/_build/netmap.json:24](../../hardware/kicad/_build/netmap.json#L24); [firmware/Core/Src/main.c:407](../../firmware/Core/Src/main.c#L407); [firmware/Core/Src/stm32f4xx_hal_msp.c:125](../../firmware/Core/Src/stm32f4xx_hal_msp.c#L125); [firmware/Core/Src/main.c:570](../../firmware/Core/Src/main.c#L570).\n\n### Pin 3 — GND\n\n**Domain:** 0 V reference (expected). **Direction:** Reference.\n\nUnpowered continuity to GND1/TP5; resistance/continuity has not been measured.\n\nEvidence: [Allegro/hardware/allegro-original/Allegro v5/Allegro/pstxnet.dat:115](../../Allegro/hardware/allegro-original/Allegro%20v5/Allegro/pstxnet.dat#L115); [Allegro/hardware/allegro-original/Allegro v5/Allegro/pstxnet.dat:169](../../Allegro/hardware/allegro-original/Allegro%20v5/Allegro/pstxnet.dat#L169); [Allegro/hardware/allegro-original/Allegro v5/Allegro/pstxnet.dat:172](../../Allegro/hardware/allegro-original/Allegro%20v5/Allegro/pstxnet.dat#L172); [Allegro/hardware/allegro-original/Allegro v5/Allegro/pstxnet.dat:175](../../Allegro/hardware/allegro-original/Allegro%20v5/Allegro/pstxnet.dat#L175); [Allegro/hardware/allegro-original/Allegro v5/Allegro/pstxnet.dat:178](../../Allegro/hardware/allegro-original/Allegro%20v5/Allegro/pstxnet.dat#L178); [Allegro/hardware/allegro-original/Allegro v5/Allegro/pstxnet.dat:181](../../Allegro/hardware/allegro-original/Allegro%20v5/Allegro/pstxnet.dat#L181); [hardware/kicad/_build/netmap.json:3](../../hardware/kicad/_build/netmap.json#L3).\n\n[Atlas index and snapshot provenance](README.md) · [Schematic PDF](../img/v1_schematic.pdf) · [PCB top](../img/v1_pcb_top.png) · [PCB bottom](../img/v1_pcb_bottom.png)\n"},{"path":"docs/atlas/STEERINGSERVO.md","title":"STEERINGSERVO header / firmware thrust","text":"# STEERINGSERVO header / firmware thrust\n\nSource-named servo header carries PC6/TIM3, currently assigned to thrust in firmware.\n\nAllegro reference **STEERINGSERVO** → KiCad reference **STEERINGSERVO1**.\n\nBOM: PPTC031LFBN-RC; MPN `PPTC031LFBN-RC`; Sullins Connector Solutions; confidence: HIGH.\nFootprint: `LoRa_Boat_Controller:CONN_PPTC031_SUL`. [Full BOM](../BOM.csv).\n\n## Read before wiring\n\n- Electrical pin numbers below come from v5 pstxnet.dat, not a physical left-to-right view. Board side, connector key, cable view, and pin-1 marking require physical verification. All voltages and waveforms are design/code expectations, not bench measurements.\n- V1 connector names conflict with firmware roles: SPEEDCONTROLLER pin 2 carries the firmware rudder waveform; STEERINGSERVO pin 2 carries the firmware thrust waveform. Treat both as electrical identities until harness labels and physical continuity are verified.\n- Pin 1 is on the board +3V3 rail. ESC/BEC/servo external power compatibility and current budget are unverified; this is not a certified actuator power port.\n- TIM3 startup differs: current C requests 1000 us, .ioc requests 1500 us. Regeneration needs review.\n\n## Electrical pin map\n\n| Pin | Readable net | Allegro net | MCU | Firmware role |\n|---|---|---|---|---|\n| 1 | +3V3 | 3.3V | U3-19 VDD; U3-32 VDD_2; U3-48 VDD_3; U3-64 VDD_4; U3-13 VDDA/VREF+ | Board supply / debug voltage reference |\n| 2 | PWM_PC6_SERVOHDR | N04395 | U3-37 PC6 | TIM3_CH1 / set_thrust(): 1000–2000 us; C startup 1000 us |\n| 3 | GND | 0 | U3-18 VSS; U3-31 VSS_2; U3-47 VSS_3; U3-63 VSS_4; U3-12 VSSA/VREF- | Common reference |\n\n## Verification targets — not measured results\n\n### Pin 1 — +3V3\n\n**Domain:** 3.3 V nominal (unmeasured). **Direction:** Board rail; external powering unsupported until reviewed.\n\nMeasure rail relative to TP5 with loads disconnected after V1 power defects are reviewed.\n\nEvidence: [Allegro/hardware/allegro-original/Allegro v5/Allegro/pstxnet.dat:292](../../Allegro/hardware/allegro-original/Allegro%20v5/Allegro/pstxnet.dat#L292); [Allegro/hardware/allegro-original/Allegro v5/Allegro/pstxnet.dat:322](../../Allegro/hardware/allegro-original/Allegro%20v5/Allegro/pstxnet.dat#L322); [Allegro/hardware/allegro-original/Allegro v5/Allegro/pstxnet.dat:325](../../Allegro/hardware/allegro-original/Allegro%20v5/Allegro/pstxnet.dat#L325); [Allegro/hardware/allegro-original/Allegro v5/Allegro/pstxnet.dat:328](../../Allegro/hardware/allegro-original/Allegro%20v5/Allegro/pstxnet.dat#L328); [Allegro/hardware/allegro-original/Allegro v5/Allegro/pstxnet.dat:331](../../Allegro/hardware/allegro-original/Allegro%20v5/Allegro/pstxnet.dat#L331); [Allegro/hardware/allegro-original/Allegro v5/Allegro/pstxnet.dat:334](../../Allegro/hardware/allegro-original/Allegro%20v5/Allegro/pstxnet.dat#L334); [hardware/kicad/_build/netmap.json:2](../../hardware/kicad/_build/netmap.json#L2).\n\n### Pin 2 — PWM_PC6_SERVOHDR\n\n**Domain:** 3.3 V logic; load compatibility unverified. **Direction:** MCU → header / TP3.\n\nExpected 50 Hz, 1000 us after C startup. CubeMX .ioc instead specifies 1500 us. Scope with actuators disconnected.\n\nEvidence: [Allegro/hardware/allegro-original/Allegro v5/Allegro/pstxnet.dat:273](../../Allegro/hardware/allegro-original/Allegro%20v5/Allegro/pstxnet.dat#L273); [Allegro/hardware/allegro-original/Allegro v5/Allegro/pstxnet.dat:276](../../Allegro/hardware/allegro-original/Allegro%20v5/Allegro/pstxnet.dat#L276); [hardware/kicad/_build/netmap.json:25](../../hardware/kicad/_build/netmap.json#L25); [firmware/Core/Src/main.c:391](../../firmware/Core/Src/main.c#L391); [firmware/Core/Src/stm32f4xx_hal_msp.c:146](../../firmware/Core/Src/stm32f4xx_hal_msp.c#L146); [firmware/Core/Src/main.c:621](../../firmware/Core/Src/main.c#L621); [firmware/BoatTHISTIMEITSDIFFERENT.ioc:150](../../firmware/BoatTHISTIMEITSDIFFERENT.ioc#L150).\n\n### Pin 3 — GND\n\n**Domain:** 0 V reference (expected). **Direction:** Reference.\n\nUnpowered continuity to GND1/TP5; resistance/continuity has not been measured.\n\nEvidence: [Allegro/hardware/allegro-original/Allegro v5/Allegro/pstxnet.dat:121](../../Allegro/hardware/allegro-original/Allegro%20v5/Allegro/pstxnet.dat#L121); [Allegro/hardware/allegro-original/Allegro v5/Allegro/pstxnet.dat:169](../../Allegro/hardware/allegro-original/Allegro%20v5/Allegro/pstxnet.dat#L169); [Allegro/hardware/allegro-original/Allegro v5/Allegro/pstxnet.dat:172](../../Allegro/hardware/allegro-original/Allegro%20v5/Allegro/pstxnet.dat#L172); [Allegro/hardware/allegro-original/Allegro v5/Allegro/pstxnet.dat:175](../../Allegro/hardware/allegro-original/Allegro%20v5/Allegro/pstxnet.dat#L175); [Allegro/hardware/allegro-original/Allegro v5/Allegro/pstxnet.dat:178](../../Allegro/hardware/allegro-original/Allegro%20v5/Allegro/pstxnet.dat#L178); [Allegro/hardware/allegro-original/Allegro v5/Allegro/pstxnet.dat:181](../../Allegro/hardware/allegro-original/Allegro%20v5/Allegro/pstxnet.dat#L181); [hardware/kicad/_build/netmap.json:3](../../hardware/kicad/_build/netmap.json#L3).\n\n[Atlas index and snapshot provenance](README.md) · [Schematic PDF](../img/v1_schematic.pdf) · [PCB top](../img/v1_pcb_top.png) · [PCB bottom](../img/v1_pcb_bottom.png)\n"},{"path":"docs/atlas/TP1.md","title":"TP1 — PA8 PWM","text":"# TP1 — PA8 PWM\n\nTest point on the source ESC header signal, currently firmware rudder output.\n\nAllegro reference **TP1** → KiCad reference **TP1**.\n\nBOM: TP; MPN `not applicable (bare pad)`; no purchased component; confidence: TBD.\nFootprint: `LoRa_Boat_Controller:amv_test_point`. [Full BOM](../BOM.csv).\n\n## Read before wiring\n\n- Electrical pin numbers below come from v5 pstxnet.dat, not a physical left-to-right view. Board side, connector key, cable view, and pin-1 marking require physical verification. All voltages and waveforms are design/code expectations, not bench measurements.\n- V1 connector names conflict with firmware roles: SPEEDCONTROLLER pin 2 carries the firmware rudder waveform; STEERINGSERVO pin 2 carries the firmware thrust waveform. Treat both as electrical identities until harness labels and physical continuity are verified.\n\n## Electrical pin map\n\n| Pin | Readable net | Allegro net | MCU | Firmware role |\n|---|---|---|---|---|\n| 1 | PWM_PA8_ESCHDR | N04355 | U3-41 PA8 | TIM1_CH1 / set_rudder(): 1100–1900 us; startup 1500 us |\n\n## Verification targets — not measured results\n\n### Pin 1 — PWM_PA8_ESCHDR\n\n**Domain:** 3.3 V logic; load compatibility unverified. **Direction:** MCU → header / TP1.\n\nExpected 50 Hz, 1500 us after startup; source name says ESC but firmware role is rudder. Scope with actuators disconnected.\n\nEvidence: [Allegro/hardware/allegro-original/Allegro v5/Allegro/pstxnet.dat:241](../../Allegro/hardware/allegro-original/Allegro%20v5/Allegro/pstxnet.dat#L241); [Allegro/hardware/allegro-original/Allegro v5/Allegro/pstxnet.dat:244](../../Allegro/hardware/allegro-original/Allegro%20v5/Allegro/pstxnet.dat#L244); [hardware/kicad/_build/netmap.json:24](../../hardware/kicad/_build/netmap.json#L24); [firmware/Core/Src/main.c:407](../../firmware/Core/Src/main.c#L407); [firmware/Core/Src/stm32f4xx_hal_msp.c:125](../../firmware/Core/Src/stm32f4xx_hal_msp.c#L125); [firmware/Core/Src/main.c:570](../../firmware/Core/Src/main.c#L570).\n\n[Atlas index and snapshot provenance](README.md) · [Schematic PDF](../img/v1_schematic.pdf) · [PCB top](../img/v1_pcb_top.png) · [PCB bottom](../img/v1_pcb_bottom.png)\n"},{"path":"docs/atlas/TP3.md","title":"TP3 — PC6 PWM","text":"# TP3 — PC6 PWM\n\nTest point on the source servo header signal, currently firmware thrust output.\n\nAllegro reference **TP3** → KiCad reference **TP3**.\n\nBOM: TP; MPN `not applicable (bare pad)`; no purchased component; confidence: TBD.\nFootprint: `LoRa_Boat_Controller:amv_test_point`. [Full BOM](../BOM.csv).\n\n## Read before wiring\n\n- Electrical pin numbers below come from v5 pstxnet.dat, not a physical left-to-right view. Board side, connector key, cable view, and pin-1 marking require physical verification. All voltages and waveforms are design/code expectations, not bench measurements.\n- V1 connector names conflict with firmware roles: SPEEDCONTROLLER pin 2 carries the firmware rudder waveform; STEERINGSERVO pin 2 carries the firmware thrust waveform. Treat both as electrical identities until harness labels and physical continuity are verified.\n\n## Electrical pin map\n\n| Pin | Readable net | Allegro net | MCU | Firmware role |\n|---|---|---|---|---|\n| 1 | PWM_PC6_SERVOHDR | N04395 | U3-37 PC6 | TIM3_CH1 / set_thrust(): 1000–2000 us; C startup 1000 us |\n\n## Verification targets — not measured results\n\n### Pin 1 — PWM_PC6_SERVOHDR\n\n**Domain:** 3.3 V logic; load compatibility unverified. **Direction:** MCU → header / TP3.\n\nExpected 50 Hz, 1000 us after C startup. CubeMX .ioc instead specifies 1500 us. Scope with actuators disconnected.\n\nEvidence: [Allegro/hardware/allegro-original/Allegro v5/Allegro/pstxnet.dat:270](../../Allegro/hardware/allegro-original/Allegro%20v5/Allegro/pstxnet.dat#L270); [Allegro/hardware/allegro-original/Allegro v5/Allegro/pstxnet.dat:276](../../Allegro/hardware/allegro-original/Allegro%20v5/Allegro/pstxnet.dat#L276); [hardware/kicad/_build/netmap.json:25](../../hardware/kicad/_build/netmap.json#L25); [firmware/Core/Src/main.c:391](../../firmware/Core/Src/main.c#L391); [firmware/Core/Src/stm32f4xx_hal_msp.c:146](../../firmware/Core/Src/stm32f4xx_hal_msp.c#L146); [firmware/Core/Src/main.c:621](../../firmware/Core/Src/main.c#L621); [firmware/BoatTHISTIMEITSDIFFERENT.ioc:150](../../firmware/BoatTHISTIMEITSDIFFERENT.ioc#L150).\n\n[Atlas index and snapshot provenance](README.md) · [Schematic PDF](../img/v1_schematic.pdf) · [PCB top](../img/v1_pcb_top.png) · [PCB bottom](../img/v1_pcb_bottom.png)\n"},{"path":"docs/atlas/TP4.md","title":"TP4 — +3V3","text":"# TP4 — +3V3\n\nTest point on the main 3.3 V rail.\n\nAllegro reference **TP4** → KiCad reference **TP4**.\n\nBOM: TP; MPN `not applicable (bare pad)`; no purchased component; confidence: TBD.\nFootprint: `LoRa_Boat_Controller:amv_test_point`. [Full BOM](../BOM.csv).\n\n## Read before wiring\n\n- Electrical pin numbers below come from v5 pstxnet.dat, not a physical left-to-right view. Board side, connector key, cable view, and pin-1 marking require physical verification. All voltages and waveforms are design/code expectations, not bench measurements.\n- Use TP5 as the source-defined reference. Bench rail tolerance/ripple has not been measured.\n\n## Electrical pin map\n\n| Pin | Readable net | Allegro net | MCU | Firmware role |\n|---|---|---|---|---|\n| 1 | +3V3 | 3.3V | U3-19 VDD; U3-32 VDD_2; U3-48 VDD_3; U3-64 VDD_4; U3-13 VDDA/VREF+ | Board supply / debug voltage reference |\n\n## Verification targets — not measured results\n\n### Pin 1 — +3V3\n\n**Domain:** 3.3 V nominal (unmeasured). **Direction:** Board rail; external powering unsupported until reviewed.\n\nMeasure rail relative to TP5 with loads disconnected after V1 power defects are reviewed.\n\nEvidence: [Allegro/hardware/allegro-original/Allegro v5/Allegro/pstxnet.dat:313](../../Allegro/hardware/allegro-original/Allegro%20v5/Allegro/pstxnet.dat#L313); [Allegro/hardware/allegro-original/Allegro v5/Allegro/pstxnet.dat:322](../../Allegro/hardware/allegro-original/Allegro%20v5/Allegro/pstxnet.dat#L322); [Allegro/hardware/allegro-original/Allegro v5/Allegro/pstxnet.dat:325](../../Allegro/hardware/allegro-original/Allegro%20v5/Allegro/pstxnet.dat#L325); [Allegro/hardware/allegro-original/Allegro v5/Allegro/pstxnet.dat:328](../../Allegro/hardware/allegro-original/Allegro%20v5/Allegro/pstxnet.dat#L328); [Allegro/hardware/allegro-original/Allegro v5/Allegro/pstxnet.dat:331](../../Allegro/hardware/allegro-original/Allegro%20v5/Allegro/pstxnet.dat#L331); [Allegro/hardware/allegro-original/Allegro v5/Allegro/pstxnet.dat:334](../../Allegro/hardware/allegro-original/Allegro%20v5/Allegro/pstxnet.dat#L334); [hardware/kicad/_build/netmap.json:2](../../hardware/kicad/_build/netmap.json#L2).\n\n[Atlas index and snapshot provenance](README.md) · [Schematic PDF](../img/v1_schematic.pdf) · [PCB top](../img/v1_pcb_top.png) · [PCB bottom](../img/v1_pcb_bottom.png)\n"},{"path":"docs/atlas/TP5.md","title":"TP5 — ground","text":"# TP5 — ground\n\nTest point on common ground.\n\nAllegro reference **TP5** → KiCad reference **TP5**.\n\nBOM: TP; MPN `not applicable (bare pad)`; no purchased component; confidence: TBD.\nFootprint: `LoRa_Boat_Controller:amv_test_point`. [Full BOM](../BOM.csv).\n\n## Read before wiring\n\n- Electrical pin numbers below come from v5 pstxnet.dat, not a physical left-to-right view. Board side, connector key, cable view, and pin-1 marking require physical verification. All voltages and waveforms are design/code expectations, not bench measurements.\n- TP2 is absent from the v5 netlist and current BOM. Do not reuse the older documentation's ADC test-point claim.\n\n## Electrical pin map\n\n| Pin | Readable net | Allegro net | MCU | Firmware role |\n|---|---|---|---|---|\n| 1 | GND | 0 | U3-18 VSS; U3-31 VSS_2; U3-47 VSS_3; U3-63 VSS_4; U3-12 VSSA/VREF- | Common reference |\n\n## Verification targets — not measured results\n\n### Pin 1 — GND\n\n**Domain:** 0 V reference (expected). **Direction:** Reference.\n\nUnpowered continuity to GND1/TP5; resistance/continuity has not been measured.\n\nEvidence: [Allegro/hardware/allegro-original/Allegro v5/Allegro/pstxnet.dat:163](../../Allegro/hardware/allegro-original/Allegro%20v5/Allegro/pstxnet.dat#L163); [Allegro/hardware/allegro-original/Allegro v5/Allegro/pstxnet.dat:169](../../Allegro/hardware/allegro-original/Allegro%20v5/Allegro/pstxnet.dat#L169); [Allegro/hardware/allegro-original/Allegro v5/Allegro/pstxnet.dat:172](../../Allegro/hardware/allegro-original/Allegro%20v5/Allegro/pstxnet.dat#L172); [Allegro/hardware/allegro-original/Allegro v5/Allegro/pstxnet.dat:175](../../Allegro/hardware/allegro-original/Allegro%20v5/Allegro/pstxnet.dat#L175); [Allegro/hardware/allegro-original/Allegro v5/Allegro/pstxnet.dat:178](../../Allegro/hardware/allegro-original/Allegro%20v5/Allegro/pstxnet.dat#L178); [Allegro/hardware/allegro-original/Allegro v5/Allegro/pstxnet.dat:181](../../Allegro/hardware/allegro-original/Allegro%20v5/Allegro/pstxnet.dat#L181); [hardware/kicad/_build/netmap.json:3](../../hardware/kicad/_build/netmap.json#L3).\n\n[Atlas index and snapshot provenance](README.md) · [Schematic PDF](../img/v1_schematic.pdf) · [PCB top](../img/v1_pcb_top.png) · [PCB bottom](../img/v1_pcb_bottom.png)\n"},{"path":"docs/atlas/VIN.md","title":"Battery positive","text":"# Battery positive\n\nSingle solder pad for raw input supply.\n\nAllegro reference **VIN** → KiCad reference **VIN1**.\n\nBOM: Battery+; MPN `not applicable (bare pad)`; no purchased component; confidence: n/a.\nFootprint: `LoRa_Boat_Controller:amv_con1`. [Full BOM](../BOM.csv).\n\n## Read before wiring\n\n- Electrical pin numbers below come from v5 pstxnet.dat, not a physical left-to-right view. Board side, connector key, cable view, and pin-1 marking require physical verification. All voltages and waveforms are design/code expectations, not bench measurements.\n- The input voltage/current envelope is not established by this source reconstruction. Identify battery and protection first.\n\n## Electrical pin map\n\n| Pin | Readable net | Allegro net | MCU | Firmware role |\n|---|---|---|---|---|\n| 1 | VIN_RAW | N088060 | No direct MCU pin | Battery input to buck converter and R5/R6 divider; ADC not initialized |\n\n## Verification targets — not measured results\n\n### Pin 1 — VIN_RAW\n\n**Domain:** Battery specification and safe board operating envelope unresolved. **Direction:** Battery/external supply → board.\n\nIdentify battery and input protection; regulator rating alone does not establish safe board input voltage.\n\nEvidence: [Allegro/hardware/allegro-original/Allegro v5/Allegro/pstxnet.dat:251](../../Allegro/hardware/allegro-original/Allegro%20v5/Allegro/pstxnet.dat#L251); [hardware/kicad/_build/netmap.json:33](../../hardware/kicad/_build/netmap.json#L33); [firmware/Core/Src/main.c:428](../../firmware/Core/Src/main.c#L428).\n\n[Atlas index and snapshot provenance](README.md) · [Schematic PDF](../img/v1_schematic.pdf) · [PCB top](../img/v1_pcb_top.png) · [PCB bottom](../img/v1_pcb_bottom.png)\n"},{"path":"docs/CONVERSION_NOTES.md","title":"Allegro → KiCad conversion notes (V1, as fabricated)","text":"# Allegro → KiCad conversion notes (V1, as fabricated)\n\nRewritten 2026-09-16. The March-2026 version of this file described a conversion of the Specctra DSN (`senior design v2.dsn`); that DSN is an export of **v2.brd**, while the fabricated board is **v5.brd**. Between v2 and v5 the board was re-laid out on a smaller outline (66.5 × 37.3 mm instead of 76.2 × 76.2 mm), every part moved, U1/COUT1/TP2 were removed, D21 was added, and four footprints changed (see `A0_PROVENANCE.md`). Nothing from the old converter survives except the readable-net-name idea.\n\n## Sources actually used\n\n| Data | Source file(s) | Why this one |\n|---|---|---|\n| Copper, mask, silkscreen, outline | `Allegro/hardware/allegro-original/BoatcrewArtwork/BOATCREW*.art` (byte-identical copies in `Allegro v5/Allegro/`) | Plotted from `senior design v5.brd` on 2025-05-09 17:41:07, 30 minutes after the last netlist import; the last entry in `allegro.jrl` is this artwork run |\n| Netlist | `Allegro v5/Allegro/pstxnet.dat`, `pstxprt.dat`, `pstchip.dat` | OrCAD packaging of 2025-05-09 17:12:27, imported into v5.brd at 17:12:46 (`netrev.lst`, `eco.txt`) |\n| Pad geometry | `senior design v2.dsn` `(library (image …) (padstack …))` for the 21 footprints that did not change, the v5 films for the four that did | The DSN is the only text source of padstack shapes; the films confirm them pad by pad |\n| Design rules | `senior design v2_rules.do` (12 mil width, 12 mil clearance, 5 mil to vias) | Only rule file in the repo; the fabricated copper violates it in places (documented in `LoRa_Boat_Controller.kicad_dru`) |\n| Drill | derived from the v5 pad flashes + padstack hole sizes | The only drill file in the repo (`BOATCREWDRILL-1-2.drl`) is a v4 export; 35 of its 50 holes have no v5 pad |\n\n## Method (all scripted, `hardware/kicad/tools/`)\n\n1. `provenance.py` reads every Gerber/drill header → provenance table.\n2. `v5_reconstruct.py` matches every footprint's pad pattern against the dark flashes of `BOATCREWTOPL.art` (1.5 mil tolerance), rasterizes both copper films at 2 px/mil, labels connected copper, joins layers through vias/PTH pads, and resolves which pads belong to which net from `pstxnet.dat` by constraint propagation (44/44 parts, 0 shorts, 0 opens). Film voids that the 5 mil pour clearance does not explain become rule areas (footprint body keep-outs, the 580 × 706 mil LoRa keep-out).\n3. `gen_footprints.py` writes `LoRa_Boat_Controller.pretty/` (pads exact, solder-mask margins from the mask films, courtyard = pad extents).\n4. `gen_pcb.py` writes the board: footprints at the film positions, every film line as a track with its net, vias, the +3V3 (top) and GND (bottom) pours as zones, rule areas, silkscreen and outline 1:1 from the films, plus `.kicad_pro` (rules) and `.kicad_dru` (as-fabricated exceptions).\n5. `validate_pcb.py` (KiCad python) re-reads the board: 172/172 pad centres within 0.000 mil of the film flashes; fills zones; saves.\n6. `xor_compare.py` rasterizes the KiCad Gerber export and the films in one frame → per-layer mismatch (F.Cu 0.87 %, B.Cu 0.23 %); hole-by-hole drill match 53/53.\n7. `gen_symbols.py` + `gen_sch.py` write the hierarchical schematic from the same netlist; `check_netlist.py` proves schematic == board == `pstxnet.dat` pin sets.\n8. `gen_bom.py`, `gen_docs.py`, `evidence_figs.py`, `a0_xor_dsn.py` produce the BOM, NETLIST/INDEX/this table, the evidence figures and the DSN-v2 comparison. `build_v1.py` runs the whole chain.\n\n## Coordinate frames\n\nAllegro/DSN/films share one origin (films have `Offset 0,0`), mils, Y up. KiCad: mm, Y down, Allegro origin placed at (100, 100) mm (`allegro_data.allegro_to_kicad`). KiCad plots Gerbers with Y pointing up again, so the comparison uses `raster.kicad_xform` (x − 3937 mil, y + 3937 mil). Footprint rotation: Allegro CCW degrees map 1:1 to KiCad footprint rotation (verified by the 0.000 mil pad check).\n\n## Deliberate deviations from a \"clean\" KiCad project (fidelity first)\n\n- Netclass clearance is the 12 mil design rule, but the fabricated copper has 7.7 mil between adjacent LQFP fan-out traces, 5 mil pour-to-copper gaps and two pads at 3.4/4.8 mil from a track; `LoRa_Boat_Controller.kicad_dru` states these measured minimums so DRC reports 0 errors without hiding them (they are V1 findings).\n- Pads have `zone_connect none` and a 5 mil local clearance because Allegro plots thermal spokes as explicit lines; the spokes are imported as tracks.\n- Vias are untented (44 mil mask openings on 24 mil pads, as on the films); KiCad therefore reports 37 solder-mask-bridge warnings — real on the fabricated board.\n- Reference designators without a trailing digit get a `1` suffix (`CANHEADER1`, `CIN1`, `JTAG1`, …) because KiCad's annotation rule otherwise blocks *Update PCB from Schematic*; the Allegro name is kept in the `Allegro_RefDes` property.\n- Silkscreen is imported as graphics from the film (the fabricated text), footprint references are on `F.Fab` only.\n- The eight identical 0805 decoupling capacitors C2–C9 sit on the same nets (+3V3/GND); their refdes-to-position assignment follows a deterministic order (`v5_reconstruct.py` notes) and cannot be proven from copper alone.\n\n## Footprint mapping (generated)\n\nAllegro footprint → project footprint (pads exactly as fabricated) → nearest KiCad-library footprint (for reference only; the board uses the project footprints) → pad-geometry delta.\n\n\u003c!-- BEGIN GENERATED gen_docs.py footprints -->\n| Allegro footprint (JEDEC_TYPE) | Project footprint | Used by | Pads (mil, as fabricated) | Nearest KiCad-library footprint | Pad delta vs library |\n|---|---|---|---|---|---|\n| `CAP_0603G_AVX-M` | `LoRa_Boat_Controller:CAP_0603G_AVX-M` | C14 | 2: rect 42x40@(35.5,0); 1: rect 42x40@(-35.5,0) | `Capacitor_SMD:C_0603_1608Metric` | same package class; pad sizes differ by a few mil |\n| `CAP_0603_CL10A_1P6XP8_SAM-M` | `LoRa_Boat_Controller:CAP_0603_CL10A_1P6XP8_SAM-M` | C10, CEXT1 | 2: rect 42x37@(34.5,0); 1: rect 42x37@(-34.5,0) | `Capacitor_SMD:C_0603_1608Metric` | same package class; pad sizes differ by a few mil |\n| `CAP_CL10_SAM-M` | `LoRa_Boat_Controller:CAP_CL10_SAM-M` | C12 | 2: rect 33.81x33.5@(36.59,0); 1: rect 33.81x33.5@(-36.59,0) | `Capacitor_SMD:C_0603_1608Metric` | same package class; pad sizes differ by a few mil |\n| `CAP_GJM1555C1H220JB01__MUR-L` | `LoRa_Boat_Controller:CAP_GJM1555C1H220JB01__MUR-L` | C23 | 2: rect 20x20@(16.5,0); 1: rect 20x20@(-16.5,0) | `Capacitor_SMD:C_0402_1005Metric` | same package class; pad sizes differ by a few mil |\n| `CAP_KGM21_KAV-L` | `LoRa_Boat_Controller:CAP_KGM21_KAV-L` | C1, C2, C22, C3, C4, C5, C6, C7, C8, C9 | 1: rect 36x47@(-27.5,0); 2: rect 36x47@(27.5,0) | `Capacitor_SMD:C_0805_2012Metric` | 36x47 mil at 55 mil pitch vs 0805 lib 1.0x1.45 mm at 1.9 mm (39x57 at 75) |\n| `CAP_NTS_55_2P8T_NIP` | `LoRa_Boat_Controller:CAP_NTS_55_2P8T_NIP` | CIN1 | 2: rect 65x213@(101.5,0); 1: rect 65x213@(-101.5,0) | `Capacitor_SMD:C_2220_5750Metric` | 65x213 mil at 203 mil pitch for the 5.7x5.0 mm Chemi-Con NTS body |\n| `CONN5_1LFBN-RC_SUL` | `LoRa_Boat_Controller:CONN5_1LFBN-RC_SUL` | GPSMODULE1, LORAMODULE1 | 5 pads circle 68x68 hole 40 | `Connector_PinHeader_2.54mm:PinHeader_1x05_P2.54mm_Vertical` | 68 mil pad / 40 mil hole (DSN v2 had 60/40) |\n| `CONN_B4B-XH-A_JST` | `LoRa_Boat_Controller:CONN_B4B-XH-A_JST` | CANHEADER1 | 4: circle 69x69@(-295.28,0) hole 49; 3: circle 69x69@(-196.85,0) hole 49; 2: circle 69x69@(-98.42,0) hole 49; 1: circle 69x69@(0,0) hole 49 | `Connector_JST:JST_XH_B4B-XH-A_1x04_P2.50mm_Vertical` | 69 mil pad / 49 mil hole at 98.42 mil (2.5 mm) pitch |\n| `CONN_PPTC031_SUL` | `LoRa_Boat_Controller:CONN_PPTC031_SUL` | SPEEDCONTROLLER1, STEERINGSERVO1 | 3: circle 68x68@(-200,0) hole 40; 2: circle 68x68@(-100,0) hole 40; 1: circle 68x68@(0,0) hole 40 | `Connector_PinHeader_2.54mm:PinHeader_1x03_P2.54mm_Vertical` | 68 mil pad / 40 mil hole (DSN v2 had 60/40) |\n| `D0008A_L` | `LoRa_Boat_Controller:D0008A_L` | U5 | 8 pads obround 49.21x21.65 | `Package_SO:SOIC-8_3.9x4.9mm_P1.27mm` | oblong 21.65x49.21 mil at 50 mil pitch vs SOIC-8 lib 1.55x0.6 mm rect |\n| `G-21_MUR-L` | `LoRa_Boat_Controller:G-21_MUR-L` | C20, C21 | 2: rect 26x47@(32.5,0); 1: rect 26x47@(-32.5,0) | `Capacitor_SMD:C_0805_2012Metric` | same package class; pad sizes differ by a few mil |\n| `G-31_MUR-M` | `LoRa_Boat_Controller:G-31_MUR-M` | COUT1 | 2: rect 50x65@(60,0); 1: rect 50x65@(-60,0) | `Capacitor_SMD:C_1206_3216Metric` | same package class; pad sizes differ by a few mil |\n| `IND_7045_TDK` | `LoRa_Boat_Controller:IND_7045_TDK` | L1 | 1: rect 86.61x94.88@(0,108.07); 2: rect 86.61x94.88@(0,-108.07) | `Inductor_SMD:L_TDK_SLF7045` | custom 86.6x94. |---|---|\n| `+3V3` | `3.3V` | C3-2, GPSMODULE1-1, C2-2, STEERINGSERVO1-1, SPEEDCONTROLLER1-1, C4-2, L3-2, C20-2, R1-1, C14-1, TP4-1, COUT1-2, L1-1, U3-19 (VDD), U3-32 (VDD_2), U3-48 (VDD_3), U3-64 (VDD_4), U3-13 (VDDA/VREF+), CEXT1-2, C10-2, C5-2, C6-2, C7-2, C8-2, C9-2, JTAG1-1 (01) | Debug, GPS_Module, LoRa_Module, MCU, PWM_Outputs, PowerSupply | Top-layer pour. Also feeds SPEEDCONTROLLER-1 and STEERINGSERVO-1 (actuator power pins!) and JTAG-1 | V2: actuator power leaves this rail |\n| `GND` | `0` | C3-1, GPSMODULE1-2, C4-1, SPEEDCONTROLLER1-3, C2-1, STEERINGSERVO1-3, LORAMODULE1-5, CANHEADER1-1, C21-1, L4-1, C22-1, C23-1, GND1-1, CIN1-1, R6-1, U6-5 (GND), R2-2, D21-1, COUT1-1, TP5-1, C10-1, U3-18 (VSS), U3-31 (VSS_2), U3-47 (VSS_3), U3-63 (VSS_4), U3-12 (VSSA/VREF-), C5-1, C6-1, C7-1, C8-1, C9-1, JTAG1-9 (09), JTAG1-5 (05), JTAG1-3 (03), C1-1, U5-2 (GND) | CAN_Bus, Debug, GPS_Module, LoRa_Module, MCU, PWM_Outputs, PowerSupply | Bottom-layer pour; top pour is +3V3 | kept; V2 adds proper star/return for the actuator rail |\n| `ADC_VBAT` | `ADC` | R6-2, R5-2, U3-16 (PA2) | MCU, PowerSupply | R5 30 k / R6 10 k divider to PA2 (ADC1_IN2); firmware never enables the ADC | V2: read it; add filter cap |\n| `BST` | `N17942` | U6-4 (BST), R3-2 | PowerSupply | U6 BST to R3 (51 R) | unchanged |\n| `BST_RC` | `N061071` | R3-1, C12-2 | PowerSupply | between R3 and C12 (0.1 uF) - the bootstrap RC per Nisshinbo DS | unchanged |\n| `CANH` | `N24691` | CANHEADER1-3, U5-7 (CANH) | CAN_Bus | U5 pin 7 (CANH) -> CANHEADER pin 3 | V2: termination option |\n| `CANL` | `N04855` | CANHEADER1-4, U5-6 (CANL) | CAN_Bus | U5 pin 6 (CANL) -> CANHEADER pin 4 | V2: termination option |\n| `CAN_RXD_PA10` | `N04759` | U3-43 (PA10), U5-4 (RXD) | CAN_Bus, MCU | U5 RXD -> PA10, which has no CAN alternate function | V2: RXD to PA11 |\n| `CAN_STB_PA11` | `N04755` | U3-44 (PA11), U5-8 (STB) | CAN_Bus, MCU | PA11 (= CAN1_RX pin!) drives U5 STB | V2: STB on a plain GPIO or tied low |\n| `CAN_TXD_PA12` | `N04763` | U3-45 (PA12), U5-1 (TXD) | CAN_Bus, MCU | PA12 CAN1_TX -> U5 TXD (correct) | unchanged |\n| `CAN_VCC` | `N24886` | CANHEADER1-2, U5-3 (VCC), C1-2 | CAN_Bus | U5 VCC (needs 4.5-5.5 V) supplied from CANHEADER-2, C1 0.1 uF | V2: on-board 5 V |\n| `EN` | `N148600` | R4-2, U6-1 (CE) | PowerSupply | U6 CE via R4 5.1 k from VIN_RAW (CE has no internal pull) | V2: MCU-controlled enable optional |\n| `FB_DIV` | `N17576` | U6-6 (VFB), R2-1, R1-2, C14-2 | PowerSupply | U6 VFB with R1 15 k / R2 4.7 k / C14 470 pF -> Vout = 0.8*(1+15/4.7) = 3.35 V | unchanged |\n| `GPS_PB0` | `N04277` | GPSMODULE1-3, U3-26 (PB0) | GPS_Module, MCU | PB0 GPIO output (held LOW by firmware) -> GPS header pin 3 | V2: PPS input instead |\n| `GPS_RX_PC11` | `N04281` | GPSMODULE1-4, U3-52 (PC11) | GPS_Module, MCU | GPS TXD -> USART3_RX | unchanged |\n| `GPS_TX_PC10` | `N04285` | GPSMODULE1-5, U3-51 (PC10) | GPS_Module, MCU | USART3_TX -> GPS RXD (also carries debug prints) | V2: separate console |\n| `LORA_FILT` | `N27410` | C20-1, L4-2 | LoRa_Module | between L4 (from +3V3) and L3; C20 10 uF to +3V3 (not GND!) | V2: cap to GND |\n| `LORA_RST_PA3` | `N24517` | LORAMODULE1-4, U3-17 (PA3) | LoRa_Module, MCU | PA3 -> LoRa NRST; firmware never drives it | V2 firmware drives reset |\n| `LORA_RX_PA1` | `N04485` | LORAMODULE1-3, U3-15 (PA1) | LoRa_Module, MCU | LoRa TXD -> UART4_RX | series resistor in V2 |\n| `LORA_TX_PA0` | `N04477` | LORAMODULE1-2, U3-14 (PA0) | LoRa_Module, MCU | UART4_TX -> LoRa RXD | series resistor in V2 |\n| `LORA_VCC` | `N04429` | LORAMODULE1-1, L3-1, C21-2, C22-2, C23-2 | LoRa_Module | LoRa header VDD after ferrite L3, with C21 10 uF, C22 0.1 uF, C23 (22 or 47 pF) to GND | V2: same filter, verify TX current |\n| `NRST` | `RESET` | U3-7 (NRST), JTAG1-10 | Debug, MCU | U3 NRST -> JTAG-10; no external RC | V2: 100 nF on NRST |\n| `PWM_PA8_ESCHDR` | `N04355` | SPEEDCONTROLLER1-2, TP1-1, U3-41 (PA8) | MCU, PWM_Outputs | PA8/TIM1_CH1 -> SPEEDCONTROLLER-2 (and TP1); firmware calls PA8 \"rudder\" | V2: named by function, series R + ESD |\n| `PWM_PC6_SERVOHDR` | `N04395` | TP3-1, STEERINGSERVO1-2, U3-37 (PC6) | MCU, PWM_Outputs | PC6/TIM3_CH1 -> STEERINGSERVO-2 (and TP3); firmware calls PC6 \"motor\" | V2: named by function, series R + ESD |\n| `SWCLK` | `PA14 TCLK` | U3-49 (PA14), JTAG1-4 (04) | Debug, MCU | PA14 -> JTAG-4 | unchanged |\n| `SWDIO` | `PA13 TMS` | U3-46 (PA13), JTAG1-2 (02) | Debug, MCU | PA13 -> JTAG-2 | unchanged |\n| `SWO_TDO` | `PB3 TBO` | U3-55 (PB3), JTAG1-6 (06) | Debug, MCU | PB3 -> JTAG-6 | unchanged |\n| `SW_NODE` | `N18028` | U6-3 (LX), C12-1, L1-2, D21-2 | PowerSupply | U6 LX, L1-2, C12-1 (bootstrap RC), D21-2 cathode of the CMS06 catch diode | unchanged topology; layout tightened |\n| `TDI` | `PA15 TDI` | U3-50 (PA15), JTAG1-8 (08) | Debug, MCU | PA15 -> JTAG-8 | V2: SWD only, free PA15/PB3 |\n| `VBAT` | `VBAT` | U3-1 (VBAT) | MCU | U3 pin 1 only - floating on V1 | V2: tie to VDD |\n| `VCAP1` | `N27791` | CEXT1-1, U3-30 (VCAP_1) | MCU | U3 pin 30 VCAP_1 to CEXT-1; CEXT-2 returns to +3V3 instead of VSS (V1 defect) | V2: 4.7 uF to VSS |\n| `VIN_RAW` | `N088060` | VIN1-1, U6-2 (VIN), CIN1-2, R5-1, R4-1 | PowerSupply | Battery pad, CIN, U6 VIN, R4 (CE pull-up), R5 (ADC divider); no fuse / reverse protection / TVS | V2: fuse + reverse-polarity + TVS + bulk cap |\n\n## Unconnected pins (NC in pstxnet.dat)\n\nU3: U3-2, U3-3, U3-4, U3-5, U3-6, U3-8, U3-9, U3-10, U3-11, U3-20, U3-21, U3-22, U3-23, U3-24, U3-25, U3-27, U3-28, U3-29, U3-33, U3-34, U3-35, U3-36, U3-38, U3-39, U3-40, U3-42, U3-53, U3-54, U3-56, U3-57, U3-58, U3-59, U3-60, U3-61, U3-62 (35 MCU pins incl. BOOT0 pin 60 and the HSE/LSE pins 3, 4, 5, 6); U5-5 (NC on the H variant); JTAG1-7 (key).\n\n## Reading the names\n\n- Signal nets are named by MCU pin so the PWM swap question cannot recur: `PWM_PA8_ESCHDR` reaches the header the silkscreen calls SPEEDCONTROLLER, `PWM_PC6_SERVOHDR` the STEERINGSERVO header.\n- `CANL`/`CANH` follow the TCAN1042H pin functions (pin 6 = CANL, pin 7 = CANH); the March 2026 NETLIST.md had them reversed.\n- Power symbols in the schematic: `GND`, `+3V3`, `VIN_RAW`.\n"},{"path":"docs/research/BOM_MPN_RESEARCH.md","title":"V1 BOM - Manufacturer Part Number Research","text":"# V1 BOM - Manufacturer Part Number Research\n\nBoard: STM32F446 boat controller (Allegro/OrCAD original). Pricing looked up 2026-09-16.\n\nMethod: Mouser product pages were read directly (unit price at the 1-pc and 10-pc breaks, stock, lifecycle flag). Digi-Key blocks automated page access (Cloudflare), so Digi-Key figures below come from Digi-Key search-result snippets only; treat them as qty-1 indications, not a verified price table. Where neither Digi-Key nor Mouser could be read, LCSC is quoted and labelled as such. Mouser displayed a \"tariff of 8-30% may be applied if shipping to the United States\" banner on several passives; that surcharge is NOT included in the figures below.\n\nConfidence key: HIGH = exact MPN identified from the design's own device/footprint name. MEDIUM = series/footprint identified from the design, specific value, voltage or tolerance chosen here. LOW/TBD = guess or no part.\n\n## Part table\n\n| Ref | Value | Allegro device / footprint name | Proposed MPN | Manufacturer | Description | Package | Confidence | Unit price qty1 / qty10 (distributor, date) | Source URL |\n|---|---|---|---|---|---|---|---|---|---|\n| C1, C2, C3, C4, C5, C6, C7, C8, C9, C22 | 0.1 uF | C_CAP_KGM21_KAV-L_.1UF | KGM21NR71H104KT | Kyocera AVX | 0.1 uF 10% 50 V X7R MLCC (exact MPN confirmed, 502k in stock) | 0805 (2012) | HIGH | $0.11 / $0.041 (Mouser, 2026-09-16); Digi-Key snippet $0.08-0.10 qty1 | https://www.mouser.com/ProductDetail/KYOCERA-AVX/KGM21NR71H104KT ; https://www.digikey.com/en/products/detail/kyocera-avx/KGM21NR71H104KT/563505 |\n| C10 | 4.7 uF | C_CAP_0603_CL10A_1P6XP8_SAM-M_4.7UF | CL10A475KP8NNNC | Samsung Electro-Mechanics | 4.7 uF 10% 10 V X5R MLCC. Design encodes only \"CL10A\" + 1.6x0.8 mm; 10 V variant ET6TR (tape and reel) | STMicroelectronics | Arm Cortex-M4 180 MHz, 512 KB flash, 128 KB SRAM, LQFP64 10x10. TR suffix = tape-and-reel packing of the identical die; both orderable | LQFP-64 | HIGH | STM32F446RET6: $10.57 / $8.23; STM32F446RET6TR: $9.76 / $7.58 (Mouser, 2026-09-16); Digi-Key snippet $8.15-10.27 | https://www.mouser.com/ProductDetail/STMicroelectronics/STM32F446RET6 ; https://www.mouser.com/ProductDetail/STMicroelectronics/STM32F446RET6TR ; https://www.digikey.com/en/products/detail/stmicroelectronics/STM32F446RET6/5175962 |\n| U5 | TCAN1042HDRQ1 | SOIC-8 | TCAN1042HDRQ1 | Texas Instruments | Automotive 70 V bus-fault-protected CAN FD transceiver, 5 Mbps, AEC-Q100. STATUS CONFLICT: TI part page says ACTIVE (2026-09-16) but Mouser flags \"End of Life: scheduled for obsolescence\". TI names TCAN1044A-Q1 as pin-for-pin newer version (see Notes) | SOIC-8 (D) | HIGH | $2.19 / $1.63 (Mouser, 2026-09-16), 8,167 in stock | https://www.mouser.com/ProductDetail/Texas-Instruments/TCAN1042HDRQ1 ; https://www.ti.com/product/TCAN1042H-Q1/part-details/TCAN1042HDRQ1 ; https://www.digikey.com/en/products/detail/texas-instruments/TCAN1042HDRQ1/6572307 |\n| U6 | R1240N001B-TR-FE | SOT-23-6W | R1240N001B-TR-FE | Nisshinbo Micro Devices (formerly Ricoh Electronic Devices) | 1.25 MHz PWM step-down DC/DC, Vin 4.5-30 V, Vout adj 0.8-15 V, ~1.2 A per distributor listings. Exact orderable MPN confirmed at Digi-Key and Mouser; Active, not obsolete | SOT-23-6W | HIGH | $1.77 / $1.30 (Mouser, 2026-09-16, only 5 in stock); Digi-Key snippet: $1.72 / $1.262 (7,863 in stock) | https://www.mouser.com/ProductDetail/Nisshinbo/R1240N001B-TR-FE ; https://www.digikey.com/en/products/detail/nisshinbo-micro-devices-inc/R1240N001B-TR-FE/10244725 |\n| JTAG | FTSH-105-01-L-DV-K | 2x5 1.27 mm SMD | FTSH-105-01-L-DV-K | Samtec | 10-pin 2-row 1.27 mm SMT micro header, 10 uin gold, 0.120 in post. \"-K\" = keying notch (polarised); non-keyed equivalent is FTSH-105-01-L-DV | SMT 2x5, 1.27 mm | HIGH | $1.24 / $1.24 (Mouser, 2026-09-16; next break $0.972 @92), 72k in stock | https://www.mouser.com/ProductDetail/Samtec/FTSH-105-01-L-DV-K ; https://www.samtec.com/products/ftsh-105-01-l-dv-k ; https://www.digikey.com/en/products/detail/samtec-inc/FTSH-105-01-L-DV-K/1875039 |\n| CANHEADER | B4B-XH-A(LF)(SN) | JST XH 4-pos | B4B-XH-A(LF)(SN) | JST | XH 2.5 mm 4-position vertical through-hole header, tin | TH, 2.5 mm pitch | HIGH | Digi-Key snippet $0.21 qty1 (Digi-Key PN 455-2249-ND); qty-10 not retrievable; Mouser page did not render pricing; LCSC $0.0602 (MOQ 10) | https://www.digikey.com/en/products/detail/jst-sales-america-inc/B4B-XH-A-LF-SN/1651047 ; https://www.lcsc.com/product-detail/C144395.html |\n| GPSMODULE, LORAMODULE | PPTC051LFBN-RC | 1x5 0.1 in socket | PPTC051LFBN-RC | Sullins Connector Solutions | 5-position single-row 2.54 mm female header, tin, through-hole. Not carried by Mouser | TH, 2.54 mm | HIGH | Digi-Key snippet $0.38 qty1 (other snippets $0.44-0.47 - likely regional/older); qty-10 not retrievable; LCSC $1.124 (out of stock) | https://www.digikey.com/en/products/detail/sullins-connector-solutions/PPTC051LFBN-RC/807239 |\n| SPEEDCONTROLLER, STEERINGSERVO | PPTC031LFBN-RC | 1x3 0.1 in socket | PPTC031LFBN-RC | Sullins Connector Solutions | 3-position single-row 2.54 mm female header, tin, through-hole. Not carried by Mouser | TH, 2.54 mm | HIGH | Digi-Key snippet $0.30 qty1 (other snippets $0.34-0.42); qty-10 not retrievable | https://www.digikey.com/en/products/detail/sullins-connector-solutions/PPTC031LFBN-RC/810143 |\n| TP1, TP3, TP4, TP5 | test point | amv_test_point (1.4 mm hole / 3.4 mm pad, single PTH) | No part (bare PTH pad). Optional loop: Keystone 5020 | - / Keystone | Design pad is a single 1.4 mm plated hole. No Keystone THM test point matches 1.4 mm: 5000-5004 miniature and 5020/5021 loop styles need 0.040 in (1.0 mm) holes; 5023 needs 0.067-0.078 in. Fitting a Keystone part means changing the footprint | PTH pad | TBD | No part: $0. Keystone 5020: $0.26 / $0.201 (Mouser, 2026-09-16); Keystone 5001 Digi-Key snippet $0.26-0.27 | https://www.mouser.com/ProductDetail/Keystone-Electronics/5020 ; https://www.digikey.com/en/products/detail/keystone-electronics/5001/255327 |\n| VIN, GND | battery terminal | amv_con1 (1.6 mm pad / 0.6 mm hole) | No part / wire solder pad | - | Bare pads for direct wire soldering | PTH pad | n/a | $0 | - |\n\n## Notes\n\n1. **CIN is not a Kemet 1210 part.** KTS500B106M55N0T00 is Nippon Chemi-Con NTS-series (the Allegro footprint literally says CAP_NTS_55_2P8T = 5.7 x 5.0 mm body, 2.8 mm thick, i.e. EIA 2220). Chemi-Con lists it as In Production, but distributor stock is thin (Mouser 126 pcs, LCSC 0). If it goes short, in-production 2220 50 V 10 uF alternatives to price: KEMET C2220C106K5RACTU (X7R), Murata GRM55DR61H106KA88L (X5R). Any 1210 substitute would need a footprint change.\n2. **C23 value conflict.** The device name embeds GJM1555C1H220JB01 (22 pF) while the schematic value reads 47 pF. If this is a crystal load cap, 22 pF is the more typical value for an 8 MHz HSE crystal with ~18 pF CL, but the schematic wins until someone checks the crystal spec. Both parts priced above.\n3. **L1 SLF7045T-4R7M2R0-PF is obsolete** (TDK PCN 2024-07-30; Mouser lifecycle = Obsolete; Digi-Key still shows residual stock). Mouser's listed recommended alternative is TDK VLS6045EX-4R7M-H (6.0 x 6.0 x 4.5 mm, 4.7 uH, 4.2 A). The TDK PCN itself names VLS5045EX-4R7M (5 x 5 mm). Either requires a new footprint; the 6 x 6 part is the closer mechanical fit to the 7 x 7 original. Neither substitute could be priced at Digi-Key/Mouser today (LCSC $0.21 for VLS6045EX-4R7M-H).\n4. **U5 TCAN1042HDRQ1 lifecycle.** TI's own part-details page reports ACTIVE (TI store out of stock), while Mouser tags it \"End of Life: scheduled for obsolescence\". TI's product page points to TCAN1044A-Q1 as a newer, pin-for-pin, same-function device (SOIC-8: TCAN1044ADRQ1). Buy TCAN1042HDRQ1 from current distribu
