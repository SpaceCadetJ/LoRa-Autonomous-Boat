-EP for the ICM-20948) |\n| `fp-lib-table`, `sym-lib-table` | project libraries: `LoRa_Boat_Controller` (reused V1 footprints/symbols from `../kicad/`) and `LoRa_Boat_Controller_V2` |\n| `_build/` | (git-ignored) DSN/SES, freerouting log, DRC/ERC reports, placement report, BOM JSON |\n\n## Tool chain (run from the repo root)\n\n```bash\npython hardware/kicad_v2/tools/gen_v2.py check                                   # design-rule sanity: every pin either in a net or in NC_PINS\npython hardware/kicad_v2/tools/gen_v2.py                                         # library + schematic + project + unrouted PCB + docs/BOM_V2.csv\n\"C:/Users/Jay/AppData/Local/Programs/KiCad/9.0/bin/python.exe\" hardware/kicad_v2/tools/placement_check.py   # courtyard overlaps / parts off the board\n\"C:/Users/Jay/AppData/Local/Programs/KiCad/9.0/bin/kicad-cli.exe\" sch erc --severity-all -o hardware/kicad_v2/_build/erc.rpt hardware/kicad_v2/LoRa_Boat_Controller_V2.kicad_sch\n\"C:/Users/Jay/AppData/Local/Programs/KiCad/9.0/bin/python.exe\" hardware/kicad_v2/tools/route_v2.py all     # DSN (B.Cu GND plane only) -> freerouting -> SES import -> pour fill\n\"C:/Users/Jay/AppData/Local/Programs/KiCad/9.0/bin/kicad-cli.exe\" pcb drc --severity-error -o hardware/kicad_v2/_build/drc.rpt hardware/kicad_v2/LoRa_Boat_Controller_V2.kicad_pcb\n```\n\n`route_v2.py` needs Java 21 and `freerouting-2.1.0.jar` at `%LOCALAPPDATA%\\freerouting\\` (or `FREEROUTING_JAR`); download from https://github.com/freerouting/freerouting/releases/download/v2.1.0/freerouting-2.1.0.jar (2.4.x needs Java 25). Routing is not stored in the generator: after any `gen_v2.py` run the board is unrouted again and `route_v2.py all` must be repeated.\n\n## Design source (`tools/v2_design.py`)\n\n- `PARTS`: ref -> (symbol, footprint, value, MPN, manufacturer, sheet, description). `NETS`: net -> pins as `REF-number` or `REF.pinname`. `NC_PINS`: pins deliberately left open (everything else must be in a net, `gen_v2.py check` fails otherwise).\n- `POWER_NETS`: which nets are drawn with power symbols; `SHEETS`: sheet names/paper/descriptions; `PLACE`: ref -> (x, y, rotation) in board mm from the top-left corner; `MOUNT_HOLES`, `BOARD_W/H`, `KEEPOUTS`.\n- `PRICE_USD` / `PRICE_DATE`: qty-1 catalogue prices used by `docs/BOM_V2.csv` (estimates; re-quote at order time).\n\nRequirement traceability is in the schematic sheet descriptions and in `docs/V2_REQUIREMENTS.md` (REQ-xx ids); the design decisions still open for Jay are in `BLOCKERS.md`.\n\n## Known state of this draft\n\n- Autorouted, not hand-optimised: expect to tidy the buck-converter loops (U2/L1/D3/C5-C6 and U3/L2/D4/C8-C9), the crystal traces and the USB pair before fabrication; keep the placement.\n- Silkscreen is reference designators only; no assembly drawing yet.\n- Footprints for new parts come from the KiCad 9 standard library on this machine (`KICAD_FOOTPRINT_DIR`), embedded into the board at generation time.\n"}],"images":[{"path":"docs/img/v1_evidence_can.png","title":"evidence can","type":"png"},{"path":"docs/img/v1_evidence_pwm.png","title":"evidence pwm","type":"png"},{"path":"docs/img/v1_evidence_vcap.png","title":"evidence vcap","type":"png"},{"path":"docs/img/v1_fab_B_Cu.png","title":"fab B Cu","type":"png"},{"path":"docs/img/v1_fab_B_Mask.png","title":"fab B Mask","type":"png"},{"path":"docs/img/v1_fab_Edge_Cuts.png","title":"fab Edge Cuts","type":"png"},{"path":"docs/img/v1_fab_F_Cu.png","title":"fab F Cu","type":"png"},{"path":"docs/img/v1_fab_F_Mask.png","title":"fab F Mask","type":"png"},{"path":"docs/img/v1_fab_F_SilkS.png","title":"fab F SilkS","type":"png"},{"path":"docs/img/v1_kicad_B_Cu.png","title":"kicad B Cu","type":"png"},{"path":"docs/img/v1_kicad_B_Mask.png","title":"kicad B Mask","type":"png"},{"path":"docs/img/v1_kicad_Edge_Cuts.png","title":"kicad Edge Cuts","type":"png"},{"path":"docs/img/v1_kicad_F_Cu.png","title":"kicad F Cu","type":"png"},{"path":"docs/img/v1_kicad_F_Mask.png","title":"kicad F Mask","type": cks; neither proves functional electrical design or physical bench behavior.","DRC uses the released as-fabricated custom clearance rules, including a 3.3 mil track-to-pad allowance.","The 139 parity warnings remain unresolved at this revision despite exact connectivity agreement.","V5 finished-hole sizes, plating and complete drill provenance are not independently verified.","No independent full-film XOR, all-pad geometry comparison, schematic visual QA, Update-PCB GUI exercise, firmware build or powered-hardware test was performed in this packet."]},"sources":[{"path":"firmware/Core/Src/main.c","text":"/* USER CODE BEGIN Header */\r\n/**\r\n  ******************************************************************************\r\n  * @file           : main.c\r\n  * @brief          : Main program body (Boat board – STM32F446RET: LoRa + GPS)\r\n  ******************************************************************************\r\n  * Peripherals (actual, based on testing):\r\n  *   TIM1_CH1 (PA8)      -> Rudder servo PWM\r\n  *   TIM3_CH1 (PC6)      -> Motor / Fans PWM\r\n  *   PB0                 -> Debug LED / probe\r\n  *\r\n  *   UART4  (PA0 TX,  PA1 RX)   -> LoRa  @115200 (RYLR module)\r\n  *   USART3(PC10 TX, PC11 RX)   -> GPS / DEBUG @9600\r\n  *\r\n  * BOARD WIRING NOTE (V1 as fabricated, verified from the v5 fab Gerbers +\r\n  * pstxnet.dat, 2026-09-16 - see docs/V1_DESIGN_REVIEW.md, docs/img/v1_evidence_pwm.png):\r\n  *   PA8 / TIM1_CH1 is routed to header refdes SPEEDCONTROLLER pin 2\r\n  *   PC6 / TIM3_CH1 is routed to header refdes STEERINGSERVO  pin 2\r\n  *   i.e. the copper is the mirror of the names used in this file: with this\r\n  *   firmware the ESC must be plugged into the header STEERINGSERVO and the\r\n  *   rudder servo into the header SPEEDCONTROLLER.  Do not \"fix\" the\r\n  *   firmware without also re-labelling the harness; V2 renames the nets by MCU\r\n  *   pin (PWM_PA8_ESCHDR / PWM_PC6_SERVOHDR).\r\n  *   PB0 is wired to GPSMODULE pin 3 and is held LOW by this firmware.\r\n  *   Other board facts that matter here: no HSE/LSE crystal (HSI only), VBAT and\r\n  *   BOOT0 pins are unconnected, CAN transceiver RXD is on PA10 (no CAN AF).\r\n  *\r\n  * Behavior:\r\n  *   - PWM:\r\n  *       Motor:  TIM3_CH1 / PC6, 50 Hz, 1000–2000 µs\r\n  *       Rudder: TIM1_CH1 / PA8, 50 Hz, 1100–1900 µs (center ~1500)\r\n  *\r\n  *   - LoRa:\r\n  *       AT startup:\r\n  *         ATE0\r\n  *         AT+ADDRESS=1        (BOAT)\r\n  *         AT+NETWORKID=18\r\n  *         AT+BAND=915000000\r\n  *         AT+PARAMETER=12,7,1,4\r\n  *\r\n  *       Incoming lines (from +RCV=...):\r\n  *         THRUST,\u003c0–100>\r\n  *         RUDDER,\u003c0–100>   (0=left, 50=center, 100=right)\r\n  *         GPS,\u003clat>,\u003clon>  (from other node, just printed)\r\n  *\r\n  *   - GPS:\r\n  *       Parse $GPRMC / $GNRMC to gps_lat/gps_lon/gps_valid.\r\n  *       Every 5s (if valid): send \"GPS,\u003clat>,\u003clon>\" via LoRa AT+SEND\r\n  *       to RC node address 2.\r\n  ******************************************************************************\r\n  */\r\n/* USER CODE END Header */\r\n\r\n/* Includes ------------------------------------------------------------------*/\r\n#include \"main.h\"\r\n\r\n/* Private includes ----------------------------------------------------------*/\r\n/* USER CODE BEGIN Includes */\r\n#include \u003cstring.h>\r\n#include \u003cstdio.h>\r\n#include \u003cstdlib.h>\r\n/* USER CODE END Includes */\r\n\r\n/* Private typedef -----------------------------------------------------------*/\r\n/* USER CODE BEGIN PTD */\r\n/* USER CODE END PTD */\r\n\r\n/* Private define ------------------------------------------------------------*/\r\n/* USER CODE BEGIN PD */\r\n\r\n/* GPS / LoRa line buffers */\r\n#define GPS_BUF_LEN    128\r\n#define LORA_BUF_LEN   128\r\n\r\n/* LoRa addressing – must match RC firmware */\r\n#define LORA_ADDR_RC    2   /* Remote: RC handset (L072) */\r\n#define LORA_ADDR_BOAT  1   /* This boat node (F446) */\r\n#define LORA_NET_ID    18\r\n#define LORA_FREQ      915000000UL\r\n#define LORA_PARAM_STR \"12,7,1,4\"\r\n\r\n/* Motor PWM (PC6 – TIM3_CH1) */\r\n#define PWM_MOTOR_MIN_US     1000U   /* ESC min / idle */\r\n#define PWM_MOTOR_MAX_US     2000U\r\n#define PWM_MOTOR_IDLE_US    PWM_MOTOR_MIN_US\r\n\r\n/* Rudder PWM (PA8 – TIM1_CH1) */\r\n#define PWM_RUDDER_CENTER_US 1500U\r\n#define PWM_RUDDER_LEFT_US   1100U   /* tune if needed */\r\n#define PWM_RUDDER_RIGHT_US  1900U\r\n\r\n/* USER CODE END PD */\r\n\r\n/* Private macro -------------------------------------------------------------*/\r\n/* USER CODE BEGIN PM */\r\n/* USER CODE END PM */\r\n\r\n/* Private variables ---------------------------------------------------------*/\r\nTIM_HandleTypeDef htim1;\r\nTIM_HandleTypeDef htim3;\r\n\r\nUART_HandleTypeDef huart4;   // LoRa\r\nUART_HandleTypeDef huart3;   // GPS / debug\r\n\r\n/* USER CODE BEGIN PV */\r\n\r\n/* GPS RX state */\r\nstatic uint8_t gps_rx_byte;\r\nstatic char    gps_buf[GPS_BUF_LEN];\r\nstatic volatile size_t gps_len   = 0;\r\nstatic volatile uint8_t gps_ready = 0;\r\n\r\n/* LoRa RX state */\r\nstatic uint8_t lora_rx_byte;\r\nstatic char    lora_buf[LORA_BUF_LEN];\r\nstatic volatile size_t lora_len   = 0;\r\nstatic volatile uint8_t lora_ready = 0;\r\n\r\n/* Parsed GPS data */\r\nfloat   gps_lat   = 0.0f;\r\nfloat   gps_lon   = 0.0f;\r\nuint8_t gps_valid = 0;\r\n\r\n/* Last time we sent GPS over LoRa */\r\nuint32_t last_lora_tx = 0;\r\n\r\n/* Motor / rudder logical values */\r\nuint8_t thrust_value = 0;   // 0..100 (0 = stop, 100 = full)\r\nuint8_t rudder_value = 50;  // 0..100 (0=left, 50=center, 100=right)\r\n\r\n/* USER CODE END PV */\r\n\r\n/* Private function prototypes -----------------------------------------------*/\r\nvoid SystemClock_Config(void);\r\nstatic void MX_GPIO_Init(void);\r\nstatic void MX_UART4_Init(void);\r\nstatic void MX_USART3_UART_Init(void);\r\nstatic void MX_TIM1_Init(void);\r\nstatic void MX_TIM3_Init(void);\r\n/* USER CODE BEGIN PFP */\r\n/* Debug helper */\r\nstatic void dbg(const char *s);\r\n\r\n/* High-level helpers */\r\nstatic void set_thrust(uint8_t value);\r\nstatic void set_rudder(uint8_t value);\r\n\r\n/* UART IT helpers */\r\nstatic void StartGPSRxIT(void);\r\nstatic void StartLoRaRxIT(void);\r\n\r\n/* LoRa helpers */\r\nstatic void lora_send_line(const char* s);\r\nstatic void lora_send_payload(const char* payload);\r\nstatic void parse_lora_line(char* s);\r\n\r\n/* GPS helpers */\r\nstatic int  gps_ddmm_to_deg(const char* val, const char* hemi, float* out);\r\nstatic int  gps_validate_checksum(const char* s);\r\nstatic void gps_parse_rmc(char* line);\r\nstatic void gps_task(void);\r\n/* USER CODE END PFP */\r\n\r\n/* Private user code ---------------------------------------------------------*/\r\n/* USER CODE BEGIN 0 */\r\n\r\nstatic void dbg(const char *s)\r\n{\r\n  if (!s) return;\r\n  /* Use finite timeout so a broken UART doesn't hard-lock */\r\n  HAL_UART_Transmit(&huart3, (uint8_t*)s, strlen(s), 100);\r\n}\r\n\r\n/* Start interrupt receive for both UARTs */\r\nstatic void StartGPSRxIT(void)\r\n{\r\n  HAL_UART_Receive_IT(&huart3, &gps_rx_byte, 1);\r\n}\r\n\r\nstatic void StartLoRaRxIT(void)\r\n{\r\n  HAL_UART_Receive_IT(&huart4, &lora_rx_byte, 1);\r\n}\r\n\r\n/* Simple AT line sender (adds \\r\\n) */\r\nstatic void lora_send_line(const char* s)\r\n{\r\n  if (!s) return;\r\n\r\n  /* Finite timeouts here too */\r\n  HAL_UART_Transmit(&huart4, (uint8_t*)s, strlen(s), 100);\r\n  uint8_t crlf[2] = { '\\r', '\\n' };\r\n  HAL_UART_Transmit(&huart4, crlf, 2, 100);\r\n}\r\n\r\n/* AT+SEND payload helper:\r\n *  - Boat node address  = LORA_ADDR_BOAT (1)\r\n *  - RC handset address = LORA_ADDR_RC   (2)\r\n *  We send GPS/etc *to the RC*, so destination = LORA_ADDR_RC.\r\n */\r\nstatic void lora_send_payload(const char* payload)\r\n{\r\n  if (!payload) return;\r\n  char cmd[128];\r\n  snprintf(cmd, sizeof(cmd),\r\n           \"AT+SEND=%d,%u,%s\",\r\n           LORA_ADDR_RC,           /* send TO RC (2) */\r\n           (unsigned)strlen(payload),\r\n           payload);\r\n  lora_send_line(cmd);\r\n}\r\n\r\n/* Convert ddmm.mmmm -> decimal degrees */\r\nstatic int gps_ddmm_to_deg(const char* val, const char* hemi, float* out)\r\n{\r\n  if (!val || !*val || !out) return 0;\r\n  double v       = atof(val);\r\n  int    deg     = (int)(v / 100);\r\n  double minutes = v - (deg * 100.0);\r\n  double result  = deg + minutes / 60.0;\r\n  if (hemi && (*hemi == 'S' || *hemi == 'W')) result = -result;\r\n  *out = (float)result;\r\n  return 1;\r\n}\r\n\r\n/* Validate NMEA checksum */\r\nstatic int gps_validate_checksum(const char* s)\r\n{\r\n  if (!s || s[0] != '$') return 0;\r\n  const char* star = strrchr(s, '*');\r\n  if (!star) return 0;\r\n\r\n  uint8_t chk = 0;\r\n  for (const char* p = s + 1; p \u003c star; p++)\r\n  {\r\n    chk ^= (uint8_t)(*p);\r\n  }\r\n  uint8_t given = (uint8_t)strtol(star + 1, NULL, 16);\r\n  return (chk == given);\r\n}\r\n\r\n/* Parse an RMC line (in-place strtok) */\r\nstatic void gps_parse_rmc(char* line)\r\n{\r\n  if (!gps_validate_checksum(line)) return;\r\n\r\n  char* toks[16];\r\n  int   n = 0;\r\n\r\n  for (char* tok = strtok(line, \",\"); tok && n \u003c 16; tok = strtok(NULL, \",\"))\r\n  {\r\n    toks[n++] = tok;\r\n  }\r\n  if (n \u003c 7) return;\r\n\r\n  if (strncmp(toks[0], \"$GPRMC\", 6) != 0 &&\r\n      strncmp(toks[0], \"$GNRMC\", 6) != 0)\r\n  {\r\n    return;\r\n  }\r\n\r\n  /* Status: A = active, V = void */\r\n  if (toks[2][0] != 'A')\r\n  {\r\n    gps_valid = 0;\r\n    return;\r\n  }\r\n\r\n  float lat, lon;\r\n  if (!gps_ddmm_to_deg(toks[3], toks[4], &lat)) return;\r\n  if (!gps_ddmm_to_deg(toks[5], toks[6], &lon)) return;\r\n\r\n  gps_lat   = lat;\r\n  gps_lon   = lon;\r\n  gps_valid = 1;\r\n}\r\n\r\n/* GPS processing task (call from main loop) */\r\nstatic void gps_task(void)\r\n{\r\n  if (!gps_ready) return;\r\n  gps_ready = 0;\r\n\r\n  char buf[GPS_BUF_LEN];\r\n  strncpy(buf, gps_buf, sizeof(buf));\r\n  buf[GPS_BUF_LEN - 1] = '\\0';\r\n\r\n  if (strncmp(buf, \"$GPRMC\", 6) == 0 || strncmp(buf, \"$GNRMC\", 6) == 0)\r\n  {\r\n    gps_parse_rmc(buf);\r\n  }\r\n}\r\n\r\n/* Parse one LoRa line from RYLR (\"+RCV=...\") */\r\nstatic void parse_lora_line(char* s)\r\n{\r\n  if (!s) return;\r\n\r\n  /* Skip leading CR/LF/spaces so \"\\r+RCV=...\" still matches */\r\n  while (*s == '\\r' || *s == '\\n' || *s == ' ' || *s == '\\t')\r\n  {\r\n    s++;\r\n  }\r\n\r\n  if (*s == '\\0') return;\r\n\r\n  /* Expect lines like:\r\n   *   +RCV=1,10,THRUST,50,-50,12\r\n   *   +RCV=1,10,RUDDER,30,-70,11\r\n   */\r\n  if (strncmp(s, \"+RCV=\", 5) != 0 && strncmp(s, \"RCV=\", 4) != 0)\r\n  {\r\n    return;\r\n  }\r\n\r\n  /* Skip header up to second comma, then data starts */\r\n  char* p = s;\r\n  int   comma_count = 0;\r\n  while (*p && comma_count \u003c 2)\r\n  {\r\n    if (*p == ',') comma_count++;\r\n    p++;\r\n  }\r\n  if (comma_count \u003c 2) return;  // malformed\r\n  char* data = p;               // points at payload: \"THRUST,50,...\"\r\n\r\n  /* Normalize: strip trailing \\r or \\n */\r\n  char* end = data + strlen(data);\r\n  while (end > data && (end[-1] == '\\r' || end[-1] == '\\n'))\r\n  {\r\n    *--end = '\\0';\r\n  }\r\n\r\n  /* Commands:\r\n   *  THRUST,\u003c0-100>\r\n   *  RUDDER,\u003c0-100>\r\n   *  GPS,\u003clat>,\u003clon>\r\n   */\r\n\r\n  if (strncmp(data, \"THRUST,\", 7) == 0)\r\n  {\r\n    int value;\r\n    if (sscanf(data, \"THRUST,%d\", &value) == 1)\r\n    {\r\n      if (value \u003c 0)   value = 0;\r\n      if (value > 100) value = 100;\r\n      thrust_value = (uint8_t)value;\r\n      set_thrust(thrust_value);\r\n\r\n      char dbg_buf[64];\r\n      snprintf(dbg_buf, sizeof(dbg_buf), \"LoRa: THRUST=%d\\r\\n\", value);\r\n      dbg(dbg_buf);\r\n    }\r\n  }\r\n  else if (strncmp(data, \"RUDDER,\", 7) == 0)\r\n  {\r\n    int value;\r\n    if (sscanf(data, \"RUDDER,%d\", &value) == 1)\r\n    {\r\n      if (value \u003c 0)   value = 0;\r\n      if (value > 100) value = 100;\r\n      rudder_value = (uint8_t)value;\r\n      set_rudder(rudder_value);\r\n\r\n      char dbg_buf[64];\r\n      snprintf(dbg_buf, sizeof(dbg_buf), \"LoRa: RUDDER=%d\\r\\n\", value);\r\n      dbg(dbg_buf);\r\n    }\r\n  }\r\n  else if (strncmp(data, \"GPS,\", 4) == 0)\r\n  {\r\n    float lat, lon;\r\n    if (sscanf(data, \"GPS,%f,%f\", &lat, &lon) == 2)\r\n    {\r\n      char dbg_buf[80];\r\n      snprintf(dbg_buf, sizeof(dbg_buf),\r\n               \"LoRa: GPS from RC: %.6f, %.6f\\r\\n\", lat, lon);\r\n      dbg(dbg_buf);\r\n    }\r\n  }\r\n}\r\n\r\n/* Set motor thrust (0..100) → TIM3_CH1 / PC6 */\r\nstatic void set_thrust(uint8_t value)\r\n{\r\n  if (value > 100) value = 100;\r\n\r\n  uint32_t range = (PWM_MOTOR_MAX_US - PWM_MOTOR_MIN_US); // 1000\r\n  uint32_t pulse = PWM_MOTOR_MIN_US + (range * value) / 100U;\r\n\r\n  __HAL_TIM_SET_COMPARE(&htim3, TIM_CHANNEL_1, pulse);\r\n  thrust_value = value;\r\n}\r\n\r\n/* Set rudder (0..100) → TIM1_CH1 / PA8\r\n * 0   = fully left  (PWM_RUDDER_LEFT_US)\r\n * 50  = center      (PWM_RUDDER_CENTER_US)\r\n * 100 = fully right (PWM_RUDDER_RIGHT_US)\r\n */\r\nstatic void set_rudder(uint8_t value)\r\n{\r\n  if (value > 100) value = 100;\r\n\r\n  uint32_t range = (PWM_RUDDER_RIGHT_US - PWM_RUDDER_LEFT_US);\r\n  uint32_t pulse = PWM_RUDDER_LEFT_US + (range * value) / 100U;\r\n\r\n  __HAL_TIM_SET_COMPARE(&htim1, TIM_CHANNEL_1, pulse);\r\n  rudder_value = value;\r\n}\r\n\r\n/* USER CODE END 0 */\r\n\r\n/**\r\n  * @brief  The application entry point.\r\n  * @retval int\r\n  */\r\n\r\nint main(void)\r\n{\r\n  /* MCU Configuration--------------------------------------------------------*/\r\n\r\n  /* Reset of all peripherals, Initializes the Flash interface and the Systick. */\r\n  HAL_Init();   // sets up uwTick, SysTick, HAL_Delay, etc.\r\n\r\n  /* Configure the system clock */\r\n  SystemClock_Config();\r\n\r\n  /* Initialize all configured peripherals */\r\n  MX_GPIO_Init();\r\n  MX_UART4_Init();\r\n  MX_USART3_UART_Init();\r\n  MX_TIM1_Init();\r\n  MX_TIM3_Init();\r\n\r\n  /* NVIC setup for UART interrupts (must match stm32f4xx_it.c IRQHandlers) */\r\n  HAL_NVIC_SetPriority(UART4_IRQn, 5, 0);\r\n  HAL_NVIC_EnableIRQ(UART4_IRQn);\r\n\r\n  HAL_NVIC_SetPriority(USART3_IRQn, 5, 0);\r\n  HAL_NVIC_EnableIRQ(USART3_IRQn);\r\n\r\n  /* Start PWM on both channels */\r\n  if (HAL_TIM_PWM_Start(&htim1, TIM_CHANNEL_1) != HAL_OK) { Error_Handler(); }\r\n  if (HAL_TIM_PWM_Start(&htim3, TIM_CHANNEL_1) != HAL_OK) { Error_Handler(); }\r\n\r\n  /* Safe startup: motor idle, rudder centered */\r\n  set_thrust(0);\r\n  set_rudder(50);\r\n\r\n  /* Let ESC/servo/LoRa/GPS power up */\r\n  HAL_Delay(1500);\r\n\r\n  /* Start UART reception in interrupt mode */\r\n  StartGPSRxIT();\r\n  StartLoRaRxIT();\r\n\r\n  /* Configure LoRa module via AT commands */\r\n  lora_send_line(\"ATE0\");                        // Echo off\r\n  lora_send_line(\"AT+ADDRESS=1\");                // This node address (boat)\r\n  lora_send_line(\"AT+NETWORKID=18\");             // Network ID\r\n  lora_send_line(\"AT+BAND=915000000\");           // 915 MHz\r\n  lora_send_line(\"AT+PARAMETER=\" LORA_PARAM_STR);// SF12, BW index 7 = 125 kHz (not 7.8 kHz), CR4/5, preamble 4. NOTE: an RYLR998 rejects SF12 (SF5-11 only) and keeps its stored settings; only the RYLR896 accepts SF12.\r\n\r\n  dbg(\"Boat: LoRa init done\\r\\n\");\r\n\r\n  /* Infinite loop */\r\n  while (1)\r\n  {\r\n    /* Handle GPS parsing */\r\n    gps_task();\r\n\r\n    /* Process any complete LoRa line */\r\n    if (lora_ready)\r\n    {\r\n      lora_ready = 0;\r\n      char buf_local[LORA_BUF_LEN];\r\n      strncpy(buf_local, lora_buf, sizeof(buf_local));\r\n      buf_local[LORA_BUF_LEN - 1] = '\\0';\r\n\r\n      dbg(\"LORA RX: \");\r\n      dbg(buf_local);\r\n      dbg(\"\\r\\n\");\r\n\r\n      parse_lora_line(buf_local);\r\n    }\r\n\r\n    uint32_t now = HAL_GetTick();\r\n\r\n    /* Send *our* GPS over LoRa every 5 seconds if valid */\r\n    if (gps_valid && (now - last_lora_tx >= 5000U))\r\n    {\r\n      char payload[64];\r\n      snprintf(payload, sizeof(payload), \"GPS,%.6f,%.6f\", gps_lat, gps_lon);\r\n      lora_send_payload(payload);\r\n      last_lora_tx = now;\r\n    }\r\n\r\n    HAL_Delay(10);\r\n  }\r\n}\r\n\r\n/**\r\n  * @brief System Clock Configuration\r\n  * @retval None\r\n  */\r\nvoid SystemClock_Config(void)\r\n{\r\n  RCC_OscInitTypeDef RCC_OscInitStruct = {0};\r\n  RCC_ClkInitTypeDef RCC_ClkInitStruct = {0};\r\n\r\n  /** Configure the main internal regulator output voltage */\r\n  __HAL_RCC_PWR_CLK_ENABLE();\r\n  __HAL_PWR_VOLTAGESCALING_CONFIG(PWR_REGULATOR_VOLTAGE_SCALE3);\r\n\r\n  /** Initializes the RCC Oscillators according to the specified parameters */\r\n  RCC_OscInitStruct.OscillatorType      = RCC_OSCILLATORTYPE_HSI;\r\n  RCC_OscInitStruct.HSIState            = RCC_HSI_ON;\r\n  RCC_OscInitStruct.HSICalibrationValue = RCC_HSICALIBRATION_DEFAULT;\r\n  RCC_OscInitStruct.PLL.PLLState        = RCC_PLL_NONE;\r\n  if (HAL_RCC_OscConfig(&RCC_OscInitStruct) != HAL_OK)\r\n  {\r\n    Error_Handler();\r\n  }\r\n\r\n  /** Initializes the CPU, AHB and APB buses clocks */\r\n  RCC_ClkInitStruct.ClockType      = RCC_CLOCKTYPE_HCLK\r\n                                   | RCC_CLOCKTYPE_SYSCLK\r\n                                   | RCC_CLOCKTYPE_PCLK1\r\n                                   | RCC_CLOCKTYPE_PCLK2;\r\n  RCC_ClkInitStruct.SYSCLKSource   = RCC_SYSCLKSOURCE_HSI;\r\n  RCC_ClkInitStruct.AHBCLKDivider  = RCC_SYSCLK_DIV1;\r\n  RCC_ClkInitStruct.APB1CLKDivider = RCC_HCLK_DIV1;\r\n  RCC_ClkInitStruct.APB2CLKDivider = RCC_HCLK_DIV1;\r\n\r\n  if (HAL_RCC_ClockConfig(&RCC_ClkInitStruct, FLASH_LATENCY_0) != HAL_OK)\r\n  {\r\n    Error_Handler();\r\n  }\r\n}\r\n\r\n/**\r\n  * @brief TIM1 Initialization Function\r\n  * @param None\r\n  * @retval None\r\n  */\r\nstatic void MX_TIM1_Init(void)\r\n{\r\n  TIM_MasterConfigTypeDef sMasterConfig = {0};\r\n  TIM_OC_InitTypeDef      sConfigOC     = {0};\r\n  TIM_BreakDeadTimeConfigTypeDef sBreakDeadTimeConfig = {0};\r\n\r\n  htim1.Instance               = TIM1;\r\n  htim1.Init.Prescaler         = 15;\r\n  htim1.Init.CounterMode       = TIM_COUNTERMODE_UP;\r\n  htim1.Init.Period            = 19999;\r\n  htim1.Init.ClockDivision     = TIM_CLOCKDIVISION_DIV1;\r\n  htim1.Init.RepetitionCounter = 0;\r\n  htim1.Init.AutoReloadPreload = TIM_AUTORELOAD_PRELOAD_ENABLE;\r\n  if (HAL_TIM_PWM_Init(&htim1) != HAL_OK)\r\n  {\r\n    Error_Handler();\r\n  }\r\n  sMasterConfig.MasterOutputTrigger = TIM_TRGO_RESET;\r\n  sMasterConfig.MasterSlaveMode     = TIM_MASTERSLAVEMODE_DISABLE;\r\n  if (HAL_TIMEx_MasterConfigSynchronization(&htim1, &sMasterConfig) != HAL_OK)\r\n  {\r\n    Error_Handler();\r\n  }\r\n  sConfigOC.OCMode       = TIM_OCMODE_PWM1;\r\n  sConfigOC.Pulse        = PWM_RUDDER_CENTER_US;\r\n  sConfigOC.OCPolarity   = TIM_OCPOLARITY_HIGH;\r\n  sConfigOC.OCNPolarity  = TIM_OCNPOLARITY_HIGH;\r\n  sConfigOC.OCFastMode   = TIM_OCFAST_DISABLE;\r\n  sConfigOC.OCIdleState  = TIM_OCIDLESTATE_RESET;\r\n  sConfigOC.OCNIdleState = TIM_OCNIDLESTATE_RESET;\r\n  if (HAL_TIM_PWM_ConfigChannel(&htim1, &sConfigOC, TIM_CHANNEL_1) != HAL_OK)\r\n  {\r\n    Error_Handler();\r\n  }\r\n  sBreakDeadTimeConfig.OffStateRunMode  = TIM_OSSR_DISABLE;\r\n  sBreakDeadTimeConfig.OffStateIDLEMode = TIM_OSSI_DISABLE;\r\n  sBreakDeadTimeConfig.LockLevel        = TIM_LOCKLEVEL_OFF;\r\n  sBreakDeadTimeConfig.DeadTime         = 0;\r\n  sBreakDeadTimeConfig.BreakState       = TIM_BREAK_DISABLE;\r\n  sBreakDeadTimeConfig.BreakPolarity    = TIM_BREAKPOLARITY_HIGH;\r\n  sBreakDeadTimeConfig.AutomaticOutput  = TIM_AUTOMATICOUTPUT_DISABLE;\r\n  if (HAL_TIMEx_ConfigBreakDeadTime(&htim1, &sBreakDeadTimeConfig) != HAL_OK)\r\n  {\r\n    Error_Handler();\r\n  }\r\n  HAL_TIM_MspPostInit(&htim1);\r\n}\r\n\r\n/**\r\n  * @brief TIM3 Initialization Function\r\n  * @param None\r\n  * @retval None\r\n  */\r\nstatic void MX_TIM3_Init(void)\r\n{\r\n  TIM_MasterConfigTypeDef sMasterConfig = {0};\r\n  TIM_OC_InitTypeDef      sConfigOC     = {0};\r\n\r\n  htim3.Instance               = TIM3;\r\n  htim3.Init.Prescaler         = 15;\r\n  htim3.Init.CounterMode       = TIM_COUNTERMODE_UP;\r\n  htim3.Init.Period            = 19999;\r\n  htim3.Init.ClockDivision     = TIM_CLOCKDIVISION_DIV1;\r\n  htim3.Init.AutoReloadPreload = TIM_AUTORELOAD_PRELOAD_ENABLE;\r\n  if (HAL_TIM_PWM_Init(&htim3) != HAL_OK)\r\n  {\r\n    Error_Handler();\r\n  }\r\n  sMasterConfig.MasterOutputTrigger = TIM_TRGO_RESET;\r\n  sMasterConfig.MasterSlaveMode     = TIM_MASTERSLAVEMODE_DISABLE;\r\n  if (HAL_TIMEx_MasterConfigSynchronization(&htim3, &sMasterConfig) != HAL_OK)\r\n  {\r\n    Error_Handler();\r\n  }\r\n  sConfigOC.OCMode     = TIM_OCMODE_PWM1;\r\n  sConfigOC.Pulse      = PWM_MOTOR_IDLE_US;\r\n  sConfigOC.OCPolarity = TIM_OCPOLARITY_HIGH;\r\n  sConfigOC.OCFastMode = TIM_OCFAST_DISABLE;\r\n  if (HAL_TIM_PWM_ConfigChannel(&htim3, &sConfigOC, TIM_CHANNEL_1) != HAL_OK)\r\n  {\r\n    Error_Handler();\r\n  }\r\n  HAL_TIM_MspPostInit(&htim3);\r\n}\r\n\r\n/**\r\n  * @brief UART4 Initialization Function\r\n  * @param None\r\n  * @retval None\r\n  */\r\nstatic void MX_UART4_Init(void)\r\n{\r\n  huart4.Instance        = UART4;\r\n  huart4.Init.BaudRate   = 115200;\r\n  huart4.Init.WordLength = UART_WORDLENGTH_8B;\r\n  huart4.Init.StopBits   = UART_STOPBITS_1;\r\n  huart4.Init.Parity     = UART_PARITY_NONE;\r\n  huart4.Init.Mode       = UART_MODE_TX_RX;\r\n  huart4.Init.HwFlowCtl  = UART_HWCONTROL_NONE;\r\n  huart4.Init.OverSampling = UART_OVERSAMPLING_16;\r\n  if (HAL_UART_Init(&huart4) != HAL_OK)\r\n  {\r\n    Error_Handler();\r\n  }\r\n}\r\n\r\n/**\r\n  * @brief USART3 Initialization Function\r\n  * @param None\r\n  * @retval None\r\n  */\r\nstatic void MX_USART3_UART_Init(void)\r\n{\r\n  huart3.Instance        = USART3;\r\n  huart3.Init.BaudRate   = 9600;\r\n  huart3.Init.WordLength = UART_WORDLENGTH_8B;\r\n  huart3.Init.StopBits   = UART_STOPBITS_1;\r\n  huart3.Init.Parity     = UART_PARITY_NONE;\r\n  huart3.Init.Mode       = UART_MODE_TX_RX;\r\n  huart3.Init.HwFlowCtl  = UART_HWCONTROL_NONE;\r\n  huart3.Init.OverSampling = UART_OVERSAMPLING_16;\r\n  if (HAL_UART_Init(&huart3) != HAL_OK)\r\n  {\r\n    Error_Handler();\r\n  }\r\n}\r\n\r\n/**\r\n  * @brief GPIO Initialization Function\r\n  * @param None\r\n  * @retval None\r\n  */\r\nstatic void MX_GPIO_Init(void)\r\n{\r\n  GPIO_InitTypeDef GPIO_InitStruct = {0};\r\n\r\n  /* GPIO Ports Clock Enable */\r\n  __HAL_RCC_GPIOA_CLK_ENABLE();\r\n  __HAL_RCC_GPIOB_CLK_ENABLE();\r\n  __HAL_RCC_GPIOC_CLK_ENABLE();\r\n\r\n  /*Configure GPIO pin Output Level */\r\n  HAL_GPIO_WritePin(GPIOB, GPIO_PIN_0, GPIO_PIN_RESET);\r\n\r\n  /*Configure GPIO pin : PB0 (debug LED / probe) */\r\n  GPIO_InitStruct.Pin   = GPIO_PIN_0;\r\n  GPIO_InitStruct.Mode  = GPIO_MODE_OUTPUT_PP;\r\n  GPIO_InitStruct.Pull  = GPIO_NOPULL;\r\n  GPIO_InitStruct.Speed = GPIO_SPEED_FREQ_LOW;\r\n  HAL_GPIO_Init(GPIOB, &GPIO_InitStruct);\r\n}\r\n\r\n/* USER CODE BEGIN 4 */\r\n\r\n/* UART receive complete callback (called from IRQs via HAL_UART_IRQHandler) */\r\nvoid HAL_UART_RxCpltCallback(UART_HandleTypeDef *huart)\r\n{\r\n  if (huart->Instance == USART3)  /* GPS */\r\n  {\r\n    char c = (char)gps_rx_byte;\r\n\r\n    if (c == '\\n')\r\n    {\r\n      gps_buf[gps_len] = '\\0';\r\n      gps_ready = 1;\r\n      gps_len = 0;\r\n    }\r\n    else\r\n    {\r\n      if (gps_len \u003c (GPS_BUF_LEN - 1))\r\n      {\r\n        gps_buf[gps_len++] = c;\r\n      }\r\n    }\r\n    StartGPSRxIT();\r\n  }\r\n  else if (huart->Instance == UART4)  /* LoRa */\r\n  {\r\n    char c = (char)lora_rx_byte;\r\n\r\n    if (c == '\\n')\r\n    {\r\n      lora_buf[lora_len] = '\\0';\r\n      lora_ready = 1;\r\n      lora_len = 0;\r\n    }\r\n    else\r\n    {\r\n      if (lora_len \u003c (LORA_BUF_LEN - 1))\r\n      {\r\n        lora_buf[lora_len++] = c;\r\n      }\r\n    }\r\n    StartLoRaRxIT();\r\n  }\r\n}\r\n\r\n/* USER CODE END 4 */\r\n\r\n/**\r\n  * @brief  This function is executed in case of error occurrence.\r\n  * @retval None\r\n  */\r\nvoid Error_Handler(void)\r\n{\r\n  __disable_irq();\r\n  while (1)\r\n  {\r\n  }\r\n}\r\n\r\n#ifdef USE_FULL_ASSERT\r\nvoid assert_failed(uint8_t *file, uint32_t line)\r\n{\r\n  (void)file;\r\n  (void)line;\r\n}\r\n#endif /* USE_FULL_ASSERT */\r\n"},{"path":"firmware/Core/Src/stm32f4xx_hal_msp.c","text":"/* USER CODE BEGIN Header */\r\n/**\r\n  ******************************************************************************\r\n  * @file         stm32f4xx_hal_msp.c\r\n  * @brief        This file provides code for the MSP Initialization\r\n  *               and de-Initialization codes.\r\n  ******************************************************************************\r\n  * @attention\r\n  *\r\n  * Copyright (c) 2025 STMicroelectronics.\r\n  * All rights reserved.\r\n  *\r\n  * This software is licensed under terms that can be found in the LICENSE file\r\n  * in the root directory of this software component.\r\n  * If no LICENSE file comes with this software, it is provided AS-IS.\r\n  *\r\n  ******************************************************************************\r\n  */\r\n/* USER CODE END Header */\r\n\r\n/* Includes ------------------------------------------------------------------*/\r\n#include \"main.h\"\r\n/* USER CODE BEGIN Includes */\r\n\r\n/* USER CODE END Includes */\r\n\r\n/* Private typedef -----------------------------------------------------------*/\r\n/* USER CODE BEGIN TD */\r\n\r\n/* USER CODE END TD */\r\n\r\n/* Private define ------------------------------------------------------------*/\r\n/* USER CODE BEGIN Define */\r\n\r\n/* USER CODE END Define */\r\n\r\n/* Private macro -------------------------------------------------------------*/\r\n/* USER CODE BEGIN Macro */\r\n\r\n/* USER CODE END Macro */\r\n\r\n/* Private variables ---------------------------------------------------------*/\r\n/* USER CODE BEGIN PV */\r\n\r\n/* USER CODE END PV */\r\n\r\n/* Pr GPIO Configuration\r\n    PA8     ------> TIM1_CH1\r\n    */\r\n    GPIO_InitStruct.Pin = GPIO_PIN_8;\r\n    GPIO_InitStruct.Mode = GPIO_MODE_AF_PP;\r\n    GPIO_InitStruct.Pull = GPIO_NOPULL;\r\n    GPIO_InitStruct.Speed = GPIO_SPEED_FREQ_LOW;\r\n    GPIO_InitStruct.Alternate = GPIO_AF1_TIM1;\r\n    HAL_GPIO_Init(GPIOA, &GPIO_InitStruct);\r\n\r\n    /* USER CODE BEGIN TIM1_MspPostInit 1 */\r\n\r\n    /* USER CODE END TIM1_MspPostInit 1 */\r\n  }\r\n  else if(htim->Instance==TIM3)\r\n  {\r\n    /* USER CODE BEGIN TIM3_MspPostInit 0 */\r\n\r\n    /* USER CODE END TIM3_MspPostInit 0 */\r\n\r\n    __HAL_RCC_GPIOC_CLK_ENABLE();\r\n    /**TIM3 GPIO Configuration\r\n    PC6     ------> TIM3_CH1\r\n    */\r\n    GPIO_InitStruct.Pin = GPIO_PIN_6;\r\n    GPIO_InitStruct.Mode = GPIO_MODE_AF_PP;\r\n    GPIO_InitStruct.Pull = GPIO_NOPULL;\r\n    GPIO_InitStruct.Speed = GPIO_SPEED_FREQ_LOW;\r\n    GPIO_InitStruct.Alternate = GPIO_AF2_TIM3;\r\n    HAL_GPIO_Init(GPIOC, &GPIO_InitStruct);\r\n\r\n    /* USER CODE BEGIN TIM3_MspPostInit 1 */\r\n\r\n    /* USER CODE END TIM3_MspPostInit 1 */\r\n  }\r\n\r\n}\r\n/**\r\n  * @brief TIM_PWM MSP De-Initialization\r\n  * This function freeze the hardware resources used in this example\r\n  * @param htim_pwm: TIM_PWM handle pointer\r\n  * @retval None\r\n  */\r\nvoid HAL_TIM_PWM_MspDeInit(TIM_HandleTypeDef* htim_pwm)\r\n{\r\n  if(htim_pwm->Instance==TIM1)\r\n  {\r\n    /* USER CODE BEGIN TIM1_MspDeInit 0 */\r\n\r\n    /* USER CODE END TIM1_MspDeInit 0 */\r\n    /* Peripheral clock disable */\r\n    __HAL_RCC_TIM1_CLK_DISABLE();\r\n    /* USER CODE BEGIN TIM1_MspDeInit 1 */\r\n\r\n    /* USER CODE END TIM1_MspDeInit 1 */\r\n  }\r\n  else if(htim_pwm->Instance==TIM3)\r\n  {\r\n    /* USER CODE BEGIN TIM3_MspDeInit 0 */\r\n\r\n    /* USER CODE END TIM3_MspDeInit 0 */\r\n    /* Peripheral clock disable */\r\n    __HAL_RCC_TIM3_CLK_DISABLE();\r\n    /* USER CODE BEGIN TIM3_MspDeInit 1 */\r\n\r\n    /* USER CODE END TIM3_MspDeInit 1 */\r\n  }\r\n\r\   v = v * 10u + d;\n    }\n    *out = v;\n    return 1;\n}\n\nstatic int metadata_number(const char *s, size_t n)\n{\n    uint32_t ignored;\n    uint32_t limit = 32767u;\n    if (n && s[0] == '-') { ++s; --n; limit = 32768u; }\n    return number(s, n, limit, &ignored);\n}\n\nstatic int field(const char *s, size_t len, size_t *at, uint32_t max,\n                 uint32_t *value)\n{\n    size_t start = *at;\n    while (*at \u003c len && s[*at] != ',') ++*at;\n    if (*at == len || !number(s + start, *at - start, max, value)) return 0;\n    ++*at;\n    return 1;\n}\n\nrc_parse_result rc_parse(const char *line, size_t len,\n                         uint16_t expected_sender, rc_command *out)\n{\n    size_t at = 5u, payload_at, payload_end, rssi_at;\n    uint32_t sender, declared, value;\n    rc_command result;\n    if (!line || !out || len > RC_MAX_LINE_BYTES) return RC_PARSE_FORMAT;\n    if (len && line[len - 1u] == '\\n') --len;\n    if (len && line[len - 1u] == '\\r') --len;\n    if (len \u003c 5u || memcmp(line, \"+RCV=\", 5u)) return RC_PARSE_FORMAT;\n    if (!field(line, len, &at, 65535u, &sender)) return RC_PARSE_FORMAT;\n    if (sender != expected_sender) return RC_PARSE_SENDER;\n    if (!field(line, len, &at, RC_MAX_LINE_BYTES, &declared)) return RC_PARSE_LENGTH;\n    payload_at = at;\n    if (declared > len - at) return RC_PARSE_LENGTH;\n    payload_end = at + (size_t)declared;\n    if (payload_end == len || line[payload_end] != ',') return RC_PARSE_LENGTH;\n    if (declared \u003c 8u) return RC_PARSE_COMMAND;\n    if (!memcmp(line + payload_at, \"THRUST,\", 7u)) result.kind = RC_THRUST;\n    else if (!memcmp(line + payload_at, \"RUDDER,\", 7u)) result.kind = RC_RUDDER;\n    else return RC_PARSE_COMMAND;\n    if (!number(line + payload_at + 7u, declared - 7u, 100u, &value))\n        return RC_PARSE_VALUE;\n    result.value = (uint8_t)value;\n    rssi_at = payload_end + 1u;\n    at = rssi_at;\n    while (at \u003c len && line[at] != ',') ++at;\n    if (at == len || !metadata_number(line + rssi_at, at - rssi_at))\n        return RC_PARSE_FORMAT;\n    ++at;\n    if (!metadata_number(line + at, len - at)) return RC_PARSE_FORMAT;\n    *out = result;\n    return RC_PARSE_OK;\n}\n\nstatic void safe_output(rc_control *c)\n{\n    c->thrust = 0;\n    c->rudder = 50;\n}\n\nstatic void clear_evidence(rc_control *c)\n{\n    c->seen[RC_THRUST] = 0;\n    c->seen[RC_RUDDER] = 0;\n    c->requested[RC_THRUST] = 0;\n    c->requested[RC_RUDDER] = 50;\n}\n\nstatic void latch(rc_control *c, rc_fault fault)\n{\n    c->mode = RC_FAILSAFE;\n    c->fault = fault;\n    safe_output(c);\n    clear_evidence(c);\n}\n\nint rc_init(rc_control *c, uint16_t expected_sender, uint32_t timeout_ms)\n{\n    if (!c) return 0;\n    memset(c, 0, sizeof(*c));\n    c->expected_sender = expected_sender;\n    c->timeout_ms = timeout_ms;\n    safe_output(c);\n    clear_evidence(c);\n    if (!timeout_ms || timeout_ms > INT32_MAX) {\n        latch(c, RC_BAD_CONFIG);\n        return 0;\n    }\n    c->mode = RC_DISARMED;\n    return 1;\n}\n\nvoid rc_tick(rc_control *c, uint32_t now)\n{\n    unsigned i;\n    if (!c || c->mode == RC_FAILSAFE) return;\n    for (i = 0; i \u003c 2u; ++i) {\n        if (!c->seen[i] || (uint32_t)(now - c->received_at[i]) >= c->timeout_ms) {\n            c->seen[i] = 0;\n            if (c->mode == RC_ARMED) {\n                latch(c, RC_LINK_EXPIRED);\n                return;\n            }\n        }\n    }\n}\n\nint rc_receive(rc_control *c, const char *line, size_t len,\n               uint32_t received_at, uint32_t now)\n{\n    rc_command command;\n    unsigned slot;\n    if (!c) return 0;\n    rc_tick(c, now); /* Never let a late command conceal an expired deadline. */\n    if (c->mode == RC_FAILSAFE ||\n        (uint32_t)(now - received_at) >= c->timeout_ms ||\n        rc_parse(line, len, c->expected_sender, &command) != RC_PARSE_OK) return 0;\n    slot = (unsigned)command.kind;\n    if (c->seen[slot] && (uint32_t)(received_at - c->received_at[slot]) > INT32_MAX)\n        return 0;\n    c->received_at[slot] = received_at;\n    c->seen[slot] = 1;\n    c->requested[slot] = command.value;\n    if (c->mode == RC_ARMED) {\n        c->thrust = c->requested[RC_THRUST];\n        c->rudder = c->requested[RC_RUDDER];\n    }\n    return 1;\n}\n\nint rc_arm(rc_control *c, uint32_t now)\n{\n    if (!c) return 0;\n    rc_tick(c, now);\n    if (c->mode != RC_DISARMED || !c->seen[RC_THRUST] || !c->seen[RC_RUDDER] ||\n        c->requested[RC_THRUST] != 0 || c->requested[RC_RUDDER] != 50) return 0;\n    c->mode = RC_ARMED;\n    return 1;\n}\n\nvoid rc_disarm(rc_control *c)\n{\n    if (!c) return;\n    safe_output(c);\n    clear_evidence(c);\n    if (c->mode != RC_FAILSAFE) c->mode = RC_DISARMED;\n}\n\nvoid rc_trip(rc_control *c)\n{\n    if (c && c->fault != RC_BAD_CONFIG) latch(c, RC_EXTERNAL_FAULT);\n}\n\nint rc_recover(rc_control *c)\n{\n    if (!c || c->mode != RC_FAILSAFE || c->fault == RC_BAD_CONFIG) return 0;\n    c->mode = RC_DISARMED;\n    c->fault = RC_NO_FAULT;\n    safe_output(c);\n    clear_evidence(c);\n    return 1;\n}\n"},{"path":"reviews/codex/firmware_prototype/lora_control.h","text":"#ifndef LORA_CONTROL_H\n#define LORA_CONTROL_H\n\n#include \u003cstddef.h>\n#include \u003cstdint.h>\n\n/* Review-only reference. No HAL, PWM, radio authentication or remote arm code. */\n#define RC_MAX_LINE_BYTES 127u\n\ntypedef enum { RC_THRUST, RC_RUDDER } rc_kind;\ntypedef struct { rc_kind kind; uint8_t value; } rc_command;\ntypedef enum {\n    RC_PARSE_OK, RC_PARSE_FORMAT, RC_PARSE_SENDER,\n    RC_PARSE_LENGTH, RC_PARSE_COMMAND, RC_PARSE_VALUE\n} rc_parse_result;\n\n/* Byte count excludes a C NUL terminator; CR, LF or CRLF suffix is optional.\n * On error, *out is unchanged. Accepts +RCV only and exact payload length.\n * expected_sender is an address filter, NOT authentication. */\nrc_parse_result rc_parse(const char *line, size_t len,\n                         uint16_t expected_sender, rc_command *out);\n\ntypedef enum { RC_DISARMED, RC_ARMED, RC_FAILSAFE } rc_mode;\ntypedef enum { RC_NO_FAULT, RC_LINK_EXPIRED, RC_EXTERNAL_FAULT,\n               RC_BAD_CONFIG } rc_fault;\ntypedef struct {\n    rc_mode mode;\n    rc_fault fault;\n    uint16_t expected_sender;\n    uint32_t timeout_ms;\n    uint32_t received_at[2];\n    uint8_t seen[2];\n    uint8_t requested[2];\n    uint8_t thrust;\n    uint8_t rudder;\n} rc_control;\n\n/* Single owner: call all state APIs from one task, never concurrently/ISR.\n * All times are the same monotonic uint32 millisecond clock. Service at least\n * once per timeout; neither stored timestamps nor caller scheduling may span\n * a full 2^32-ms rollover. timeout_ms must be 1..INT32_MAX. */\nint rc_init(rc_control *c, uint16_t expected_sender, uint32_t timeout_ms);\nvoid rc_tick(rc_control *c, uint32_t now);\n/* Returns 1 only for an accepted fresh valid command. Invalid/stale input\n * does not refresh either channel. Outputs remain safe while disarmed.\n * received_at is stamped when a complete frame is queued, not on dequeue. */\nint rc_receive(rc_control *c, const char *line, size_t len,\n               uint32_t received_at, uint32_t now);\n/* Explicit trusted policy event; legacy THRUST/RUDDER NEVER arms.\n * Requires recent THRUST=0 AND RUDDER=50 since boot/disarm/recovery. */\nint rc_arm(rc_control *c, uint32_t now);\nvoid rc_disarm(rc_control *c);\nvoid rc_trip(rc_control *c);\n/* Explicit trusted recovery event after the fault cause is cleared. Only\n * returns to DISARMED; new neutral commands plus explicit arm are required. */\nint rc_recover(rc_control *c);\n\n#endif\n"},{"path":"reviews/codex/firmware_prototype/test_lora_control.c","text":"#include \"lora_control.h\"\n#include \u003cassert.h>\n#include \u003cstdio.h>\n#include \u003cstring.h>\n\n#define T0 \"+RCV=2,8,THRUST,0,-70,12\"\n#define T50 \"+RCV=2,9,THRUST,50,-70,12\"\n#define R50 \"+RCV=2,9,RUDDER,50,-70,12\"\n#define R80 \"+RCV=2,9,RUDDER,80,-70,12\"\n#define RECEIVE(c, s, rx, now) rc_receive(c, s, sizeof(s)-1u, rx, now)\n\nstatic void parser_tests(void)\n{\n    static const char *invalid[] = {\n        \"RCV=2,8,THRUST,0,-70,12\", \" +RCV=2,8,THRUST,0,-70,12\",\n        \"+RCV=1,8,THRUST,0,-70,12\", \"+RCV=2,7,THRUST,0,-70,12\",\n        \"+RCV=2,9,THRUST,0,-70,12\", \"+RCV=2,99999999999,THRUST,0,-70,12\",\n        \"+RCV=2,9,THRUST,-1,-70,12\", \"+RCV=2,10,THRUST,101,-70,12\",\n        \"+RCV=2,9,THRUST,0x,-70,12\", \"+RCV=2,9,THRUST,+1,-70,12\",\n        \"+RCV=2,9,THRUST, 1,-70,12\", \"+RCV=2,9,THRUST,50,-70,12junk\",\n        \"+RCV=2,9,THRUST,50,-70,12,0\", \"+RCV=2,9,THRUST,50,-70\",\n        \"+RCV=2,9,THRUST,50,,-1\", \"+RCV=2,9,THRUST,50,-,12\",\n        \"+RCV=2,9,THRUST,50,-32769,12\", \"+RCV=2,9,THRUST,50,-70,32768\",\n        \"+RCV=2,9,THRUST,50,-70,12\\n\\n\", \"+RCV=2,9,thrust,50,-70,12\",\n        \"+RCV=2,7,THRUST,,-70,12\", \"+RCV=2,8,ARM,0000,-70,12\",\n        \"+RCV=65536,8,THRUST,0,-70,12\", \"+RCV=2,-1,THRUST,0,-70,12\"\n    };\n    rc_command out = { RC_RUDDER, 42 };\n    size_t i;\n    assert(rc_parse(T0, sizeof(T0)-1u, 2, &out) == RC_PARSE_OK);\n    assert(out.kind == RC_THRUST && out.value == 0);\n    assert(rc_parse(\"+RCV=2,10,THRUST,100,-70,-5\\r\\n\", 29u, 2, &out) == RC_PARSE_OK);\n    assert(out.value == 100);\n    assert(rc_parse(R50 \"\\r\", sizeof(R50 \"\\r\")-1u, 2, &out) == RC_PARSE_OK);\n    assert(out.kind == RC_RUDDER && out.value == 50);\n    assert(rc_parse(R50 \"\\n\", sizeof(R50 \"\\n\")-1u, 2, &out) == RC_PARSE_OK);\n    for (i = 0; i \u003c sizeof(invalid)/sizeof(invalid[0]); ++i) {\n        out.kind = RC_RUDDER; out.value = 42;\n        assert(rc_parse(invalid[i], strlen(invalid[i]), 2, &out) != RC_PARSE_OK);\n        assert(out.kind == RC_RUDDER && out.value == 42);\n    }\n    for (i = 0; i \u003c sizeof(T50)-2u; ++i)\n        assert(rc_parse(T50, i, 2, &out) != RC_PARSE_OK);\n    /* An embedded NUL is a byte, never an implicit early end. */\n    {\n        char embedded[] = T50;\n        embedded[17] = '\\0';\n        assert(rc_parse(embedded, sizeof(embedded)-1u, 2, &out) != RC_PARSE_OK);\n    }\n    assert(rc_parse(NULL, 0, 2, &out) != RC_PARSE_OK);\n    assert(rc_parse(T0, sizeof(T0)-1u, 2, NULL) != RC_PARSE_OK);\n    assert(rc_parse(T0, RC_MAX_LINE_BYTES+1u, 2, &out) != RC_PARSE_OK);\n}\n\nstatic void neutral_and_arm(rc_control *c, uint32_t t)\n{\n    assert(RECEIVE(c, T0, t, t));\n    assert(RECEIVE(c, R50, t, t));\n    assert(rc_arm(c, t));\n}\n\nstatic void state_tests(void)\n{\n    rc_control c;\n    /* 100 ms is a synthetic test parameter, not a deployment requirement. */\n    assert(rc_init(&c, 2, 100));\n    assert(c.mode == RC_DISARMED && c.thrust == 0 && c.rudder == 50);\n    assert(!rc_arm(&c, 0));\n    assert(RECEIVE(&c, T50, 0, 0));\n    assert(RECEIVE(&c, R50, 0, 0));\n    assert(c.thrust == 0 && !rc_arm(&c, 0));\n    neutral_and_arm(&c, 1);\n    assert(RECEIVE(&c, T50, 2, 2) && c.thrust == 50);\n    assert(RECEIVE(&c, R80, 90, 90) && c.rudder == 80);\n    rc_tick(&c, 101);\n    assert(c.mode == RC_ARMED);\n    rc_tick(&c, 102); /* Rudder traffic cannot renew the thrust deadline. */\n    assert(c.mode == RC_FAILSAFE && c.fault == RC_LINK_EXPIRED);\n    assert(c.thrust == 0 && c.rudder == 50);\n    assert(!RECEIVE(&c, T0, 103, 103) && !rc_arm(&c, 103));\n    rc_disarm(&c);\n    assert(c.mode == RC_FAILSAFE); /* disarm never clears a latched fault */\n    assert(rc_recover(&c) && c.mode == RC_DISARMED && !rc_arm(&c, 104));\n    neutral_and_arm(&c, 104);\n    rc_trip(&c);\n    assert(c.mode == RC_FAILSAFE && c.fault == RC_EXTERNAL_FAULT);\n    assert(c.thrust == 0 && c.rudder == 50);\n    assert(rc_recover(&c));\n\n    neutral_and_arm(&c, 200);\n    assert(!RECEIVE(&c, T50, 300, 300)); /* late valid packet cannot resurrect */\n    assert(c.mode == RC_FAILSAFE);\n    assert(rc_recover(&c));\n    assert(!RECEIVE(&c, T50, 200, 301)); /* stale queued frame */\n    assert(!RECEIVE(&c, T50, 302, 301)); /* future timestamp */\n    assert(RECEIVE(&c, T0, 310, 310));\n    assert(!RECEIVE(&c, T50, 309, 311)); /* out-of-order local queue */\n    assert(RECEIVE(&c, R50, 310, 311));\n    assert(rc_arm(&c, 311));\n    assert(!RECEIVE(&c, \"+RCV=3,9,THRUST,50,-70,12\", 320, 320));\n    rc_tick(&c, 410);\n    assert(c.mode == RC_FAILSAFE); /* wrong sender did not extend freshness */\n\n    assert(rc_init(&c, 2, 100));\n    neutral_and_arm(&c, UINT32_MAX-49u);\n    rc_tick(&c, 49u);\n    assert(c.mode == RC_ARMED);\n    rc_tick(&c, 50u);\n    assert(c.mode == RC_FAILSAFE); /* unsigned clock rollover */\n    assert(rc_init(&c, 2, 100));\n    neutral_and_arm(&c, 0);\n    assert(RECEIVE(&c, T50, 90, 90));\n    rc_tick(&c, 100);\n    assert(c.mode == RC_FAILSAFE); /* throttle traffic cannot mask rudder loss */\n    assert(rc_init(&c, 2, 100));\n    assert(RECEIVE(&c, T0, 0, 0));\n    assert(RECEIVE(&c, R50, 0, 0));\n    assert(!rc_arm(&c, 100)); /* neutral evidence expires while disarmed */\n    neutral_and_arm(&c, 101);\n    rc_disarm(&c);\n    assert(c.mode == RC_DISARMED && !rc_arm(&c, 101));\n    assert(!rc_init(&c, 2, 0) && c.fault == RC_BAD_CONFIG);\n    assert(!rc_recover(&c));\n    assert(!rc_init(&c, 2, UINT32_MAX));\n    assert(!rc_init(NULL, 2, 100));\n}\n\nint main(void)\n{\n    parser_tests();\n    state_tests();\n    puts(\"PASS: strict parser and control-state test groups\");\n    return 0;\n}\n"}],"next":["Inspect independent release verification and its limitations.","Review actuator power, VCAP and PWM evidence before bench work.","Record radio, battery, ESC/BEC and harness identities.","Integrate and test protocol corrections after firmware ownership transfer.","Measure voice airtime, intelligibility and RC coexistence before radio selection."],"decisions":[["Radio hardware","Identify installed RYLR model and firmware; capture AT readback.","Required before RF commitments"],["Battery and actuator supply","Record chemistry, cell count, BEC voltage and actual harness routing.","Required before V2 po let D=window.PROJECT;const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let page=Object.keys(names).includes(location.hash.slice(1))?location.hash.slice(1):'overview',query='',bomRevision='v1',assetRevision='v1',assetChoice='',connectorChoice='';

function show(title,html){$('dialog-title').textContent=title;$('dialog-body').innerHTML=html;if(!$('dialog').open)$('dialog').showModal();}
function normalizeLink(target,source){if(/^https?:\/\//i.test(target))return {external:target};if(/^[a-z]+:/i.test(target))return {};try{return {path:new URL(target,'https://repository.invalid/'+source).pathname.slice(1)};}catch{return {};}}
function inline(s,source){let t=esc(s);t=t.replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');return t.replace(/\[([^\]]+)\]\(([^)]+)\)/g,(_,label,target)=>{const v=normalizeLink(target.replaceAll('&amp;','&'),source);return v.external?`<a href="${esc(v.external)}" target="_blank" rel="noopener">${label}</a>`:v.path?`<a href="../${encodeURI(v.path)}" data-doc="${esc(v.path)}">${label}</a>`:label;});}
function markdown(text,source){const lines=String(text).split('\n');let out='',code=false,buf=[],inList=false;const closeList=()=>{if(inList){out+='</ul>';inList=false;}};for(let i=0;i<lines.length;i++){let l=lines[i];if(l.startsWith('```')){closeList();if(code){out+='<pre><code>'+esc(buf.join('\n'))+'</code></pre>';buf=[];}code=!code;continue;}if(code){buf.push(l);continue;}if(/^\|/.test(l)&&/^\|[- :|]+\|?\s*$/.test(lines[i+1]||'')){closeList();const cells=x=>x.replace(/^\||\|\s*$/g,'').split(/(?<!\\)\|/).map(x=>inline(x.trim(),source));const head=cells(l),rows=[];i+=2;while(i<lines.length&&/^\|/.test(lines[i])){rows.push('<tr>'+cells(lines[i]).map(c=>'<td>'+c+'</td>').join('')+'</tr>');i++;}i--;out+=table(head,rows);continue;}const h=l.match(/^(#{1,4}) (.+)/);if(h){closeList();out+=`<h${h[1].length}>${inline(h[2],source)}</h${h[1].length}>`;continue;}if(/^\s*[-*] /.test(l)){if(!inList){out+='<ul>';inList=true;}out+='<li>'+inline(l.replace(/^\s*[-*] /,''),source)+'</li>';continue;}closeList();if(/^---+$/.test(l.trim()))out+='<hr>';else if(l.startsWith('> '))out+='<blockquote>'+inline(l.slice(2),source)+'</blockquote>';else if(l.trim())out+='<p>'+inline(l,source)+'</p>';}closeList();if(code)out+='<pre>'+esc(buf.join('\n'))+'</pre>';return out;}

function overview(){return intro('From working boat to reusable platform.',esc(D.purpose))+`<div class="stats"><div class="stat"><span class="small muted">V1 baseline</span><b>${D.bom.length} parts</b><span class="small">32 connected source nets</span></div><div class="stat"><span class="small muted">V2 engineering record</span><b>${D.requirements.length} requirements</b><span class="small">${D.designFindings.length} source findings</span></div><div class="stat"><span class="small muted">Design libraries</span><b>${D.images.length} views</b><span class="small">Schematics, layers & evidence</span></div><div class="stat"><span class="small muted">Release readiness</span><b>Review open</b><span class="small">Draft ≠ hardware qualification</span></div></div><div class="grid"><section class="card"><div class="row spread"><h2>V1 / fabricated baseline</h2><span class="tag">Reconstruction</span></div><img class="board-hero" src="../docs/img/v1_pcb_top.png" alt="Top render of reconstructed V1 boat controller"><div class="row section"><button class="primary" data-page="design">Explore design</button><button data-page="bom">Inspect BOM</button>${documentRef('REPORT.md','Read project report')}</div><p class="muted small section">V1: 66.548 × 37.313 mm. Original design defects are preserved and documented. Fabrication drill is inferred from v5 features.</p></section><section class="card"><h2>Engineering gates</h2><ol class="phase-list">${D.phases.map(p=>`<li><span class="phase-id">${esc(p.id)}</span><div><strong>${esc(p.title)}</strong> ${badge(p.status)}<p>${esc(p.detail)}</p>${documentRef(p.source,'Evidence')}</div></li>`).join('')}</ol></section></div><div class="notice">The future handheld includes <strong>voice, text and location</strong>. Voice performance and RC coexistence remain requirements to validate before radio selection.</div><section class="card section"><h2>Next review</h2><ol>${D.next.map(x=>`<li>${esc(x)}</li>`).join('')}</ol><button data-page="verification">View verification record</button></section>`;}
function design(){const assets=D.images.filter(x=>x.path.includes('/'+assetRevision+'_')&&matches(x));if(!assets.some(x=>x.path===assetChoice))assetChoice=assets.find(x=>x.path.includes('pcb_top'))?.path||assets.find(x=>x.path.includes('sch_root'))?.path||assets[0]?.path||'';const a=assets.find(x=>x.path===assetChoice);return intro('Design viewer','Inspect released geometry, schematic sheets and copper evidence. Each view links back to its source artifact.')+`<div class="filters"><label>Revision <select id="asset-revision"><option value="v1" ${assetRevision==='v1'?'selected':''}>V1 reconstructed</option><option value="v2" ${assetRevision==='v2'?'selected':''}>V2 draft</option></select></label><label>View <select id="asset-choice">${assets.map(x=>`<option value="${esc(x.path)}" ${x.path===assetChoice?'selected':''}>${esc(x.title)}</option>`).join('')}</select></label><label>Zoom <input id="zoom" type="range" min="100" max="350" value="100" aria-label="Image zoom"></label></div>${a?`<div class="asset-stage">${a.type==='pdf'?`<iframe src="../${encodeURI(a.path)}" title="Schematic PDF"></iframe>`:`<img id="asset-image" src="../${encodeURI(a.path)}" alt="${esc(a.title)}">`}</div><div class="row spread asset-caption"><span>${esc(a.path)}</span>${link(a.path,'Open full artifact')}</div>`:empty('No matching view is present in this snapshot.')}<div class="row section">${link(`hardware/${assetRevision==='v1'?'kicad/LoRa_Boat_Controller':'kicad_v2/LoRa_Boat_Controller_V2'}.kicad_pro`,'KiCad project')}${link(`hardware/${assetRevision==='v1'?'kicad/LoRa_Boat_Controller':'kicad_v2/LoRa_Boat_Controller_V2'}.kicad_pcb`,'PCB file')}${assetRevision==='v2'?documentRef('hardware/kicad_v2/README.md','V2 design notes'):documentRef('docs/CONVERSION_NOTES.md','Conversion notes')}</div>${assetRevision==='v2'?`<section class="notice">${inline(D.fabrication,'REPORT.md')}<p class="small">Missing board renders stay absent; no preview is fabricated from a planned design.</p></section>`:`<section class="card section"><h2>Fabrication evidence / reconstructed copper</h2><div class="compare"><div><h3>Original v5 top copper</h3><img src="../docs/img/v1_fab_F_Cu.png" alt="Original v5 top copper"></div><div><h3>KiCad top copper</h3><img src="../docs/img/v1_kicad_F_Cu.png" alt="Reconstructed top copper"></div></div><p class="small muted">Visual comparison supplements the measured XOR report; it is not a connectivity test.</p></section>`}`;}
function bom(){const rows=(bomRevision==='v1'?D.bom:D.bomV2).filter(matches);return intro('BOM & datasheets','Search reference designators, part numbers, values or manufacturers. Confidence and substitutions come from the source BOM.')+`<div class="filters"><label>Revision <select id="bom-revision"><option value="v1" ${bomRevision==='v1'?'selected':''}>V1</option><option value="v2" ${bomRevision==='v2'?'selected':''}>V2 draft</option></select></label><span>${rows.length} rows</span>${link(bomRevision==='v1'?'docs/BOM.csv':'docs/BOM_V2.csv','Open CSV')}</div><p class="muted small">Prices are dated source estimates, not live distributor quotes. A missing datasheet is shown explicitly; a suggested part is not proof of the fitted part.</p>${table(['Reference / quantity','Value & description','MPN / manufacturer','Confidence / source price','Details'],rows.map((r)=>{const refs=r.Ref||r.Refs;return `<tr><td><strong>${esc(refs)}</strong><br>Qty ${esc(r.Qty)}</td><td>${esc(r.Value)}<br><small class="muted">${esc(r.Description)}</small></td><td><code>${esc(r.MPN||'Not specified')}</code><br>${esc(r.Manufacturer||'—')}</td><td>${esc(r.Confidence||'V2 proposed')}<br>${r['Unit price qty1 USD']?'$'+esc(r['Unit price qty1 USD']):'—'}</td><td><button data-part="${esc(refs)}">Inspect</button></td></tr>`;}))}<section class="section"><h2>Manufacturer references</h2><div class="connector-grid">${D.datasheets.filter(matches).map(d=>`<article class="card"><h3>${esc(d.title)}</h3><p class="small muted">${esc(d.maker)}</p><p class="small">${esc(d.note)}</p><a href="${esc(d.url)}" target="_blank" rel="noopener">Open manufacturer document ↗</a></article>`).join('')}</div></section>`;}
function partDetail(ref){const p=(bomRevision==='v1'?D.bom:D.bomV2).find(r=>(r.Ref||r.Refs)===ref);if(!p)return;const ds=D.datasheets.filter(d=>bomRevision==='v1'?d.refs.includes(ref):p.MPN&&d.title.startsWith(String(p.MPN).slice(0,7)));show(ref,`<h3>${esc(p.Description)}</h3>${table(['Field','Source BOM value'],Object.entries(p).map(([k,v])=>`<tr><td>${esc(k)}</td><td>${esc(v||'Not specified')}</td></tr>`))}<h3 class="section">Datasheets</h3>${ds.length?ds.map(d=>`<p><a href="${esc(d.url)}" target="_blank" rel="noopener">${esc(d.title)}</a> — ${esc(d.note)}</p>`).join(''):'<p class="muted">No verified exact-part datasheet link has been added for this row. See the datasheet research notes before substituting.</p>'}${documentRef('docs/research/DATASHEET_NOTES.md','Research notes')}`);}
function atlas(){const list=D.connectors.filter(matches);const c=D.connectors.find(x=>x.id===connectorChoice);return intro('Connector atlas','Trace every external pin to the net, MCU pad and firmware behavior. Expected bench readings are proposed checks, not measured results.')+(list.length?`<div class="connector-grid">${list.map(c=>`<button data-connector="${esc(c.id)}"><b>${esc(c.title||c.id)}</b><small>${c.pins?.length||0} pins · ${esc(c.id)}</small></button>`).join('')}</div>`:empty('Connector atlas is being recovered from the interrupted session; no pin data is invented.'))+(c?`<section class="card section"><div class="row spread"><h2>${esc(c.title||c.id)}</h2>${documentRef(c.doc,'Open atlas page')}</div><p>${esc(c.description)}</p>${(c.notes||[]).map(n=>`<p class="notice">${esc(n)}</p>`).join('')}${table(['Pin','Net / MCU','Firmware','Electrical / direction','Expected check'],(c.pins||[]).map(p=>`<tr><td><strong>${esc(p.pin)}</strong></td><td><code>${esc(p.net)}</code><br>${esc(p.allegro_net)}<br>${esc(p.mcu)}</td><td>${esc(p.firmware)}<br>${(p.evidence||[]).map(e=>`<button data-doc="${esc(e.path)}">${esc(e.path.split('/').pop())}${e.line?':'+e.line:''}</button>`).join(' ')}</td><td>${esc(p.voltage)}<br>${esc(p.direction)}</td><td>${esc(p.bench)}</td></tr>`))}</section>`:'');}
function software(){const src=D.sources.filter(matches),prototype=src.filter(x=>x.path.includes('/firmware_prototype/'));return intro('Software, protocol & application','The current HAL application, proposed corrections, and successor implementation plan are separate engineering artifacts.')+`<div class="flow"><div><strong>Application</strong><p>Vehicle control + navigation<br>Handheld voice / text / location</p></div><div><strong>Protocol services</strong><p>Identity, framing, freshness<br>Control priority and delivery state</p></div><div><strong>Safety & drivers</strong><p>Arm / failsafe / watchdog<br>UART, GNSS, PWM and sensors</p></div><div><strong>Hardware</strong><p>STM32 + radio adapter<br>Protected power and external I/O</p></div></div><section class="notice"><strong>Deployment status:</strong> live V1 firmware preserves the original behavior. The standalone correction code is a review prototype, not an integrated or hardware-qualified firmware release.</section><div class="grid"><section class="card"><h2>Current on-air application</h2><p><code>THRUST,0…100</code> and <code>RUDDER,0…100</code> arrive as separate payloads. GPS coordinates are sent periodically.</p><p>Current gaps include command expiry, strict sender/length validation, safe buffer handoff, UART error recovery and fix freshness.</p>${documentRef('docs/research/FIRMWARE_REVIEW_NOTES.md','Firmware audit')}</section><section class="card"><h2>Proposed correction path</h2><ol><li>Validate complete frames before actuation.</li><li>Require explicit arming and fresh commands.</li><li>Latch failsafe; reconnect stays disarmed.</li><li>Align generated startup configuration with C.</li><li>Test timing under radio, voice and telemetry load.</li></ol>${documentRef('firmware/V2_FIRMWARE_PLAN.md','V2 firmware plan')}</section></div><section class="section"><h2>Source and review artifacts</h2><div class="list">${src.map(s=>`<div class="list-item row spread"><div><strong>${esc(s.path.split('/').pop())}</strong><div class="path">${esc(s.path)}</div></div>${docbtn(s.path,s.path.includes('prototype')?'Inspect proposal':'Read source')}</div>`).join('')}</div>${!prototype.length?'<p class="muted">No correction prototype captured in this snapshot.</p>':''}</section><section class="card section"><h2>Voice, text and location</h2><p>Compare live half-duplex push-to-talk with recorded voice delivery. Establish codec/framing airtime, useful speech quality, delay and the maximum blocking interval seen by RC control before committing to a radio.</p>${documentRef('reviews/codex/PLATFORM_CONCEPT.md','Platform architecture')}</section>`;}
function verification(){const independent=D.independent,checks=independent?.checks||[];const layers=D.reports.xor_report?.data?.layers||{};const drc=D.reports.drc?.data;const violations=drc?.violations||[];return intro('Verification & provenance','A report is tied to its inputs. Independent results are shown separately from primary-agent reports and design intent.')+`<section class="card"><h2>Independent release review</h2>${independent?`<p>Revision <code>${esc(independent.revision)}</code> · ${esc(independent.generated_at)}</p>${table(['Check','Verdict','Evidence'],checks.filter(matches).map(c=>`<tr><td>${esc(c.name)}</td><td>${badge(c.status)}<p>${esc(c.detail)}</p></td><td>${typeof c.evidence==='string'?link(c.evidence,'Evidence'):esc(JSON.stringify(c.evidence||''))}</td></tr>`))}<ul>${(independent.limitations||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul>${documentRef('reviews/codex/S2_VERIFICATION.md','Independent report')}`:empty('Independent verification was interrupted. Raw outputs exist, but there is no completed verdict yet.')}</section><section class="card section"><h2>Primary V1 report snapshot</h2><p class="small muted">These values are read from working report files; read the independent row above for corroboration.</p><div class="stats"><div class="stat">DRC errors<b>${drc?violations.filter(x=>x.severity==='error').length:'—'}</b></div><div class="stat">DRC warnings<b>${drc?violations.filter(x=>x.severity==='warning').length:'—'}</b></div><div class="stat">Unconnected entries<b>${drc?drc.unconnected_items?.length??'—':'—'}</b></div><div class="stat">Report date<b style="font-size:16px">${esc(drc?.date||'Unavailable')}</b></div></div>${table(['Layer','XOR / copper union','Pixel scale','Source'],Object.entries(layers).map(([k,v])=>`<tr><td>${esc(k)}</td><td>${Number(v.xor_pct_of_union).toFixed(3)}%</td><td>${esc(v.scale_px_per_mil)} px/mil</td><td>${link(D.reports.xor_report.path,'Raw JSON')}</td></tr>`))}<div class="notice">Drill comparison uses inferred v5 hole locations. It does not prove identity to an original final v5 NC drill file.</div></section><section class="card section"><h2>V2 working reports</h2><p>Active draft reports may change during routing. Their existence does not constitute independent V2 sign-off.</p>${Object.entries(D.v2Reports).map(([name,r])=>`<p>${link(r.path,name)}</p>`).join('')||'<p>No V2 report files captured.</p>'}</section><section class="card section"><h2>Snapshot manifest</h2><p>HEAD <code>${esc(D.head)}</code> · generated ${esc(D.generated_at)}</p><p>${D.inputs_changed_during_build.length?badge('Inputs changed during build — refresh required'):badge('Inputs stable during capture')}</p><details><summary>${Object.keys(D.manifest).length} source hashes</summary>${table(['Source','SHA-256'],Object.entries(D.manifest).filter(matches).map(([p,h])=>`<tr><td>${esc(p)}</td><td><code>${esc(h)}</code></td></tr>`))}</details></section>`;}
function traceability(){const f=D.designFindings.filter(matches),r=D.requirements.filter(matches);return intro('Findings → requirements','Follow the reason for a change through its acceptance test. A requirement being written is not evidence that it is implemented.')+`<section class="card"><h2>V1 findings / successor disposition</h2>${table(['Finding','Severity','Observation & evidence','Requirement links'],f.map(x=>`<tr><td><strong>${esc(x.id)}</strong></td><td>${esc(x.severity)}</td><td>${inline(x.finding,'docs/V1_DESIGN_REVIEW.md')}<p class="small muted">${esc(x.evidence)}</p></td><td>${x.requirements.map(id=>`<button data-req="${esc(id)}">${esc(id)}</button>`).join(' ')||inline(x.disposition,'docs/V1_DESIGN_REVIEW.md')}</td></tr>`))}</section><section class="card section"><h2>Measurable requirements</h2>${table(['ID','Requirement','Verification'],r.map(x=>`<tr><td><button data-req="${esc(x.id)}">${esc(x.id)}</button></td><td>${inline(x.requirement,x.source)}</td><td>${esc(x.verify)}</td></tr>`))}</section><section class="section"><h2>Independent intake findings</h2><div class="list">${D.findings.filter(matches).map(x=>`<article class="list-item"><div class="row spread"><h3>${esc(x.id)} · ${esc(x.title)}</h3>${badge(x.status)}</div><p>${esc(x.detail)}</p></article>`).join('')}</div></section>`;}
function decisions(){let notes='';try{notes=localStorage.getItem('lora-review-notes')||'';}catch{}return intro('Decisions, next steps & handoff','Keep the original baseline intact, resolve the next measurable question, and carry evidence into the next session.')+`<section class="card"><h2>Open decisions / primary working defaults</h2><p class="small muted">Defaults are engineering assumptions awaiting confirmation, not recorded user decisions.</p>${table(['#','Decision','Working default'],D.decisionRows.filter(matches).map(d=>`<tr><td>${esc(d.id)}</td><td>${esc(d.question)}</td><td>${esc(d.default)}</td></tr>`))}${documentRef('BLOCKERS.md','Full decision record')}</section><div class="grid section"><section class="card"><h2>Next bounded packets</h2><ol>${D.next.map(x=>`<li>${esc(x)}</li>`).join('')}</ol>${documentRef('reviews/codex/README.md','Resume instructions')}</section><section class="card notes"><h2>Your review notes</h2><p class="small muted">Stored in this browser only. Notes do not approve a design or change repository status. Export the handoff to keep a copy.</p><label class="sr" for="notes">Local review notes</label><textarea id="notes" placeholder="Record a question, observed hardware detail, or decision…">${esc(notes)}</textarea><p class="small" id="note-state">${notes?'Saved locally':'No saved notes'}</p></section></div><section class="card section"><h2>Changes since previous viewer build</h2>${D.changed_since_previous.length?`<ul>${D.changed_since_previous.map(p=>`<li><code>${esc(p)}</code></li>`).join('')}</ul>`:'<p class="muted">First capture, or no captured source hashes changed.</p>'}</section>`;}
function documents(){const docs=D.documents.filter(matches);return intro('Document library','Read the project story, implementation, test plans and source evidence in one place.')+`<div class="list">${docs.map(d=>`<article class="list-item row spread"><div><h3>${esc(d.title)}</h3><div class="path">${esc(d.path)}</div></div>${docbtn(d.path,'Read')}</article>`).join('')}</div><section class="card section"><h2>CAD, images and downloadable source map</h2>${table(['Artifact','Open'],D.available_paths.filter(matches).map(p=>`<tr><td><code>${esc(p)}</code></td><td>${link(p,'Open file')}</td></tr>`))}</section>`;}
const renders={overview,design,bom,atlas,software,verification,traceability,decisions,documents};
function render(){document.title=names[page]+' • LoRa Lab';$('nav').innerHTML=Object.entries(names).map(([id,n])=>`<button data-page="${id}" ${id===page?'aria-current="page"':''}>${n}</button>`).join('');$('main').innerHTML=renders[page]();$('revision').textContent=D.head.slice(0,8);$('snapshot-label').textContent=D.branch+' · '+D.head.slice(0,7);$('footer').textContent='Captured '+new Date(D.generated_at).toLocaleString()+' · Local repository viewer · Datasheets open at their publishers · Hardware validation status is explicit.';}
function navigate(p){page=p;query='';$('search').value='';history.replaceState(null,'','#'+p);render();window.scrollTo({top:0,behavior:'instant'});}
document.addEventListener('click',e=>{const b=e.target.closest('button,a');if(!b)return;if(b.dataset.page)navigate(b.dataset.page);if(b.dataset.doc){if(openDocument(b.dataset.doc))e.preventDefault();}if(b.dataset.part)partDetail(b.dataset.part);if(b.dataset.connector){connectorChoice=b.dataset.connector;render();}if(b.dataset.req){const r=D.requirements.find(x=>x.id===b.dataset.req);if(r)show(r.id,`<h3>Requirement</h3><p>${inline(r.requirement,r.source)}</p><h3>Source findings</h3><p>${esc(r.findings)}</p><h3>Acceptance method</h3><p>${esc(r.verify)}</p>${documentRef(r.source,'Full requirements document')}`);}});
document.addEventListener('change',e=>{if(e.target.id==='bom-revision'){bomRevision=e.target.value;render();}if(e.target.id==='asset-revision'){assetRevision=e.target.value;assetChoice='';render();}if(e.target.id==='asset-choice'){assetChoice=e.target.value;render();}});
document.addEventListener('input',e=>{if(e.target.id==='zoom'&&$('asset-image'))$('asset-image').style.width=e.target.value+'%';if(e.target.id==='notes'){try{localStorage.setItem('lora-review-notes',e.target.value);$('note-state').textContent='Saved in this browser';}catch{$('note-state').textContent='Storage unavailable; use Export handoff to keep notes.';}}});
$('search').addEventListener('input',e=>{query=e.target.value.toLowerCase().trim();render();});$('dialog-close').onclick=()=>$('dialog').close();$('dialog').addEventListener('click',e=>{if(e.target===$('dialog'))$('dialog').close();});
$('refresh').onclick=async()=>{if(location.protocol==='file:'){show('Refresh the snapshot','<p>This offline page includes its data. Run <code>node pm/tools/build.mjs</code> from the repository root, then reload this page. With the local server running, this button reads the latest generated status.</p>');return;}try{const res=await fetch('status.json',{cache:'no-store'});if(!res.ok)throw Error(res.status);const fresh=await res.json();if(fresh.schema!==1)throw Error('Unsupported schema');D=fresh;render();$('announce').textContent='Snapshot refreshed';}catch{show('Snapshot not refreshed','<p>The saved snapshot remains available. Regenerate status.json and check the local viewer server.</p>');}};
$('export').onclick=()=>{let notes=$('notes')?.value||'';if(!notes)try{notes=localStorage.getItem('lora-review-notes')||'';}catch{}const txt='# LoRa review handoff\n\nCaptured: '+D.generated_at+'\nBranch / HEAD: '+D.branch+' / '+D.head+'\n\n## Next review\n'+D.next.map(x=>'- '+x).join('\n')+'\n\n## Local notes (not design approval)\n'+notes+'\n\n## Context\nRead pm/README.md, HANDOFF.md and FILE_OWNERSHIP.md before writing. Keep primary CAD/firmware ownership intact. Voice + text + location are required. Review reported and independent results separately.\n';const url=URL.createObjectURL(new Blob([txt],{type:'text/markdown'}));const a=document.createElement('a');a.href=url;a.download='lora-review-handoff.md';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};
render();
</script></body></html>
