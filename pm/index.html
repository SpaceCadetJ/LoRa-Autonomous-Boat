"67","Qty":"1","Refs":"TP7","Value":"PPS","MPN":"","Manufacturer":"","Description":"","Footprint":"TestPoint:TestPoint_Pad_D1.5mm","Sheet":"Navigation","Unit price qty1 USD":"","Ext price USD":""},{"Item":"68","Qty":"4","Refs":"H1 H2 H3 H4","Value":"M3","MPN":"","Manufacturer":"","Description":"Mounting hole","Footprint":"MountingHole:MountingHole_3.2mm_M3","Sheet":"Power","Unit price qty1 USD":"","Ext price USD":""},{"Item":"","Qty":"118","Refs":"TOTAL (board only, qty 1, catalogue prices as of 2026-09-16)","Value":"","MPN":"","Manufacturer":"","Description":"","Footprint":"","Sheet":"","Unit price qty1 USD":"","Ext price USD":"53.80"}],"requirements":[{"id":"REQ-RF-01","requirement":"The LoRa module model and firmware version shall be identified at boot (`AT+VER`), every configuration command shall be acknowledged, and the resulting parameters read back (`AT+PARAMETER?`) and logged before the link is declared up.","findings":"F-RF-03, F-RF-06","verify":"Bench: swap module, inject `+ERR`, confirm the node refuses to arm with wrong parameters","source":"docs/V2_REQUIREMENTS.md"},{"id":"REQ-RF-02","requirement":"Operating point: SF7 or SF8, BW 125 kHz, CR 4/5 **[default SF7]**, with automatic fallback to SF9/SF10 when the handset RSSI \u003c −110 dBm for > 5 s, and recovery when > −100 dBm for > 10 s. Both ends switch together via a signalled profile change.","findings":"F-RF-02, §2.2","verify":"Range test with attenuator; log SF transitions","source":"docs/V2_REQUIREMENTS.md"},{"id":"REQ-RF-03","requirement":"One command packet carries thrust, rudder, arm flag, 8-bit sequence number and CRC-8 in ≤ 8 payload bytes; handset sends it at ≥ 5 Hz **[default 10 Hz at SF7]**; telemetry ≤ 1 Hz and never longer than 120 ms on air at the current SF.","findings":"F-RF-02, F-RF-05","verify":"Logic analyser on the module UART: command period and telemetry duration","source":"docs/V2_REQUIREMENTS.md"},{"id":"REQ-RF-04","requirement":"The board provides a 50 Ω antenna port (SMA or u.FL bulkhead) with a controlled-impedance feed ≤ 20 mm long and a copper/component keep-out of ≥ 5 mm around the feed and connector; no antenna sits on the module header. **[default: RYLR998_M4 (I-PEX) on the existing 1×5 pinout, u.FL-to-SMA pigtail to a 2 dBi whip]**","findings":"F-RF-04, §2.1","verify":"Impedance by TDR/VNA or by stack-up calculation record; range test ≥ 1.5 km over water at SF7 with 12 dB margin","source":"docs/V2_REQUIREMENTS.md"},{"id":"REQ-RF-05","requirement":"The buck converters, ESC cabling and servo cabling shall be ≥ 25 mm from the antenna feed. With the default RYLR998_M4 (u.FL, antenna on an external pigtail) no on-board copper void is needed under the module; if an antenna-equipped RYLR998 is fitted instead, it mounts hanging off the right board edge (antenna outboard) and the pour is voided under the antenna on both layers.","findings":"F-RF-04","verify":"Layout review; DRC keep-out rule areas (only for the on-board-antenna variant)","source":"docs/V2_REQUIREMENTS.md"},{"id":"REQ-RF-06","requirement":"Every received command shall be rejected unless it has the expected sender address, a valid CRC, and a sequence number newer than the last accepted one (modulo 256); rejected packets are counted and reported in telemetry.","findings":"F-RF-05","verify":"Fuzz the UART with corrupted frames; count rejects, confirm no actuator change","source":"docs/V2_REQUIREMENTS.md"},{"id":"REQ-RF-07","requirement":"Link statistics (RSSI, SNR, reject count, command age) are available in telemetry and on the console.","findings":"F-RF-05","verify":"Read telemetry","source":"docs/V2_REQUIREMENTS.md"},{"id":"REQ-CTL-01","requirement":"If no valid command is accepted for `T_loss` **[default 1.0 s]**, thrust goes to idle (1000 µs) and rudder to neutral (1500 µs) within 20 ms of the timeout and stays there until a fresh arm sequence.","findings":"F-RF-01","verify":"Logic analyser on both PWM pins while the handset is switched off; measure time from last packet to idle pulse","source":"docs/V2_REQUIREMENTS.md"},{"id":"REQ-CTL-02","requirement":"The independent watchdog (IWDG) runs from the LSI with a ≤ 500 ms window; a watchdog or fault reset drives both PWM outputs to idle/neutral before any radio traffic is processed; fault handlers set outputs safe and reset within 100 ms.","findings":"F-MCU-06","verify":"Force a fault (stack overflow test), verify outputs and reset cause in the boot log","source":"docs/V2_REQUIREMENTS.md"},{"id":"REQ-CTL-03","requirement":"At power-on, reset and brown-out the PWM pins are held so that the ESC sees ≤ 1000 µs or no pulse (pull-down on the ESC signal line) and the servo sees no pulse until firmware is running.","findings":"F-CTL-03, F-CTL-04","verify":"Scope both pins through 20 power cycles and 10 resets","source":"docs/V2_REQUIREMENTS.md"},{"id":"REQ-CTL-04","requirement":"The vehicle has states Disarmed / Armed / Failsafe (`reviews/codex/PLATFORM_CONCEPT.md`); arming requires an explicit handset command with the throttle at zero; reconnect after link loss does not re-arm.","findings":"F-CTL-03","verify":"State-machine test vectors","source":"docs/V2_REQUIREMENTS.md"},{"id":"REQ-CTL-05","requirement":"ESC and servo signal outputs pass through a 100 Ω series resistor and a TVS (working voltage 5 V); the outputs are 5 V-capable (level shifter or open-drain with pull-up to the actuator rail) so the ESC's 5 V logic threshold is met.","findings":"F-CTL-02","verify":"ESD gun ±8 kV contact on the header; ESC arms reliably","source":"docs/V2_REQUIREMENTS.md"},{"id":"REQ-CTL-06","requirement":"Net names, header silkscreen and firmware pin defines use the same function names (ESC, SERVO) derived from one pin table (`firmware/V2_FIRMWARE_PLAN.md`); the schematic, board and `.ioc` are generated/checked from that table.","findings":"F-CTL-04","verify":"`check_netlist.py` equivalent for V2 + a pin-table diff in CI","source":"docs/V2_REQUIREMENTS.md"},{"id":"REQ-CTL-07","requirement":"Rudder and thrust limits, trim and the failsafe values are configuration parameters stored in flash, changeable only while disarmed.","findings":"M","verify":"Console test","source":"docs/V2_REQUIREMENTS.md"},{"id":"REQ-PWR-01","requirement":"Battery input: reverse-polarity protection (P-FET), fuse **[default 3 A blade or PTC on the logic feed]**, 33 V TVS, ≥ 47 µF bulk capacitance; input range 7-25.2 V **[default 2S-6S LiPo; decision 2]**.","findings":"F-PWR-01, F-PWR-03","verify":"Reverse the battery for 10 s; surge test; Vin sweep","source":"docs/V2_REQUIREMENTS.md"},{"id":"REQ-PWR-02","requirement":"Battery terminal rated for the ESC current if the ESC is fed through the board **[default: ESC fed directly from the battery; the board takes ≤ 1 A through an XT30 or 5.08 mm screw terminal]**.","findings":"F-PWR-01","verify":"Connector rating vs measured current","source":"docs/V2_REQUIREMENTS.md"},{"id":"REQ-PWR-03","requirement":"Actuator power rail (servo/ESC BEC, 5-6 V) is a separate net from the 3.3 V logic rail with no DC path between them; the actuator header power pin is that rail, never +3V3.","findings":"F-CTL-01","verify":"Continuity/ohmmeter test; back-feed test with 5 V on the header pin while the board is off","source":"docs/V2_REQUIREMENTS.md"},{"id":"REQ-PWR-04","requirement":"The servo rail is sourced either from the ESC BEC through the SERVO header **[default]** or from an on-board 5 V/2 A buck (populate option); a Schottky OR-ing prevents BEC/board contention.","findings":"F-CTL-01","verify":"Power-tree review; both sources connected","source":"docs/V2_REQUIREMENTS.md"},{"id":"REQ-PWR-05","requirement":"Battery voltage is measured with ≥ 1 % accuracy over 6-26 V through a filtered divider (≤ 10 kΩ source impedance, 100 nF), and the firmware acts on two thresholds (warning, failsafe) with hysteresis.","findings":"F-PWR-04","verify":"Calibrated supply sweep","source":"docs/V2_REQUIREMENTS.md"},{"id":"REQ-PWR-06","requirement":"Board current sense (≤ 3 A, 1 % shunt + amplifier) on the logic feed **[default: fitted]**; ESC current via ESC telemetry UART if the ESC supports it (optional).","findings":"F-CTL-05","verify":"Compare with a bench meter","source":"docs/V2_REQUIREMENTS.md"},{"id":"REQ-PWR-07","requirement":"The 3.3 V rail delivers ≥ 600 mA with ≤ 50 mV ripple at the LoRa module pins during a 145 mA TX burst; LoRa supply keeps the V1 pi-filter with all capacitors returned to GND.","findings":"F-PWR-06","verify":"Scope at LORAMODULE pin 1 during `AT+SEND`","source":"docs/V2_REQUIREMENTS.md"},{"id":"REQ-PWR-08","requirement":"Status LEDs: power, link (blinks on accepted command), GNSS fix, fault/failsafe.","findings":"F-PWR-05","verify":"Visual","source":"docs/V2_REQUIREMENTS.md"},{"id":"REQ-NAV-01","requirement":"GNSS module with ≥ 5 Hz update, PPS output, backup power input, on a 1×6 header **[default: u-blox NEO-M8N/M9N-class breakout pinout VCC/GND/TX/RX/PPS/VBAT]** at 115200 baud.","findings":"F-NAV-03","verify":"Log rate and PPS with a counter","source":"docs/V2_REQUIREMENTS.md"},{"id":"REQ-NAV-02","requirement":"PPS is wired to a timer input-capture pin; no GPIO output drives any GNSS header pin.","findings":"F-NAV-01","verify":"Pin table review; scope","source":"docs/V2_REQUIREMENTS.md"},{"id":"REQ-NAV-03","requirement":"GNSS parsing is DMA/ring-buffer based; a fix older than `T_fix` **[default 2 s]** is invalid for control and reported as stale in telemetry.","findings":"F-NAV-02","verify":"Replay NMEA with gaps and `V` sentences","source":"docs/V2_REQUIREMENTS.md"},{"id":"REQ-NAV-04","requirement":"The debug console is a separate UART (see REQ-DBG-01); nothing but GNSS traffic is on the GNSS UART.","findings":"F-NAV-02","verify":"Sniff the GNSS RX line","source":"docs/V2_REQUIREMENTS.md"},{"id":"REQ-NAV-05","requirement":"A 6/9-axis IMU with magnetometer **[default: ICM-20948 or BMI270+BMM150 on I²C/SPI, decision 5]** provides heading at ≥ 50 Hz; magnetometer placed ≥ 15 mm from the buck inductor and ESC cables.","findings":"F-NAV-03","verify":"Heading error \u003c 3° after calibration on a turntable","source":"docs/V2_REQUIREMENTS.md"},{"id":"REQ-NAV-06","requirement":"Heading hold and waypoint following run at 20 Hz with configurable gains; loss of heading source degrades to manual rudder, never to \"hold last output\".","findings":"M","verify":"HIL test with logged commands","source":"docs/V2_REQUIREMENTS.md"},{"id":"REQ-MCU-01","requirement":"VCAP_1: 4.7 µF X5R/X7R (ESR \u003c 1 Ω) between pin 30 and VSS, within 5 mm of the pin.","findings":"F-MCU-01","verify":"Schematic/layout review; 1.2 V ripple scope","source":"docs/V2_REQUIREMENTS.md"},{"id":"REQ-MCU-02","requirement":"VBAT tied to VDD (100 nF); BOOT0 pulled to GND with 10 kΩ and jumper-able to VDD.","findings":"F-MCU-02","verify":"Continuity","source":"docs/V2_REQUIREMENTS.md"},{"id":"REQ-MCU-03","requirement":"8 MHz (or 25 MHz) HSE crystal with load capacitors per DS10693; USB and UART timing derive from it; HSI remains as fallback with a logged clock-security event.","findings":"F-MCU-03","verify":"Measure MCO; UART error \u003c 0.2 %","source":"docs/V2_REQUIREMENTS.md"},{"id":"REQ-MCU-04","requirement":"32.768 kHz LSE footprint (populate option) for RTC timestamps **[default: fitted]**.","findings":"F-MCU-03","verify":"RTC drift","source":"docs/V2_REQUIREMENTS.md"},{"id":"REQ-MCU-05","requirement":"NRST has 100 nF to GND and is available on the debug header and a push-button.","findings":"F-MCU-04","verify":"—","source":"docs/V2_REQUIREMENTS.md"},{"id":"REQ-DBG-01","requirement":"A dedicated console: USB-C (USB FS, device) **[default]** or a 3-pin 3.3 V UART header; SWD via the same 10-pin Cortex connector as V1.","findings":"F-MCU-05","verify":"Enumerates as CDC; SWD attach","source":"docs/V2_REQUIREMENTS.md"},{"id":"REQ-DBG-02","requirement":"Four status LEDs (REQ-PWR-08) and one user button.","findings":"F-PWR-05","verify":"—","source":"docs/V2_REQUIREMENTS.md"},{"id":"REQ-DBG-03","requirement":"Test points on: ESC signal, SERVO signal, 3V3, actuator rail, VIN, GND, PPS — labelled on silkscreen.","findings":"F-MECH-04","verify":"—","source":"docs/V2_REQUIREMENTS.md"},{"id":"REQ-DBG-04","requirement":"LoRa NRST is driven by the MCU; the driver waits for `+READY`, checks every reply, and reports failures on the console.","findings":"F-RF-06","verify":"Hold the module in reset; watch the recovery","source":"docs/V2_REQUIREMENTS.md"},{"id":"REQ-FW-01","requirement":"Firmware plan (`firmware/V2_FIRMWARE_PLAN.md`): DMA UARTs with error callbacks, command timeout, IWDG, arm state machine, GNSS fix age, ADC battery, link-loss test procedure. `main.c` of V1 is not modified.","findings":"F-MCU-06, F-RF-01","verify":"Plan reviewed; V2 firmware project separate","source":"docs/V2_REQUIREMENTS.md"},{"id":"REQ-FW-02","requirement":"A regenerated CubeMX project must not change startup pulse values or NVIC settings (all user code inside USER CODE blocks; `.ioc` and code agree).","findings":"F-CTL-04","verify":"Regenerate and diff","source":"docs/V2_REQUIREMENTS.md"},{"id":"REQ-MECH-01","requirement":"Four M3 mounting holes (3.2 mm, 6 mm keep-out) on a rectangular pattern **[default 72 × 38 mm on an 80 × 46 mm board; decision 7 — the 70 × 40 mm first cut could not hold the 118 parts without courtyard overlaps]**, board size ≤ 100 × 60 mm (JLCPCB/PCBWay 2-layer prototype price break).","findings":"F-MECH-01","verify":"Drill check; `placement_check.py` 0 courtyard overlaps","source":"docs/V2_REQUIREMENTS.md"},{"id":"REQ-MECH-02","requirement":"All connectors on two opposite edges, keyed (JST XH/PH or locking headers) **[default: JST XH for power/actuators, 2.54 mm headers with polarity marks for modules; decision 6]**; the board accepts conformal coating (no exposed adjustable parts).","findings":"F-MECH-05","verify":"Assembly review","source":"docs/V2_REQUIREMENTS.md"},{"id":"REQ-MECH-03","requirement":"Design rules: 6 mil track / 6 mil clearance minimum, 8 mil pour clearance, 12 mil signal tracks where possible, 20 mil power, 0.3/0.6 mm vias; DRC 0 errors with the project's rule file and no exceptions.","findings":"F-MECH-02","verify":"`kicad-cli pcb drc`","source":"docs/V2_REQUIREMENTS.md"},{"id":"REQ-MECH-04","requirement":"Vias tented or with 1:1 mask; no pour copper of another net inside a via's mask opening.","findings":"F-MECH-03","verify":"DRC solder-mask bridge = 0","source":"docs/V2_REQUIREMENTS.md"},{"id":"REQ-MECH-05","requirement":"Silkscreen: refdes and function labels for every connector pin 1 and every test point, diode polarity marks, no silk over pads; two fiducials.","findings":"F-MECH-04","verify":"DRC silk checks = 0","source":"docs/V2_REQUIREMENTS.md"},{"id":"REQ-CAN-01","requirement":"**[default: CAN dropped; decision 4]**. If kept: a 3.3 V-capable transceiver (TCAN334G or TCAN1044AV with VIO) on CAN1_RX = PA11 / CAN1_TX = PA12, STB on a GPIO with pull-down, 120 Ω termination jumper, ESD.","findings":"F-CAN-01","verify":"Loopback with a second node","source":"docs/V2_REQUIREMENTS.md"}],"designFindings":[{"id":"F-RF-01","severity":"Safety","finding":"No link-loss failsafe. The last THRUST/RUDDER value persists forever when the handset goes silent; `HAL_GetTick()` is used only for the 5 s telemetry timer. PWM is timer hardware, so a hung CPU is indistinguishable from a healthy one at the ESC.","evidence":"FW §1, `main.c:454-486`, `474-483`","disposition":"REQ-CTL-01/02/03 (command age timeout, watchdog, boot-safe outputs)","requirements":["REQ-CTL-01","REQ-FW-01"]},{"id":"F-RF-02","severity":"Functional","finding":"SF12/BW125 makes the link ~1 command/s: a 9-byte command is 1.19 s on air, the 24-byte GPS frame 1.68 s every 5 s, so the boat is deaf 34 % of the time and two commands (THRUST+RUDDER) take ~2.4 s. See §2 for the airtime table.","evidence":"`main.c:67, 449, 477`; §2","disposition":"REQ-RF-02/03 (single combined command packet, SF7-SF9, ≥ 5 Hz)","requirements":["REQ-RF-02","REQ-RF-03"]},{"id":"F-RF-03","severity":"Functional","finding":"The firmware's `AT+PARAMETER=12,7,1,4` is only valid for the RYLR896 (SF 7-12); an RYLR998 rejects SF12 with `+ERR` (SF 5-11) and silently keeps its stored settings because the firmware never reads replies. The board's 1×5 header matches the RYLR998 pinout (VDD, NRST, RXD, TXD, GND); the RYLR896 has a **six**-pin header (pin 5 NC, pin 6 GND) and would not fit. Which module is installed is the first decision in `BLOCKERS.md`.","evidence":"DS-6a/6b; FW §3; `pstxnet` LORAMODULE pins 1-5","disposition":"REQ-RF-01 (module identified, parameters read back)","requirements":["REQ-RF-01"]},{"id":"F-RF-04","severity":"Reliability","finding":"Antenna: the module's helical antenna (gain not published) sits wherever the module lands on the 1×5 header, 10-20 mm from the 1.25 MHz buck (U6/L1/D21 are 25 mm away on the left) and next to the ESC/servo headers. The designers did void both copper pours under the module (580 × 706 mil rule areas, both layers), which is correct practice. No u.FL/SMA, no keep-out on the top for the ESC cables.","evidence":"`hardware/kicad/_build/v5_board.json` pour_keepouts; films","disposition":"REQ-RF-04/05 (external antenna connector, controlled feed, keep-out)","requirements":["REQ-RF-04","REQ-RF-05"]},{"id":"F-RF-05","severity":"Reliability","finding":"No application-layer integrity: `+RCV=` payloads are parsed without sender-address check, sequence number or checksum; UART bytes with framing errors are delivered as data and a corrupted digit becomes a thrust value.","evidence":"FW §3, §7; `main.c:298-350`, HAL `hal_uart.c:2408-2411`","disposition":"REQ-RF-06 (framed, sequenced, CRC'd command packet; sender check)","requirements":["REQ-RF-03","REQ-RF-06","REQ-RF-07"]},{"id":"F-RF-06","severity":"Reliability","finding":"LoRa reset (PA3 → LORAMODULE-4) is never driven; AT replies (`+OK/+ERR/+READY`) are never read; init relies on a fixed 1.5 s delay.","evidence":"FW §3; `main.c:438, 445-449`","disposition":"REQ-DBG-04 (driver with readback)","requirements":["REQ-RF-01","REQ-DBG-04"]},{"id":"F-CTL-01","severity":"Safety","finding":"Both actuator headers have pin 1 on **+3V3** (the MCU logic rail). A standard servo needs 4.8-6 V and 0.5-2 A; an ESC with a BEC drives 5 V *into* pin 1. With the 3.3 V rail pulled to 5 V the STM32 (abs. max 4.0 V) and the LoRa module (max 3.6 V) are over their limits; the R1240N simply stops switching because VFB > 0.8 V. Since the board survived, the harness must not carry the BEC output to pin 1 (or the servo is powered elsewhere). This has to be confirmed with Jay; either way the design is wrong.","evidence":"`pstxnet` 3.3V ∋ SPEEDCONTROLLER-1, STEERINGSERVO-1; DS-5 (VDD max), DS-6a (VDD max 3.6 V); DS-1 (R1240N async, no back-feed path other than the rail)","disposition":"REQ-PWR-03/04 (separate actuator rail, no back-feed)","requirements":["REQ-PWR-03","REQ-PWR-04"]},{"id":"F-CTL-02","severity":"Safety","finding":"PWM outputs are bare MCU pins on unprotected 0.1 in headers routed straight to a motor-noisy environment: no series resistor, no ESD, no level shifting to the 5 V logic many ESCs expect. TP1/TP3 add exposed 3.4 mm pads on the same nets.","evidence":"schematic `PWM_Outputs` sheet; films","disposition":"REQ-CTL-05 (series R + TVS, 5 V-capable driver)","requirements":["REQ-CTL-05"]},{"id":"F-CTL-03","severity":"Safety","finding":"ESC arms automatically ~10 ms after reset (PWM at 1000 µs idle before the LoRa init); the first `THRUST` received drives the motor with no arm/disarm state.","evidence":"FW §8; `main.c:430-438`","disposition":"REQ-CTL-04 (explicit arm state machine)","requirements":["REQ-CTL-03","REQ-CTL-04"]},{"id":"F-CTL-04","severity":"Reliability","finding":"Firmware and copper disagree on which timer feeds which header (§0). Any regeneration from the `.ioc` also restores a 1500 µs TIM3 start pulse (`.ioc:150` vs `main.c:608`) = mid-throttle on a forward-only ESC.","evidence":"§0; FW §2","disposition":"REQ-CTL-06 (nets named by pin in V2; startup values under test)","requirements":["REQ-CTL-03","REQ-CTL-06","REQ-FW-02"]},{"id":"F-CTL-05","severity":"Nice","finding":"No motor or battery current sense, no ESC telemetry input, no RPM.","evidence":"schematic","disposition":"REQ-PWR-06 (current sense), optional telemetry UART","requirements":["REQ-PWR-06"]},{"id":"F-NAV-01","severity":"Functional","finding":"The GPS header pin 3 is driven by **PB0 as a push-pull output held LOW** by the firmware (\"debug LED\" in the comments). If the module presents an output there (PPS on many breakouts) it is a driver-to-driver contention; if it is the module's RX it is a permanent break. Header: 1 = 3V3, 2 = GND, 3 = PB0, 4 = GPS TX → PC11, 5 = GPS RX ← PC10.","evidence":"`pstxnet` N04277 = {U3-26 PB0, GPSMODULE-3}; FW §6, `main.c:675-682`","disposition":"REQ-NAV-02 (PPS input on a timer-capture pin)","requirements":["REQ-NAV-02"]},{"id":"F-NAV-02","severity":"Functional","finding":"Debug prints are transmitted into the GPS module's RX line (USART3 TX shared), and a single RX buffer is overwritten by the next NMEA sentence before the main loop copies it, so RMC lines are mostly lost; `gps_valid` never clears after a fix is lost.","evidence":"FW §4 (defects A/B), §7","disposition":"REQ-NAV-03/04 (separate console, fix age)","requirements":["REQ-NAV-03","REQ-NAV-04"]},{"id":"F-NAV-03","severity":"Functional","finding":"Generic 1 Hz / 9600 baud NMEA with no PPS, no backup power, no heading source. Course over ground is meaningless below ~1 m/s, so the boat has no heading when station-keeping or docking.","evidence":"schematic; FW §4","disposition":"REQ-NAV-01 (≥ 5 Hz GNSS with PPS), REQ-NAV-05 (IMU + magnetometer)","requirements":["REQ-NAV-01","REQ-NAV-05"]},{"id":"F-PWR-01","severity":"Safety","finding":"Battery input has no fuse, no reverse-polarity protection, no TVS and only CIN (10 µF/50 V) as bulk capacitance. The battery lands on two 1.6 mm pads with **0.6 mm holes** — too small for the wire gauge a brushless ESC needs and a single point of failure for the whole board's ground.","evidence":"`pstxnet` N088060; footprint `amv_con1` (PAD160MM_CIR060MM)","disposition":"REQ-PWR-01/02 (fuse, reverse, TVS, bulk; real terminal)","requirements":["REQ-PWR-01","REQ-PWR-02"]},{"id":"F-PWR-02","severity":"Reliability (resolved in v5)","finding":"The DSN v2 had U1 = SB007-03Q (a **30 V / 70 mA** Schottky, not an ESD part) as the buck catch diode; v5 replaced it with D21 = CMS06 (30 V / 2 A), which is the diode Nisshinbo recommends. Correct topology now: the R1240N is asynchronous and needs the external diode. Remaining nit: CMS06 Cj = 130 pF vs the ≤ 100 pF the R1240N datasheet asks for.","evidence":"`eco.txt`, `pstxnet` N18028 = {U6-3 LX, C12-1, L1-2, D21-2 K}, D21-1 A on GND; DS-1, DS-3, DS-4","disposition":"keep D21; consider CMS11 only if Vin > 24 V","requirements":[]},{"id":"F-PWR-03","severity":"Reliability","finding":"Battery-voltage margin: D21 VRRM 30 V, CIN 50 V, R1240N 30 V. Fine to 4S/5S LiPo (16.8/21 V); a 6S pack (25.2 V) leaves 4.8 V on the diode. The regulator's 100 ns minimum on-time at 1.25 MHz limits regulation to Vin ≤ ~27 V at 3.35 V out. Output is 0.8 × (1 + 15 k/4.7 k) = **3.35 V** (R1/R2), within STM32/LoRa limits.","evidence":"DS-1 §5, §7; `pstxnet` FB_DIV","disposition":"REQ-PWR-05 (state the battery: decision 2)","requirements":["REQ-PWR-01"]},{"id":"F-PWR-04","severity":"Reliability","finding":"ADC battery divider (R5 30 k / R6 10 k → PA2, 4:1, 3.3 V full scale = 13.2 V) exists but the ADC is never enabled; no filter capacitor; no low-battery behaviour. Note 13.2 V full scale is below a fully charged 4S pack (16.8 V).","evidence":"`pstxnet` ADC; FW §5","disposition":"REQ-PWR-06 (measure, ratio for the chosen pack, low-battery policy)","requirements":["REQ-PWR-05"]},{"id":"F-PWR-05","severity":"Nice","finding":"No status LEDs at all (power, link, fix, fault).","evidence":"schematic","disposition":"REQ-DBG-02","requirements":["REQ-PWR-08","REQ-DBG-02"]},{"id":"F-PWR-06","severity":"Nice","finding":"The LoRa supply filter is two BLM15 beads (values unspecified) with C20 (10 µF) from the mid-node to **+3V3 instead of GND**, C21/C22/C23 correct. Headroom is fine: 3.3 V rail budget ≈ 15 mA MCU + 145 mA LoRa TX + ≤ 45 mA GPS ≈ 205 mA peak against the R1240N's 1.2 A.","evidence":"`pstxnet` N27410 = {L4-2, C20-1}, 3.3V ∋ C20-2; DS-6a; DS-1","disposition":"fix C20 return; keep filter","requirements":["REQ-PWR-07"]},{"id":"F-MCU-01","severity":"Reliability","finding":"**CEXT (4.7 µF) is connected between VCAP_1 and +3V3, not VSS.** The value is right for the single-VCAP LQFP-64 (4.7 µF, ESR \u003c 1 Ω) but the return is wrong: the 1.2 V core regulator sees its decoupling through the 3.3 V rail's own capacitors; at power-up the cap couples the VDD ramp into VCAP. It runs, which is why nobody noticed.","evidence":"`docs/img/v1_evidence_vcap.png`; DS-5 §6.3.2, Table 18","disposition":"REQ-MCU-01 (4.7 µF VCAP_1 → VSS, short)","requirements":["REQ-MCU-01"]},{"id":"F-MCU-02","severity":"Reliability","finding":"VBAT (pin 1) and BOOT0 (pin 60) are unconnected. DS10693 §3.20 requires VBAT tied to VDD when no battery is used; ST's hardware guidelines require BOOT0 driven (normally 10 kΩ to GND). Both float on V1.","evidence":"`pstxnet` VBAT single-node, NC list ∋ U3-60; DS-5","disposition":"REQ-MCU-02","requirements":["REQ-MCU-02"]},{"id":"F-MCU-03","severity":"Reliability","finding":"No HSE or LSE crystal: the CPU, timers and both UARTs run from the HSI (±1 % at 25 °C, −8/+4.5 % over −40..105 °C). The 115200 baud link to the LoRa module has a 3.3 % total budget; inside a sealed box on the water in summer the HSI alone can use most of it. No USB (needs HSE), no RTC.","evidence":"FW §9; DS-5 HSI table","disposition":"REQ-MCU-03 (HSE 8-25 MHz), REQ-MCU-04 (LSE optional)","requirements":["REQ-MCU-03","REQ-MCU-04"]},{"id":"F-MCU-04","severity":"Reliability","finding":"NRST has no capacitor or external RC (only the 30-50 kΩ internal pull-up), routed straight to the debug header pin 10.","evidence":"`pstxnet` RESET; DS-5 Table 59","disposition":"REQ-MCU-05","requirements":["REQ-MCU-05"]},{"id":"F-MCU-05","severity":"Nice","finding":"Debug is the ARM 10-pin Cortex connector (Samtec FTSH-105, SWD+SWO+TDI, keyed) — good. There is no UART console (debug text goes into the GPS module) and no USB.","evidence":"schematic `Debug` sheet; FW §7","disposition":"REQ-DBG-01/03","requirements":["REQ-DBG-01"]},{"id":"F-MCU-06","severity":"Reliability","finding":"No watchdog; `Error_Handler` and all fault handlers spin forever with PWM frozen at the last value.","evidence":"FW §5, §8","disposition":"REQ-CTL-02 (IWDG), REQ-FW-01","requirements":["REQ-CTL-02","REQ-FW-01"]},{"id":"F-CAN-01","severity":"Functional","finding":"CAN cannot work as wired: RXD is on PA10 (no CAN AF), STB is on PA11 (= CAN1_RX), only TXD (PA12 = CAN1_TX) is right. STB has an internal pull-up (HIGH = standby), so with PA11 floating the transceiver is in standby. VCC (4.5-5.5 V) is supplied from the CAN header (pin 2), there is no 5 V on the board. Firmware never uses CAN.","evidence":"§0; DS-2; DS-5","disposition":"Decision 4: drop CAN, or wire RXD → PA11, STB → GPIO, add on-board 5 V or use a 3.3 V transceiver","requirements":["REQ-CAN-01"]},{"id":"F-MECH-01","severity":"Reliability","finding":"No mounting holes. The four 1.4 mm holes are the test points TP1/TP3/TP4/TP5 (3.4 mm pads on live nets: PWM, PWM, +3V3, GND); the two 0.6 mm holes are the battery pads. Board is 66.55 × 37.31 mm.","evidence":"film outline; drill derivation (`xor_report.json`)","disposition":"REQ-MECH-01 (4 × M3 on a stated pattern)","requirements":["REQ-MECH-01"]},{"id":"F-MECH-02","severity":"Reliability","finding":"The fabricated copper violates the design's own 12 mil rule: 40 track pairs at 7.64-7.95 mil (adjacent 0.5 mm LQFP fan-out), pour clearances 5 mil everywhere, a GND track 3.37 mil from the unconnected pad 62, a +3V3 track 4.8 mil from C3 pin 1, one track-to-via at 9.8 mil. Allegro reported 150 DRC errors at artwork time (`batch_drc.log`). Manufacturable (≥ 3.3 mil), but no margin.","evidence":"`LoRa_Boat_Controller.kicad_dru`; `_build/drc.json` history in `CONVERSION_LOG.md`","disposition":"REQ-MECH-03 (6/6 mil rules with 8 mil pour clearance)","requirements":["REQ-MECH-03"]},{"id":"F-MECH-03","severity":"Reliability","finding":"Vias are untented with 44 mil mask openings on 24 mil pads while the pours come within 5 mil of the via: 37 places where bare pour copper of another net is exposed inside a via's mask window (solder-bridge risk).","evidence":"KiCad DRC `solder_mask_bridge` × 37 (warning)","disposition":"REQ-MECH-04 (tent vias or 1:1 mask)","requirements":["REQ-MECH-04"]},{"id":"F-MECH-04","severity":"Nice","finding":"Silkscreen crosses pads in 21 places and the board edge in 6; no fiducials; no polarity marks for D21 and the headers beyond autosilk text; test points and battery pads unlabeled by function.","evidence":"KiCad DRC silk warnings; film","disposition":"REQ-MECH-05","requirements":["REQ-DBG-03","REQ-MECH-05"]},{"id":"F-MECH-05","severity":"Nice","finding":"No conformal coating or enclosure provision; exposed 3.4 mm test pads and 0.1 in headers on a boat.","evidence":"—","disposition":"REQ-MECH-02","requirements":["REQ-MECH-02"]},{"id":"F-MECH-06","severity":"Reliability","finding":"The only drill file in the repo is a **v4** export (35 of 50 holes do not match v5); the fabricated drill was reconstructed from the v5 pad flashes. Fine for the KiCad baseline, but the original fab package is incomplete.","evidence":"`A0_PROVENANCE.md`","disposition":"ask Jay for the fab-house zip if it exists (BLOCKERS)","requirements":[]},{"id":"F-BOM-01","severity":"Reliability","finding":"L1 (TDK SLF7045T-4R7M2R0-PF) is end-of-life (last shipment 2026-12-31); R5's intended ROHM MCR10 series is no longer orderable; TCAN1042HDRQ1 is flagged EOL by Mouser (TI: active, successor TCAN1044A-Q1).","evidence":"`docs/research/BOM_MPN_RESEARCH.md`","disposition":"V2 BOM uses VLS6045EX-4R7M-H, Yageo 0805, TCAN1044A-Q1 or drops CAN","requirements":[]},{"id":"F-BOM-02","severity":"Nice","finding":"C23's device name encodes 22 pF (GJM1555C1H220JB01) while the schematic value says 47 pF; the RYLR998 reference design uses 47 pF. CIN is a Nippon Chemi-Con 2220, not a Kemet 1210 (the footprint is right, the old BOM text was not).","evidence":"DS-9, DS-10","disposition":"resolve value; BOM corrected","requirements":[]}],"decisionRows":[{"id":"1","question":"Installed LoRa module: RYLR998 (SF5-11, 22 dBm, 5-pin) or RYLR896 (SF7-12, 15 dBm, 6-pin)? V2: RYLR998_M4 (I-PEX) or a discrete SX1262?","default":"RYLR998_M4 on the 5-pin pinout + SMA bulkhead"},{"id":"2","question":"Battery chemistry / cell count; ESC fed through the board or directly from the battery?","default":"2S-6S LiPo; ESC direct from the battery; board \u003c= 1 A"},{"id":"3","question":"Servo power: ESC BEC through the SERVO header, or on-board 5 V buck?","default":"BEC through the header + OR-ing diode; 5 V buck as populate option"},{"id":"4","question":"Keep CAN?","default":"Dropped (frees PA11/PA12 for USB)"},{"id":"5","question":"IMU","default":"ICM-20948 on I2C"},{"id":"6","question":"Connector family","default":"JST XH for power/actuators, 2.54 mm headers for GNSS/LoRa modules"},{"id":"7","question":"Mounting pattern / enclosure","default":"80 × 46 mm board; four M3 holes on 72 × 38 mm pattern (latest primary revision)"},{"id":"8","question":"Debug console","default":"USB-C CDC (needs the HSE crystal, which V2 adds anyway)"},{"id":"9","question":"Handheld voice mode (live PTT vs recorded) - only affects the boat radio if voice shares the boat's channel","default":"Boat radio designed for RC + telemetry only"},{"id":"10","question":"Is the original fab-house zip (real v5 drill, stack-up) available?","default":"Drill inferred from v5 pads (matches hole-for-hole)"},{"id":"11","question":"On the working V1 harness: which header is the ESC plugged into, and is the header power pin (pin 1, +3V3) connected to anything?","default":"Assumed ESC on STEERINGSERVO, servo on SPEEDCONTROLLER, pin 1 unconnected (F-CTL-01)"}],"fabrication":"**Before fabrication (hand work the generator does not do):** tighten the two buck-converter switching loops (U2/L1/D3/C5-C6 and U3/L2/D4/C8-C9) and the crystal traces, route the USB pair as a pair, review the autorouter via placement near the XT30 and the LoRa header, add an assembly drawing. The placement is intended to stay; only the copper needs tidying.","v2Reports":{"erc.json":{"path":"hardware/kicad_v2/_build/erc.json","content":"{\r\n    \"$schema\": \"https://schemas.kicad.org/erc.v1.json\",\r\n    \"coordinate_units\": \"mm\",\r\n    \"date\": \"2026-09-16T21:08:37-0500\",\r\n    \"kicad_version\": \"9.0.7\",\r\n    \"sheets\": [\r\n        {\r\n            \"path\": \"/\",\r\n            \"uuid_path\": \"/1dd45446-4f65-56e8-a2d3-9539c2076706\",\r\n            \"violations\": []\r\n        },\r\n        {\r\n            \"path\": \"/Power/\",\r\n            \"uuid_path\": \"/1dd45446-4f65-56e8-a2d3-9539c2076706/ab044879-1b8a-5671-848c-dc324c91f865\",\r\n            \"violations\": []\r\n        },\r\n        {\r\n            \"path\": \"/MCU/\",\r\n            \"uuid_path\": \"/1dd45446-4f65-56e8-a2d3-9539c2076706/8711b833-cdc8-552e-8deb-3b072a45ec1b\",\r\n            \"violations\": []\r\n        },\r\n        {\r\n            \"path\": \"/Radio/\",\r\n            \"uuid_path\": \"/1dd45446-4f65-56e8-a2d3-9539c2076706/797ed2d7-f26a-5324-8d20-a644f401b7c5\",\r\n            \"violations\": []\r\n        },\r\n        {\r\n            \"path\": \"/Navigation/\",\r\n            \"uuid_path\": \"/1dd45446-4f65-56e8-a2d3-9539c2076706/b7be4430-1eb4-5f2b-9d93-98132a937546\",\r\n            \"violations\": [\r\n                {\r\n                    \"description\": \"Pins of type Bidirectional and Power output are connected\",\r\n                    \"items\": [\r\n ","note":"DS10693 Rev 11; pin map, alternate functions, regulator supply scheme. Independently consulted in intake."},{"id":"can","title":"TCAN1042H-Q1","refs":["U5"],"maker":"Texas Instruments","url":"https://www.ti.com/lit/gpn/tcan1042h-q1","note":"SLLSES9D; transceiver pinout and supply requirements. Independently consulted in intake."},{"id":"buck","title":"R1240 series","refs":["U6"],"maker":"Nisshinbo Micro Devices","url":"https://www.nisshinbo-microdevices.co.jp/en/pdf/datasheet/r1240-ea.pdf","note":"EA-190-240903; manufacturer link recorded in primary datasheet notes."},{"id":"radio","title":"RYLR998 / 498 command guide","refs":["LORAMODULE1"],"maker":"REYAX","url":"https://reyax.com/upload/products_download/download_file/LoRa_AT_Command_RYLR998_RYLR498_EN.pdf","note":"Verify installed module before using these limits. RYLR896 is not interchangeable by assumption."},{"id":"radio-ds","title":"RYLR998 module","refs":["LORAMODULE1"],"maker":"REYAX","url":"https://reyax.com/upload/products_download/download_file/RYLR998_EN.pdf","note":"Module candidate/reference; installed hardware identity remains open."}],"documents":[{"path":"README.md","title":"LoRa Autonomous Boat Controller","text":"# LoRa Autonomous Boat Controller\r\n\r\nAn RC-scale autonomous surface vessel controller: an STM32F446 takes thrust and rudder commands from a handheld over a 915 MHz LoRa link (Reyax RYLR UART module), reads a NMEA GPS, and drives a brushless ESC and a rudder servo with 50 Hz servo PWM. Built as a University of Arkansas EECS senior design project in Cadence OrCAD/Allegro 22.1, fabricated in May 2025 (\"senior design v5\"), and now reconstructed in KiCad 9 as the baseline for a V2 redesign.\r\n\r\n**Start with [REPORT.md](REPORT.md)** (five minutes) or [docs/INDEX.md](docs/INDEX.md) (everything). The interactive project manager, when present, is at `pm/index.html`.\r\n\r\n| | |\r\n|---|---|\r\n| ![V1 top](docs/img/v1_pcb_top.png) | ![V1 root schematic](docs/img/v1_sch_Root.svg) |\r\n| V1 as fabricated, reconstructed in KiCad 9 (66.5 × 37.3 mm, 2 layers) | V1 root schematic (one sheet per OrCAD block) |\r\n\r\n## V1 → V2 in one paragraph\r\n\r\nV1 works as a radio-controlled boat but has no link-loss failsafe (the last thrust value persists forever), puts the MCU's 3.3 V logic rail on the servo/ESC power pins, returns the STM32's VCAP capacitor to +3V3 instead of ground, wires the CAN transceiver to pins the CAN peripheral cannot use, runs everything from the internal RC oscillator, and leaves the battery input unprotected. All of this is documented with copper-level evidence in [docs/V1_DESIGN_REVIEW.md](docs/V1_DESIGN_REVIEW.md). V2 ([docs/V2_REQUIREMENTS.md](docs/V2_REQUIREMENTS.md), `hardware/kicad_v2/`) keeps the proven parts (STM32F446, R1240N buck, 2-layer form factor, ARM debug connector) and adds the failsafe/watchdog, a separate actuator rail with input protection, an HSE crystal, status LEDs, PPS/IMU for navigation, an external antenna port and mounting holes.\r\n\r\n## Repository map\r\n\r\n```\r\nREADME.md, REPORT.md          start here / the report\r\nCONVERSION_LOG.md             append-only work log (what changed, what was validated, commits)\r\nBLOCKERS.md                   decisions Jay must make + defaults in use; AGENT_STATUS.md, HANDOFF.md, FILE_OWNERSHIP.md: agent coordination\r\nPROMPT_FOR_CODEX.md           brief for the second (review/documentation) agent\r\ndocs/\r\n  INDEX.md                    table of every document and image\r\n  A0_PROVENANCE.md            which artwork is the fabricated board, v2→v5 placement diff, drill provenance, Gerber XOR tables\r\n  V1_DESIGN_REVIEW.md         findings with evidence + link budget / control / power analysis\r\n  V2_REQUIREMENTS.md          numbered testable requirements + decision list\r\n  NETLIST.md                  every net (generated); CONVERSION_NOTES.md: method + footprint mapping; BOM.csv, BOM_V2.csv (generated)\r\n  research/                   datasheet notes, MPN/pricing research, firmware review (line-cited)\r\n  img/                        renders, layer SVGs, XOR images, evidence figures, schematic PDF/SVGs\r\n  archive/                    superseded March-2026 pipeline docs\r\nhardware/kicad/               V1 KiCad 9 project (as fabricated): LoRa_Boat_Controller.kicad_pro / .kicad_pcb / .kicad_sch + 7 sheets,\r\n                              LoRa_Boat_Controller.pretty/ (project footprints), .kicad_sym (project symbols), .kicad_dru (as-fabricated rules)\r\nhardware/kicad/tools/         every script that produced the above (see \"Regenerate\")\r\nhardware/kicad_v2/            V2 KiCad project (Phase C draft): LoRa_Boat_Controller_V2.kicad_pro / .kicad_pcb (80 x 46 mm, autorouted) / root + 6 sheets,\r\n                              generated from tools/v2_design.py by tools/gen_v2.py; tools/route_v2.py drives freerouting; README.md explains the chain\r\nfirmware/                     V1 STM32CubeIDE project (unchanged behaviour; header comments document the board wiring) + V2_FIRMWARE_PLAN.md\r\nAllegro/hardware/allegro-original/   read-only source evidence: Allegro v5/ (board revisions, logs, OrCAD netlist pstxnet.dat),\r\n                              BoatcrewArtwork/ (the v5 fabrication Gerbers), LIBRARY_MASTER/ (Allegro footprints)\r\nreviews/codex/                independent review packet by the second agent\r\n```\r\n\r\n## What is actually in the Allegro folder (read this before trusting older notes)\r\n\r\n- `BoatcrewArtwork/BOATCREW*.art` are the fabrication films: plotted from `senior design v5.brd` on 2025-05-09 17:41, the last thing Allegro did (`allegro.jrl`). They are the copper ground truth.\r\n- `Allegro v5/Allegro/pstxnet.dat` (+ `pstxprt.dat`, `pstchip.dat`) is the OrCAD netlist imported into v5 half an hour earlier: 44 parts, 32 nets + 37 unconnected pins. This, not the older `senior design v2.dsn`, is the connectivity truth.\r\n- `senior design v2.dsn` is a Specctra export of **v2**: a 76.2 × 76.2 mm board with 45 parts on a different placement. v5 is 66.5 × 37.3 mm; every part moved; U1/COUT1/TP2 are gone and D21 was added. The DSN is only used for pad geometry.\r\n- `BOATCREWDRILL-1-2.drl` is a **v4** drill (35 of 50 holes don't exist on v5); the KiCad drill is derived from the v5 pad flashes and matches them hole for hole.\r\n- `Allegro v5/Allegro/Artwork/` and `Artwork.zip` are v4; `SENIORDESIGN_BOARD.png` is a screenshot of the OrCAD start page.\r\n\r\n## Opening the projects in KiCad 9\r\n\r\n- V1: open `hardware/kicad/LoRa_Boat_Controller.kicad_pro`. Libraries are project-local (`fp-lib-table`, `sym-lib-table`); no global library setup is needed except the standard KiCad 9 symbol libraries (`MCU_ST_STM32F4`, `Device`, `Connector*`, `power`) that ship with KiCad. The board opens with zones filled; DRC runs with the project's `.kicad_dru` (0 errors, 67 documented warnings). ERC 0.\r\n- V2: open `hardware/kicad_v2/LoRa_Boat_Controller_V2.kicad_pro`. Same library conventions (project-local tables; the V1 `.pretty` is reused through `${KIPRJMOD}/../kicad/`). The board is an autorouted draft (freerouting 2.1.0) with DRC 0 errors; see `hardware/kicad_v2/README.md` for the state of the draft and what still needs hand work before fabrication.\r\n\r\nReference designators without a trailing digit in Allegro (`CANHEADER`, `LORAMODULE`, `GPSMODULE`, `SPEEDCONTROLLER`, `STEERINGSERVO`, `JTAG`, `CIN`, `COUT`, `CEXT`, `VIN`, `GND`) are `…1` in KiCad (annotation rule); the Allegro name is in every symbol's `Allegro_RefDes` field and in `docs/BOM.csv`.\r\n\r\n## Regenerate everything\r\n\r\nRequirements: KiCad 9.0.7 (default path `C:\\Users\\Jay\\AppData\\Local\\Programs\\KiCad\\9.0\\bin`, override with `KICAD_BIN`), Python 3.12 with `pip install gerbonara sexpdata kiutils numpy scipy shapely pillow`.\r\n\r\n```bash\r\npython hardware/kicad/tools/build_v1.py\r\n```\r\n\r\nruns, from the repo root: provenance → v5 reconstruction (placement + connectivity from the films and pstxnet.dat) → footprints → board + project + rule file → pcbnew validation and zone fill → DRC → Gerber/drill export → XOR fidelity check → DSN-v2 comparison → evidence figures → renders/SVGs → symbols → schematic → ERC → netlist check → BOM → schematic PDF/SVG → NETLIST/CONVERSION_NOTES/INDEX. Every script has a header stating its inputs and outputs and can be run alone (`python hardware/kicad/tools/\u003cscript>.py`; `validate_pcb.py` and `check_netlist.py` need KiCad's own `python.exe`). Outputs that are evidence go to `docs/`; intermediate JSON goes to `hardware/kicad/_build/` (gitignored).\r\n\r\nTo regenerate V2: `python hardware/kicad_v2/tools/gen_v2.py` (library, schematic, project, unrouted board, `docs/BOM_V2.csv`), then `route_v2.py all` with KiCad's `python.exe` to autoroute (needs Java 21 + freerouting 2.1.0; details in `hardware/kicad_v2/README.md`).\r\n\r\nPhase A validation as of the `v1-kicad-baseline` tag: 172/172 pads within 0.000 mil of the film flashes; DRC 0 errors / 0 unconnected; ERC 0 violations; schematic and board pin sets identical to `pstxnet.dat`; Gerber XOR vs the films F.Cu 0.87 %, B.Cu 0.23 %, masks \u003c 1 %; drill 53/53 holes within 0.05 mil.\r\n\r\n## Firmware\r\n\r\n`firmware/` is the V1 STM32CubeIDE project (bare-metal HAL, `Core/Src/main.c` ≈ 750 lines: RYLR AT init, `+RCV=` parsing, RMC parsing, two PWM channels, 5 s telemetry). Behaviour is unchanged; the header comments now state the copper-verified wiring (PA8/TIM1 → SPEEDCONTROLLER header, PC6/TIM3 → STEERINGSERVO header, PB0 → GPS pin 3). See `docs/research/FIRMWARE_REVIEW_NOTES.md` for the line-cited review and `firmware/V2_FIRMWARE_PLAN.md` for V2.\r\n\r\n## Companion hardware\r\n\r\nThe boat node is address 1 on network 18; the handset (STM32L072 + matching RYLR module, address 2) is not in this repository.\r\n\r\n## License\r\n\r\nSenior design project — University of Arkansas EECS.\r\n"},{"path":"REPORT.md","title":"LoRa Autonomous Boat — reconstruction and V2 report","text":"# LoRa Autonomous Boat — reconstruction and V2 report\n\nWritten 2026-09-16 by the primary agent (Claude Code). Branches: `v1-kicad-reconstruction` (Phase A, tag `v1-kicad-baseline`) and `v2-design` (Phases B/C, tag `v2-design-draft`). The full document set is indexed in [docs/INDEX.md](docs/INDEX.md); the work log is [CONVERSION_LOG.md](CONVERSION_LOG.md); open decisions are in [BLOCKERS.md](BLOCKERS.md).\n\n## 1. What was delivered\n\n| Phase | Deliverable | Where | State |\n|---|---|---|---|\n| A | Faithful KiCad 9 reconstruction of the fabricated V1 board (v5 films + OrCAD netlist), hierarchical schematic, project libraries, as-fabricated rule file, generator scripts | `hardware/kicad/`, `hardware/kicad/tools/` | complete, tagged `v1-kicad-baseline` |\n| A | Provenance, conversion notes, netlist, BOM with MPNs and prices, evidence figures, renders | `docs/A0_PROVENANCE.md`, `docs/CONVERSION_NOTES.md`, `docs/NETLIST.md`, `docs/BOM.csv`, `docs/img/` | complete |\n| B | Evidence-based V1 design review (31 findings) and 45 numbered, testable V2 requirements with a decision list | `docs/V1_DESIGN_REVIEW.md`, `docs/V2_REQUIREMENTS.md` | complete |\n| B | V1 firmware wiring notes (comment-only) and V2 firmware plan | `firmware/Core/Src/main.c` header, `firmware/V2_FIRMWARE_PLAN.md` | complete |\n| C | V2 KiCad project: 6-sheet schematic (ERC clean), placed and autorouted 80 × 46 mm board (DRC clean), priced BOM, generator + autoroute chain | `hardware/kicad_v2/`, `docs/BOM_V2.csv` | draft, tagged `v2-design-draft` — needs hand tidy-up before fabrication (§4) |\n| — | Interactive project manager / atlas / independent verification | `pm/`, `docs/atlas/`, `reviews/codex/` | Codex agent (see `PROMPT_FOR_CODEX.md`, `AGENT_STATUS.md`) |\n\n## 2. Phase A fidelity numbers (V1 as fabricated)\n\n| Check | Result | Evidence |\n|---|---|---|\n| Footprint pad positions vs film flashes | 172 / 172 pads within 0.000 mil | `validate_pcb.py` |\n| Gerber XOR, KiCad export vs fabrication films | F.Cu 0.87 %, B.Cu 0.23 %, masks \u003c 1 %, silk/outline \u003c 1 % | `docs/A0_PROVENANCE.md` tables, `docs/img/v1_xor_*.png` |\n| Drill | 53 / 53 holes within 0.05 mil of the v5 pad flashes (the shipped `.drl` is v4: 35 of its 50 holes do not exist on v5) | `A0_PROVENANCE.md` |\n| Connectivity | Schematic netlist == `pstxnet.dat` == board pad nets (32 nets, 37 unconnected pins) | `check_netlist.py` PASS |\n| DRC | 0 errors, 0 unconnected with the as-fabricated `.kicad_dru`; 67 documented warnings (the 7.6-mil LQFP fan-out and 37 mask bridges that are on the real board) | `hardware/kicad/_build/drc.rpt` |\n| ERC | 0 violations | `_build/erc.rpt` |\n\nThree wiring questions the old notes left open were answered from copper (`docs/img/v1_evidence_*.png`): PA8/TIM1 drives the SPEEDCONTROLLER header and PC6/TIM3 the STEERINGSERVO header; CEXT sits between VCAP_1 (pin 30) and +3V3, not ground; the CAN transceiver RXD is on PA10 (no CAN alternate function), so CAN never worked.\n\n## 3. V1 findings that drive V2 (full list with evidence in `docs/V1_DESIGN_REVIEW.md`)\n\n- **Safety:** no link-loss failsafe (last thrust persists), both actuator headers put +3V3 on the servo/ESC power pin, the ESC arms 10 ms after reset, no fuse / reverse-polarity / TVS on the battery input, no watchdog.\n- **Functional:** SF12/BW125 gives about one command per second and the RYLR998 rejects SF12 outright; CAN unusable as wired; GPS header pin 3 held low by PB0; debug prints go into the GPS RX line.\n- **Reliability:** VCAP returned to +3V3, VBAT/BOOT0 floating, no crystal (HSI only), no mounting holes (the 1.4 mm holes are live test points), 40 track pairs below the design rule of 12 mil, 37 untented-via mask bridges.\n\n## 4. V2 in one page\n\n**Kept:** STM32F446RET6 LQFP-64, R1240N 3.3 V buck (now with its catch diode, feedback and compensation network corrected), 2-layer board, Samtec 10-pin SWD header, Reyax RYLR UART module socket, 2.54 mm GNSS header.\n\n**Added / changed (REQ ids in `docs/V2_REQUIREMENTS.md`):** XT30 battery input with 3 A fuse, P-FET reverse protection, SMAJ33A TVS and 47 µF bulk (REQ-PWR-01..03); 20 mΩ shunt + INA180 current sense and a filtered battery divider on the ADC (REQ-PWR-06/07); TPS54202 5 V servo buck OR-ed with the ESC BEC through SS34 diodes, so the actuator headers carry 5 V, never the logic rail (REQ-CTL-02); ESC/servo signals through 74AHCT1G125 level shifters with series resistors and PESD clamps on JST XH connectors (REQ-CTL-03/04); 8 MHz HSE and 32.768 kHz LSE crystals, NRST RC, VBAT/BOOT0 terminated (REQ-MCU-01..04); four status LEDs (REQ-DBG-02); USB-C CDC console with USBLC6 protection (REQ-DBG-01); ICM-20948 IMU on I2C with interrupt, GNSS PPS on PB0 (REQ-NAV-01..03); LoRa supply filter returned to ground, module reset driven by PA3 (REQ-RF-02/03); CAN dropped (frees PA11/PA12 for USB); four M3 mounting holes on a 72 × 38 mm pattern (REQ-MECH-01); seven test points.\n\n**Numbers:** 118 parts, 71 nets, 68 BOM lines, board-only parts cost **$53.80 at qty 1** (`docs/BOM_V2.csv`, catalogue estimates dated 2026-09-16; the LoRa and GNSS modules, PCB and assembly are extra). Board 80 × 46 mm, 2 layers, Default class 0.25 mm track / 0.15 mm clearance, Power class 0.6 mm / 0.2 mm, vias 0.6/0.3 and 0.8/0.4 mm. ROUTE_STATS\n\n**Before fabrication (hand work the generator does not do):** tighten the two buck-converter switching loops (U2/L1/D3/C5-C6 and U3/L2/D4/C8-C9) and the crystal traces, route the USB pair as a pair, review the autorouter via placement near the XT30 and the LoRa header, add an assembly drawing. The placement is intended to stay; only the copper needs tidying.\n\n## 5. Decisions needed from Jay (defaults in use; details in `BLOCKERS.md`)\n\n1. LoRa module variant (default RYLR998_M4 with u.FL, antenna on a pigtail, no on-board keep-out).\n2. Battery chemistry / cell count and whether the ESC is fed through the board (default 2S-6S LiPo, ESC direct from the battery, board ≤ 3 A).\n3. Servo power source (default ESC BEC through the header OR-ed with the on-board 5 V buck).\n4. Keep CAN? (default dropped).\n5. IMU choice (default ICM-20948).\n6. Connector family (default JST XH power/actuators, 2.54 mm module headers).\n7. Mounting pattern / enclosure (**revised default 72 × 38 mm on 80 × 46 mm**; the 70 × 40 mm first cut did not fit).\n8. Debug console (default USB-C CDC).\n9. Handheld voice mode and whether voice shares the boat channel.\n10. Whether the fab-house zip (real v5 drill, stack-up) exists.\n11. On the working V1 harness, which header the ESC is plugged into and whether its +3V3 pin is connected.\n\n## 6. Reproduce\n\n- V1: `python hardware/kicad/tools/build_v1.py` from the repo root (KiCad 9.0.7 + Python 3.12 with gerbonara/numpy/scipy/shapely/pillow/sexpdata/kiutils) rebuilds board, schematic, validations, images and generated docs.\n- V2: `python hardware/kicad_v2/tools/gen_v2.py` then `route_v2.py all` with the KiCad `python.exe` (Java 21 + freerouting 2.1.0). `hardware/kicad_v2/README.md` lists every step and check.\n- Every script states its inputs/outputs in its header; intermediate files go to the git-ignored `_build/` folders.\n\n## 7. Session log (commits on `v2-design`, newest first)\n\n| Commit | Content |\n|---|---|\n| (tag `v2-design-draft`) | V2 routed board, renders, BOM_V2, REPORT.md, docs index |\n| 0aa4920 | Codex snapshot: pm viewer scaffold, S2 verification packet, firmware protocol prototype |\n| c06307f | Phase C: V2 schematic (6 sheets, ERC clean) + placed, DRC-clean unrouted PCB + tools |\n| 2319972 | gen_sch.py Sheet class made reusable; V2 project skeleton |\n| 679a9c7 | Phase A4 + B: README, design review, V2 requirements, firmware plan, generated docs, archived stale docs |\n| 87a336c | Copper-evidence figures, firmware comment-only wiring notes, Codex prompt |\n| 1f07361, b831657 | Coordination with the Codex agent (HANDOFF, FILE_OWNERSHIP, AGENT_STATUS, LF attributes) |\n| 639e08f (tag `v1-kicad-baseline`) | Phase A3 close: CANH/CANL corrected, BOM with MPNs, DSN-v2 comparison, schematic exports |\n| 4f855ba | Phase A3: hierarchical V1 schematic from pstxnet.dat, ERC clean, netlist == pstxnet |\n| 65c9d14 | Phase A2: faithful V1 PCB reconstruction from the v5 films |\n| 89b5219 | Snapshot of the pre-reconstruction state |\n"},{"path":"HANDOFF.md","title":"Shared handoff","text":"# Shared handoff\n\n## Handoff — 2026-09-17 UTC — Codex initial coordination\n\n- Branch / commit: `v1-kicad-reconstruction` / `89b5219`.\n- Scope owned: `reviews/codex/**` and initial root coordination records (see `FILE_OWNERSHIP.md`).\n- Scope released: none yet.\n- Files changed: new coordination records only at this checkpoint.\n- Commands run: read collaborator brief; read full primary brief; `git status --short --branch`; `git log --oneline --decorate -15`; read conversion log, provenance report, source netlist, artwork headers, firmware.\n- Validation results: primary work is changing during inspection; no stable design release available.\n- Evidence artifacts: review packet in progress.\n- Blocking findings: no acknowledged ownership/handoff before these records; original brief's net count, outline and drill assumptions are contradicted by newer source evidence and require corrected acceptance criteria.\n- Non-blocking findings: stale March workflow docs must eventually be archived by their owner.\n- Assumptions still unverified: full v5 copper equivalence, current KiCad DRC/ERC and reproducibility.\n- Requested next action: primary may continue in its reserved scopes; when ready, append explicit released revision, paths, commands, logs and unresolved discrepancies. Release does not transfer files automatically.\n- Safe for other agent to continue: YES in primary reserved scope; NO to simultaneous writes in Codex review scope.\n- Safe scope: read-only analysis anywhere; Codex writes only in `reviews/codex/**` and its initial coordination records.\n\n## Handoff — 2026-09-17T00:19:00Z — Codex review packet\n\n- Branch / commit: `v1-kicad-reconstruction` / `89b5219`; no Git mutations by Codex.\n- Scope owned: isolated review and initial coordination setup for this session.\n- Scope released: `reviews/codex/**`, initial Codex coordination claim. Reclaim before subsequent writes.\n- Files changed: four new root coordination files; `reviews/codex/README.md`, `ASSESSMENT.md`, `PLATFORM_CONCEPT.md`, `SOURCE_AUDIT.json`, `tools/source_audit.py`.\n- Commands run: read-only Git status/history/diff; source/document inspection; targeted official ST/TI/REYAX reference checks; `& 'C:\\Users\\Jay\\AppData\\Local\\Programs\\KiCad\\9.0\\bin\\python.exe' reviews/codex/tools/source_audit.py` (two successful runs after initial sandbox launch denial).\n- Validation results: audit exit 0, complete parsed net/node coverage, no duplicate pin memberships, no changed inputs during final audit. Verified source counts, outline coordinates, artwork headers and v4 drill identity. Firmware audit independently corroborated missing link-loss timeout and startup configuration drift.\n- Evidence artifacts: `reviews/codex/SOURCE_AUDIT.json`, final timestamp 00:17:47 UTC, exact per-file SHA-256 hashes; primary report summaries are explicitly labelled observed, not independently rerun.\n- Blocking findings: R01 stale baseline targets; R02 incomplete converter validation. Primary DRC remains nonzero. Future actuator use additionally requires R04 control failsafe behavior.\n- Non-blocking findings for continued reconstruction: R03 CANH/CANL semantic mapping; R05–R11 firmware/pin/power/radio findings requiring later disposition. Do not confuse non-blocking for this analysis with safe powered operation.\n- Assumptions still unverified: physical PWM harness, copper proof for all critical nodes, final v5 drill, full ERC/DRC/XOR/PCB–schematic sync, installed radio/ESC/BEC/battery, handheld voice vs text preference.\n- Requested next action: primary reads assessment R01–R03 and CEXT/radio findings, then releases exact revision/paths/logs when ready. Codex resumes S1 on a release; otherwise advances only separately claimed planning/review work.\n- Safe for other agent to continue: YES in primary reserved scope. NO for Codex takeover of implementation without explicit release.\n- Safe scope: primary implementation reservation remains active; read-only work anywhere; new non-overlapping review paths after claim.\n\n## User clarification — 2026-09-17 UTC — voice scope\n\n- Jay requires **voice plus text and location**. The earlier pending voice/text preference is resolved.\n- Updated `PLATFORM_CONCEPT.md`, review `README.md`, `BLOCKERS.md` and status; added voice-mode comparison and audio/RC coexistence acceptance seeds. No hardware choice made.\n- Next RF packet must establish live vs recorded-voice performance, codec/framing airtime and safe RC coexistence before radio selection.\n- Review/coordination claim released again. Primary implementation reservation unchanged.\n\n## Handoff — 2026-09-17 — Primary (Claude Code): Phase A released at commit 639e08f\n\n- Branch / commit: `v1-kicad-reconstruction` / `639e08f` (Phase A3 close); `b831657` adds the Codex packet unchanged. Tag `v1-kicad-baseline` follows once A4 (evidence figures, firmware comments, docs rewrite) lands.\n- Released for independent review (read-only for Codex): `hardware/kicad/**` (project, 7 sheets, .pretty, .kicad_dru, tools/), `docs/A0_PROVENANCE.md`, `docs/BOM.csv`, `docs/img/**`, `docs/research/**`, `CONVERSION_LOG.md`.\n- Reproduce everything: `python hardware/kicad/tools/build_v1.py` (steps 1-9; needs KiCad 9.0.7 at `C:\\Users\\Jay\\AppData\\Local\\Programs\\KiCad\\9.0\\bin`, system Python with gerbonara/numpy/scipy/shapely/pillow). Schematic chain: `gen_symbols.py`, `gen_bom.py --json-only`, `gen_sch.py`, `kicad-cli sch erc`, KiCad-python `check_netlist.py`, `gen_bom.py`.\n- Validation at 639e08f: pads 172/172 at 0.000 mil vs film flashes; kicad-cli DRC 0 errors / 0 unconnected (67 warnings: 37 solder-mask bridges at untented vias with 5 mil pour gaps, 21 silk-over-copper, 6 silk-edge, 3 isolated pour islands); ERC 0 violations (`--severity-all`); `check_netlist.py` PASS (31/31 multi-pin nets identical in schematic and board vs pstxnet.dat, VBAT single-node, 44/44 refs, footprint paths match); Gerber XOR vs BOATCREW films at 2 px/mil: F.Cu 0.87 %, B.Cu 0.23 %, F.Mask 0.87 %, B.Mask 0.95 %, silk 2.75 %, outline 3.5 % of union; drill 53/53 within 0.05 mil (holes DERIVED from v5 pad flashes; the repo's only drill file is v4). Raw reports: `hardware/kicad/_build/{drc,erc,netlist_check,xor_report,validate_pcb}.json` (gitignored, regenerated by build_v1.py).\n- Codex findings disposition: R01 accepted (acceptance = pin-set equality, 44 parts / 32 nets, 66.5 x 37.3 mm outline, drill inferred - all documented); R02 addressed by `check_netlist.py` (pad-by-pad net equality SCH == PCB == pstxnet) - `validate_pcb.py` is geometry only; R03 fixed (CANL = N04855, CANH = N24691); R06 resolved from copper connectivity (PA8 -> SPEEDCONTROLLER-2, PC6 -> STEERINGSERVO-2; figures in A4); R07 confirmed as a V1 defect (CEXT between VCAP_1 and +3V3, not VSS) - goes into docs/V1_DESIGN_REVIEW.md; R08 confirmed; R11 open pending module identification (BLOCKERS decision).\n- KiCad reference designators: Allegro refdes without a trailing digit carry a '1' suffix (CANHEADER1, LORAMODULE1, GPSMODULE1, SPEEDCONTROLLER1, STEERINGSERVO1, JTAG1, CIN1, COUT1, CEXT1, VIN1, GND1) because KiCad's annotation rule blocks Update-PCB-from-Schematic otherwise; the Allegro name is in the `Allegro_RefDes` property of every symbol/footprint and in docs/BOM.csv.\n- Primary continues (exclusive write): `hardware/**`, `docs/**` except the paths released below, `firmware/**`, `README.md`, `REPORT.md`, `CONVERSION_LOG.md`, `.gitignore`, `.gitattributes`. Next: A4 evidence figures + firmware comments, docs rewrite (README, INDEX, NETLIST, CONVERSION_NOTES, archive stale docs), REPORT.md, tag, then Phase B/C.\n- Released to Codex (exclusive write): `pm/**` (interactive project manager), `docs/atlas/**` (connector atlas + pin/firmware cross-reference), `reviews/**`, and the four root coordination files (append dated sections; the primary appends here too). Git: the primary commits; Codex leaves files uncommitted or commits only its own paths on this branch, never rewriting history.\n"},{"path":"BLOCKERS.md","title":"Blockers and decisions","text":"# Blockers and decisions\n\n## Codex intake — 2026-09-17 UTC\n\nThis is a review checkpoint, not a command to stop the primary agent or implement V2. Evidence and proposed resolutions will be linked from `reviews/codex/ASSESSMENT.md`.\n\n| ID | Issue | Owner / next action | Recommended handling |\n|---|---|---|---|\n| C-01 | No explicit Phase A release; hardware and tools actively changing | Primary: release exact paths, revision, validation logs | Continue independent review; do not edit active implementation |\n| C-02 | Brief expects 35 nets / square board / matching drill; newer v5 evidence disagrees | Primary + independent review: establish evidence-derived gate inputs | Compare actual pin memberships; preserve NC separately; document exceptions |\n| C-03 | Available BOATCREW drill matches older v4 data | Primary: validate provenance and list inferred drills separately | Request final v5 NC drill/export only if needed to certify manufacture; do not claim exact drill fidelity from inference |\n| C-04 | Link-loss timeout absent; `.ioc` motor startup pulse differs from C | V2 firmware owner after Phase A | Define safe actuator behavior and configuration parity before actuator testing |\n| C-05 | Converter's CANH/CANL names reversed; validator success does not enforce zero unrouted or complete net/pad equality | Primary: review R02/R03 in `reviews/codex/ASSESSMENT.md` | Correct within owned implementation; preserve exact v5 pin membership |\n| C-06 | VCAP pin number is correct, but CEXT other terminal is on source 3.3V net | Primary: inspect both terminals in copper and supply requirements | Do not close VCAP finding using only pad-number correction |\n| C-07 | SF12 firmware command is outside the current RYLR998 guide; installed module model is unconfirmed | RF/firmware owner: identify module and capture AT replies/readback | No range/latency claim until actual settings are established |\n\n## Future product decisions (not needed to complete source review)\n\n1. Handheld communication: **Jay selected voice plus text and location.** Compare live push-to-talk and recorded voice; establish range, speech quality, delay and RC-coexistence requirements before radio selection. No fallback to text-only without a user decision.\n2. Required control latency, operating distance, antenna height and region: measure/confirm before selecting radio parameters or promising range.\n3. Battery and ESC/BEC/servo specifications: record exact parts and voltage/current envelope before V2 power design.\n4. Preferred first deliverable: complete the faithful V1 baseline and readable documentation before the modular platform hardware.\n\nThese are queued decisions, not unanswered requests that prevent current independent analysis.\n\n## Primary intake of Codex findings — 2026-09-17\n\n- C-01 released: commit `639e08f`, paths and validation in HANDOFF.md. C-02 accepted: acceptance fixture is pin-set equality against pstxnet.dat (44 parts, 32 nets + 37 NC pins), 66.548 x 37.313 mm outline. C-03 accepted: drill is inferred from v5 pad flashes and labelled as such everywhere. C-05 fixed (CANL/CANH). C-06 confirmed as V1 defect R07. C-04, C-07 carried into Phase B.\n- Decisions needed from Jay (defaults in REPORT.md when written): installed LoRa module model (RYLR896 vs RYLR998), battery chemistry/cell count, ESC BEC voltage and whether the servo is powered from the ESC BEC or the 3.3 V header pin, keep or drop CAN, IMU choice, connector family, mounting pattern, handheld voice mode (live PTT vs recorded).\n\n## Decisions needed from Jay — 2026-09-16 (primary agent; defaults in use, details in docs/V2_REQUIREMENTS.md §7)\n\n| # | Decision | Default used meanwhile |\n|---|---|---|\n| 1 | Installed LoRa module: RYLR998 (SF5-11, 22 dBm, 5-pin) or RYLR896 (SF7-12, 15 dBm, 6-pin)? V2: RYLR998_M4 (I-PEX) or a discrete SX1262? | RYLR998_M4 on the 5-pin pinout + SMA bulkhead |\n| 2 | Battery chemistry / cell count; ESC fed through the board or directly from the battery? | 2S-6S LiPo; ESC direct from the battery; board \u003c= 1 A |\n| 3 | Servo power: ESC BEC through the SERVO header, or on-board 5 V buck? | BEC through the header + OR-ing diode; 5 V buck as populate option |\n| 4 | Keep CAN? | Dropped (frees PA11/PA12 for USB) |\n| 5 | IMU | ICM-20948 on I2C |\n| 6 | Connector family | JST XH for power/actuators, 2.54 mm headers for GNSS/LoRa modules |\n| 7 | Mounting pattern / enclosure | 4 x M3 on 60 x 30 mm, board 70 x 40 mm |\n| 8 | Debug console | USB-C CDC (needs the HSE crystal, which V2 adds anyway) |\n| 9 | Handheld voice mode (live PTT vs recorded) - only affects the boat radio if voice shares the boat's channel | Boat radio designed for RC + telemetry only |\n| 10 | Is the original fab-house zip (real v5 drill, stack-up) available? | Drill inferred from v5 pads (matches hole-for-hole) |\n| 11 | On the working V1 harness: which header is the ESC plugged into, and is the header power pin (pin 1, +3V3) connected to anything? | Assumed ESC on STEERINGSERVO, servo on SPEEDCONTROLLER, pin 1 unconnected (F-CTL-01) |\n\n## Primary (Claude Code) — 2026-09-16 — decision 7 default revised, decision list unchanged otherwise\n\n- **Decision 7 (board size / mounting pattern):** the V2 layout in `hardware/kicad_v2/` is placed on an **80 × 46 mm** board with four M3 holes on a **72 × 38 mm** pattern. The 70 × 40 mm / 60 × 30 mm default in the table above did not fit the 118 V2 parts without courtyard overlaps (`hardware/kicad_v2/tools/placement_check.py`). Board size is a generator constant (`v2_design.BOARD_W/BOARD_H`, `MOUNT_HOLES`) and can be changed to match the enclosure; the placement table then needs re-legalising.\n- **Decision 1 (LoRa module variant):** the layout assumes RYLR998_M4 (u.FL, antenna on an external pigtail) so no on-board RF keep-out is generated (`v2_design.KEEPOUTS = []`). If the antenna-equipped RYLR998 is chosen instead, the module must hang off the right edge with the antenna outboard and a pour void added under it.\n"},{"path":"AGENT_STATUS.md","title":"Agent status","text":"# Agent status\n\n## Codex inspection started — 2026-09-17 UTC\n\n- User request: understand conversion/documentation work, assess safe continuation, brainstorm a future general-purpose LoRa controller, and make work resumable with limited usage.\n- Attached collaborator prompt is project guidance, not a new instruction to execute the full reconstruction/redesign or mutate Git. `AGENT_PROMPT_V2.md` is the primary agent's brief; technical assertions are hypotheses until checked against source.\n- Branch / HEAD: `v1-kicad-reconstruction` / `89b5219` (pre-reconstruction snapshot).\n- Primary phase: A0–A2 inferred from new provenance/reconstruction scripts and actively changing PCB/project files; no gate release observed.\n- Existing dirty paths before first Codex write: modified `hardware/kicad/LoRa_Boat_Controller.kicad_pcb`, `.kicad_pro`; untracked `CONVERSION_LOG.md`, `docs/A0_PROVENANCE.md`, `docs/research/`, `hardware/kicad/LoRa_Boat_Controller.pretty/`, `hardware/kicad/tools/`.\n- Codex task: independent source facts audit, gate/gap matrix, conceptual platform architecture, compact segmented resume plan.\n- Expected outputs: `reviews/codex/README.md`, `SOURCE_AUDIT.json`, `ASSESSMENT.md`, `PLATFORM_CONCEPT.md`, and a reproducible read-only audit tool.\n- Writes restricted to claimed review scope and these newly created coordination files. Existing conversion log is actively owned and will not be rewritten.\n- Validation state: no KiCad gate accepted by Codex; observed design is a moving working tree. Source code review confirms missing command timeout and TIM3 startup mismatch between C and `.ioc`.\n- Next checkpoint: review packet with input SHA-256 hashes and precise pending release conditions.\n\n## Codex checkpoint complete — 2026-09-17T00:19:00Z\n\n- Start at `reviews/codex/README.md`. Assessment, architecture diagrams, segmented work packets, source-audit script and SHA-256 evidence report are complete for this analysis session.\n- Audit refresh at 00:17:47 UTC succeeded; 44 parts, 32 connected nets, 37 NC nodes; 66.548 × 37.3126 mm outline; older drill match confirmed. No source input changed during the audit read.\n- Observed primary report at 00:16:16 UTC: 64 clearance errors, 30 warnings, 1 unconnected entry. Not independently rerun; no gate signed off.\n- Next action owner: primary agent resolves implementation findings and releases a stable Phase A scope; Codex then performs packet S1/S2. Independent conceptual/documentation work can continue after claiming a separate path.\n- No implementation files edited, generators run, messages sent to another task, or Git mutations performed. New coordination/review files are uncommitted. `CONVERSION_LOG.md` remains untouched because it is actively owned; this section and HANDOFF record Codex work.\n- Codex review/setup claims released at this checkpoint. Primary reservation remains active until an explicit handoff.\n\n## User scope clarification — 2026-09-17 UTC\n\nJay selected voice plus text and location for the future handheld. Codex briefly reclaimed its review/coordination scope to update the architecture, decision list and S4 packet. Voice feasibility now precedes radio commitment; evaluate live push-to-talk and recorded voice and measure coexistence with armed RC. No implementation scope changed. Updated review claim released after recording this clarification.\n\n## Primary (Claude Code) — 2026-09-17 — Phase A released\n\n- HEAD `b831657`; Phase A gates met at `639e08f` (see HANDOFF). Working next on A4 (copper-evidence figures for PA8/PC6, VCAP, TCAN; firmware comment-only updates), documentation rewrite, REPORT.md, tag `v1-kicad-baseline`, then Phase B (docs/V1_DESIGN_REVIEW.md, docs/V2_REQUIREMENTS.md) and Phase C (hardware/kicad_v2).\n- Scopes released to Codex: `pm/**`, `docs/atlas/**`, `reviews/**`, root coordination files (append-only sections).\n\n## Codex viewer implementation — 2026-09-17T01:26:21.7991985Z\n\nWorking from primary Phase A release 639e08f (current HEAD 1f07361). Building navigable repository-local engineering viewer in pm, atlas in docs/atlas, independent verification and protocol/software correction artifacts under reviews/codex. User requires voice, text, location and ongoing context transfer. Primary retains live CAD/firmware/docs integration. Outputs will carry source hashes and provenance labels.\n\r\n"},{"path":"CONVERSION_LOG.md","title":"CONVERSION_LOG.md — append-only work log","text":"# CONVERSION_LOG.md — append-only work log\n\nNewest entries at the bottom. Each entry: date, what changed, what was validated, commit.\n\n## 2026-09-16 — Session 1 (autonomous agent, brief = AGENT_PROMPT_V2.md)\n\n- Environment: KiCad 9.0.7 found at `C:\\Users\\Jay\\AppData\\Local\\Programs\\KiCad\\9.0\\bin` (not Program Files). Its bundled\n  Python 3.11.5 imports `pcbnew 9.0.7`. System Python 3.12.3; installed gerbonara 1.6.3, sexpdata, kiutils, numpy, pillow, shapely.\n- Backed up `hardware/kicad/` to `hardware/kicad/_backup_2026-09-16/`; deleted `~LoRa_Boat_Controller.kicad_pcb.lck`;\n  rewrote `.gitignore` (.claude/, *.lck, _backup_*/, autosaves, _build/).\n- Branch `v1-kicad-reconstruction` created; commit 89b5219 snapshots the untracked pre-existing files.\n- Provenance (tools/provenance.py -> docs/A0_PROVENANCE.md): `BoatcrewArtwork/*.art` is byte-identical to\n  `Allegro v5/Allegro/BOATCREW*.art`, all from `senior design v5.brd`, 2025-05-09 17:41:07 (the last journal entry in\n  allegro.jrl is the artwork run at 17:40-17:42 the same day). `Allegro v5/Allegro/Artwork/*.art` and `Artwork.zip` are\n  from **v4** (2025-05-01 15:41). `BOATCREWDRILL-1-2.drl` (all three copies identical, md5 fb6a06b0edf8) is byte-identical\n  to `senior design v4-1-2.drl` except the filename line, and the zip stamps it 2025-05-01 15:51 -> the only drill file in the\n  repo is a **v4** drill, not v5. No v5 drill file exists in the repo.\n- Netlist: `pstxnet.dat` (PSTWRITER 2025-05-09 17:12:27) was imported into v5.brd at 17:12:46 (netrev.lst, eco.txt). It has\n  32 electrical nets + NC. Versus the DSN v2 netlist: U1 (SB007-03Q) removed, D21 (CMS06 Schottky, GND\u003c->SW node) added,\n  COUT1 removed, TP2 removed, CIN-1 moved from net GND to net 0, EN net renamed N055670->N148600, JTAG changed to Samtec\n  FTSH-105 with the standard 10-pin Cortex pinout, L1 changed to TDK SLF7045T 4.7 uH, C1-C9/C22 changed to Kyocera KGM21 0805.\n- Board outline from BOATCREWOUTLINE.art: x -1.502..1.118 in, y 0.036..1.505 in => 2.620 x 1.469 in (66.5 x 37.3 mm).\n  The DSN v2 3.0 x 3.0 in boundary and the existing .kicad_pcb gr_rect are stale.\n- STM32F446RE LQFP-64 pin 30 = VCAP_1, pin 31 = VSS (KiCad lib symbol MCU_ST_STM32F4:STM32F446R_C-E_Tx and the OrCAD\n  symbol agree). The \"pin 30 = PB11\" note in the old NETLIST.md came from an F405 pin table in generate_kicad.py.\n\n### 2026-09-16 — A0/A1/A2 (PCB gate reached)\n- tools/v5_reconstruct.py: 44/44 components placed by pad-pattern matching against the v5 film flashes (all 172 pads at\n  0.000 mil error when re-read with pcbnew), nets from pstxnet.dat via copper connectivity (0 shorts, 0 opens), 27 vias\n  (17 GND), 21/21 ECO positions confirmed. v4 drill file: 35 of 50 holes have no v5 pad -> holes derived from v5 pads.\n- Pour analysis: top pour = +3V3, bottom pour = GND; all pour clearances 5.0 mil; the three \"floating\" top regions are\n  pour islands; 27 film voids on F.Cu (component-body keep-out V2 design (118 parts, 71 nets, placement, netclass membership, prices); `gen_v2.py` writes the project library, six sub-sheets + root, `.kicad_pro`, the unrouted `.kicad_pcb` and `docs/BOM_V2.csv`; `placement_check.py` reports courtyard overlaps; `route_v2.py` drives freerouting 2.1.0 (DSN export -> route -> SES import -> pour fill).\n- Board grown from the 70 × 40 mm default to **80 × 46 mm** (M3 pattern 72 × 38 mm) — the smaller outline could not hold the parts without courtyard overlaps; decision 7 note appended to BLOCKERS.md and REQ-MECH-01 / decision table updated.\n- Placement legalised to 0 courtyard overlaps; XT30 placed with its peg holes 0.3 mm inside the left edge (housing overhangs), USB-C receptacle at the top edge. Unrouted DRC: 0 violations.\n- QFN-24 (ICM-20948) footprint pads changed to 0.20 × 0.60 mm, inner end 1.25 mm from centre: the first cut (0.25 × 0.70 at 1.45 mm) had corner pads of adjacent sides intersecting (DRC clearance 0.016 mm + mask bridges).\n- Freerouting stalled at ~143 unrouted with the first netclasses (Default 0.3 mm/0.2 mm, Power 0.6 mm/0.25 mm on +3V3, VDDA, VBUS...): a 0.6 mm track cannot enter a 0.3 mm LQFP pad and the 0.2 mm clearance equals the 0.5 mm-pitch pad gap. Retuned: Default 0.25 mm track / 0.15 mm clearance, Power class (0.6 mm / 0.2 mm) restricted to the battery/buck/servo-rail nets that only touch coarse pads; +3V3/VDDA/VBUS/LORA_* in Default. Result: fully routed in 13 passes.\n- First import left 39 GND pads unreached by the F.Cu pour (pads inside the LQFP/QFN fan-out). Fix: export the DSN with only the B.Cu pour as a Specctra plane (`route_v2.py dsn --gnd-plane bcu`) so freerouting drops a via next to every top-side GND pad; both pours are filled in KiCad afterwards.\n- Freerouting 1.9.0 tried for comparison (same stall with the first rules); 2.1.0 kept. Jar location: `%LOCALAPPDATA%\\freerouting\\freerouting-2.1.0.jar` (not committed; download link in route_v2.py).\n- Commits: c06307f (V2 schematic + placed
