<!doctype html>

<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LoRa • Engineering workspace</title>
<style>
:root{--ink:#142433;--muted:#586979;--line:#d8e1e8;--nav:#132d3e;--accent:#086b81;--paper:#fff;--back:#edf2f6;--warm:#9a5510;--danger:#a02a32}*{box-sizing:border-box}body{margin:0;background:var(--back);color:var(--ink);font:16px/1.55 system-ui,Segoe UI,sans-serif}button,input,select,textarea{font:inherit}button,a{touch-action:manipulation}button{cursor:pointer;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink);padding:8px 13px}button:hover{border-color:var(--accent);background:#edf7fa}a{color:var(--accent);text-underline-offset:3px}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #ecad47;outline-offset:3px}h1,h2,h3,p{margin-top:0}h1{font-size:clamp(25px,3vw,35px);line-height:1.2;letter-spacing:-.7px;margin-bottom:9px}h2{font-size:21px;margin:0 0 15px}h3{font-size:17px;margin:0 0 8px}small,.small{font-size:13px}.muted{color:var(--muted)}.shell{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:100vh}aside{background:var(--nav);color:#fff;padding:30px 18px;display:flex;flex-direction:column;gap:25px}aside .brand{font-weight:700;font-size:24px;letter-spacing:-.7px;padding:0 12px}.brand span{color:#78d2da}.eyebrow{font-size:12px;letter-spacing:1.6px;text-transform:uppercase;font-weight:650;margin-bottom:8px}.nav{display:grid;gap:5px}nav button{text-align:left;background:transparent;border:0;color:#dce7ef;border-radius:5px;font-size:15px;padding:11px 13px}nav button:hover{color:#fff;background:#234555}nav button[aria-current=page]{background:#e1f4f5;color:#0f3848;font-weight:650}aside footer{font-size:13px;color:#bed0de;padding:0 12px;margin-top:auto}aside footer code{color:#fff}.topbar{background:var(--paper);border-bottom:1px solid var(--line);padding:16px 30px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}.topbar input{min-width:0;width:min(390px,100%);background:#f5f8fa;border:1px solid var(--line);padding:9px 13px;border-radius:6px}.top-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.top-actions button{font-size:14px}.workspace{min-width:0}.main{padding:30px;max-width:1550px;margin:auto}.lead{max-width:890px;color:var(--muted);margin-bottom:23px}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.spread{justify-content:space-between}.card{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:22px;min-width:0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin:20px 0}.stat{border-top:3px solid var(--accent);background:#fff;padding:16px 18px;border-radius:4px;min-width:0}.stat b{display:block;font-size:26px;line-height:1.2;margin:6px 0}.tag{display:inline-block;font-size:12px;font-weight:650;background:#e4f1f4;color:#125366;padding:3px 8px;border-radius:3px;vertical-align:middle}.tag.warn{background:#fff1d8;color:#834904}.tag.bad{background:#fce5e7;color:#9c222e}.tag.good{background:#e0f2e9;color:#206046}.notice{background:#fff7e7;border-left:3px solid #ce8d24;padding:14px 18px;margin:18px 0;color:#704711}.section{margin-top:24px}.board-hero{width:100%;height:300px;object-fit:contain;background:#f1f5f7;border-radius:5px}.phase-list{list-style:none;margin:0;padding:0;display:grid;gap:0}.phase-list li{display:grid;grid-template-columns:38px minmax(0,1fr);gap:13px;padding:13px 0;border-bottom:1px solid var(--line)}.phase-list li:last-child{border:0}.phase-id{font-size:14px;font-weight:700;color:var(--accent)}.phase-list p{margin:5px 0;font-size:14px;color:var(--muted)}.table-wrap{overflow:auto;max-width:100%}table{width:100%;border-collapse:collapse;font-size:14px}th{text-align:left;background:#eef4f6;color:#3c5364;white-space:nowrap}td,th{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:top}td{overflow-wrap:anywhere}tbody tr:hover{background:#f5fafb}td button{padding:3px 8px;font-size:14px}code{font:13px ui-monospace,Consolas,monospace;overflow-wrap:anywhere}pre{background:#102632;color:#dcebf0;padding:18px;border-radius:5px;overflow:auto;max-height:65vh;font:13px/1.6 ui-monospace,Consolas,monospace;tab-size:2}pre code{white-space:pre;overflow-wrap:normal}.filters{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:18px 0}.filters label{font-size:14px;display:flex;gap:8px;align-items:center}select{max-width:100%;border:1px solid var(--line);border-radius:5px;padding:8px;background:#fff;color:var(--ink)}.empty{padding:35px;text-align:center;color:var(--muted);background:#fff;border:1px dashed var(--line)}.list{display:grid;gap:12px}.list-item{padding:17px 20px;background:#fff;border:1px solid var(--line);border-radius:6px}.list-item p{margin:8px 0 0;font-size:15px}.asset-stage{height:520px;overflow:auto;background:#f0f4f6;border:1px solid var(--line);padding:15px;text-align:center}.asset-stage img{width:100%;max-width:none;transform-origin:top left}.asset-stage iframe{width:100%;height:100%;border:0;background:#fff}.asset-caption{font-size:13px;color:var(--muted);margin:10px 0}.compare{display:grid;grid-template-columns:1fr 1fr;gap:16px}.compare img{width:100%;background:white}.chiprow{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}.path{font-size:12px;color:var(--muted);overflow-wrap:anywhere}.connector-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.connector-grid button{text-align:left;padding:18px}.connector-grid b{display:block}.connector-grid small{color:var(--muted)}.flow{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin:22px 0}.flow>div{border-top:3px solid var(--accent);background:#fff;padding:17px}.flow p{font-size:14px;color:var(--muted);margin:8px 0 0}.footerline{padding:20px 30px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}dialog{border:1px solid var(--line);border-radius:9px;padding:0;width:min(1100px,94vw);max-height:92vh;color:var(--ink);background:#fff}dialog::backdrop{background:#08243599}.dialog-head{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--line);padding:15px 22px;display:flex;justify-content:space-between;gap:15px;align-items:center;z-index:2}.dialog-head h2{font-size:18px;margin:0;overflow-wrap:anywhere}.dialog-body{padding:25px;overflow-wrap:anywhere}.dialog-body img{max-width:100%}.doc-body h1{font-size:27px}.doc-body h2{margin-top:28px}.doc-body h3{margin-top:20px}.doc-body blockquote{border-left:3px solid var(--line);margin:15px 0;padding-left:20px;color:var(--muted)}.doc-body table{margin:15px 0}.doc-body p{margin-bottom:14px}.doc-body ul{padding-left:23px}.notes textarea{width:100%;min-height:100px;border:1px solid var(--line);border-radius:5px;padding:12px}.sr{position:absolute;width:1px;height:1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}.subnav{display:flex;gap:8px;flex-wrap:wrap}.subnav button[aria-pressed=true]{background:var(--nav);color:white}.lightbox{max-height:72vh;object-fit:contain}.mono-num{font-variant-numeric:tabular-nums}@media(max-width:1050px){.shell{grid-template-columns:190px minmax(0,1fr)}.main{padding:23px}.grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.flow{grid-template-columns:repeat(2,1fr)}.board-hero{height:260px}}@media(max-width:700px){.shell{display:block}aside{padding:16px;gap:14px}.nav{display:flex;overflow:auto;gap:6px;padding-bottom:3px}nav button{white-space:nowrap;padding:9px 12px}.brand{font-size:21px!important}aside footer{display:none}.topbar{padding:14px 18px}.topbar input{width:100%}.main{padding:22px 16px}.card{padding:17px}.compare{grid-template-columns:1fr}.asset-stage{height:380px}.dialog-body{padding:16px}.flow{grid-template-columns:1fr 1fr}.stat{padding:12px}.stat b{font-size:22px}.footerline{padding:18px}button{min-height:40px}.top-actions{width:100%}}@media print{aside,.topbar,.footerline,.filters{display:none}.shell{display:block}.main{padding:0}.card{break-inside:avoid}}
</style></head>
<body><div class="shell"><aside><div class="brand">LoRa<span> / </span>Lab<div class="eyebrow" style="margin-top:9px;color:#a6c1d0">Engineering workspace</div></div><nav class="nav" aria-label="Project sections" id="nav"></nav><footer><p>Boat controller →<br>RC + voice + text + location</p><p>Evidence before release.<br><code id="revision"></code></p></footer></aside><div class="workspace"><header class="topbar"><label class="sr" for="search">Search the current section</label><input id="search" type="search" placeholder="Search this section…" autocomplete="off"><div class="top-actions"><span class="tag" id="snapshot-label">Repository snapshot</span><button id="refresh">Refresh data</button><button id="export">Export handoff</button></div></header><main class="main" id="main"></main><footer class="footerline" id="footer"></footer></div></div><dialog id="dialog"><div class="dialog-head"><h2 id="dialog-title"></h2><button id="dialog-close" aria-label="Close detail">Close ×</button></div><div class="dialog-body" id="dialog-body"></div></dialog><div class="sr" aria-live="polite" id="announce"></div>
<script>/*__PROJECT_DATA__*/</script>
<script>
'use strict';
let D=window.PROJECT;const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const names={overview:'Project overview',design:'Design viewer',bom:'BOM & datasheets',atlas:'Connector atlas',software:'Software & protocol',verification:'Verification',traceability:'Findings → requirements',decisions:'Plan & decisions',documents:'Document library'};
let page=Object.keys(names).includes(location.hash.slice(1))?location.hash.slice(1):'overview',query='',bomRevision='v1',assetRevision='v1',assetChoice='',connectorChoice='';
const link=(p,label)=>`<a href="../${encodeURI(p)}" target="_blank" rel="noopener">${esc(label||p)}</a>`;
const docbtn=(p,label)=>`<button data-doc="${esc(p)}">${esc(label||p.split('/').pop())}</button>`;
const matches=x=>!query||JSON.stringify(x).toLowerCase().includes(query);
const badge=s=>{const t=String(s||'');let cls=/fail|error|mismatch|blocked/i.test(t)?'bad':/pass|verified|resolved/i.test(t)?'good':/open|draft|pending|unverified|not|needs|unknown/i.test(t)?'warn':'';return `<span class="tag ${cls}">${esc(t)}</span>`;};
const intro=(title,desc)=>`<div class="eyebrow">${esc(D.branch)} / PROJECT RECORD</div><h1>${title}</h1><p class="lead">${desc}</p>`;
const empty=t=>`<div class="empty">${esc(t)}</div>`;
function table(headers,rows){return `<div class="table-wrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`;}
function documentRef(p,label){return D.documents.some(d=>d.path===p)?docbtn(p,label):link(p,label);}
function show(title,html){$('dialog-title').textContent=title;$('dialog-body').innerHTML=html;if(!$('dialog').open)$('dialog').showModal();}
function normalizeLink(target,source){if(/^https?:\/\//i.test(target))return {external:target};if(/^[a-z]+:/i.test(target))return {};try{return {path:new URL(target,'https://repository.invalid/'+source).pathname.slice(1)};}catch{return {};}}
function inline(s,source){let t=esc(s);t=t.replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');return t.replace(/\[([^\]]+)\]\(([^)]+)\)/g,(_,label,target)=>{const v=normalizeLink(target.replaceAll('&amp;','&'),source);return v.external?`<a href="${esc(v.external)}" target="_blank" rel="noopener">${label}</a>`:v.path?`<a href="../${encodeURI(v.path)}" data-doc="${esc(v.path)}">${label}</a>`:label;});}
function markdown(text,source){const lines=String(text).split('\n');let out='',code=false,buf=[],inList=false;const closeList=()=>{if(inList){out+='</ul>';inList=false;}};for(let i=0;i<lines.length;i++){let l=lines[i];if(l.startsWith('```')){closeList();if(code){out+='<pre><code>'+esc(buf.join('\n'))+'</code></pre>';buf=[];}code=!code;continue;}if(code){buf.push(l);continue;}if(/^\|/.test(l)&&/^\|[- :|]+\|?\s*$/.test(lines[i+1]||'')){closeList();const cells=x=>x.replace(/^\||\|\s*$/g,'').split(/(?<!\\)\|/).map(x=>inline(x.trim(),source));const head=cells(l),rows=[];i+=2;while(i<lines.length&&/^\|/.test(lines[i])){rows.push('<tr>'+cells(lines[i]).map(c=>'<td>'+c+'</td>').join('')+'</tr>');i++;}i--;out+=table(head,rows);continue;}const h=l.match(/^(#{1,4}) (.+)/);if(h){closeList();out+=`<h${h[1].length}>${inline(h[2],source)}</h${h[1].length}>`;continue;}if(/^\s*[-*] /.test(l)){if(!inList){out+='<ul>';inList=true;}out+='<li>'+inline(l.replace(/^\s*[-*] /,''),source)+'</li>';continue;}closeList();if(/^---+$/.test(l.trim()))out+='<hr>';else if(l.startsWith('> '))out+='<blockquote>'+inline(l.slice(2),source)+'</blockquote>';else if(l.trim())out+='<p>'+inline(l,source)+'</p>';}closeList();if(code)out+='<pre>'+esc(buf.join('\n'))+'</pre>';return out;}
function openDocument(p){const d=D.documents.find(x=>x.path===p);if(d){show(d.title,`<div class="row spread"><span class="path">${esc(p)}</span>${link(p,'Open original')}</div><article class="doc-body section">${markdown(d.text,p)}</article>`);return true;}const s=D.sources.find(x=>x.path===p);if(s){show(p,`${link(p,'Open source file')}<p class="muted small">Source snapshot; line numbers refer to this captured version.</p><pre><code>${s.text.split('\n').map((l,i)=>esc(String(i+1).padStart(4)+'  '+l)).join('\n')}</code></pre>`);return true;}return false;}
function overview(){return intro('From working boat to reusable platform.',esc(D.purpose))+`<div class="stats"><div class="stat"><span class="small muted">V1 baseline</span><b>${D.bom.length} parts</b><span class="small">32 connected source nets</span></div><div class="stat"><span class="small muted">V2 engineering record</span><b>${D.requirements.length} requirements</b><span class="small">${D.designFindings.length} source findings</span></div><div class="stat"><span class="small muted">Design libraries</span><b>${D.images.length} views</b><span class="small">Schematics, layers & evidence</span></div><div class="stat"><span class="small muted">Release readiness</span><b>Review open</b><span class="small">Draft ≠ hardware qualification</span></div></div><div class="grid"><section class="card"><div class="row spread"><h2>V1 / fabricated baseline</h2><span class="tag">Reconstruction</span></div><img class="board-hero" src="../docs/img/v1_pcb_top.png" alt="Top render of reconstructed V1 boat controller"><div class="row section"><button class="primary" data-page="design">Explore design</button><button data-page="bom">Inspect BOM</button>${documentRef('REPORT.md','Read project report')}</div><p class="muted small section">V1: 66.548 × 37.313 mm. Original design defects are preserved and documented. Fabrication drill is inferred from v5 features.</p></section><section class="card"><h2>Engineering gates</h2><ol class="phase-list">${D.phases.map(p=>`<li><span class="phase-id">${esc(p.id)}</span><div><strong>${esc(p.title)}</strong> ${badge(p.status)}<p>${esc(p.detail)}</p>${documentRef(p.source,'Evidence')}</div></li>`).join('')}</ol></section></div><div class="notice">The future handheld includes <strong>voice, text and location</strong>. Voice performance and RC coexistence remain requirements to validate before radio selection.</div><section class="card section"><h2>Next review</h2><ol>${D.next.map(x=>`<li>${esc(x)}</li>`).join('')}</ol><button data-page="verification">View verification record</button></section>`;}
function design(){const assets=D.images.filter(x=>x.path.includes('/'+assetRevision+'_')&&matches(x));if(!assets.some(x=>x.path===assetChoice))assetChoice=assets.find(x=>x.path.includes('pcb_top'))?.path||assets.find(x=>x.path.includes('sch_root'))?.path||assets[0]?.path||'';const a=assets.find(x=>x.path===assetChoice);return intro('Design viewer','Inspect released geometry, schematic sheets and copper evidence. Each view links back to its source artifact.')+`<div class="filters"><label>Revision <select id="asset-revision"><option value="v1" ${assetRevision==='v1'?'selected':''}>V1 reconstructed</option><option value="v2" ${assetRevision==='v2'?'selected':''}>V2 draft</option></select></label><label>View <select id="asset-choice">${assets.map(x=>`<option value="${esc(x.path)}" ${x.path===assetChoice?'selected':''}>${esc(x.title)}</option>`).join('')}</select></label><label>Zoom <input id="zoom" type="range" min="100" max="350" value="100" aria-label="Image zoom"></label></div>${a?`<div class="asset-stage">${a.type==='pdf'?`<iframe src="../${encodeURI(a.path)}" title="Schematic PDF"></iframe>`:`<img id="asset-image" src="../${encodeURI(a.path)}" alt="${esc(a.title)}">`}</div><div class="row spread asset-caption"><span>${esc(a.path)}</span>${link(a.path,'Open full artifact')}</div>`:empty('No matching view is present in this snapshot.')}<div class="row section">${link(`hardware/${assetRevision==='v1'?'kicad/LoRa_Boat_Controller':'kicad_v2/LoRa_Boat_Controller_V2'}.kicad_pro`,'KiCad project')}${link(`hardware/${assetRevision==='v1'?'kicad/LoRa_Boat_Controller':'kicad_v2/LoRa_Boat_Controller_V2'}.kicad_pcb`,'PCB file')}${assetRevision==='v2'?documentRef('hardware/kicad_v2/README.md','V2 design notes'):documentRef('docs/CONVERSION_NOTES.md','Conversion notes')}</div>${assetRevision==='v2'?`<section class="notice">${inline(D.fabrication,'REPORT.md')}<p class="small">Missing board renders stay absent; no preview is fabricated from a planned design.</p></section>`:`<section class="card section"><h2>Fabrication evidence / reconstructed copper</h2><div class="compare"><div><h3>Original v5 top copper</h3><img src="../docs/img/v1_fab_F_Cu.png" alt="Original v5 top copper"></div><div><h3>KiCad top copper</h3><img src="../docs/img/v1_kicad_F_Cu.png" alt="Reconstructed top copper"></div></div><p class="small muted">Visual comparison supplements the measured XOR report; it is not a connectivity test.</p></section>`}`;}
function bom(){const rows=(bomRevision==='v1'?D.bom:D.bomV2).filter(matches);return intro('BOM & datasheets','Search reference designators, part numbers, values or manufacturers. Confidence and substitutions come from the source BOM.')+`<div class="filters"><label>Revision <select id="bom-revision"><option value="v1" ${bomRevision==='v1'?'selected':''}>V1</option><option value="v2" ${bomRevision==='v2'?'selected':''}>V2 draft</option></select></label><span>${rows.length} rows</span>${link(bomRevision==='v1'?'docs/BOM.csv':'docs/BOM_V2.csv','Open CSV')}</div><p class="muted small">Prices are dated source estimates, not live distributor quotes. A missing datasheet is shown explicitly; a suggested part is not proof of the fitted part.</p>${table(['Reference / quantity','Value & description','MPN / manufacturer','Confidence / source price','Details'],rows.map((r)=>{const refs=r.Ref||r.Refs;return `<tr><td><strong>${esc(refs)}</strong><br>Qty ${esc(r.Qty)}</td><td>${esc(r.Value)}<br><small class="muted">${esc(r.Description)}</small></td><td><code>${esc(r.MPN||'Not specified')}</code><br>${esc(r.Manufacturer||'—')}</td><td>${esc(r.Confidence||'V2 proposed')}<br>${r['Unit price qty1 USD']?'$'+esc(r['Unit price qty1 USD']):'—'}</td><td><button data-part="${esc(refs)}">Inspect</button></td></tr>`;}))}<section class="section"><h2>Manufacturer references</h2><div class="connector-grid">${D.datasheets.filter(matches).map(d=>`<article class="card"><h3>${esc(d.title)}</h3><p class="small muted">${esc(d.maker)}</p><p class="small">${esc(d.note)}</p><a href="${esc(d.url)}" target="_blank" rel="noopener">Open manufacturer document ↗</a></article>`).join('')}</div></section>`;}
function partDetail(ref){const p=(bomRevision==='v1'?D.bom:D.bomV2).find(r=>(r.Ref||r.Refs)===ref);if(!p)return;const ds=D.datasheets.filter(d=>bomRevision==='v1'?d.refs.includes(ref):p.MPN&&d.title.startsWith(String(p.MPN).slice(0,7)));show(ref,`<h3>${esc(p.Description)}</h3>${table(['Field','Source BOM value'],Object.entries(p).map(([k,v])=>`<tr><td>${esc(k)}</td><td>${esc(v||'Not specified')}</td></tr>`))}<h3 class="section">Datasheets</h3>${ds.length?ds.map(d=>`<p><a href="${esc(d.url)}" target="_blank" rel="noopener">${esc(d.title)}</a> — ${esc(d.note)}</p>`).join(''):'<p class="muted">No verified exact-part datasheet link has been added for this row. See the datasheet research notes before substituting.</p>'}${documentRef('docs/research/DATASHEET_NOTES.md','Research notes')}`);}
function atlas(){const list=D.connectors.filter(matches);const c=D.connectors.find(x=>x.id===connectorChoice);return intro('Connector atlas','Trace every external pin to the net, MCU pad and firmware behavior. Expected bench readings are proposed checks, not measured results.')+(list.length?`<div class="connector-grid">${list.map(c=>`<button data-connector="${esc(c.id)}"><b>${esc(c.title||c.id)}</b><small>${c.pins?.length||0} pins · ${esc(c.id)}</small></button>`).join('')}</div>`:empty('Connector atlas is being recovered from the interrupted session; no pin data is invented.'))+(c?`<section class="card section"><div class="row spread"><h2>${esc(c.title||c.id)}</h2>${documentRef(c.doc,'Open atlas page')}</div><p>${esc(c.description)}</p>${(c.notes||[]).map(n=>`<p class="notice">${esc(n)}</p>`).join('')}${table(['Pin','Net / MCU','Firmware','Electrical / direction','Expected check'],(c.pins||[]).map(p=>`<tr><td><strong>${esc(p.pin)}</strong></td><td><code>${esc(p.net)}</code><br>${esc(p.allegro_net)}<br>${esc(p.mcu)}</td><td>${esc(p.firmware)}<br>${(p.evidence||[]).map(e=>`<button data-doc="${esc(e.path)}">${esc(e.path.split('/').pop())}${e.line?':'+e.line:''}</button>`).join(' ')}</td><td>${esc(p.voltage)}<br>${esc(p.direction)}</td><td>${esc(p.bench)}</td></tr>`))}</section>`:'');}
function software(){const src=D.sources.filter(matches),prototype=src.filter(x=>x.path.includes('/firmware_prototype/'));return intro('Software, protocol & application','The current HAL application, proposed corrections, and successor implementation plan are separate engineering artifacts.')+`<div class="flow"><div><strong>Application</strong><p>Vehicle control + navigation<br>Handheld voice / text / location</p></div><div><strong>Protocol services</strong><p>Identity, framing, freshness<br>Control priority and delivery state</p></div><div><strong>Safety & drivers</strong><p>Arm / failsafe / watchdog<br>UART, GNSS, PWM and sensors</p></div><div><strong>Hardware</strong><p>STM32 + radio adapter<br>Protected power and external I/O</p></div></div><section class="notice"><strong>Deployment status:</strong> live V1 firmware preserves the original behavior. The standalone correction code is a review prototype, not an integrated or hardware-qualified firmware release.</section><div class="grid"><section class="card"><h2>Current on-air application</h2><p><code>THRUST,0…100</code> and <code>RUDDER,0…100</code> arrive as separate payloads. GPS coordinates are sent periodically.</p><p>Current gaps include command expiry, strict sender/length validation, safe buffer handoff, UART error recovery and fix freshness.</p>${documentRef('docs/research/FIRMWARE_REVIEW_NOTES.md','Firmware audit')}</section><section class="card"><h2>Proposed correction path</h2><ol><li>Validate complete frames before actuation.</li><li>Require explicit arming and fresh commands.</li><li>Latch failsafe; reconnect stays disarmed.</li><li>Align generated startup configuration with C.</li><li>Test timing under radio, voice and telemetry load.</li></ol>${documentRef('firmware/V2_FIRMWARE_PLAN.md','V2 firmware plan')}</section></div><section class="section"><h2>Source and review artifacts</h2><div class="list">${src.map(s=>`<div class="list-item row spread"><div><strong>${esc(s.path.split('/').pop())}</strong><div class="path">${esc(s.path)}</div></div>${docbtn(s.path,s.path.includes('prototype')?'Inspect proposal':'Read source')}</div>`).join('')}</div>${!prototype.length?'<p class="muted">No correction prototype captured in this snapshot.</p>':''}</section><section class="card section"><h2>Voice, text and location</h2><p>Compare live half-duplex push-to-talk with recorded voice delivery. Establish codec/framing airtime, useful speech quality, delay and the maximum blocking interval seen by RC control before committing to a radio.</p>${documentRef('reviews/codex/PLATFORM_CONCEPT.md','Platform architecture')}</section>`;}
function verification(){const independent=D.independent,checks=independent?.checks||[];const layers=D.reports.xor_report?.data?.layers||{};const drc=D.reports.drc?.data;const violations=drc?.violations||[];return intro('Verification & provenance','A report is tied to its inputs. Independent results are shown separately from primary-agent reports and design intent.')+`<section class="card"><h2>Independent release review</h2>${independent?`<p>Revision <code>${esc(independent.revision)}</code> · ${esc(independent.generated_at)}</p>${table(['Check','Verdict','Evidence'],checks.filter(matches).map(c=>`<tr><td>${esc(c.name)}</td><td>${badge(c.status)}<p>${esc(c.detail)}</p></td><td>${typeof c.evidence==='string'?link(c.evidence,'Evidence'):esc(JSON.stringify(c.evidence||''))}</td></tr>`))}<ul>${(independent.limitations||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul>${documentRef('reviews/codex/S2_VERIFICATION.md','Independent report')}`:empty('Independent verification was interrupted. Raw outputs exist, but there is no completed verdict yet.')}</section><section class="card section"><h2>Primary V1 report snapshot</h2><p class="small muted">These values are read from working report files; read the independent row above for corroboration.</p><div class="stats"><div class="stat">DRC errors<b>${drc?violations.filter(x=>x.severity==='error').length:'—'}</b></div><div class="stat">DRC warnings<b>${drc?violations.filter(x=>x.severity==='warning').length:'—'}</b></div><div class="stat">Unconnected entries<b>${drc?drc.unconnected_items?.length??'—':'—'}</b></div><div class="stat">Report date<b style="font-size:16px">${esc(drc?.date||'Unavailable')}</b></div></div>${table(['Layer','XOR / copper union','Pixel scale','Source'],Object.entries(layers).map(([k,v])=>`<tr><td>${esc(k)}</td><td>${Number(v.xor_pct_of_union).toFixed(3)}%</td><td>${esc(v.scale_px_per_mil)} px/mil</td><td>${link(D.reports.xor_report.path,'Raw JSON')}</td></tr>`))}<div class="notice">Drill comparison uses inferred v5 hole locations. It does not prove identity to an original final v5 NC drill file.</div></section><section class="card section"><h2>V2 working reports</h2><p>Active draft reports may change during routing. Their existence does not constitute independent V2 sign-off.</p>${Object.entries(D.v2Reports).map(([name,r])=>`<p>${link(r.path,name)}</p>`).join('')||'<p>No V2 report files captured.</p>'}</section><section class="card section"><h2>Snapshot manifest</h2><p>HEAD <code>${esc(D.head)}</code> · generated ${esc(D.generated_at)}</p><p>${D.inputs_changed_during_build.length?badge('Inputs changed during build — refresh required'):badge('Inputs stable during capture')}</p><details><summary>${Object.keys(D.manifest).length} source hashes</summary>${table(['Source','SHA-256'],Object.entries(D.manifest).filter(matches).map(([p,h])=>`<tr><td>${esc(p)}</td><td><code>${esc(h)}</code></td></tr>`))}</details></section>`;}
function traceability(){const f=D.designFindings.filter(matches),r=D.requirements.filter(matches);return intro('Findings → requirements','Follow the reason for a change through its acceptance test. A requirement being written is not evidence that it is implemented.')+`<section class="card"><h2>V1 findings / successor disposition</h2>${table(['Finding','Severity','Observation & evidence','Requirement links'],f.map(x=>`<tr><td><strong>${esc(x.id)}</strong></td><td>${esc(x.severity)}</td><td>${inline(x.finding,'docs/V1_DESIGN_REVIEW.md')}<p class="small muted">${esc(x.evidence)}</p></td><td>${x.requirements.map(id=>`<button data-req="${esc(id)}">${esc(id)}</button>`).join(' ')||inline(x.disposition,'docs/V1_DESIGN_REVIEW.md')}</td></tr>`))}</section><section class="card section"><h2>Measurable requirements</h2>${table(['ID','Requirement','Verification'],r.map(x=>`<tr><td><button data-req="${esc(x.id)}">${esc(x.id)}</button></td><td>${inline(x.requirement,x.source)}</td><td>${esc(x.verify)}</td></tr>`))}</section><section class="section"><h2>Independent intake findings</h2><div class="list">${D.findings.filter(matches).map(x=>`<article class="list-item"><div class="row spread"><h3>${esc(x.id)} · ${esc(x.title)}</h3>${badge(x.status)}</div><p>${esc(x.detail)}</p></article>`).join('')}</div></section>`;}
function decisions(){let notes='';try{notes=localStorage.getItem('lora-review-notes')||'';}catch{}return intro('Decisions, next steps & handoff','Keep the original baseline intact, resolve the next measurable question, and carry evidence into the next session.')+`<section class="card"><h2>Open decisions / primary working defaults</h2><p class="small muted">Defaults are engineering assumptions awaiting confirmation, not recorded user decisions.</p>${table(['#','Decision','Working default'],D.decisionRows.filter(matches).map(d=>`<tr><td>${esc(d.id)}</td><td>${esc(d.question)}</td><td>${esc(d.default)}</td></tr>`))}${documentRef('BLOCKERS.md','Full decision record')}</section><div class="grid section"><section class="card"><h2>Next bounded packets</h2><ol>${D.next.map(x=>`<li>${esc(x)}</li>`).join('')}</ol>${documentRef('reviews/codex/README.md','Resume instructions')}</section><section class="card notes"><h2>Your review notes</h2><p class="small muted">Stored in this browser only. Notes do not approve a design or change repository status. Export the handoff to keep a copy.</p><label class="sr" for="notes">Local review notes</label><textarea id="notes" placeholder="Record a question, observed hardware detail, or decision…">${esc(notes)}</textarea><p class="small" id="note-state">${notes?'Saved locally':'No saved notes'}</p></section></div><section class="card section"><h2>Changes since previous viewer build</h2>${D.changed_since_previous.length?`<ul>${D.changed_since_previous.map(p=>`<li><code>${esc(p)}</code></li>`).join('')}</ul>`:'<p class="muted">First capture, or no captured source hashes changed.</p>'}</section>`;}
function documents(){const docs=D.documents.filter(matches);return intro('Document library','Read the project story, implementation, test plans and source evidence in one place.')+`<div class="list">${docs.map(d=>`<article class="list-item row spread"><div><h3>${esc(d.title)}</h3><div class="path">${esc(d.path)}</div></div>${docbtn(d.path,'Read')}</article>`).join('')}</div><section class="card section"><h2>CAD, images and downloadable source map</h2>${table(['Artifact','Open'],D.available_paths.filter(matches).map(p=>`<tr><td><code>${esc(p)}</code></td><td>${link(p,'Open file')}</td></tr>`))}</section>`;}
const renders={overview,design,bom,atlas,software,verification,traceability,decisions,documents};
function render(){document.title=names[page]+' • LoRa Lab';$('nav').innerHTML=Object.entries(names).map(([id,n])=>`<button data-page="${id}" ${id===page?'aria-current="page"':''}>${n}</button>`).join('');$('main').innerHTML=renders[page]();$('revision').textContent=D.head.slice(0,8);$('snapshot-label').textContent=D.branch+' · '+D.head.slice(0,7);$('footer').textContent='Captured '+new Date(D.generated_at).toLocaleString()+' · Local repository viewer · Datasheets open at their publishers · Hardware validation status is explicit.';}
function navigate(p){page=p;query='';$('search').value='';history.replaceState(null,'','#'+p);render();window.scrollTo({top:0,behavior:'instant'});}
document.addEventListener('click',e=>{const b=e.target.closest('button,a');if(!b)return;if(b.dataset.page)navigate(b.dataset.page);if(b.dataset.doc){if(openDocument(b.dataset.doc))e.preventDefault();}if(b.dataset.part)partDetail(b.dataset.part);if(b.dataset.connector){connectorChoice=b.dataset.connector;render();}if(b.dataset.req){const r=D.requirements.find(x=>x.id===b.dataset.req);if(r)show(r.id,`<h3>Requirement</h3><p>${inline(r.requirement,r.source)}</p><h3>Source findings</h3><p>${esc(r.findings)}</p><h3>Acceptance method</h3><p>${esc(r.verify)}</p>${documentRef(r.source,'Full requirements document')}`);}});
document.addEventListener('change',e=>{if(e.target.id==='bom-revision'){bomRevision=e.target.value;render();}if(e.target.id==='asset-revision'){assetRevision=e.target.value;assetChoice='';render();}if(e.target.id==='asset-choice'){assetChoice=e.target.value;render();}});
document.addEventListener('input',e=>{if(e.target.id==='zoom'&&$('asset-image'))$('asset-image').style.width=e.target.value+'%';if(e.target.id==='notes'){try{localStorage.setItem('lora-review-notes',e.target.value);$('note-state').textContent='Saved in this browser';}catch{$('note-state').textContent='Storage unavailable; use Export handoff to keep notes.';}}});
$('search').addEventListener('input',e=>{query=e.target.value.toLowerCase().trim();render();});$('dialog-close').onclick=()=>$('dialog').close();$('dialog').addEventListener('click',e=>{if(e.target===$('dialog'))$('dialog').close();});
$('refresh').onclick=async()=>{if(location.protocol==='file:'){show('Refresh the snapshot','<p>This offline page includes its data. Run <code>node pm/tools/build.mjs</code> from the repository root, then reload this page. With the local server running, this button reads the latest generated status.</p>');return;}try{const res=await fetch('status.json',{cache:'no-store'});if(!res.ok)throw Error(res.status);const fresh=await res.json();if(fresh.schema!==1)throw Error('Unsupported schema');D=fresh;render();$('announce').textContent='Snapshot refreshed';}catch{show('Snapshot not refreshed','<p>The saved snapshot remains available. Regenerate status.json and check the local viewer server.</p>');}};
$('export').onclick=()=>{let notes=$('notes')?.value||'';if(!notes)try{notes=localStorage.getItem('lora-review-notes')||'';}catch{}const txt='# LoRa review handoff\n\nCaptured: '+D.generated_at+'\nBranch / HEAD: '+D.branch+' / '+D.head+'\n\n## Next review\n'+D.next.map(x=>'- '+x).join('\n')+'\n\n## Local notes (not design approval)\n'+notes+'\n\n## Context\nRead pm/README.md, HANDOFF.md and FILE_OWNERSHIP.md before writing. Keep primary CAD/firmware ownership intact. Voice + text + location are required. Review reported and independent results separately.\n';const url=URL.createObjectURL(new Blob([txt],{type:'text/markdown'}));const a=document.createElement('a');a.href=url;a.download='lora-review-handoff.md';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};
render();
</script></body></html>
