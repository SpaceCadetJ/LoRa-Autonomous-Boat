name: Repository checks

# Software/evidence packaging checks. A green result is not hardware approval.
on:
  push:
    branches: [main, v2-design]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-review-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check acceptance logic
        run: python -m unittest discover -s tools/quality -p 'test_*.py' -v
      - name: Verify portable evidence and portfolio links
        run: python tools/quality/check_publication.py
      - name: Verify V2 diagnostic pin contract
        run: |
          python firmware_v2/tools/build.py check
          python -m unittest discover -s firmware_v2/tests -v
      - name: Check IMU candidate rejection cases
        run: python reviews/codex/imu_interface/test_candidate.py
      - name: Verify placement preservation rejection cases
        run: python reviews/codex/imu_placement/test_preservation.py
      - name: Check IMU2 bias-filter amendment rejection cases
        run: python reviews/codex/imu_bias_filter/test_amendment.py
      - name: Verify unchanged 6S power boundary capture
        run: python reviews/codex/power_envelope/capture.py --check
      - name: Verify proposed power arithmetic and rejection cases
        run: |
          python reviews/codex/power_topology/model.py --check
          python reviews/codex/power_topology/test_model.py
      - name: Verify isolated input-stage native delta and rejection cases
        run: |
          python reviews/codex/input_stage/verify_candidate.py --check
          python reviews/codex/input_stage/test_candidate.py
      - name: Check reverse-leakage disposition and review tool
        run: |
          python reviews/codex/reverse_leakage/capture.py --check
          python reviews/codex/reverse_leakage/model.py --check
          python reviews/codex/reverse_leakage/test_model.py
          python reviews/codex/reverse_leakage/build_view.py --check
      - name: Check input capacitor specification and footprint evidence
        run: |
          python reviews/codex/input_capacitors/model.py --check
          python reviews/codex/input_capacitors/test_model.py
          python reviews/codex/input_capacitors/check_geometry.py
          python reviews/codex/input_capacitors/build_view.py --check
      - name: Verify isolated 3.3 V converter evidence and rejection cases
        run: |
          python reviews/codex/buck_3v3/verify_candidate.py --check
          python reviews/codex/buck_3v3/test_candidate.py
          python reviews/codex/buck_3v3/model.py --check
          python reviews/codex/buck_3v3/test_model.py
          python reviews/codex/buck_3v3/inspect_packages.py --check
      - name: Verify isolated 5 V converter and feed evidence
        run: |
          python reviews/codex/buck_5v/verify_candidate.py --check
          python reviews/codex/buck_5v/test_candidate.py
          python reviews/codex/buck_5v/model.py --check
          python reviews/codex/buck_5v/test_model.py
          python reviews/codex/buck_5v/inspect_packages.py --check
      - name: Verify actuator supply and population contract
        run: |
          python reviews/codex/actuator_supply/verify_candidate.py --check
          python reviews/codex/actuator_supply/test_candidate.py
          python reviews/codex/actuator_supply/inspect_packages.py --check
          python reviews/codex/actuator_enable/verify_candidate.py --check
          python reviews/codex/actuator_enable/test_candidate.py
          python reviews/codex/actuator_enable/inspect_packages.py --check
          node reviews/codex/actuator_interlock/test_model.cjs
          python reviews/codex/actuator_interlock/verify_observability.py --check
          python reviews/codex/actuator_latch/verify_candidate.py --check
          python reviews/codex/actuator_latch/test_candidate.py
          python reviews/codex/actuator_latch/test_latch.py --check
          python reviews/codex/actuator_latch/inspect_packages.py --check
      - name: Verify rail qualification screening
        run: |
          python reviews/codex/rail_qualification/model.py --check
          python reviews/codex/rail_qualification/test_model.py
          python reviews/codex/rail_qualification/build_view.py --check
          python reviews/codex/rail_qualification/check_packet.py --check
      - name: Verify supervisor comparison
        run: |
          python reviews/codex/supervisor_comparison/model.py --check
          python reviews/codex/supervisor_comparison/test_model.py
          python reviews/codex/supervisor_comparison/build_results.py --check
          python reviews/codex/supervisor_comparison/check_packet.py --check
      - name: Verify 3.3 V observation allocation
        run: |
          python reviews/codex/observation_3v3/model.py --check
          python reviews/codex/observation_3v3/test_model.py
      - name: Verify observer load and power-state limits
        run: |
          python reviews/codex/observer_power/model.py --check
          python reviews/codex/observer_power/test_model.py
      - name: Verify observer retention and restart contract
        run: |
          python reviews/codex/observer_retention/model.py --check
          python reviews/codex/observer_retention/test_model.py
          python reviews/codex/oe_isolation/model.py --check
          python reviews/codex/oe_isolation/test_model.py
          python -B reviews/codex/vcca_shutdown/test_packet.py
          python -B reviews/codex/connector_fault_contract/test_model.py
      - name: Verify isolated C11 identity, lands and reservoir limits
        run: |
          python -B reviews/codex/vservo_reservoir/verify_candidate.py --check
          python -B reviews/codex/vservo_reservoir/inspect_geometry.py --check
          python -B reviews/codex/vservo_reservoir/test_candidate.py
          python -B reviews/codex/vservo_reservoir/test_model.py
      - name: Verify VSERVO transient boundary and conditional calculations
        run: |
          python -B reviews/codex/vservo_transients/test_model.py
          python -B reviews/codex/vservo_transients/build_packet.py --check
      - name: Replay historical packets and verify current viewer provenance
        run: |
          python -B tools/quality/test_viewer_replay.py
          python -B tools/quality/check_viewer_replay.py --check
      - name: Reconcile candidate ordering package
        run: python hardware/manufacturing/check_package.py
      - name: Check connector atlas sources
        run: python docs/atlas/generate_atlas.py --check
      - name: Build and validate the local viewer
        run: |
          node pm/tools/build.mjs
          node pm/tools/validate.mjs
      - name: Preserve inspectable viewer snapshot
        uses: actions/upload-artifact@v4
        with:
          name: engineering-workspace-snapshot
          path: |
            pm/index.html
            pm/status.json
          if-no-files-found: error
